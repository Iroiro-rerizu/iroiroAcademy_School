<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幻想クロニクル - Game Center Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.75);
            --border: rgba(255, 255, 255, 0.2); --online: #00ff88;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; }
        
        /* 日常的な背景 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.6); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.5) 100%); z-index: -1; }

        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; pointer-events: auto; }
        .hidden { display: none !important; opacity: 0; }

        /* キャラクター配置 (50, 200, 350) */
        .char-original { position: absolute; width: 70px; height: 70px; border-radius: 15px; border: 2px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: float 3s infinite ease-in-out; pointer-events: none; z-index: 1; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* プロセカ風ボタン */
        .btn-pro { background: #fff; color: #333; border: none; padding: 15px 50px; border-radius: 5px; font-weight: 900; cursor: pointer; transition: 0.3s; transform: skewX(-10deg); box-shadow: 4px 4px 0 var(--pro-teal); font-family: inherit; }
        .btn-pro:hover { transform: skewX(-10deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); background: var(--pro-teal); color: #fff; }

        /* ヘッダーUI */
        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; padding: 5px 12px; background: rgba(0,0,0,0.6); border-left: 4px solid var(--pro-teal); backdrop-filter: blur(10px); z-index: 200; border-radius: 5px; }
        .av-mini { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #fff; overflow: hidden; background: #222; }

        /* 下部ナビ */
        .nav-container { position: absolute; bottom: 30px; display: flex; gap: 10px; width: 95%; max-width: 900px; z-index: 200; }
        .nav-card { flex: 1; background: var(--glass); border: 1px solid var(--border); padding: 15px 5px; border-radius: 10px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(15px); font-weight: bold; font-size: 0.75rem; }
        .nav-card:hover { background: var(--pro-teal); color: #000; transform: translateY(-10px); }
        .nav-card.main { background: var(--pro-pink); border: none; font-size: 1.1rem; flex: 1.5; color: #fff; }

        /* --- ゲーム選択カード（指定のデザインをプロセカ風に） --- */
        .game-container-scroll { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-height: 60vh; overflow-y: auto; padding: 20px; width: 90%; scrollbar-width: none; }
        .card { width: 220px; height: 280px; background: var(--glass); border: 2px solid var(--border); border-radius: 20px; padding: 20px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-10px) skewX(-2deg); border-color: var(--pro-teal); box-shadow: 0 10px 30px rgba(51, 255, 204, 0.3); }
        .thumb { width: 100%; height: 120px; border-radius: 10px; margin-bottom: 15px; }
        .p0 { background: linear-gradient(135deg, #2af598, #009efd); }
        .p1 { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .p2 { background: linear-gradient(135deg, #fccb90, #d57eeb); }
        .p3 { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .game-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; }
        .game-desc { font-size: 0.7rem; opacity: 0.6; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        dialog { background: #fff; color: #333; border: none; padding: 30px; border-radius: 20px; width: 380px; z-index: 50000; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>

    <!-- ローディング -->
    <div id="loadingOverlay">
        <div style="width: 50px; height: 50px; border: 3px solid var(--pro-teal); border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite;"></div>
        <p id="loadText" style="margin-top: 20px; letter-spacing: 5px;">通信中...</p>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <div class="char-original" style="left: 50px; top: 300px;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=A" style="width:100%"></div>
        <div class="char-original" style="left: 200px; top: 300px; animation-delay: 0.2s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=B" style="width:100%"></div>
        <div class="char-original" style="left: 350px; top: 300px; animation-delay: 0.4s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=C" style="width:100%"></div>

        <h1 style="font-family: Montserrat; font-size: 5.5rem; margin: 0; letter-spacing: -3px; text-shadow: 0 0 20px var(--pro-teal);">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: bold; color: var(--pro-pink); margin-bottom: 50px;">GAME CENTER</p>
        <button class="btn-pro" onclick="transition('titleScreen', 'loadingScreen')">ログイン</button>
    </div>

    <!-- 2. ロード画面 -->
    <div id="loadingScreen" class="screen hidden">
        <p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px;">システムを同期中...</p>
    </div>

    <!-- 3. ホーム -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.8rem; font-weight: bold;"><span id="hName">---</span></div>
        </div>
        <h2 style="font-size: 2.5rem; font-weight: 300; letter-spacing: 5px;">MY CONSOLE</h2>
        <nav class="nav-container">
            <div class="nav-card" onclick="openBox('modalFriend')">フレンド</div>
            <div class="nav-card" onclick="openBox('modalConfig')">プロフィール</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); initGameList();">ゲーム選択</div>
            <div class="nav-card">ガチャ</div>
            <div class="nav-card">お知らせ</div>
        </nav>
    </div>

    <!-- 4. ゲーム選択（スプレッドシートから取得） -->
    <div id="questScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; font-size: 3rem; margin: 0;">SELECT GAME</h2>
        <div class="game-container-scroll" id="game-list-container">
            <!-- ここにスプレッドシートのゲームがカードとして並びます -->
        </div>
        <button class="btn-pro" style="margin-top:20px; background:#555; color:#fff; box-shadow:none;" onclick="closeQuest()">戻る</button>
    </div>

    <!-- ダイアログ -->
    <dialog id="modalConfig"><h2>設定</h2>名前:<input type="text" id="nIn"><button class="btn-pro" style="width:100%;" onclick="saveSettings()">保存</button></dialog>
    <dialog id="modalFriend"><h2>フレンド</h2><div id="fList" class="list-box" style="color:#333;">読み込み中...</div><input type="text" id="fIdIn" placeholder="ID検索"><button class="btn-pro" onclick="sendReq()">申請</button><button class="btn-pro" style="background:#555; color:#fff; margin-top:5px;" onclick="this.closest('dialog').close()">とじる</button></dialog>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwYfoV6l8qfAWZ5eR-fHhw_Ntz4Oo1fCbKXiRur6jaxjAvs2b_DBbU13QiXLvNe2N3S/exec';
        let myId = "", isSyncing = false;

        function transition(h, s) {
            document.getElementById(h).classList.add('hidden');
            document.getElementById(s).classList.remove('hidden');
            if(s === 'loadingScreen') setTimeout(() => { transition('loadingScreen', 'gameScreen'); initPortal(); }, 1200);
        }
        function openBox(id) { document.getElementById(id).showModal(); }
        function closeQuest() { transition('questScreen', 'gameScreen'); }

        function initPortal() {
            if(!localStorage.getItem('gID')) localStorage.setItem('gID', Math.random().toString(36).substring(2, 12).toUpperCase());
            myId = localStorage.getItem('gID');
            document.getElementById('hName').innerText = localStorage.getItem('gName') || "USER";
            const av = "https://api.dicebear.com/7.x/avataaars/svg?seed=" + myId;
            document.getElementById('hAv').src = av;
            if(!isSyncing) { isSyncing = true; setInterval(performSync, 10000); performSync(); }
        }

        async function performSync() {
            if(!GAS_URL.includes('https')) return;
            const data = { type: "sync", id: myId, name: localStorage.getItem('gName') || "USER", location: "ホーム" };
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
        }

        function saveSettings() {
            localStorage.setItem('gName', document.getElementById('nIn').value);
            document.getElementById('hName').innerText = document.getElementById('nIn').value;
            performSync();
            document.getElementById('modalConfig').close();
        }

        // --- ゲーム選択システムの統合 ---
        async function initGameList() {
            const container = document.getElementById('game-list-container');
            container.innerHTML = "<p>ゲームを探しています...</p>";
            try {
                const response = await fetch(`${GAS_URL}?action=getList`);
                const games = await response.json();
                container.innerHTML = "";

                games.forEach((game, index) => {
                    const colorClass = "p" + (index % 4);
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => fetchGame(game.id);
                    card.innerHTML = `
                        <div class="thumb ${colorClass}"></div>
                        <div class="game-title">${game.title}</div>
                        <div class="game-desc">${game.description}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = "<p>エラー：GASのURLを確認してください</p>";
            }
        }

        async function fetchGame(rowId) {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadText').innerText = "プログラムを展開中...";
            try {
                const response = await fetch(`${GAS_URL}?action=getCode&row=${rowId}`);
                const data = await response.json();
                document.open();
                document.write(data.code);
                document.close();
            } catch (e) {
                alert("ゲームの読み込みに失敗しました");
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }
    </script>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
</body>
</html>
