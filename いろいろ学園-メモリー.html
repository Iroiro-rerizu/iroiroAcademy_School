<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - COLORFUL STAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.85);
            --border: rgba(255, 255, 255, 0.3); --verify: #1da1f2; --gold: #ffcc00;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        /* 背景装飾 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.4); pointer-events: none; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, #000 100%); z-index: -1; pointer-events: none; }

        /* スクリーン管理 */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.22, 1, 0.36, 1); z-index: 100; box-sizing: border-box; padding: 20px; }
        .hidden { display: none !important; opacity: 0; transform: scale(1.1); }

        /* プロセカ風斜めボタン */
        .btn-pro { position: relative; background: #fff; color: #111; border: none; padding: 18px 45px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 6px 6px 0 var(--pro-teal); z-index: 1000; font-family: 'Montserrat', sans-serif; margin: 15px; text-transform: uppercase; text-align: center; width: 85%; max-width: 320px; font-size: 1.2rem; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); }
        .btn-pro:active { transform: skewX(-15deg) translate(3px, 3px); box-shadow: 0 0 0 var(--pro-teal); }
        .btn-pro.pink { box-shadow: 6px 6px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }

        /* ヘッダー */
        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; z-index: 200; background: rgba(0,0,0,0.5); padding: 8px 20px; border-radius: 50px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .av-mini { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; }
        .iro-coin-disp { margin-left: 10px; font-weight: 900; color: var(--pro-teal); font-size: 1.2rem; font-family: 'Montserrat'; }

        /* ナビゲーション */
        .nav-container { position: absolute; bottom: 30px; display: flex; gap: 12px; width: 95%; max-width: 900px; z-index: 300; justify-content: center; }
        .nav-card { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid var(--border); padding: 22px 5px; border-radius: 12px; cursor: pointer; text-align: center; font-weight: 900; font-size: 0.85rem; transition: 0.3s; backdrop-filter: blur(10px); letter-spacing: 1px; }
        .nav-card:active { transform: scale(0.9); background: var(--pro-teal); color: #000; }
        .nav-card.main { background: var(--pro-pink); border: none; box-shadow: 0 0 25px rgba(255,51,153,0.5); }

        /* ボトムシート */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 94%; background: #0a0b12; border-radius: 30px 30px 0 0; z-index: 50000; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; color: #fff; border-top: 3px solid var(--pro-teal); }
        .bottom-sheet.open { bottom: 0; }
        .sheet-content { padding: 30px; padding-bottom: 150px; max-width: 800px; margin: 0 auto; }

        /* メンバーリスト */
        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; }
        .member-card { position: relative; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; border: 1px solid var(--border); text-align: center; }
        .member-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; }
        .count-badge { position: absolute; top: 5px; right: 5px; background: var(--pro-pink); color: #fff; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; border: 1.5px solid #fff; z-index: 10; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="sheetOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:49000;display:none;backdrop-filter:blur(5px);" onclick="closeAllSheets()"></div>

    <!-- 1. タイトル画面 -->
    <div id="titleScreen" class="screen">
        <h1 style="font-family: Montserrat; font-size: clamp(3.5rem, 15vw, 8rem); margin: 0; text-shadow: 0 0 30px var(--pro-teal); letter-spacing: -2px;">GENSOU</h1>
        <p style="letter-spacing: 15px; font-weight: 900; color: var(--pro-pink); margin-bottom: 60px; font-size: 1.2rem;">COLORFUL STAGE</p>
        <button class="btn-pro" onclick="handleLoginClick()"><span>TAP TO START</span></button>
    </div>

    <!-- 2. ホーム画面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 1rem; font-weight: 900;"><span id="hName">---</span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">0</span></div>
        </div>
        
        <h1 style="font-family: 'Montserrat'; font-size: 6rem; opacity: 0.05; position: absolute; pointer-events: none;">DASHBOARD</h1>
        
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">FRIENDS</div>
            <div class="nav-card main" onclick="launchGachaUI()">GACHA</div>
            <div class="nav-card" onclick="openSheet('sheetMember')">MEMBERS</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">CONFIG</div>
        </nav>
    </div>

    <!-- 各ボトムシート -->
    <div id="sheetMember" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">MY MEMBERS</h2><div id="memberListContainer" class="member-grid"></div></div></div>
    
    <div id="sheetConfig" class="bottom-sheet">
        <div class="sheet-content" style="text-align: center;">
            <h2 style="font-family: Montserrat;">USER CONFIG</h2>
            <div style="background:#fff; color:#333; padding:25px; border-radius:20px; max-width:350px; margin:0 auto; text-align:left;">
                <label>NAME</label>
                <input type="text" id="nIn" style="width:100%; font-size:1.5rem; border:none; border-bottom:2px solid #333; margin-bottom:20px;">
                <p>ID: <span id="myIdDisplay" style="font-weight:bold;">---</span></p>
            </div><br>
            <button class="btn-pro pink" onclick="saveSettings()"><span>SAVE & SYNC</span></button>
        </div>
    </div>

    <div id="sheetFriend" class="bottom-sheet">
        <div class="sheet-content">
            <h2 style="color:var(--pro-pink); font-family: Montserrat;">FRIENDS</h2>
            <div id="fList" style="background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; min-height:100px;"></div>
        </div>
    </div>

    <!-- ゲーム・ガチャ表示レイヤー -->
    <div id="gameLayer">
        <div style="position:fixed;top:15px;right:15px;width:45px;height:45px;background:rgba(0,0,0,0.6);border:2px solid #fff;border-radius:50%;display:flex;z-index:20000;justify-content:center;align-items:center;font-weight:900;cursor:pointer;" onclick="location.reload()">×</div>
        <iframe id="gameFrame" src="about:blank"></iframe>
    </div>

    <script>
        // --- 設定 ---
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyYI4PKEf0tvuhXW3VA60sp3v7vs45IHUAwmPQshn9KBVAH-EnrbvadfmLB8vrHsi5Q/exec';
        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = parseInt(localStorage.getItem('gCoins')) || 10000;
        let myChars = localStorage.getItem('gChars') || ""; 
        let globalCharaPool = {};

        // --- 起動・同期 ---
        async function handleLoginClick() {
            localStorage.setItem('gID', myId);
            transition('titleScreen', 'gameScreen');
            document.getElementById('hName').innerText = localStorage.getItem('gName') || "NEW PLAYER";
            document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
            document.getElementById('myIdDisplay').innerText = myId;
            document.getElementById('nIn').value = localStorage.getItem('gName') || "";
            
            const av = "https://api.dicebear.com/7.x/avataaars/svg?seed=" + myId;
            document.getElementById('hAv').src = av;

            await fetchPools();
            renderMembers();
        }

        async function fetchPools() {
            try {
                const res = await fetch(GAS_URL + "?action=getCharaPools");
                globalCharaPool = await res.json();
            } catch(e) {
                console.error("Pools fetch failed. Using dummy data.");
                globalCharaPool = {
                    star2: [{name:"R奏", img:"https://picsum.photos/200/300?1"}],
                    star3: [{name:"SRまふゆ", img:"https://picsum.photos/200/300?2"}],
                    star4: [{name:"SSRミク", img:"https://picsum.photos/200/300?3"}]
                };
            }
        }

        function transition(h, s) { 
            document.getElementById(h).classList.add('hidden'); 
            const nxt = document.getElementById(s);
            nxt.style.display = 'flex'; 
            setTimeout(() => nxt.classList.remove('hidden'), 50); 
        }

        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }

        function renderMembers() {
            const container = document.getElementById('memberListContainer');
            if(!myChars) { container.innerHTML = "No members yet."; return; }
            const counts = {};
            myChars.split(',').filter(n => n).forEach(n => counts[n] = (counts[n] || 0) + 1);
            container.innerHTML = Object.keys(counts).map(name => `
                <div class="member-card">
                    <div class="count-badge">x${counts[name]}</div>
                    <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${name}">
                    <div style="font-size:0.7rem; margin-top:5px;">${name}</div>
                </div>
            `).join('');
        }

        // --- ガチャUI本体 ---
        async function launchGachaUI() {
            document.getElementById('gameLayer').style.display = 'block';
            const settingsRes = await fetch(GAS_URL + "?action=getGachaSettings");
            const gData = await settingsRes.json();

            document.getElementById('gameFrame').srcdoc = `
            <!DOCTYPE html><html><head><style>
                body{background:#000;color:#fff;font-family:sans-serif;margin:0;overflow:hidden;}
                #bg{position:fixed;width:100%;height:100%;background:url('${gData[0].bg}') center/cover;filter:brightness(0.6);}
                .ui{height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:40px;box-sizing:border-box;position:relative;z-index:10;}
                .controls{display:flex;gap:15px;justify-content:flex-end;}
                .pull-btn{position:relative;width:200px;padding:22px;border:none;color:#fff;font-weight:900;cursor:pointer;transform:skewX(-15deg);font-size:1.1rem;}
                .b-1{background:#555;} .b-10{background:linear-gradient(45deg,#ff3399,#ff88bb);} .b-100{background:linear-gradient(45deg,#ffcc00,#ff6600);color:#000;}
                .tag{position:absolute;top:-12px;left:5px;background:#fff;color:#ff3399;padding:2px 8px;font-size:0.7rem;transform:skewX(15deg);border-radius:4px;font-weight:bold;}
                #reveal{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1000;display:none;flex-direction:column;justify-content:center;align-items:center;background:#000;}
                #summary{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;}
                .summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:20px;max-height:70vh;overflow-y:auto;}
                .card{width:70px;background:#222;border:1px solid #444;border-radius:8px;padding:5px;text-align:center;}
                .card img{width:100%;border-radius:4px;}
                .s4{border-color:#ffcc00;box-shadow:0 0 10px #ffcc00;}
            </style></head>
            <body>
                <div id="bg"></div>
                <div class="ui">
                    <h1 style="font-size:3rem;text-shadow:0 0 20px #000;margin-bottom:auto;">${gData[0].title}</h1>
                    <div class="controls">
                        <button class="pull-btn b-1" onclick="pull(1)"><span>1回引く</span></button>
                        <button class="pull-btn b-10" onclick="pull(10)"><div class="tag">★3以上確定</div><span>10回引く</span></button>
                        <button class="pull-btn b-100" onclick="pull(100)"><div class="tag">★4確定</div><span>100回引く</span></button>
                    </div>
                </div>
                <div id="reveal" onclick="next()">
                    <img id="rev-img" style="width:100%;height:80%;object-fit:contain;">
                    <div id="rev-stars" style="color:#ffcc00;font-size:2rem;margin-top:20px;"></div>
                    <h2 id="rev-name" style="font-size:2.5rem;"></h2>
                </div>
                <div id="summary">
                    <h2>RESULTS</h2>
                    <div id="grid" class="summary-grid"></div>
                    <button onclick="location.reload()" style="margin-top:20px;padding:15px 50px;border-radius:50px;border:none;background:cyan;font-weight:bold;">CLOSE</button>
                </div>
                <script>
                    let coins = ${iroCoins};
                    let pools = ${JSON.stringify(globalCharaPool)};
                    let res = [], cur = 0;
                    function pull(n){
                        const cost = n*300; if(coins<cost){alert("Coin不足");return;}
                        coins-=cost;
                        res = []; let hasS3=false, hasS4=false;
                        for(let i=0; i<n; i++){
                            let r=Math.random()*100, rank=2;
                            if(r<3.5)rank=4; else if(r<16)rank=3;
                            // 確定ロジック
                            if(n===10 && i===n-1 && !hasS3) rank=3;
                            if(n===100 && i===n-1 && !hasS4) rank=4;
                            if(rank>=4){hasS4=true; hasS3=true;} if(rank>=3)hasS3=true;
                            const p=pools['star'+rank]; const c=p[Math.floor(Math.random()*p.length)];
                            res.push({...c, rank:rank});
                        }
                        window.parent.postMessage({type:'gacha', value:coins, chars:res.map(x=>x.name).join(',')}, '*');
                        cur=0; document.getElementById('reveal').style.display='flex'; show();
                    }
                    function show(){
                        const item=res[cur]; document.getElementById('rev-img').src=item.img;
                        document.getElementById('rev-name').innerText=item.name;
                        document.getElementById('rev-stars').innerText='★'.repeat(item.rank);
                    }
                    function next(){ cur++; if(cur<res.length)show(); else {
                        document.getElementById('reveal').style.display='none';
                        const g=document.getElementById('grid'); g.innerHTML=res.map(x=>\`
                            <div class="card \${x.rank===4?'s4':''}">
                                <img src="\${x.img}"><div style="font-size:0.5rem;color:#ffcc00;">\${'★'.repeat(x.rank)}</div>
                            </div>\`).join('');
                        document.getElementById('summary').style.display='flex';
                    }}
                <\/script></body></html>`;
        }

        window.addEventListener('message', e => {
            if(e.data.type === 'gacha') {
                iroCoins = e.data.value;
                const newChars = e.data.chars;
                myChars = myChars ? myChars + "," + newChars : newChars;
                localStorage.setItem('gCoins', iroCoins);
                localStorage.setItem('gChars', myChars);
                syncToGAS();
            }
        });

        async function syncToGAS() {
            document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
            renderMembers();
            await fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    type: "sync",
                    id: myId,
                    name: localStorage.getItem('gName'),
                    iroCoin: iroCoins,
                    chars: myChars
                })
            });
        }

        function saveSettings() {
            const name = document.getElementById('nIn').value;
            localStorage.setItem('gName', name);
            document.getElementById('hName').innerText = name;
            syncToGAS();
            closeAllSheets();
        }
    </script>
</body>
</html>
