<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - THE FINAL COMPLETE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- プロセカ風モダンデザイン --- */
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --pro-blue: #00ccff;
            --glass: rgba(0, 0, 0, 0.7); --border: rgba(255, 255, 255, 0.3);
            --online: #00ff88; --offline: #888;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; }
        
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.6); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.5) 100%); z-index: -1; }

        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; pointer-events: auto; }
        .hidden { display: none !important; opacity: 0; pointer-events: none !important; }

        /* 元々のキャラクター配置 (50, 200, 350) */
        .char-original { position: absolute; width: 80px; height: 80px; border-radius: 20px; border: 2.5px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: float 3s infinite ease-in-out; z-index: 1; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* ボタン */
        .btn-pro { background: #fff; color: #333; border: none; padding: 15px 50px; border-radius: 5px; font-weight: 900; cursor: pointer; transition: 0.3s; transform: skewX(-10deg); box-shadow: 4px 4px 0 var(--pro-teal); z-index: 500; font-family: inherit; }
        .btn-pro:hover { transform: skewX(-10deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); background: var(--pro-teal); color: #fff; }
        .btn-pro.pink { box-shadow: 4px 4px 0 var(--pro-pink); }
        .btn-pro.gray { box-shadow: 4px 4px 0 #555; background: #444; color: #fff; }

        /* ヘッダーUI */
        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; padding: 5px 12px; background: rgba(0,0,0,0.6); border-left: 4px solid var(--pro-teal); backdrop-filter: blur(10px); z-index: 200; border-radius: 5px; }
        .av-mini { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #fff; overflow: hidden; background: #222; }
        .sync-badge { position: absolute; top: 15px; right: 15px; font-size: 0.6rem; display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 30px; border: 1px solid var(--border); }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--offline); transition: 0.3s; }
        .dot.on { background: var(--online); box-shadow: 0 0 10px var(--online); }

        /* ナビゲーション */
        .nav-container { position: absolute; bottom: 30px; display: flex; gap: 10px; width: 95%; max-width: 900px; z-index: 200; }
        .nav-card { flex: 1; background: var(--glass); border: 1px solid var(--border); padding: 15px 5px; border-radius: 10px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(15px); font-weight: bold; font-size: 0.75rem; }
        .nav-card:hover { transform: translateY(-10px); border-color: #fff; }
        .nav-card.main { background: var(--pro-pink); border: none; font-size: 1.1rem; flex: 1.5; color: #fff; }

        /* ゲーム選択 */
        .game-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-height: 50vh; overflow-y: auto; width: 90%; }
        .card-sekai { width: 200px; height: 260px; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 15px; cursor: pointer; transition: 0.3s; text-align: center; }
        .card-sekai:hover { border-color: var(--pro-teal); transform: scale(1.05); }

        /* ポーズメニュー (Esc) */
        #pauseOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 20000; }

        /* ゲームレイヤー */
        #gameLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }

        dialog { background: #fff; color: #333; border: none; padding: 30px; border-radius: 20px; width: 380px; z-index: 50000; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        input { width: 100%; background: #eee; border: none; padding: 12px; border-radius: 10px; margin-bottom: 10px; box-sizing: border-box; font-family: inherit; }
        .list-box { background: #f5f5f5; border-radius: 15px; height: 140px; overflow-y: auto; padding: 10px; margin-bottom: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>

    <div id="pauseOverlay">
        <h1 style="font-family: Montserrat; font-size: 5rem; color: var(--pro-teal); margin: 0;">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()">再開する</button>
        <button class="btn-pro gray" style="margin-top:20px;" onclick="exitGame()">終了する</button>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <div class="char-original" style="left: 50px; top: 300px;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=A" style="width:100%"></div>
        <div class="char-original" style="left: 200px; top: 300px; animation-delay: 0.2s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=B" style="width:100%"></div>
        <div class="char-original" style="left: 350px; top: 300px; animation-delay: 0.4s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=C" style="width:100%"></div>
        <h1 style="font-family: Montserrat; font-size: 6rem; margin: 0; letter-spacing: -3px; text-shadow: 0 0 20px var(--pro-teal);">GENSOU</h1>
        <button id="loginBtn" class="btn-pro" onclick="transition('titleScreen', 'loadingScreen')">システムログイン</button>
    </div>

    <!-- 2. ロード -->
    <div id="loadingScreen" class="screen hidden">
        <p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px;">同期中...</p>
    </div>

    <!-- 3. ホーム -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.8rem; font-weight: bold;"><span id="hName">---</span></div>
        </div>
        <div class="sync-badge"><div id="syncDot" class="dot"></div><span id="syncText">OFFLINE</span></div>
        <nav class="nav-container">
            <div class="nav-card" onclick="openBox('modalFriend')">フレンド</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">ゲーム選択</div>
            <div class="nav-card" onclick="openBox('modalConfig')">プロフィール設定</div>
        </nav>
    </div>

    <!-- 4. ゲームリスト -->
    <div id="questScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; font-size: 3rem;">SELECT GAME</h2>
        <div class="game-grid" id="gameListContainer"></div>
        <button class="btn-pro gray" style="margin-top:20px;" onclick="closeQuest()">戻る</button>
    </div>

    <!-- 5. ゲーム本体 -->
    <div id="gameLayer">
        <iframe id="gameFrame" src="about:blank"></iframe>
    </div>

    <!-- 設定ダイアログ -->
    <dialog id="modalConfig">
        <h2 style="color:var(--pro-teal)">設定</h2>
        <div style="text-align: center; margin-bottom: 20px;">
            <!-- ★アイコンクリックで画像選択★ -->
            <img id="mAv" src="" style="width:80px; height:80px; border-radius:15px; border:3px solid var(--pro-teal); cursor:pointer; object-fit:cover;" onclick="document.getElementById('fileIn').click()">
            <p style="font-size:0.6rem; margin-top:5px;">クリックで画像変更</p>
            <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)">
        </div>
        名前:<input type="text" id="nIn">
        合言葉:<input type="password" id="pIn">
        <button class="btn-pro" style="width:100%;" onclick="saveSettings()">保存して同期</button>
        <button class="btn-pro gray" style="width:100%; margin-top:5px; box-shadow:none;" onclick="this.closest('dialog').close()">キャンセル</button>
    </dialog>

    <dialog id="modalFriend"><h2>フレンド</h2><div id="fList" class="list-box"></div><input type="text" id="fIdIn" placeholder="ID検索"><button class="btn-pro" onclick="sendReq()">申請</button></dialog>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxBVysypLnclz-hrEbKDT9J3rdg0SIFZK-tZE-7FE79e_ypg1GjpYs7SH9NEXE6yIp5/exec';
        let myId = "", isSyncing = false;

        function transition(h, s) {
            document.getElementById(h).classList.add('hidden');
            document.getElementById(s).classList.remove('hidden');
            if(s === 'loadingScreen') setTimeout(() => { transition('loadingScreen', 'gameScreen'); initPortal(); }, 1200);
        }
        function openBox(id) { document.getElementById(id).showModal(); }
        function closeQuest() { transition('questScreen', 'gameScreen'); }

        function initPortal() {
            if(!localStorage.getItem('gID')) localStorage.setItem('gID', Math.random().toString(36).substring(2, 12).toUpperCase());
            myId = localStorage.getItem('gID');
            document.getElementById('hName').innerText = localStorage.getItem('gName') || "USER";
            
            // アイコン読み込み
            const av = localStorage.getItem('gAv') || "https://api.dicebear.com/7.x/avataaars/svg?seed=" + myId;
            document.getElementById('hAv').src = av;
            document.getElementById('mAv').src = av;
            
            document.getElementById('nIn').value = localStorage.getItem('gName') || "";
            document.getElementById('pIn').value = localStorage.getItem('gPass') || "";
            
            if(!isSyncing) { isSyncing = true; setInterval(performSync, 10000); performSync(); }
        }

        // ★アイコンアップロード処理★
        function uploadIcon(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const dataUrl = e.target.result;
                    document.getElementById('mAv').src = dataUrl;
                    document.getElementById('hAv').src = dataUrl;
                    localStorage.setItem('gAv', dataUrl); // ローカル保存
                    if(isSyncing) performSync(); // 即座にサーバー同期
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveSettings() {
            localStorage.setItem('gName', document.getElementById('nIn').value);
            localStorage.setItem('gPass', document.getElementById('pIn').value);
            document.getElementById('hName').innerText = document.getElementById('nIn').value;
            performSync(); 
            document.getElementById('modalConfig').close();
        }

        async function performSync() {
            if(!GAS_URL.includes('https')) return;
            const data = { type: "sync", id: myId, name: localStorage.getItem('gName'), avatar: localStorage.getItem('gAv')||"", location: "ホーム" };
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
            document.getElementById('syncDot').classList.add('on');
            document.getElementById('syncText').innerText = "ONLINE";
        }

        async function loadGameList() {
            const container = document.getElementById('gameListContainer');
            container.innerHTML = "読込中...";
            const res = await fetch(`${GAS_URL}?action=getList`);
            const games = await res.json();
            container.innerHTML = "";
            games.forEach((game) => {
                const card = document.createElement('div');
                card.className = 'card-sekai';
                card.onclick = () => playThisGame(game.id);
                card.innerHTML = `<div style="height:100px; background:linear-gradient(45deg, var(--pro-teal), var(--pro-blue)); border-radius:10px; margin-bottom:10px;"></div><div style="font-weight:bold; color:#333;">${game.title}</div>`;
                container.appendChild(card);
            });
        }

        async function playThisGame(rowId) {
            document.getElementById('gameLayer').style.display = 'block';
            const res = await fetch(`${GAS_URL}?action=getCode&row=${rowId}`);
            const data = await res.json();
            document.getElementById('gameFrame').srcdoc = data.code;
        }

        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { document.getElementById('pauseOverlay').style.display = 'none'; document.getElementById('gameLayer').style.display = 'none'; document.getElementById('gameFrame').srcdoc = ""; }

        window.addEventListener('keydown', e => {
            if (e.key === "Escape" && document.getElementById('gameLayer').style.display === 'block') {
                document.getElementById('pauseOverlay').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
