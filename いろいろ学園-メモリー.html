<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proseka Gacha Simulator</title>
    <style>
        :root {
            --pink-grad: linear-gradient(180deg, #ff88bb, #ff4488);
            --accent-gold: #ffcc00;
            --ui-bg: rgba(0, 0, 0, 0.6);
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; background-color: #000; color: white; }
        
        /* 背景レイヤー */
        #bg-image { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; transition: background-image 0.6s ease; filter: brightness(1.1); z-index: 1; }
        
        .ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; box-sizing: border-box; background: linear-gradient(rgba(0,0,0,0.3), transparent 40%, transparent 60%, rgba(0,0,0,0.5)); }

        /* ヘッダー */
        .header { display: flex; justify-content: space-between; align-items: center; }
        .currency-info { background: var(--ui-bg); padding: 8px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.4); font-weight: bold; font-size: 18px; }

        /* サイドバー */
        .sidebar { position: absolute; left: 15px; top: 100px; display: flex; flex-direction: column; gap: 12px; }
        .banner-tab { width: 140px; height: 70px; background-size: cover; background-position: center; border-radius: 10px; border: 3px solid transparent; cursor: pointer; transition: 0.2s; opacity: 0.6; background-color: #333; }
        .banner-tab.active { border-color: var(--accent-gold); box-shadow: 0 0 15px var(--accent-gold); opacity: 1; transform: translateX(8px); }

        /* 情報エリア */
        .banner-info { position: absolute; left: 180px; bottom: 50px; max-width: 600px; }
        .banner-logo { font-size: 42px; font-weight: bold; text-shadow: 0 0 10px #000, 3px 3px 0px #333; margin-bottom: 10px; line-height: 1.1; }
        .banner-date { background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 5px; font-size: 14px; display: inline-block; }
        .featured-chara { margin-top: 10px; font-size: 19px; border-left: 4px solid var(--accent-gold); padding-left: 10px; text-shadow: 1px 1px 3px #000; }

        /* ボタン */
        .controls { position: absolute; right: 40px; bottom: 50px; display: flex; gap: 20px; }
        .gacha-btn { width: 170px; padding: 15px; border-radius: 18px; border: none; cursor: pointer; color: white; font-weight: bold; box-shadow: 0 5px 0 rgba(0,0,0,0.4); position: relative; }
        .gacha-btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-1 { background: #eee; color: #222; }
        .btn-10 { background: var(--pink-grad); }
        .price { font-size: 20px; display: block; margin-top: 5px; }
        .ribbon { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); background: #ff4488; font-size: 10px; padding: 2px 10px; border-radius: 10px; border: 1px solid white; color: white; }

        /* ガチャ結果画面 */
        #result-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-wrap: wrap; justify-content: center; align-items: center; padding: 60px; box-sizing: border-box; }
        .card { width: 120px; height: 180px; margin: 10px; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; animation: popIn 0.4s forwards; text-align: center; font-size: 12px; padding: 5px; box-sizing: border-box; }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .rank-4 { background: linear-gradient(45deg, #f0f, #0ff); border: 3px solid #fff; box-shadow: 0 0 20px #f0f; color: white; }
        .rank-3 { background: linear-gradient(45deg, #f1c40f, #e67e22); border: 2px solid #fff; color: white; }
        .rank-2 { background: #bdc3c7; color: #333; }
        .card-name { margin-top: 10px; font-size: 10px; background: rgba(0,0,0,0.5); color: white; padding: 2px 4px; border-radius: 3px; }

        .close-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: white; border: none; padding: 12px 40px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:1000; display:flex; justify-content:center; align-items:center; }
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 200; display: none; }
    </style>
</head>
<body>

    <div id="loading-overlay">LOADING...</div>
    <div id="bg-image"></div>
    <div id="flash"></div>

    <div class="ui-layer">
        <div class="header">
            <div style="font-size: 24px; font-weight: bold;">GACHA</div>
            <div class="currency-info">💎 <span id="crystal-count">----</span></div>
        </div>
        <div class="sidebar" id="gacha-sidebar"></div>
        <div class="banner-info">
            <div class="banner-logo" id="banner-logo"></div>
            <div class="banner-date" id="banner-date"></div>
            <div class="featured-chara" id="featured-chara"></div>
        </div>
        <div class="controls">
            <button class="gacha-btn btn-1" onclick="executeGacha(1)">1回引く<span class="price">300</span></button>
            <button class="gacha-btn btn-10" onclick="executeGacha(10)"><div class="ribbon">★3以上確定</div>10回引く<span class="price">3000</span></button>
        </div>
    </div>

    <div id="result-screen">
        <div id="card-container" style="display: contents;"></div>
        <button class="close-btn" onclick="closeResult()">とじる</button>
    </div>

    <script>
        // --- 設定 ---
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyfNRsqLvt9HDsC0z5XfGeGJewRkl_-wL8pN5mrSkQ8vwXSsqfP8FlXTSELrTFRr4sO/exec";
        const USER_ID = "ガチャ設定"; 

        // キャラクタープール（ガチャIDごとに設定可能）
        const CHARA_POOL = {
            rank4: ["初音ミク", "星乃一歌", "宵崎奏", "朝比奈まふゆ"],
            rank3: ["鏡音リン", "鏡音レン", "巡音ルカ", "MEIKO", "KAITO"],
            rank2: ["咲希", "穂波", "志歩", "みのり", "遥", "愛莉", "雫", "こはね", "杏", "彰人", "冬弥", "司", "えむ", "寧々", "類", "奏", "まふゆ", "絵名", "瑞希"]
        };

        let GACHA_LIST = [];
        let currentGachaIndex = 0;
        let crystals = 0;

        window.onload = async () => {
            await fetchGachaSettings();
            await fetchUserData();
            document.getElementById('loading-overlay').style.display = 'none';
        };

        async function fetchGachaSettings() {
            try {
                const response = await fetch(`${GAS_URL}?action=getGachaSettings`);
                GACHA_LIST = await response.json();
                if (GACHA_LIST.length > 0) {
                    const sidebar = document.getElementById('gacha-sidebar');
                    GACHA_LIST.forEach((gacha, index) => {
                        const tab = document.createElement('div');
                        tab.className = 'banner-tab' + (index === 0 ? ' active' : '');
                        tab.style.backgroundImage = `url(${gacha.thumbnail})`;
                        tab.onclick = () => switchGacha(index);
                        sidebar.appendChild(tab);
                    });
                    switchGacha(0);
                }
            } catch (e) { console.error("Settings load error"); }
        }

        async function fetchUserData() {
            try {
                const response = await fetch(`${GAS_URL}?id=${USER_ID}`);
                const data = await response.json();
                if (data.result === "success") {
                    crystals = Number(data.coins);
                    document.getElementById('crystal-count').innerText = crystals;
                }
            } catch (e) { console.error("User data load error"); }
        }

        function switchGacha(index) {
            currentGachaIndex = index;
            const data = GACHA_LIST[index];
            document.getElementById('bg-image').style.backgroundImage = `url(${data.bg})`;
            document.getElementById('banner-logo').innerHTML = data.title;
            document.getElementById('banner-date').innerText = data.date;
            document.getElementById('featured-chara').innerText = data.chara;
            document.querySelectorAll('.banner-tab').forEach((t, i) => t.classList.toggle('active', i === index));
        }

        async function executeGacha(times) {
            const cost = times === 1 ? 300 : 3000;
            if (crystals < cost) { alert("クリスタルが不足しています"); return; }

            const results = [];
            let hasRank3 = false;

            // 抽選ロジック
            for (let i = 0; i < times; i++) {
                let rank = 2;
                let rand = Math.random() * 100;

                if (times === 10 && i === 9 && !hasRank3) {
                    rank = rand < 3 ? 4 : 3; // 10連保証
                } else {
                    if (rand < 3) rank = 4;
                    else if (rand < 11.5) rank = 3;
                }

                if (rank >= 3) hasRank3 = true;

                // キャラ名決定
                const pool = CHARA_POOL[`rank${rank}`];
                const name = pool[Math.floor(Math.random() * pool.length)];
                results.push({ rank, name });
            }

            const newBalance = crystals - cost;
            const pulledNames = results.map(r => r.name);

            try {
                // スプレッドシートへ送信
                await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        type: "gacha", 
                        userId: USER_ID, 
                        newCrystalBalance: newBalance,
                        pulledCharacters: pulledNames // キャラクターリストを送信
                    })
                });
                
                crystals = newBalance;
                document.getElementById('crystal-count').innerText = crystals;
                playEffect(results);
            } catch (e) { alert("通信エラーが発生しました"); }
        }

        function playEffect(results) {
            const flash = document.getElementById('flash');
            flash.style.display = 'block'; flash.style.opacity = '1';
            setTimeout(() => {
                flash.style.transition = 'opacity 0.8s'; flash.style.opacity = '0';
                showResults(results);
                setTimeout(() => { flash.style.display = 'none'; flash.style.opacity = '1'; flash.style.transition = 'none'; }, 800);
            }, 150);
        }

        function showResults(results) {
            const container = document.getElementById('card-container');
            container.innerHTML = '';
            document.getElementById('result-screen').style.display = 'flex';
            results.forEach((data, i) => {
                setTimeout(() => {
                    const card = document.createElement('div');
                    card.className = `card rank-${data.rank}`;
                    card.innerHTML = `
                        <div>${'★'.repeat(data.rank)}</div>
                        <div class="card-name">${data.name}</div>
                    `;
                    container.appendChild(card);
                }, i * 120);
            });
        }

        function closeResult() { document.getElementById('result-screen').style.display = 'none'; }
    </script>
</body>
</html>
