<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - THE ULTIMATE EXPERIENCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.8);
            --border: rgba(255, 255, 255, 0.2); --verify: #1da1f2; --gold: #ffcc00;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        /* 背景アニメーション */
        .bg-sekai { position: fixed; top: -5%; left: -5%; width: 110%; height: 110%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') center/cover; z-index: -1; filter: brightness(0.4); animation: bgMove 30s infinite alternate linear; pointer-events: none; }
        @keyframes bgMove { from { transform: scale(1); } to { transform: scale(1.1); } }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%); z-index: -1; pointer-events: none; }

        /* スクリーン管理 */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; box-sizing: border-box; padding: 20px; }
        .hidden { opacity: 0; transform: scale(1.05); pointer-events: none !important; display: none; }

        /* プロセカ風ボタン設定（最優先クリック） */
        .btn-wrap { z-index: 10000; position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; pointer-events: none; }
        .btn-pro { position: relative; background: #fff; color: #111; border: none; padding: 16px 45px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 6px 6px 0 var(--pro-teal); z-index: 10001; font-family: 'Montserrat', sans-serif; margin: 15px; text-transform: uppercase; text-align: center; width: 85%; max-width: 320px; pointer-events: auto !important; font-size: 1.2rem; letter-spacing: 1px; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); pointer-events: none; }
        .btn-pro:active { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); }
        .btn-pro.pink { box-shadow: 6px 6px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }
        .btn-pro.gray { background: #444; color: #fff; box-shadow: 6px 6px 0 #222; }

        /* タイトル文字・浮遊キャラ（クリック無効化） */
        h1, p, .char-original { pointer-events: none !important; user-select: none; }
        .char-original { position: absolute; width: 80px; height: 80px; border-radius: 20px; border: 3px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: float 4s infinite ease-in-out; z-index: 1; box-shadow: 0 0 20px var(--pro-teal); }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-20px) rotate(5deg); } }

        /* 認証済みバッジ */
        .badge-verify { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; background: linear-gradient(135deg, #1da1f2, #0e71c8); color: #fff; border-radius: 50%; font-size: 11px; margin-left: 8px; vertical-align: middle; border: 1.5px solid #fff; box-shadow: 0 0 10px rgba(29, 161, 242, 0.6); font-weight: bold; position: relative; }
        .badge-verify::after { content: '✔'; }

        /* ヘッダー */
        .header-minimal { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 12px; padding: 6px 20px; background: rgba(0,0,0,0.7); border-left: 5px solid var(--pro-teal); backdrop-filter: blur(20px); z-index: 200; border-radius: 0 15px 15px 0; border: 1px solid var(--border); }
        .av-mini { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; cursor: pointer; }
        .iro-coin-disp { margin-left: 10px; font-weight: 900; color: var(--pro-teal); text-shadow: 0 0 10px var(--pro-teal); font-size: 1.2rem; font-family: 'Montserrat'; }

        /* ナビゲーション（レスポンシブ） */
        .nav-container { position: absolute; bottom: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 92%; max-width: 1000px; z-index: 300; pointer-events: auto; }
        @media (min-width: 768px) { .nav-container { grid-template-columns: repeat(5, 1fr); } }
        .nav-card { background: var(--glass); border: 1px solid var(--border); padding: 18px 5px; border-radius: 15px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(20px); font-weight: 900; font-size: 0.9rem; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 70px; }
        .nav-card:active { transform: scale(0.95); }
        .nav-card.main { background: linear-gradient(135deg, var(--pro-pink), #ff66cc); border: none; grid-column: span 2; }
        @media (min-width: 768px) { .nav-card.main { grid-column: span 1; } }

        .present-btn { position: absolute; top: 85px; left: 20px; width: 55px; height: 55px; background: var(--glass); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 300; border: 1.5px solid var(--border); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .present-badge { position: absolute; top: -3px; right: -3px; width: 22px; height: 22px; background: red; border-radius: 50%; border: 2px solid #fff; font-size: 0.8rem; display: none; justify-content: center; align-items: center; font-weight: 900; }

        /* ボトムシート */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 95%; background: #0a0b12; border-radius: 30px 30px 0 0; z-index: 50000; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; color: #fff; border-top: 1px solid var(--border); }
        .bottom-sheet.open { bottom: 0; }
        .sheet-content { padding: 30px; padding-bottom: 150px; max-width: 1200px; margin: 0 auto; }

        /* メンバー・詳細 */
        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; }
        .member-card { position: relative; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; border: 1px solid var(--border); text-align: center; cursor: pointer; transition: 0.2s; }
        .member-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; border: 1.5px solid #fff; }
        .count-badge { position: absolute; top: 5px; right: 5px; background: var(--pro-pink); color: #fff; font-size: 0.8rem; font-weight: bold; padding: 2px 10px; border-radius: 12px; border: 2px solid #fff; z-index: 10; }
        .detail-card { background: rgba(255,255,255,0.03); border-radius: 25px; padding: 30px; text-align: center; border: 1px solid var(--pro-teal); box-shadow: 0 0 30px rgba(51,255,204,0.2); }
        .detail-img { width: 100%; max-width: 380px; max-height: 500px; object-fit: contain; border: 2px solid #fff; border-radius: 20px; background: #000; margin-bottom: 20px; }

        .friend-box { background: #f0f0f5; color: #333; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .history-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 8px; display: grid; grid-template-columns: 1.2fr 2fr 0.8fr; align-items: center; font-size: 0.8rem; border-left: 4px solid #555; }
        .student-id-card { background: #fff; color: #111; border-radius: 20px; padding: 30px; border: 3px solid #333; max-width: 400px; margin: 20px auto; text-align: left; box-shadow: 15px 15px 0 rgba(0,0,0,0.3); }
        .student-input { background: none; border: none; border-bottom: 3px solid #111; width: 100%; font-size: 1.3rem; padding: 10px 0; margin-bottom: 15px; color:#000; font-family: inherit; font-weight: bold; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        #pauseOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); z-index: 60000; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="sheetOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:49000;display:none;backdrop-filter:blur(10px);" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" style="position:fixed;top:15px;right:15px;width:45px;height:45px;background:var(--glass);border:1.5px solid #fff;border-radius:50%;display:none;z-index:15000;justify-content:center;align-items:center;font-weight:900;cursor:pointer;color:#fff;" onclick="showPauseMenu()">II</div>

    <!-- ポーズメニュー -->
    <div id="pauseOverlay">
        <h1 style="font-family: Montserrat; font-size: 4rem; color: var(--pro-teal); text-shadow: 0 0 20px var(--pro-teal);">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開する</span></button>
        <button class="btn-pro pink" onclick="exitGame()"><span>終了する</span></button>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <div class="char-original" style="left: 10%; top: 15%;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=A" style="width:100%"></div>
        <div class="char-original" style="right: 10%; top: 20%;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=B" style="width:100%"></div>
        <h1 style="font-family: Montserrat; font-size: clamp(4rem, 18vw, 8rem); margin: 0; text-shadow: 0 0 40px var(--pro-teal); letter-spacing: -4px;">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: 900; color: var(--pro-pink); margin-bottom: 60px; font-size: 1.3rem;">COLORFUL STAGE</p>
        
        <div class="btn-wrap">
            <button class="btn-pro" onclick="handleLoginClick()"><span>ログイン</span></button>
            <button class="btn-pro pink" onclick="document.getElementById('modalTransfer').showModal()"><span>データ復旧</span></button>
        </div>
    </div>

    <!-- 2. 新規登録 -->
    <div id="registrationScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; color: var(--pro-teal); font-size: 3rem;">NEW REGISTRATION</h2>
        <div class="student-id-card">
            <h3 style="margin:0 0 20px 0; color:#111;">学生証作成</h3>
            <p style="font-size:0.9rem; color:#666; margin-bottom:5px;">ニックネーム（公開）</p>
            <input type="text" id="regName" class="student-input" placeholder="なまえ">
            <p style="font-size:0.9rem; color:#666; margin-bottom:5px;">合言葉（データ復旧用）</p>
            <input type="password" id="regPass" class="student-input" placeholder="パスワード">
            <p style="font-size:0.75rem; color:#f39; font-weight:bold;">※IDとこの合言葉でデータ復元ができます。</p>
        </div>
        <div class="btn-wrap">
            <button class="btn-pro" onclick="saveRegistration()"><span>作成してセカイへ！</span></button>
        </div>
    </div>

    <div id="loadingScreen" class="screen hidden"><p style="color: var(--pro-teal); font-weight: 900; letter-spacing: 5px; animation: flash 1.5s infinite alternate; font-size: 2.2rem; font-family: Montserrat;">CONNECTING...</p></div>

    <!-- 3. ホーム画面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 1.1rem; font-weight: 900; letter-spacing: 1px;"><span id="hName">---</span><span id="hVerified"></span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">---</span></div>
        </div>
        <div class="present-btn" onclick="openSheet('sheetPresent')">🎁<div id="pBadge" class="present-badge">0</div></div>
        
        <h2 style="font-size: clamp(2rem, 12vw, 4rem); font-weight: 300; letter-spacing: 15px; opacity: 0.7; font-family: Montserrat; text-align: center;">MAIN CONSOLE</h2>
        
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="launchGachaUI()" style="border-color: var(--pro-teal);">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">クエスト</div>
            <div class="nav-card" onclick="openSheet('sheetMember')">メンバー</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定</div>
        </nav>
    </div>

    <!-- ボトムシート -->
    <div id="sheetMember" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat; font-size: 2.5rem;">MY MEMBERS</h2><div id="memberListContainer" class="member-grid"></div></div></div>
    
    <div id="sheetMemberDetail" class="bottom-sheet">
        <div class="sheet-content" style="text-align: center;">
            <div id="memberDetailContent"></div>
            <div id="giftSelectionArea" style="display:none; margin-top:20px;">
                <h3 style="color:var(--pro-pink); margin-bottom:15px; font-size: 1.3rem;">贈るフレンドを選択</h3>
                <div id="giftFriendList" style="background:rgba(255,255,255,0.05);padding:15px;border-radius:20px;max-height:300px;overflow-y:auto; border: 1px solid var(--border); color: #333;"></div>
            </div>
            <button class="btn-pro pink" id="startGiftBtn"><span>フレンドにあげる</span></button><br>
            <button class="btn-pro gray" onclick="closeSheet('sheetMemberDetail')"><span>戻る</span></button>
        </div>
    </div>

    <div id="sheetPresent" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat; font-size: 2rem;">PRESENTS</h2><div id="pListContainer"></div><h2 style="color:var(--pro-pink); font-family: Montserrat; margin-top:40px;">COIN HISTORY</h2><div id="historyContainer"></div></div></div>
    <div id="sheetConfig" class="bottom-sheet"><div class="sheet-content" style="text-align: center;"><div class="student-id-card"><h3>学生証設定</h3><img id="mAv" style="width:105px;height:140px;border:3px solid #333;object-fit:cover;background:#eee;cursor:pointer;border-radius:15px;" onclick="document.getElementById('fileIn').click()"><p style="font-size:0.8rem; color:#777; margin-top:10px;">学籍番号: <span id="myIdDisplay" style="color:#000; font-weight:bold;">---</span></p><input type="text" id="nIn" placeholder="なまえ" class="student-input"><input type="password" id="pIn" placeholder="合言葉" class="student-input"><input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)"></div><br><button class="btn-pro" style="width:100%" onclick="saveSettings()"><span>保存して同期</span></button></div></div>
    <div id="sheetFriend" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-pink); font-family: Montserrat;">FRIENDS</h2><p style="font-size:0.7rem; opacity:0.6;">届いた申請</p><div id="reqList" class="friend-box" style="color:#111;"></div><p style="font-size:0.7rem; opacity:0.6;">送った申請（待機中）</p><div id="sentList" class="friend-box" style="color:#111;font-size:0.75rem;"></div><p style="font-size:0.7rem; opacity:0.6;">フレンドリスト</p><div id="fList" class="friend-box" style="color:#111;"></div><input type="text" id="fIdIn" placeholder="10桁ID検索" style="width:100%;padding:18px;border-radius:15px;border:none;color:#000;box-sizing:border-box;font-size:1.1rem;font-weight:bold;"><button class="btn-pro pink" style="width:100%;margin-top:10px;" onclick="sendReq()"><span>申請</span></button></div></div>
    
    <div id="questScreen" class="screen hidden"><h2 style="font-size: 3rem; color: var(--pro-teal); font-family: Montserrat;">QUEST SELECT</h2><div id="gameListContainer" style="display:flex;flex-wrap:wrap;justify-content:center;gap:15px;width:100%;"></div><button class="btn-pro gray" onclick="transition('questScreen', 'gameScreen')">戻る</button></div>

    <dialog id="modalTransfer" style="background:#111;color:#fff;border:none;border-radius:25px;padding:40px;width:90%;max-width:380px;box-shadow: 0 0 60px rgba(255,51,153,0.7);"><h3>データ復元</h3><input type="text" id="tIdIn" placeholder="PLAYER ID" style="width:100%;padding:15px;margin-bottom:15px;border-radius:10px;border:none;background:#222;color:#fff;font-family:Montserrat;"><input type="password" id="tPassIn" placeholder="PASSWORD" style="width:100%;padding:15px;margin-bottom:30px;border-radius:10px;border:none;background:#222;color:#fff;"><button class="btn-pro pink" style="width:100%;margin:0;" onclick="executeTransfer()">復元実行</button></dialog>

    <div id="gameLayer"><iframe id="gameFrame" src="about:blank"></iframe></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhxRooDZI4qfAMNMArMavV9v6M8Z38kT635TEiGN82py2d4QxvZkUSLFZr6ydjzh3-/exec';
        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = parseInt(localStorage.getItem('gCoins')) || 0;
        let myChars = "", globalCharaPool = {}, friendsData = [], claimedPresents = [], firstSyncDone = false;

        // --- ログイン・同期フロー（消失防止ロジック） ---
        function handleLoginClick() {
            const savedName = localStorage.getItem('gName');
            if(!savedName || savedName === "---") transition('titleScreen', 'registrationScreen');
            else beginPortalSync();
        }
        async function saveRegistration() {
            const name = document.getElementById('regName').value.trim(); const pass = document.getElementById('regPass').value.trim();
            if(!name || !pass) { alert("全て入力してください"); return; }
            localStorage.setItem('gName', name); localStorage.setItem('gPass', pass); localStorage.setItem('gID', myId);
            beginPortalSync();
        }
        async function beginPortalSync() {
            transition('registrationScreen', 'loadingScreen'); transition('titleScreen', 'loadingScreen');
            try { globalCharaPool = await (await fetch(GAS_URL + "?action=getCharaPools")).json(); } catch(e) {}
            const success = await fetchSync();
            if(success || !GAS_URL.includes('https')) {
                transition('loadingScreen', 'gameScreen');
                setInterval(fetchSync, 15000);
            } else { alert("同期失敗。URLを確認してください。"); transition('loadingScreen', 'titleScreen'); }
        }

        async function fetchSync() {
            if(!GAS_URL.includes('https')) return true;
            try {
                const res = await fetch(GAS_URL + "?id=" + myId);
                const json = await res.json();
                if(json.result === "success") {
                    iroCoins = Number(json.iroCoin); localStorage.setItem('gCoins', iroCoins);
                    document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                    myChars = json.chars || ""; claimedPresents = json.claimed ? json.claimed.split(',') : [];
                    friendsData = json.friendsData || [];
                    document.getElementById('hName').innerText = json.name || "USER";
                    document.getElementById('hVerified').innerHTML = json.isOfficial ? '<span class="badge-verify"></span>' : "";
                    const avUrl = json.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed="+myId;
                    document.getElementById('hAv').src = avUrl; document.getElementById('mAv').src = avUrl;
                    document.getElementById('myIdDisplay').innerText = myId;
                    
                    updatePresentUI(json.pendingGifts); updateHistoryUI(json.history); renderMembers();
                    
                    document.getElementById('reqList').innerHTML = json.pending ? json.pending.split(',').map(id => `
                        <div class="friend-item" style="color:#111; background:#fff; margin-bottom:8px; padding:10px; border-radius:12px;">
                        <span>ID: ${id}</span><button class="btn-pro" style="width:auto;padding:5px 20px;margin:0;box-shadow:none;font-size:0.7rem;" onclick="acceptF('${id}')">承認</button></div>`) : "なし";
                    document.getElementById('sentList').innerHTML = json.sentRequests ? "申請中: " + json.sentRequests : "";
                    document.getElementById('fList').innerHTML = friendsData.length ? friendsData.map(f => `
                        <div class="friend-item" style="color:#111; background:#fff; margin-bottom:10px; padding:12px; border-radius:12px;">
                            <span>${f.name}${f.isOfficial?'<span class="badge-verify"></span>':''}</span>
                            <div><button onclick="sendFriendGift('${f.id}')" style="background:none;border:none;font-size:1.5rem;cursor:pointer;">🎁</button>
                                 <button onclick="removeFriend('${f.id}')" style="background:none;border:none;font-size:1.5rem;cursor:pointer;margin-left:10px;">×</button></div></div>`) : "なし";
                    
                    firstSyncDone = true;
                    // 保存 (POST)
                    await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ 
                        type: "sync", id: myId, name: document.getElementById('nIn').value || localStorage.getItem('gName'), 
                        pass: document.getElementById('pIn').value || json.pass, iroCoin: iroCoins, chars: myChars, avatar: localStorage.getItem('gAv')||"" 
                    }) });
                    return true;
                }
            } catch(e) { return false; }
        }

        // --- メンバー・詳細 ---
        function renderMembers() {
            const container = document.getElementById('memberListContainer');
            if(!myChars) { container.innerHTML = "なし"; return; }
            const counts = {}; myChars.split(',').filter(n=>n!=="").forEach(n => { counts[n] = (counts[n] || 0) + 1; });
            const master = [...(globalCharaPool.star2||[]), ...(globalCharaPool.star3||[]), ...(globalCharaPool.star4||[])];
            container.innerHTML = Object.keys(counts).map(name => {
                const char = master.find(m => m.name === name);
                return char ? `<div class="member-card" onclick="showMemberDetail('${char.name}')"><div class="count-badge">x${counts[name]}</div><img src="${char.img}"><small>${char.name}</small></div>` : "";
            }).join('');
        }
        function showMemberDetail(name) {
            const master = [...(globalCharaPool.star2||[]), ...(globalCharaPool.star3||[]), ...(globalCharaPool.star4||[])];
            const char = master.find(m => m.name === name); if(!char) return;
            let stars = globalCharaPool.star4.some(c=>c.name===name) ? 4 : (globalCharaPool.star3.some(c=>c.name===name) ? 3 : 2);
            document.getElementById('memberDetailContent').innerHTML = `<div class="detail-card"><img src="${char.img}" class="detail-img"><div style="color:#ffcc00;font-size:2rem;">${'★'.repeat(stars)}</div><h1>${char.name}</h1></div>`;
            document.getElementById('giftSelectionArea').style.display = 'none';
            document.getElementById('startGiftBtn').style.display = 'inline-block';
            document.getElementById('startGiftBtn').onclick = () => {
                if(friendsData.length === 0) { alert("フレンドがいません"); return; }
                document.getElementById('startGiftBtn').style.display = 'none';
                document.getElementById('giftFriendList').innerHTML = friendsData.map(f => `<div style="padding:15px;border-bottom:1px solid #ddd;cursor:pointer;color:#111;" onclick="executeMemberGift('${f.id}','${f.name}','${char.name}')">${f.name} ➔ 贈る</div>`).join('');
                document.getElementById('giftSelectionArea').style.display = 'block';
            };
            openSheet('sheetMemberDetail');
        }
        async function executeMemberGift(tid, tn, cn) { if(confirm(`${tn}さんに贈りますか？`)) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "friendMemberGift", fromId: myId, fromName: document.getElementById('hName').innerText, toId: tid, charName: cn }) }); alert("贈りました！"); closeSheet('sheetMemberDetail'); fetchSync(); } }

        // --- ガチャ演出 ---
        async function launchGachaUI() {
            document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex';
            const [gDataRes, charPoolRes] = await Promise.all([ fetch(GAS_URL + "?action=getGachaSettings"), fetch(GAS_URL + "?action=getCharaPools") ]);
            const gData = await gDataRes.json(); const pools = await charPoolRes.json();
            document.getElementById('gameFrame').srcdoc = `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><style>body{background:#000;color:#fff;font-family:sans-serif;margin:0;overflow:hidden;}#bg{position:fixed;width:100%;height:100%;background:url('${gData[0].bg}') center/cover;transition:0.5s;filter:brightness(1.1);} .ui{position:relative;z-index:10;height:100vh;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;background:linear-gradient(rgba(0,0,0,0.2),transparent,rgba(0,0,0,0.9));} .coin{background:rgba(0,0,0,0.6);padding:8px 15px;border-radius:30px;color:#33ffcc;border:1px solid #33ffcc;font-weight:bold;width:fit-content;font-size:0.9rem;} .sidebar{position:absolute;left:10px;top:80px;display:flex;flex-direction:column;gap:8px;} .tab{width:110px;height:55px;background-size:cover;border:2px solid transparent;border-radius:10px;opacity:0.6;cursor:pointer;} .tab.active{border-color:#ffcc00;opacity:1;transform:translateX(5px);} .controls{position:absolute;right:15px;bottom:30px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;} .pull-btn{width:170px;padding:15px;border-radius:18px;border:none;color:#fff;font-weight:bold;cursor:pointer;font-size:0.9rem;box-shadow:0 3px 0 rgba(0,0,0,0.3);text-align:center;} .b-1{background:#555;} .b-10{background:linear-gradient(#ff88bb,#ff3399);} .b-100{background:linear-gradient(#ffcc00,#ff6600);} #reveal{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1000;display:none;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;overflow:hidden;} .rev-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;z-index:1;animation:zoomIn 10s linear infinite;} .rev-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(transparent 50%,rgba(0,0,0,0.9));z-index:2;} .rev-content{position:relative;z-index:10;text-align:center;margin-top:auto;padding-bottom:100px;} .star{font-size:3rem;color:#ffcc00;text-shadow:0 0 15px #000;animation:starPop 0.4s forwards;opacity:0;} @keyframes starPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}} @keyframes zoomIn{from{transform:scale(1)}to{transform:scale(1.15)}} #summary{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:15px;box-sizing:border-box;} .summary-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:90%;overflow-y:auto;max-height:75vh;} .summary-card{width:80px;text-align:center;background:rgba(255,255,255,0.1);border-radius:8px;padding:5px;border:1px solid rgba(255,255,255,0.2);} .summary-card img{width:65px;height:85px;object-fit:cover;border-radius:4px;border:1px solid #fff;} .skip-btn{position:fixed;top:20px;right:20px;z-index:3000;padding:10px 25px;background:rgba(255,255,255,0.2);border:1px solid #fff;border-radius:30px;color:#fff;cursor:pointer;}</style></head>
            <body><div id="bg"></div><div class="ui"><div class="coin">🪙 <span id="c">${iroCoins.toLocaleString()}</span></div><div class="sidebar" id="sb"></div><div style="margin-left:110px;margin-bottom:110px;"><h1 style="font-size:1.8rem;margin:0;">${gData[0].title}</h1></div><div class="controls" id="btn-container"></div></div>
            <button id="skip" class="skip-btn" onclick="skipReveal()" style="display:none">SKIP</button>
            <div id="reveal" onclick="nextReveal()"><img id="rev-img" class="rev-img"><div class="rev-overlay"></div><div class="rev-content"><div id="rev-stars" style="display:flex;justify-content:center;gap:10px;margin-bottom:15px;"></div><h1 style="font-size:2.5rem;margin:0;" id="rev-name"></h1><p style="font-size:0.8rem;opacity:0.6;">TAP TO NEXT</p></div></div>
            <div id="summary"><h2>RESULT</h2><div id="sum-grid" class="summary-grid"></div><button onclick="document.getElementById('summary').style.display='none'" style="margin-top:20px;padding:12px 50px;border-radius:30px;border:none;font-weight:bold;background:#fff;">とじる</button></div>
            <script>let coins=${iroCoins};let pools=${JSON.stringify(pools)};let gData=${JSON.stringify(gData)};let res=[],cur=0;
            function renderButtons(idx){
                const container = document.getElementById('btn-container'); container.innerHTML = '';
                gData[idx].buttons.split(',').forEach(b => {
                    if(b==='1回') container.innerHTML += '<button class="pull-btn b-1" onclick="startPull(1)">1回引く</button>';
                    if(b==='10回') container.innerHTML += '<button class="pull-btn b-10" onclick="startPull(10)">10回引く</button>';
                    if(b==='100回') container.innerHTML += '<button class="pull-btn b-100" onclick="startPull(100)">100回引く</button>';
                });
            }
            function startPull(n){const cost=n*300;if(coins<cost){alert('不足');return;}
            coins-=cost;document.getElementById('c').innerText=coins.toLocaleString();window.parent.postMessage({type:'gachaPull',value:coins,pulls:n,chars:''},'*');
            res=[]; let names=[]; let hasS4=false, hasS3=false;
            for(let i=0; i<n; i++){
                let s=2, r=Math.random()*100; if(r<3.5) s=4; else if(r<16) s=3;
                if(n>=100 && i===n-1 && !hasS4) s=4; else if(n>=10 && i===n-1 && !hasS3 && s<3) s=3;
                if(s>=4) hasS4=true; if(s>=3) hasS3=true;
                const pool = pools['star' + s]; const c=pool[Math.floor(Math.random()*pool.length)]; res.push({...c,rank:s}); names.push(c.name);
            }
            window.parent.postMessage({type:'gachaPull',value:coins,pulls:n,chars:names.join(',')},'*');
            cur=0; document.getElementById('skip').style.display='block'; show();}
            function show(){const c=res[cur];document.getElementById('reveal').style.display='flex';document.getElementById('rev-img').src=c.img;document.getElementById('rev-name').innerText=c.name;const b=document.getElementById('rev-stars');b.innerHTML='';for(let i=0;i<c.rank;i++){const s=document.createElement('div');s.style="font-size:2rem;color:#ffcc00;";s.innerText='★';b.appendChild(s);}}
            function nextReveal(){cur++; if(cur<res.length) show(); else skipReveal();}
            function skipReveal(){ document.getElementById('reveal').style.display='none'; document.getElementById('skip').style.display='none'; const g=document.getElementById('sum-grid');g.innerHTML='';res.forEach(c=>{const d=document.createElement('div');d.className='summary-card';d.innerHTML='<img src="'+c.img+'"><br><small>'+'★'.repeat(c.rank)+'</small>';g.appendChild(d);});document.getElementById('summary').style.display='flex';}
            gData.forEach((g,i)=>{const d=document.createElement('div');d.className='tab'+(i===0?' active':'');d.style.backgroundImage='url('+g.thumbnail+')';d.onclick=()=>{document.getElementById('bg').style.backgroundImage='url('+g.bg+')';renderButtons(i);document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',i===idx));};document.getElementById('sb').appendChild(d);});renderButtons(0);<\/script></body></html>`;
        }

        // --- 受信・操作系 ---
        window.addEventListener('message', e => { if(e.data.type === 'gachaPull') { iroCoins = e.data.value; localStorage.setItem('gCoins', iroCoins); document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString(); fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "gachaLog", userId: myId, newCoins: iroCoins, pulls: e.data.pulls, newChars: e.data.chars }) }); } });
        function saveSettings() { localStorage.setItem('gName', document.getElementById('nIn').value); localStorage.setItem('gPass', document.getElementById('pIn').value); fetchSync(); closeAllSheets(); }
        function uploadIcon(input) { if (input.files && input.files[0]) { const r = new FileReader(); r.onload = e => { localStorage.setItem('gAv', e.target.result); fetchSync(); }; r.readAsDataURL(input.files[0]); } }
        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeSheet(id) { document.getElementById(id).classList.remove('open'); if(!document.querySelector('.bottom-sheet.open')) document.getElementById('sheetOverlay').style.display = 'none'; }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }
        function showPauseMenu() { document.getElementById('pauseOverlay').style.display = 'flex'; }
        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { location.reload(); }
        async function loadGameList() { const res = await (await fetch(GAS_URL + "?action=getList")).json(); const container = document.getElementById('gameListContainer'); container.innerHTML = ""; res.forEach(g => { const card = document.createElement('div'); card.className = "nav-card"; card.innerHTML = `<b>${g.title}</b>`; card.onclick = () => launchGame(g.id); container.appendChild(card); }); }
        async function launchGame(id) { document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex'; const res = await (await fetch(GAS_URL+"?action=getCode&row="+id)).json(); document.getElementById('gameFrame').srcdoc = res.code; }
        function updateHistoryUI(h) { document.getElementById('historyContainer').innerHTML = h ? h.map(x => `<div class="history-item"><span>${x.reason}</span><span style="font-weight:bold;">${x.coin>=0?'+':''}${x.coin}</span></div>`).join('') : "履歴なし"; }
        async function sendReq() { const tid = document.getElementById('fIdIn').value.toUpperCase(); if(tid===myId) return; await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "request", myId: myId, targetId: tid }) }); alert("完了"); fetchSync(); }
        async function acceptF(tid) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "accept", myId: myId, targetId: tid }) }); fetchSync(); }
        async function removeFriend(fid) { if(confirm("解除？")){ await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "removeFriend", myId: myId, targetId: fid }) }); fetchSync(); } }
        async function sendFriendGift(fid) { const amount = prompt("枚数", "100"); if(!amount || iroCoins < amount) return; iroCoins -= parseInt(amount); await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "friendGift", fromId: myId, fromName: document.getElementById('hName').innerText, toId: fid, amount: amount }) }); fetchSync(); }
        async function claim(rowId, type, content, name) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "claim", userId: myId, giftRow: rowId }) }); alert(`「${name}」受取完了`); fetchSync(); }
        function updatePresentUI(p) { const c = document.getElementById('pBadge'); if(!p || p.length === 0) { document.getElementById('pListContainer').innerHTML = "なし"; c.style.display = 'none'; return; } c.innerText = p.length; c.style.display = 'flex'; document.getElementById('pListContainer').innerHTML = p.map(x => `<div class="present-item"><b>${x.name}</b><button class="btn-pro" style="width:auto;padding:5px 15px;" onclick="claim(${x.row},'${x.type}','${x.content}','${x.name}')">受取</button></div>`).join(''); }
        async function executeTransfer() { const id = document.getElementById('tIdIn').value.toUpperCase(); const ps = document.getElementById('tPassIn').value; const res = await (await fetch(GAS_URL + "?id=" + id)).json(); if(res.result === "success" && String(res.pass) === String(ps)) { localStorage.setItem('gID', id); location.reload(); } else { alert("失敗"); } }
    </script>
</body>
</html>
