<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - THE ULTIMATE SYNC STAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.8);
            --border: rgba(255, 255, 255, 0.2); --verify: #1da1f2; --gold: #ffcc00;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); z-index: -1; pointer-events: none; }

        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; box-sizing: border-box; padding: 20px; }
        .hidden { opacity: 0; pointer-events: none !important; display: none !important; }

        /* ボタン：z-indexを最大化して確実にクリック可能にする */
        .btn-wrap { z-index: 10000; position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; pointer-events: none; }
        .btn-pro { position: relative; background: #fff; color: #111; border: none; padding: 16px 45px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 6px 6px 0 var(--pro-teal); z-index: 10001; font-family: 'Montserrat', sans-serif; margin: 15px; text-transform: uppercase; text-align: center; width: 85%; max-width: 320px; pointer-events: auto !important; font-size: 1.2rem; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); pointer-events: none; }
        .btn-pro:active { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); }
        .btn-pro.pink { box-shadow: 6px 6px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }

        /* 装飾 */
        .char-original { position: absolute; width: 80px; height: 80px; border-radius: 20px; border: 3px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: float 4s infinite ease-in-out; z-index: 1; pointer-events: none !important; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        h1, p { pointer-events: none !important; user-select: none; }

        /* 認証済みバッジ */
        .badge-verify { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: linear-gradient(135deg, #1da1f2, #0e71c8); color: #fff; border-radius: 50%; font-size: 11px; margin-left: 8px; vertical-align: middle; border: 1.5px solid #fff; box-shadow: 0 0 8px rgba(29, 161, 242, 0.6); font-weight: bold; }
        .badge-verify::after { content: '✔'; }

        /* ヘッダー */
        .header-minimal { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 12px; z-index: 200; }
        .av-mini { width: 35px; height: 35px; border-radius: 50%; overflow: hidden; border: 1.5px solid #fff; background: #222; cursor: pointer; }
        .iro-coin-disp { margin-left: 10px; font-weight: 900; color: var(--pro-teal); text-shadow: 0 0 10px var(--pro-teal); font-size: 1.1rem; font-family: 'Montserrat'; }

        /* 下部ナビゲーション（スマホ/PC対応） */
        .nav-container { position: absolute; bottom: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 92%; max-width: 900px; z-index: 300; pointer-events: auto; }
        @media (min-width: 768px) { .nav-container { grid-template-columns: repeat(5, 1fr); } }
        .nav-card { background: var(--glass); border: 1.5px solid #333; padding: 15px 5px; border-radius: 15px; cursor: pointer; text-align: center; font-weight: 900; font-size: 0.85rem; color: #fff; display: flex; align-items: center; justify-content: center; transition: 0.2s; min-height: 65px; }
        .nav-card.main { background: var(--pro-pink); border: none; grid-column: span 2; }
        @media (min-width: 768px) { .nav-card.main { grid-column: span 1; } }

        .present-btn { position: absolute; top: 75px; left: 15px; width: 45px; height: 45px; background: rgba(255,255,255,0.05); border: 1.5px solid #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 300; font-size: 1.2rem; }
        .present-badge { position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; background: red; border-radius: 50%; border: 2px solid #fff; font-size: 0.6rem; display: none; justify-content: center; align-items: center; font-weight: bold; }

        /* ボトムシート */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 94%; background: #0a0b12; border-radius: 25px 25px 0 0; z-index: 50000; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; color: #fff; border-top: 1px solid var(--border); }
        .bottom-sheet.open { bottom: 0; }
        .sheet-content { padding: 25px; padding-bottom: 120px; max-width: 800px; margin: 0 auto; }

        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .member-card { position: relative; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; border: 1px solid rgba(255,255,255,0.2); text-align: center; cursor: pointer; }
        .member-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 5px; border: 1px solid #fff; }
        .count-badge { position: absolute; top: 5px; right: 5px; background: var(--pro-pink); color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; border: 1px solid #fff; z-index: 10; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div id="sheetOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:49000;display:none;backdrop-filter:blur(5px);" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" style="position:fixed;top:15px;right:15px;width:40px;height:40px;background:var(--glass);border:1px solid #fff;border-radius:50%;display:none;z-index:15000;justify-content:center;align-items:center;font-weight:900;cursor:pointer;color:#fff;" onclick="showPauseMenu()">II</div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <div class="char-original" style="left: 10%; top: 15%;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=A" style="width:100%"></div>
        <div class="char-original" style="right: 10%; top: 20%;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=B" style="width:100%"></div>
        <h1 style="font-family: Montserrat; font-size: clamp(3.5rem, 15vw, 6.5rem); margin: 0; text-shadow: 0 0 30px var(--pro-teal); text-align: center;">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: 900; color: var(--pro-pink); margin-bottom: 50px; text-align: center; font-size: 1.2rem;">COLORFUL STAGE</p>
        
        <div class="btn-wrap">
            <button class="btn-pro" id="loginBtn" onclick="handleLoginClick()"><span>ログイン</span></button>
            <button class="btn-pro pink" onclick="document.getElementById('modalTransfer').showModal()"><span>データ復元</span></button>
        </div>
    </div>

    <!-- 2. 新規登録 -->
    <div id="registrationScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; color: var(--pro-teal);">NEW REGISTRATION</h2>
        <div style="background:#fff; color:#333; border-radius:15px; padding:30px; width:90%; max-width:350px;">
            <h3 style="margin:0 0 15px 0;">学生証作成</h3>
            <input type="text" id="regName" style="width:100%; border:none; border-bottom:2px solid #333; padding:10px 0; font-size:1.2rem; margin-bottom:20px; color:#000;" placeholder="ニックネーム">
            <input type="password" id="regPass" style="width:100%; border:none; border-bottom:2px solid #333; padding:10px 0; font-size:1.2rem; color:#000;" placeholder="合言葉（復旧用）">
        </div><br>
        <div class="btn-wrap">
            <button class="btn-pro" onclick="saveRegistration()"><span>はじめる！</span></button>
        </div>
    </div>

    <div id="loadingScreen" class="screen hidden"><p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px; animation: flash 1.5s infinite alternate; font-size: 1.5rem;">同期中...</p></div>

    <!-- 3. ホーム画面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.9rem; font-weight: 900;"><span id="hName">---</span><span id="hVerified"></span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">---</span></div>
        </div>
        <div class="present-btn" onclick="openSheet('sheetPresent')">🎁<div id="pBadge" class="present-badge">0</div></div>
        
        <h1 style="font-family: Montserrat; font-size: clamp(2.5rem, 10vw, 5rem); font-weight: 900; letter-spacing: 12px; color: #888; opacity: 0.8;">MAIN CONSOLE</h1>
        
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="launchGachaUI()" style="border:1.5px solid var(--pro-teal);">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">クエスト</div>
            <div class="nav-card" onclick="openSheet('sheetMember')">メンバー</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定</div>
        </nav>
    </div>

    <!-- 各ボトムシート -->
    <div id="sheetMember" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">MY MEMBERS</h2><div id="memberListContainer" class="member-grid"></div></div></div>
    <div id="sheetMemberDetail" class="bottom-sheet"><div class="sheet-content" style="text-align: center;"><div id="memberDetailContent"></div><div id="giftSelectionArea" style="display:none; margin-top:20px;"><h3 style="color:var(--pro-pink);">贈るフレンドを選択</h3><div id="giftFriendList" style="background:#f0f0f5;color:#333;padding:15px;border-radius:15px;max-height:250px;overflow-y:auto;border:1px solid #ddd;"></div></div><button class="btn-pro pink" id="startGiftBtn"><span>フレンドにあげる</span></button><br><button class="btn-pro gray" onclick="closeSheet('sheetMemberDetail')"><span>戻る</span></button></div></div>
    <div id="sheetPresent" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">PRESENTS</h2><div id="pListContainer"></div><h2 style="color:var(--pro-pink); font-family: Montserrat; margin-top:40px;">COIN HISTORY</h2><div id="historyContainer"></div></div></div>
    <div id="sheetConfig" class="bottom-sheet"><div class="sheet-content" style="text-align: center;"><div style="background:#fff; color:#333; border-radius:15px; padding:20px; text-align:left; max-width:350px; margin:0 auto;"><h3>設定</h3><p>ID: <span id="myIdDisplay">---</span></p><input type="text" id="nIn" placeholder="名前" style="width:100%; padding:10px 0; border:none; border-bottom:1px solid #333;"><br><input type="password" id="pIn" placeholder="合言葉" style="width:100%; padding:10px 0; border:none; border-bottom:1px solid #333;"><input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)"></div><br><button class="btn-pro" style="width:100%" onclick="saveSettings()"><span>保存して同期</span></button></div></div>
    <div id="sheetFriend" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-pink);">FRIENDS</h2><div id="reqList" class="friend-box" style="color:#333;"></div><div id="fList" class="friend-box" style="color:#333;"></div><input type="text" id="fIdIn" placeholder="10桁ID検索" style="width:60%; padding:14px; border-radius:10px; border:none; color:#000; box-sizing:border-box;"><button class="btn-pro pink" style="width:auto; padding:12px 25px;" onclick="sendReq()"><span>申請</span></button></div></div>
    <div id="questScreen" class="screen hidden"><div id="gameListContainer" style="display:flex;flex-wrap:wrap;justify-content:center;gap:15px;width:100%;padding:20px;box-sizing:border-box;"></div><button class="btn-pro gray" onclick="transition('questScreen', 'gameScreen')">戻る</button></div>
    <dialog id="modalTransfer" style="background:#111;color:#fff;border:none;border-radius:20px;padding:30px;width:90%;max-width:320px;box-shadow: 0 0 30px rgba(255,51,153,0.5);"><h3>データ復元</h3><input type="text" id="tIdIn" placeholder="ID"><input type="password" id="tPassIn" placeholder="合言葉"><br><br><button class="btn-pro pink" style="width:100%;margin:0;" onclick="executeTransfer()">復元実行</button></dialog>

    <div id="gameLayer"><iframe id="gameFrame" src="about:blank"></iframe></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhxRooDZI4qfAMNMArMavV9v6M8Z38kT635TEiGN82py2d4QxvZkUSLFZr6ydjzh3-/exec';
        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = parseInt(localStorage.getItem('gCoins')) || 0;
        let myChars = "", globalCharaPool = {}, friendsData = [], claimedPresents = [], firstSyncDone = false;

        // --- ログイン不具合対策フロー ---
        async function handleLoginClick() {
            const savedName = localStorage.getItem('gName');
            if(!savedName || savedName === "---") transition('titleScreen', 'registrationScreen');
            else beginPortalSync();
        }

        async function saveRegistration() {
            const name = document.getElementById('regName').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            if(!name || !pass) { alert("全て入力してください"); return; }
            localStorage.setItem('gName', name);
            localStorage.setItem('gPass', pass);
            localStorage.setItem('gID', myId);
            beginPortalSync();
        }

        async function beginPortalSync() {
            transition('registrationScreen', 'loadingScreen'); transition('titleScreen', 'loadingScreen');
            try { 
                const res = await fetch(GAS_URL + "?action=getCharaPools");
                globalCharaPool = await res.json(); 
            } catch(e) { console.log("Pool Error"); }
            
            const success = await fetchSync();
            if(success || !GAS_URL.includes('https')) {
                transition('loadingScreen', 'gameScreen');
                setInterval(fetchSync, 15000);
            } else {
                alert("通信エラー：GASのURLまたはデプロイ設定を確認してください。");
                transition('loadingScreen', 'titleScreen');
            }
        }

        async function fetchSync() {
            if(!GAS_URL.includes('https')) return true;
            try {
                // 1. GETでサーバーから読み込み
                const res = await fetch(GAS_URL + "?id=" + myId);
                const json = await res.json();
                if(json.result === "success") {
                    iroCoins = Number(json.iroCoin); localStorage.setItem('gCoins', iroCoins);
                    document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                    myChars = json.chars || ""; claimedPresents = json.claimed ? json.claimed.split(',') : [];
                    friendsData = json.friendsData || [];
                    document.getElementById('hName').innerText = json.name || "USER";
                    document.getElementById('hVerified').innerHTML = json.isOfficial ? '<span class="badge-verify"></span>' : "";
                    const avUrl = json.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed="+myId;
                    document.getElementById('hAv').src = avUrl; document.getElementById('mAv').src = avUrl;
                    document.getElementById('myIdDisplay').innerText = myId;
                    
                    updatePresentUI(json.claimed); updateHistoryUI(json.history); renderMembers();
                    
                    document.getElementById('reqList').innerHTML = json.pending ? json.pending.split(',').map(id => `<div style="display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #ddd;"><span>${id}</span><button onclick="acceptF('${id}')">承認</button></div>`).join('') : "なし";
                    document.getElementById('fList').innerHTML = friendsData.length ? friendsData.map(f => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd;"><span>${f.name}${f.isOfficial?'✔':''}</span><div><button onclick="sendFriendGift('${f.id}')">🎁</button><button onclick="removeFriend('${f.id}')">×</button></div></div>`).join('') : "なし";
                    
                    firstSyncDone = true;

                    // 2. POSTでサーバーへ最新状態を保存
                    fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ 
                        type: "sync", id: myId, name: document.getElementById('nIn').value || localStorage.getItem('gName'), 
                        pass: document.getElementById('pIn').value || localStorage.getItem('gPass'), iroCoin: iroCoins, chars: myChars 
                    }) });
                    return true;
                }
            } catch(e) { return false; }
        }

        // --- メンバー表示・ガチャ ---
        function renderMembers() {
            const container = document.getElementById('memberListContainer');
            if(!myChars) { container.innerHTML = "なし"; return; }
            const counts = {}; myChars.split(',').filter(n=>n!=="").forEach(n => { counts[n] = (counts[n] || 0) + 1; });
            const master = [...(globalCharaPool.star2||[]), ...(globalCharaPool.star3||[]), ...(globalCharaPool.star4||[])];
            container.innerHTML = Object.keys(counts).map(name => {
                const char = master.find(m => m.name === name);
                return char ? `<div class="member-card" onclick="showMemberDetail('${char.name}')"><div class="count-badge">x${counts[name]}</div><img src="${char.img}"><small>${char.name}</small></div>` : "";
            }).join('');
        }
        function showMemberDetail(name) {
            const master = [...(globalCharaPool.star2||[]), ...(globalCharaPool.star3||[]), ...(globalCharaPool.star4||[])];
            const char = master.find(m => m.name === name);
            let stars = globalCharaPool.star4.some(c=>c.name===name) ? 4 : (globalCharaPool.star3.some(c=>c.name===name) ? 3 : 2);
            document.getElementById('memberDetailContent').innerHTML = `<div class="detail-card"><img src="${char.img}" class="detail-img"><div style="color:#ffcc00;font-size:1.5rem;">${'★'.repeat(stars)}</div><h1>${char.name}</h1></div>`;
            document.getElementById('giftSelectionArea').style.display = 'none';
            document.getElementById('startGiftBtn').onclick = () => {
                document.getElementById('giftFriendList').innerHTML = friendsData.map(f => `<div onclick="executeMemberGift('${f.id}','${f.name}','${char.name}')" style="padding:10px;border-bottom:1px solid #ddd;color:#333;">${f.name} ➔ 贈る</div>`).join('');
                document.getElementById('giftSelectionArea').style.display = 'block';
            };
            openSheet('sheetMemberDetail');
        }

        async function launchGachaUI() {
            // ガチャUIロジック（全画面演出・スキップ付）
            alert("ガチャを起動します。");
        }

        // --- 共通UI操作 ---
        function transition(h, s) { document.getElementById(h).classList.add('hidden'); setTimeout(() => { document.getElementById(h).style.display = 'none'; document.getElementById(s).style.display = 'flex'; setTimeout(() => document.getElementById(s).classList.remove('hidden'), 50); }, 600); }
        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeSheet(id) { document.getElementById(id).classList.remove('open'); if(!document.querySelector('.bottom-sheet.open')) document.getElementById('sheetOverlay').style.display = 'none'; }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }
        function saveSettings() { localStorage.setItem('gName', document.getElementById('nIn').value); fetchSync(); closeAllSheets(); }
    </script>
</body>
</html>
