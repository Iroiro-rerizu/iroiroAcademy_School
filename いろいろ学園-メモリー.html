<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - ULTIMATE INTEGRATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.85);
            --border: rgba(255, 255, 255, 0.3); --verify: #1da1f2;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        /* 背景装飾 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.4); pointer-events: none; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, #000 100%); z-index: -1; pointer-events: none; }

        /* キャラクター装飾（浮遊） */
        .char-original { position: absolute; width: 90px; height: 90px; border-radius: 24px; border: 3px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: float 4s infinite ease-in-out; z-index: 1; box-shadow: 0 0 25px var(--pro-teal); pointer-events: none; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-25px) rotate(8deg); } }

        /* スクリーン管理 */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; box-sizing: border-box; padding: 20px; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        /* プロセカ風ボタン */
        .btn-pro { position: relative; background: #fff; color: #111; border: none; padding: 16px 40px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 5px 5px 0 var(--pro-teal); z-index: 10000; font-family: 'Montserrat', sans-serif; margin: 12px; text-transform: uppercase; text-align: center; width: 85%; max-width: 300px; font-size: 1.1rem; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); pointer-events: none; }
        .btn-pro:active { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); }
        .btn-pro.pink { box-shadow: 5px 5px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }
        .btn-pro.gray { box-shadow: 5px 5px 0 #444; background: #777; color: #fff; }

        /* ヘッダー・ステータス */
        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; z-index: 200; }
        .av-mini { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid #fff; overflow: hidden; background: #222; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .iro-coin-disp { margin-left: 10px; font-weight: 900; color: var(--pro-teal); text-shadow: 0 0 15px var(--pro-teal); font-size: 1.2rem; }
        .badge-verify { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: linear-gradient(135deg, #1da1f2, #0e71c8); color: #fff; border-radius: 50%; font-size: 10px; margin-left: 6px; border: 1.5px solid #fff; font-weight: bold; }
        .badge-verify::after { content: '✔'; }

        /* 下部ナビゲーション */
        .nav-container { position: absolute; bottom: 25px; display: flex; gap: 10px; width: 95%; max-width: 900px; z-index: 300; justify-content: center; }
        .nav-card { flex: 1; background: rgba(0,0,0,0.7); border: 1.5px solid #444; padding: 20px 5px; border-radius: 14px; cursor: pointer; text-align: center; font-weight: 900; font-size: 0.8rem; color: #fff; transition: 0.2s; white-space: nowrap; }
        .nav-card:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .nav-card.main { background: var(--pro-pink); border: none; box-shadow: 0 0 25px rgba(255,51,153,0.5); }

        /* ボトムシート */
        .bottom-sheet { position: fixed; bottom: -110%; left: 0; width: 100%; height: 94%; background: #0a0b12; border-radius: 32px 32px 0 0; z-index: 50000; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; color: #fff; border-top: 1px solid var(--border); }
        .bottom-sheet.open { bottom: 0; }
        .sheet-content { padding: 25px; padding-bottom: 140px; max-width: 800px; margin: 0 auto; }

        /* 会員・グリッド */
        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; }
        .member-card { position: relative; background: rgba(255,255,255,0.08); border-radius: 16px; padding: 12px; border: 1.2px solid rgba(255,255,255,0.2); text-align: center; cursor: pointer; transition: 0.2s; }
        .member-card:active { transform: scale(0.95); }
        .member-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; border: 2px solid #fff; }
        .count-badge { position: absolute; top: 6px; right: 6px; background: var(--pro-pink); color: #fff; font-size: 0.7rem; font-weight: bold; padding: 3px 10px; border-radius: 20px; border: 1.5px solid #fff; z-index: 10; }

        /* 履歴・カード */
        .history-item { background: rgba(255,255,255,0.05); padding: 14px; border-radius: 12px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; border-left: 5px solid #555; }
        .student-id-card { background: #fff; color: #333; border-radius: 20px; padding: 25px; border: 4px solid #444; max-width: 360px; margin: 20px auto; text-align: left; box-shadow: 10px 10px 0 rgba(0,0,0,0.3); }
        .student-input { background: none; border: none; border-bottom: 2px solid #333; width: 100%; font-size: 1.2rem; padding: 12px 0; margin-bottom: 20px; color:#000; font-weight: bold; outline: none; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }

        /* ポーズ */
        #pauseOverlay { position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:60000;display:none;flex-direction:column;justify-content:center;align-items:center; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="floatChars"></div>

    <div id="sheetOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:49000;display:none;backdrop-filter:blur(5px);" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" style="position:fixed;top:15px;right:15px;width:45px;height:45px;background:var(--glass);border:1.5px solid #fff;border-radius:50%;display:none;z-index:15000;justify-content:center;align-items:center;font-weight:900;cursor:pointer;color:#fff;" onclick="showPauseMenu()">II</div>

    <!-- ポーズメニュー -->
    <div id="pauseOverlay">
        <h1 style="font-family: Montserrat; font-size: 3.5rem; color: var(--pro-teal); margin-bottom: 40px; text-shadow: 0 0 20px var(--pro-teal);">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開する</span></button>
        <button class="btn-pro pink" onclick="exitGame()"><span>タイトルへ</span></button>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <h1 style="font-family: Montserrat; font-size: clamp(3.5rem, 15vw, 8.5rem); margin: 0; text-shadow: 0 0 40px var(--pro-teal); text-align: center;">GENSOU</h1>
        <p style="letter-spacing: 14px; font-weight: 900; color: var(--pro-pink); margin-bottom: 60px; text-align: center; font-size: 1.3rem; text-shadow: 0 0 10px var(--pro-pink);">COLORFUL STAGE</p>
        <button class="btn-pro" onclick="handleLoginClick()"><span>ログイン</span></button>
        <button class="btn-pro pink" onclick="document.getElementById('modalTransfer').showModal()"><span>データ復元</span></button>
    </div>

    <!-- 2. 新規登録 -->
    <div id="registrationScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; color: var(--pro-teal); font-size: 2rem;">NEW REGISTRATION</h2>
        <div class="student-id-card">
            <h3 style="margin:0 0 20px 0; color:#111; font-family: Montserrat;">STUDENT ID CARD</h3>
            <input type="text" id="regName" class="student-input" placeholder="なまえ（公開）">
            <input type="password" id="regPass" class="student-input" placeholder="合言葉（復元用）">
            <p style="font-size: 0.75rem; color: #f39; font-weight:bold;">※IDと合言葉は大切に保管してください。</p>
        </div>
        <button class="btn-pro" onclick="saveRegistration()"><span>作成して開始！</span></button>
    </div>

    <div id="loadingScreen" class="screen hidden"><p style="color: var(--pro-teal); font-weight: 900; letter-spacing: 5px; animation: pulse 1s infinite alternate; font-size: 1.8rem;">同期中...</p></div>

    <!-- 3. ホーム画面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 1rem; font-weight: 900;"><span id="hName">---</span><span id="hVerified"></span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">---</span></div>
        </div>
        
        <!-- プレゼントボタン -->
        <div style="position: absolute; top: 75px; left: 15px; width: 48px; height: 48px; background: rgba(255,255,255,0.1); border: 2px solid #555; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 300; font-size: 1.5rem;" onclick="openSheet('sheetPresent')">
            🎁<div id="pBadge" style="position: absolute; top: -4px; right: -4px; width: 20px; height: 20px; background: #ff3366; border-radius: 50%; border: 2px solid #fff; font-size: 0.7rem; display: none; justify-content: center; align-items: center; font-weight: 900;">0</div>
        </div>

        <h1 style="font-family: Montserrat; font-size: clamp(2rem, 10vw, 5.5rem); font-weight: 900; letter-spacing: 12px; color: #fff; opacity: 0.7; user-select: none; pointer-events: none; text-align: center;">MAIN CONSOLE</h1>
        
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="launchGachaUI()">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">クエスト</div>
            <div class="nav-card" onclick="openSheet('sheetMember')">メンバー</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定</div>
        </nav>
    </div>

    <!-- ボトムシート群 -->
    <div id="sheetMember" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat; font-size: 2rem; margin-bottom: 25px;">MY MEMBERS</h2><div id="memberListContainer" class="member-grid"></div></div></div>
    
    <div id="sheetMemberDetail" class="bottom-sheet">
        <div class="sheet-content" style="text-align: center;">
            <div id="memberDetailContent"></div>
            <div id="giftSelectionArea" style="display:none; margin-top:25px;">
                <h3 style="color:var(--pro-pink); margin-bottom: 15px;">贈るフレンドを選択</h3>
                <div id="giftFriendList" style="background:#f8f8f8; color:#333; padding:15px; border-radius:24px; max-height:350px; overflow-y:auto; border: 3px solid #ddd;"></div>
            </div>
            <button class="btn-pro pink" id="startGiftBtn"><span>フレンドに贈る</span></button><br>
            <button class="btn-pro gray" onclick="closeSheet('sheetMemberDetail')"><span>戻る</span></button>
        </div>
    </div>

    <div id="sheetPresent" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat; font-size: 1.8rem;">PRESENTS</h2><div id="pListContainer"></div><h2 style="color:var(--pro-pink); font-family: Montserrat; font-size: 1.8rem; margin-top:50px;">COIN HISTORY</h2><div id="historyContainer"></div></div></div>
    
    <div id="sheetConfig" class="bottom-sheet">
        <div class="sheet-content" style="text-align: center;">
            <div class="student-id-card">
                <h3 style="margin:0 0 15px 0;">IDカード設定</h3>
                <img id="mAv" style="width:120px;height:120px;border:4px solid #333;object-fit:cover;background:#eee;cursor:pointer;border-radius:50%;" onclick="document.getElementById('fileIn').click()">
                <p style="font-size:0.8rem; color:#666; margin: 10px 0;">ID: <span id="myIdDisplay" style="font-weight: 900; color:#111;">---</span></p>
                <input type="text" id="nIn" placeholder="名前を更新" class="student-input">
                <input type="password" id="pIn" placeholder="合言葉を更新" class="student-input">
                <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)">
            </div>
            <br><button class="btn-pro" style="width:100%" onclick="saveSettings()"><span>設定を保存</span></button>
        </div>
    </div>

    <div id="sheetFriend" class="bottom-sheet">
        <div class="sheet-content">
            <h2 style="color:var(--pro-pink); font-family: Montserrat; font-size: 1.8rem;">FRIEND SYSTEM</h2>
            <p style="font-size:0.9rem; color:var(--pro-teal); font-weight: 900;">承認待ち</p>
            <div id="reqList" style="margin-bottom: 25px;"></div>
            <p style="font-size:0.9rem; color:var(--pro-teal); font-weight: 900;">フレンドリスト</p>
            <div id="fList"></div>
            <div style="margin-top:40px; display:flex; gap:10px;">
                <input type="text" id="fIdIn" placeholder="10桁IDで検索" style="flex:1; padding:16px; border-radius:12px; border:none; color:#000; font-weight:bold; font-size:1.1rem;">
                <button class="btn-pro pink" style="width:auto; padding:15px 30px; margin:0;" onclick="sendReq()"><span>申請</span></button>
            </div>
        </div>
    </div>

    <div id="questScreen" class="screen hidden">
        <h2 style="font-size: 3rem; color: var(--pro-teal); font-family: Montserrat; margin-bottom: 30px;">QUEST SELECT</h2>
        <div id="gameListContainer" style="display:flex;flex-wrap:wrap;justify-content:center;gap:18px;width:100%;padding:20px;box-sizing:border-box;"></div>
        <button class="btn-pro gray" onclick="transition('questScreen', 'gameScreen')"><span>戻る</span></button>
    </div>

    <dialog id="modalTransfer" style="background:#111;color:#fff;border:none;border-radius:24px;padding:35px;width:90%;max-width:340px;box-shadow: 0 0 50px rgba(255,51,153,0.4);">
        <h3 style="font-family: Montserrat; color: var(--pro-pink);">DATA RECOVERY</h3>
        <input type="text" id="tIdIn" placeholder="ID (10桁)" style="width:100%; padding:15px; margin-bottom:12px; border-radius:8px; border:none; font-weight:bold;">
        <input type="password" id="tPassIn" placeholder="合言葉" style="width:100%; padding:15px; border-radius:8px; border:none; font-weight:bold;">
        <br><br><button class="btn-pro pink" style="width:100%;margin:0;" onclick="executeTransfer()"><span>データを復元</span></button>
        <button style="background:none; border:none; color:#888; margin-top:15px; cursor:pointer;" onclick="document.getElementById('modalTransfer').close()">キャンセル</button>
    </dialog>

    <!-- ガチャ・ゲーム共通レイヤー -->
    <div id="gameLayer"><iframe id="gameFrame" src="about:blank"></iframe></div>

    <script>
        // --- 基本構成 ---
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzHCjY2K1lH3hLIFXkTEu-iqikZ3u9WFrKIkQcFKvEQ2L6WoH10p5WTWvv-I0WXw-n2/exec';
        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = parseInt(localStorage.getItem('gCoins')) || 0;
        let myChars = "", globalCharaPool = {}, friendsData = [], firstSyncDone = false;

        // 背景浮遊演出
        function initFloating() {
            const container = document.getElementById('floatChars');
            for(let i=0; i<6; i++) {
                const div = document.createElement('div');
                div.className = 'char-original';
                div.style.left = (Math.random() * 85) + '%';
                div.style.top = (Math.random() * 80) + '%';
                div.style.animationDelay = (Math.random() * 6) + 's';
                div.style.opacity = '0.25';
                container.appendChild(div);
            }
        }
        initFloating();

        // ログイン・登録
        function handleLoginClick() {
            if(!localStorage.getItem('gName')) transition('titleScreen', 'registrationScreen');
            else beginPortalSync();
        }
        async function saveRegistration() {
            const name = document.getElementById('regName').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            if(!name || !pass) { alert("全て入力してください"); return; }
            localStorage.setItem('gID', myId);
            localStorage.setItem('gName', name); localStorage.setItem('gPass', pass);
            beginPortalSync();
        }
        async function beginPortalSync() {
            transition('registrationScreen', 'loadingScreen'); transition('titleScreen', 'loadingScreen');
            try { globalCharaPool = await (await fetch(GAS_URL + "?action=getCharaPools")).json(); } catch(e) {}
            if(await fetchSync() || !GAS_URL.includes('https')) {
                transition('loadingScreen', 'gameScreen');
                setInterval(fetchSync, 15000);
            } else { 
                alert("サーバーへの接続に失敗しました。URLを確認してください。"); 
                transition('loadingScreen', 'titleScreen'); 
            }
        }
        function transition(h, s) { 
            const cur = document.getElementById(h); const nxt = document.getElementById(s); 
            if(cur) { cur.classList.add('hidden'); setTimeout(() => cur.style.display = 'none', 600); } 
            if(nxt) { nxt.style.display = 'flex'; setTimeout(() => nxt.classList.remove('hidden'), 50); } 
        }

        // 同期コア処理
        async function fetchSync() {
            if(!GAS_URL.includes('https')) return true;
            try {
                const res = await fetch(GAS_URL + "?id=" + myId);
                const json = await res.json();
                if(json.result === "success") {
                    iroCoins = Number(json.iroCoin); localStorage.setItem('gCoins', iroCoins);
                    document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                    myChars = json.chars || "";
                    friendsData = json.friendsData || [];
                    document.getElementById('hName').innerText = json.name || "USER";
                    document.getElementById('hVerified').innerHTML = json.isOfficial ? '<span class="badge-verify"></span>' : "";
                    const avUrl = json.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed="+myId;
                    document.getElementById('hAv').src = avUrl; document.getElementById('mAv').src = avUrl;
                    document.getElementById('myIdDisplay').innerText = myId;
                    
                    updatePresentUI(json.pendingGifts); 
                    updateHistoryUI(json.history);
                    renderMembers();

                    if(!firstSyncDone) {
                        document.getElementById('nIn').value = json.name;
                        document.getElementById('pIn').value = json.pass;
                        firstSyncDone = true;
                    }

                    document.getElementById('reqList').innerHTML = json.pending ? json.pending.split(',').map(id => `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:#fff;border-radius:12px;margin-bottom:8px;color:#333;font-weight:900;"><span>ID: ${id}</span><button style="background:var(--pro-teal);border:none;padding:8px 15px;border-radius:6px;font-weight:bold;" onclick="acceptF('${id}')">承認</button></div>`) : "なし";
                    document.getElementById('fList').innerHTML = friendsData.length ? friendsData.map(f => `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid #333;padding:15px 0;color:#fff;"><span>${f.name}${f.isOfficial?'<span class="badge-verify"></span>':''}</span><div><button style="background:none;border:1.5px solid #fff;color:#fff;border-radius:8px;padding:8px 12px;margin-right:8px;cursor:pointer;" onclick="sendFriendGift('${f.id}')">🎁</button><button style="background:none;border:1.5px solid var(--pro-pink);color:var(--pro-pink);border-radius:8px;padding:8px 12px;cursor:pointer;" onclick="removeFriend('${f.id}')">×</button></div></div>`).join('') : "フレンドがいません";

                    await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "sync", id: myId, name: localStorage.getItem('gName'), pass: localStorage.getItem('gPass'), iroCoin: iroCoins, chars: myChars, avatar: localStorage.getItem('gAv')||"" }) });
                    return true;
                }
            } catch(e) { return false; }
        }

        // メンバー表示・詳細
        function renderMembers() {
            const container = document.getElementById('memberListContainer');
            if(!myChars) { container.innerHTML = "なし"; return; }
            const counts = {}; myChars.split(',').filter(n=>n!=="").forEach(n => { counts[n] = (counts[n] || 0) + 1; });
            const master = [...(globalCharaPool.star2||[]), ...(globalCharaPool.star3||[]), ...(globalCharaPool.star4||[])];
            container.innerHTML = Object.keys(counts).map(name => {
                const char = master.find(m => m.name === name);
                return char ? `<div class="member-card" onclick="showMemberDetail('${char.name}')"><div class="count-badge">x${counts[name]}</div><img src="${char.img}"><br><small style="font-weight:bold;">${char.name}</small></div>` : "";
            }).join('');
        }
        function showMemberDetail(name) {
            const master = [...(globalCharaPool.star2||[]), ...(globalCharaPool.star3||[]), ...(globalCharaPool.star4||[])];
            const char = master.find(m => m.name === name); if(!char) return;
            let stars = globalCharaPool.star4.some(c=>c.name===name) ? 4 : (globalCharaPool.star3.some(c=>c.name===name) ? 3 : 2);
            document.getElementById('memberDetailContent').innerHTML = `<div class="detail-card"><img src="${char.img}" style="width:220px; height:280px; object-fit:cover; border-radius:20px; border:5px solid #fff; box-shadow:0 0 20px rgba(0,0,0,0.5);"><div style="color:#ffcc00;font-size:2rem; margin-top:15px; text-shadow:0 0 10px #000;">${'★'.repeat(stars)}</div><h1 style="font-size:2.2rem; margin:10px 0;">${char.name}</h1></div>`;
            document.getElementById('giftSelectionArea').style.display = 'none';
            document.getElementById('startGiftBtn').onclick = () => {
                document.getElementById('giftFriendList').innerHTML = friendsData.map(f => `<div onclick="executeMemberGift('${f.id}','${f.name}','${char.name}')" style="padding:18px;border-bottom:1.5px solid #eee;color:#333;cursor:pointer;font-weight:900;">${f.name} へ贈る ➔</div>`).join('');
                document.getElementById('giftSelectionArea').style.display = 'block';
            };
            openSheet('sheetMemberDetail');
        }
        async function executeMemberGift(tid, tn, cn) { if(confirm(`${tn}さんに贈りますか？`)) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "friendMemberGift", fromId: myId, fromName: document.getElementById('hName').innerText, toId: tid, charName: cn }) }); alert("贈りました！"); closeSheet('sheetMemberDetail'); fetchSync(); } }

        // ガチャUI（確定ロジック入り）
        async function launchGachaUI() {
            document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex';
            const [gDataRes, charPoolRes] = await Promise.all([ fetch(GAS_URL + "?action=getGachaSettings"), fetch(GAS_URL + "?action=getCharaPools") ]);
            const gData = await gDataRes.json(); const pools = await charPoolRes.json();
            
            document.getElementById('gameFrame').srcdoc = `
            <!DOCTYPE html><html><head><style>
                body{background:#000;color:#fff;font-family:sans-serif;margin:0;overflow:hidden;}
                #bg{position:fixed;width:100%;height:100%;background:url('${gData[0].bg}') center/cover;transition:0.6s;filter:brightness(1.1);}
                .ui{position:relative;z-index:10;height:100vh;padding:30px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;background:linear-gradient(rgba(0,0,0,0.3),transparent,rgba(0,0,0,0.9));}
                .coin-tag{background:rgba(0,0,0,0.7);padding:10px 22px;border-radius:40px;color:#33ffcc;border:2px solid #33ffcc;font-weight:bold;width:fit-content;font-size:1.2rem;}
                .sidebar{position:absolute;left:20px;top:100px;display:flex;flex-direction:column;gap:15px;}
                .tab{width:140px;height:70px;background-size:cover;border:3px solid transparent;border-radius:12px;opacity:0.6;cursor:pointer;transition:0.3s;}
                .tab.active{border-color:#ffcc00;opacity:1;transform:translateX(12px);box-shadow: 0 0 20px #ffcc00;}
                .btn-pull{padding:22px 45px;border-radius:15px;border:none;color:#fff;font-weight:900;cursor:pointer;font-size:1.2rem;box-shadow:0 6px 0 rgba(0,0,0,0.4);transition:0.1s;}
                .btn-pull:active{transform:translateY(4px);box-shadow:none;}
                .b-1{background:#555;} .b-10{background:linear-gradient(#ff88bb,#ff3399);} .b-100{background:linear-gradient(#ffcc00,#ff6600);}
                #reveal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:1000;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;overflow:hidden;}
                .rev-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;z-index:1;animation:zoomIn 15s linear infinite;}
                .rev-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(transparent 50%,rgba(0,0,0,0.95));z-index:2;}
                .rev-content{position:relative;z-index:10;text-align:center;margin-top:auto;padding-bottom:120px;}
                @keyframes zoomIn{from{transform:scale(1)}to{transform:scale(1.15)}}
                #summary{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.97);display:none;z-index:2000;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
                .summary-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:90%;overflow-y:auto;max-height:75vh;}
                .summary-card{width:90px;text-align:center;background:rgba(255,255,255,0.1);border-radius:10px;padding:8px;}
                .summary-card img{width:70px;height:100px;object-fit:cover;border-radius:6px;border:2px solid #fff;}
                .skip-btn{position:fixed;top:30px;right:30px;z-index:3000;padding:12px 35px;background:rgba(255,255,255,0.2);border:2px solid #fff;border-radius:40px;color:#fff;cursor:pointer;font-weight:900;display:none;}
            </style></head>
            <body><div id="bg"></div><div class="ui"><div class="coin-tag">🪙 <span id="c">${iroCoins.toLocaleString()}</span></div><div class="sidebar" id="sb"></div><div style="margin-left:170px;margin-bottom:120px;"><h1 id="gn" style="font-size:3rem;text-shadow:0 0 20px #000;"></h1></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:20px;" id="bc"></div></div>
            <button id="skip" class="skip-btn" onclick="skip()">SKIP</button>
            <div id="reveal" onclick="next()"><img id="ri" class="rev-img"><div class="rev-overlay"></div><div class="rev-content"><div id="rs" style="display:flex;justify-content:center;gap:15px;margin-bottom:20px;"></div><h1 style="font-size:4.5rem;margin:0;text-shadow:0 0 20px #000;" id="rn"></h1><p style="letter-spacing:5px;">TAP TO NEXT</p></div></div>
            <div id="summary"><h2 style="font-size:2.5rem;color:#33ffcc;">GACHA RESULT</h2><div id="sg" class="summary-grid"></div><button onclick="location.reload()" style="margin-top:30px;padding:20px 80px;border-radius:50px;border:none;font-weight:900;background:#fff;font-size:1.2rem;">OK</button></div>
            <script>
                let coins=${iroCoins}, ps=${JSON.stringify(pools)}, gd=${JSON.stringify(gData)}, res=[], cur=0;
                function render(idx){
                    document.getElementById('bg').style.backgroundImage='url('+gd[idx].bg+')';
                    document.getElementById('gn').innerText=gd[idx].title;
                    const bc=document.getElementById('bc'); bc.innerHTML='';
                    gd[idx].buttons.split(',').forEach(b=>{
                        let n=parseInt(b); if(isNaN(n))n=1;
                        const btn=document.createElement('button'); btn.className='btn-pull '+(n>=100?'b-100':(n>=10?'b-10':'b-1'));
                        btn.innerText=b+'引く (🪙'+(n*300)+')'; btn.onclick=()=>pull(n); bc.appendChild(btn);
                    });
                }
                function pull(n){
                    const cost=n*300; if(coins<cost){alert('コインが足りません');return;}
                    coins-=cost; document.getElementById('c').innerText=coins.toLocaleString();
                    res=[]; let names=[]; let hasS4=false, hasS3=false;
                    for(let i=0; i<n; i++){
                        let s=2, r=Math.random()*100;
                        if(r<3.5) s=4; else if(r<16) s=3;
                        
                        // 【確定ロジック】
                        if(n>=100 && i===n-1 && !hasS4) s=4; // 100連星4確定
                        else if(n>=10 && i===n-1 && !hasS3 && s<3) s=3; // 10連星3確定
                        
                        if(s>=4) hasS4=true; if(s>=3) hasS3=true;
                        const pool=ps['star'+s]; const c=pool[Math.floor(Math.random()*pool.length)];
                        res.push({...c,rank:s}); names.push(c.name);
                    }
                    window.parent.postMessage({type:'gachaPull',value:coins,pulls:n,chars:names.join(',')},'*');
                    cur=0; document.getElementById('skip').style.display='block'; show();
                }
                function show(){
                    const c=res[cur]; document.getElementById('reveal').style.display='flex';
                    document.getElementById('ri').src=c.img; document.getElementById('rn').innerText=c.name;
                    const sArea=document.getElementById('rs'); sArea.innerHTML='';
                    for(let i=0;i<c.rank;i++){ const s=document.createElement('div'); s.style="font-size:3rem;color:#ffcc00;text-shadow:0 0 15px #000;"; s.innerText='★'; sArea.appendChild(s); }
                }
                function next(){ cur++; if(cur<res.length) show(); else skip(); }
                function skip(){
                    document.getElementById('reveal').style.display='none'; document.getElementById('skip').style.display='none';
                    const g=document.getElementById('sg'); g.innerHTML='';
                    res.forEach(c=>{ const d=document.createElement('div'); d.className='summary-card'; d.innerHTML='<img src="'+c.img+'"><br><small>'+'★'.repeat(c.rank)+'</small>'; g.appendChild(d); });
                    document.getElementById('summary').style.display='flex';
                }
                gd.forEach((g,i)=>{ 
                    const t=document.createElement('div'); t.className='tab'+(i===0?' active':''); t.style.backgroundImage='url('+g.thumbnail+')';
                    t.onclick=()=>{ render(i); document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',i===j)); };
                    document.getElementById('sb').appendChild(t);
                });
                render(0);
            <\/script></body></html>`;
        }

        // --- ユーティリティ ---
        window.addEventListener('message', e => { 
            if(e.data.type === 'gachaPull') { 
                iroCoins = e.data.value; localStorage.setItem('gCoins', iroCoins); 
                document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString(); 
                fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "gachaLog", userId: myId, newCoins: iroCoins, pulls: e.data.pulls, newChars: e.data.chars }) }); 
            } 
        });

        function saveSettings() { 
            localStorage.setItem('gName', document.getElementById('nIn').value); 
            localStorage.setItem('gPass', document.getElementById('pIn').value); 
            alert("保存完了"); fetchSync(); closeAllSheets(); 
        }

        function uploadIcon(input) { 
            if (input.files && input.files[0]) { 
                const r = new FileReader(); 
                r.onload = e => { 
                    localStorage.setItem('gAv', e.target.result); 
                    document.getElementById('hAv').src = e.target.result; 
                    fetchSync(); 
                }; 
                r.readAsDataURL(input.files[0]); 
            } 
        }

        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeSheet(id) { document.getElementById(id).classList.remove('open'); if(!document.querySelector('.bottom-sheet.open')) document.getElementById('sheetOverlay').style.display = 'none'; }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }
        function showPauseMenu() { document.getElementById('pauseOverlay').style.display = 'flex'; }
        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { location.reload(); }

        async function loadGameList() { 
            const res = await (await fetch(GAS_URL + "?action=getList")).json(); 
            const container = document.getElementById('gameListContainer'); container.innerHTML = ""; 
            res.forEach(g => { 
                const card = document.createElement('div'); card.className = "nav-card"; card.style.width="140px"; card.style.flex="none";
                card.innerHTML = `<b>${g.title}</b>`; card.onclick = () => launchGame(g.id); container.appendChild(card); 
            }); 
        }

        async function launchGame(id) { 
            document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex'; 
            const res = await (await fetch(GAS_URL+"?action=getCode&row="+id)).json(); 
            document.getElementById('gameFrame').srcdoc = res.code; 
        }

        function updateHistoryUI(h) { 
            const c = document.getElementById('historyContainer');
            if(!h || h.length === 0) { c.innerHTML = "履歴はありません"; return; }
            c.innerHTML = h.map(x => `<div class="history-item"><span>${x.reason}</span><span style="text-align:right; font-weight:900; color:${x.coin>=0?'#33ffcc':'#ff3399'};">${x.coin>=0?'+':''}${x.coin}</span></div>`).join(''); 
        }

        async function sendReq() { const tid = document.getElementById('fIdIn').value.toUpperCase(); if(tid===myId) return; await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "request", myId: myId, targetId: tid }) }); alert("申請完了"); fetchSync(); }
        async function acceptF(tid) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "accept", myId: myId, targetId: tid }) }); fetchSync(); }
        async function removeFriend(fid) { if(confirm("フレンドを解除しますか？")){ await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "removeFriend", myId: myId, targetId: fid }) }); fetchSync(); } }
        async function sendFriendGift(fid) { const amount = prompt("贈るコインの枚数", "100"); if(!amount || iroCoins < amount) return; iroCoins -= parseInt(amount); await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "friendGift", fromId: myId, fromName: document.getElementById('hName').innerText, toId: fid, amount: amount }) }); fetchSync(); }
        
        async function claim(rowId, name) { 
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "claim", userId: myId, giftRow: rowId }) }); 
            alert(`「${name}」を受け取りました`); fetchSync(); 
        }

        function updatePresentUI(p) { 
            const badge = document.getElementById('pBadge'); const list = document.getElementById('pListContainer');
            if(!p || p.length === 0) { list.innerHTML = "プレゼントはありません"; badge.style.display = 'none'; return; }
            badge.innerText = p.length; badge.style.display = 'flex';
            list.innerHTML = p.map(x => `<div style="display:flex;justify-content:space-between;align-items:center;padding:15px;background:rgba(255,255,255,0.08);border-radius:15px;margin-bottom:10px;"><div><small>${x.from} より</small><br><b>${x.name}</b></div><button class="btn-pro" style="width:auto;padding:8px 20px;margin:0;font-size:0.9rem;" onclick="claim(${x.row},'${x.name}')"><span>受取</span></button></div>`).join('');
        }

        async function executeTransfer() { 
            const id = document.getElementById('tIdIn').value.toUpperCase(); 
            const ps = document.getElementById('tPassIn').value; 
            const res = await (await fetch(GAS_URL + "?id=" + id)).json(); 
            if(res.result === "success" && String(res.pass) === String(ps)) { 
                localStorage.setItem('gID', id); localStorage.setItem('gName', res.name); localStorage.setItem('gPass', res.pass); location.reload(); 
            } else { alert("IDまたは合言葉が違います"); } 
        }
    </script>
</body>
</html>
