<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - THE FINAL STAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.8);
            --border: rgba(255, 255, 255, 0.3); --online: #00ff88; --offline: #888;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        /* 背景 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.6); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%); z-index: -1; }

        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; pointer-events: auto; }
        .hidden { display: none !important; opacity: 0; }

        /* 元々のキャラクター配置 (50, 200, 350) */
        .char-original { position: absolute; width: 85px; height: 85px; border-radius: 20px; border: 3px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: float 3s infinite ease-in-out; z-index: 1; box-shadow: 0 0 20px var(--pro-teal); pointer-events: none; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* プロセカ風ボタン */
        .btn-pro { background: #fff; color: #333; border: none; padding: 12px 45px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 6px 6px 0 var(--pro-teal); z-index: 500; font-family: inherit; margin: 10px; text-transform: uppercase; text-align: center; min-width: 200px; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); }
        .btn-pro:hover { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 2px 2px 0 var(--pro-teal); background: var(--pro-teal); color: #fff; }
        .btn-pro.pink { box-shadow: 6px 6px 0 var(--pro-pink); }
        .btn-pro.pink:hover { background: var(--pro-pink); box-shadow: 0 0 0; }
        .btn-pro.gray { background: #444; color: #fff; box-shadow: 6px 6px 0 #222; }

        /* ヘッダー・同期 */
        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; padding: 5px 15px; background: rgba(0,0,0,0.6); border-left: 4px solid var(--pro-teal); backdrop-filter: blur(10px); z-index: 200; border-radius: 0 15px 15px 0; }
        .av-mini { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; }
        .sync-badge { position: absolute; top: 15px; right: 15px; font-size: 0.6rem; display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 30px; border: 1px solid var(--border); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); transition: 0.4s; }
        .dot.on { background: var(--online); box-shadow: 0 0 10px var(--online); }

        /* ナビゲーション */
        .nav-container { position: absolute; bottom: 30px; display: flex; gap: 12px; width: 95%; max-width: 1000px; z-index: 200; }
        .nav-card { flex: 1; background: var(--glass); border: 1px solid var(--border); padding: 18px 5px; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(15px); font-weight: 900; font-size: 0.75rem; color: #fff; }
        .nav-card:hover { transform: translateY(-10px); border-color: #fff; }
        .nav-card.main { background: linear-gradient(to right, var(--pro-pink), #ff66cc); border: none; font-size: 1.1rem; flex: 1.8; box-shadow: 0 0 25px rgba(255,51,153,0.5); }

        /* スライドUI */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 90%; background: #0a0b10; color: #fff; border-radius: 30px 30px 0 0; z-index: 50000; transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 -10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .bottom-sheet.open { bottom: 0; }
        .sheet-handle { width: 40px; height: 5px; background: #555; border-radius: 10px; margin: 15px auto; flex-shrink: 0; }
        .sheet-content { padding: 0 25px 30px; overflow-y: auto; flex-grow: 1; }
        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 49999; display: none; backdrop-filter: blur(5px); }

        /* 学生手帳設定 */
        .student-id-card { background: #fff; color: #333; border-radius: 10px; padding: 25px; border: 2px solid #555; box-shadow: 10px 10px 0 rgba(0,0,0,0.2); position: relative; max-width: 350px; margin: 0 auto; text-align: left; }
        .id-card-header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; font-weight: 900; }
        .id-photo { width: 90px; height: 110px; border: 2px solid #333; background: #eee; object-fit: cover; cursor: pointer; float: left; margin-right: 15px; }
        .id-label { font-size: 0.6rem; color: #666; margin: 0; }
        .id-value { font-size: 0.9rem; font-weight: bold; border-bottom: 1px solid #999; margin-bottom: 10px; display: block; }
        input.student-input { background: none; border: none; border-bottom: 1px solid #333; width: 100%; font-size: 1rem; color: #000; padding: 5px 0; font-family: inherit; }

        /* ゲーム表示 */
        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        #mobilePauseBtn { position: fixed; top: 15px; right: 15px; width: 45px; height: 45px; background: var(--glass); border: 1.5px solid #fff; border-radius: 50%; display: none; z-index: 15000; justify-content: center; align-items: center; font-weight: 900; backdrop-filter: blur(10px); cursor: pointer; }
        #pauseOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 20000; }

        /* リスト */
        .list-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; margin-bottom: 10px; max-height: 180px; overflow-y: auto; color: #fff; font-size: 0.8rem; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .st-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }

        #countOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 20000; background: rgba(0,0,0,0.4); pointer-events: none; }
        .count-text { font-family: Montserrat; font-size: 15rem; font-weight: 900; color: #fff; text-shadow: 0 0 40px var(--pro-teal); }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="sheetOverlay" class="sheet-overlay" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" onclick="showPauseMenu()">II</div>
    <div id="countOverlay"><div id="countNum" class="count-text">3</div></div>

    <!-- 共通ポーズメニュー -->
    <div id="pauseOverlay">
        <h1 style="font-family: Montserrat; font-size: 4rem; color: var(--pro-teal); margin-bottom: 20px;">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開する</span></button>
        <button class="btn-pro pink" onclick="triggerRetry()"><span>リトライ</span></button>
        <button class="btn-pro gray" onclick="exitGame()"><span>終了する</span></button>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <div class="char-original" style="left: 50px; top: 300px;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=A" style="width:100%"></div>
        <div class="char-original" style="left: 200px; top: 300px; animation-delay: 0.2s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=B" style="width:100%"></div>
        <div class="char-original" style="left: 350px; top: 300px; animation-delay: 0.4s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=C" style="width:100%"></div>
        <h1 style="font-family: Montserrat; font-size: 6rem; margin: 0; letter-spacing: -3px; text-shadow: 0 0 25px rgba(51,255,204,0.5);">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: 900; color: var(--pro-pink); margin-bottom: 50px;">COLORFUL STAGE</p>
        <button id="loginBtn" class="btn-pro" onclick="transition('titleScreen', 'loadingScreen')"><span>ログイン</span></button>
        <button id="transferBtn" class="btn-pro pink" onclick="openBox('modalTransfer')"><span>データ引き継ぎ</span></button>
        <button class="btn-pro gray" style="width:auto; font-size:0.7rem; padding:10px 20px;" onclick="openBox('modalSupport')"><span>サポート</span></button>
    </div>

    <!-- 2. ロード -->
    <div id="loadingScreen" class="screen hidden">
        <p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px; animation: flash 1s infinite alternate;">同期中...</p>
    </div>
    <style>@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0.3; } }</style>

    <!-- 3. ホーム -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.8rem; font-weight: 900;"><span id="hName">---</span></div>
        </div>
        <div class="sync-badge"><div id="syncDot" class="dot"></div><span>ONLINE</span></div>
        <h2 style="font-size: 3rem; font-weight: 300; letter-spacing: 8px; opacity: 0.8;">MAIN CONSOLE</h2>
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="alert('準備中')">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">ゲーム選択</div>
            <div class="nav-card" onclick="alert('準備中')">ストーリー</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定・学生証</div>
        </nav>
    </div>

    <!-- 4. 設定（学生証） -->
    <div id="sheetConfig" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-content" style="text-align: center;">
            <div class="student-id-card">
                <div class="id-card-header">幻想クロニクル 学生証</div>
                <div class="id-body">
                    <img id="mAv" class="id-photo" src="" onclick="document.getElementById('fileIn').click()">
                    <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)">
                    <div style="flex-grow:1;">
                        <p class="id-label">学籍番号</p><span class="id-value" id="myIdDisplay">--------</span>
                        <p class="id-label">氏名</p><input type="text" id="nIn" class="student-input">
                        <p class="id-label">合言葉</p><input type="password" id="pIn" class="student-input" placeholder="未設定">
                    </div>
                </div>
            </div>
            <button class="btn-pro" style="margin-top:30px; width:100%;" onclick="saveSettings()"><span>保存</span></button>
        </div>
    </div>

    <!-- 5. フレンド -->
    <div id="sheetFriend" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-content">
            <h2 style="color:var(--pro-pink); font-weight:900;">FRIENDS</h2>
            <p style="font-size:0.7rem; opacity:0.6;">届いた申請</p><div id="reqList" class="list-box"></div>
            <p style="font-size:0.7rem; opacity:0.6;">フレンド一覧</p><div id="fList" class="list-box"></div>
            <input type="text" id="fIdIn" placeholder="10桁ID検索"><button class="btn-pro pink" style="width:100%; margin:0;" onclick="sendReq()"><span>申請</span></button>
        </div>
    </div>

    <!-- 6. ゲーム選択 -->
    <div id="questScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; font-size: 3.5rem; margin: 0; color: var(--pro-teal);">GAME SELECT</h2>
        <div id="gameListContainer" style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; max-height:50vh; overflow-y:auto; width:95%; padding:20px;"></div>
        <button class="btn-pro gray" style="margin-top:40px;" onclick="closeQuest()"><span>戻る</span></button>
    </div>

    <!-- 7. モード選択 -->
    <dialog id="modalMode">
        <div class="dialog-header">PLAY MODE</div>
        <div class="dialog-body" style="text-align:center;">
            <button class="btn-pro" style="width:100%;" onclick="startSolo()"><span>一人で遊ぶ</span></button>
            <button class="btn-pro pink" style="width:100%;" onclick="toMatching()"><span>みんなで遊ぶ</span></button>
        </div>
    </dialog>

    <div id="matchScreen" class="screen hidden">
        <h2>MULTIPLAYER</h2>
        <div style="display:flex; gap:20px; margin-top:30px;"><button class="btn-pro" onclick="createRoom()">部屋を作る</button><button class="btn-pro pink" onclick="openBox('modalJoin')">番号で参加</button></div>
        <button class="btn-pro gray" style="margin-top:40px;" onclick="transition('matchScreen', 'questScreen')">戻る</button>
    </div>

    <div id="lobbyScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; font-size: 2rem;">ROOM ID: <span id="lobbyRoomId" style="color:var(--pro-teal);">----</span></h2>
        <div style="display:flex; gap:15px; margin-top:30px;" id="lobbyMembers">
            <div class="slot" id="slot0">待機中</div><div class="slot" id="slot1">待機中</div>
            <div class="slot" id="slot2">待機中</div><div class="slot" id="slot3">待機中</div>
        </div>
        <button id="startBtn" class="btn-pro" style="display:none; margin-top:50px;" onclick="hostSignalStart()"><span>開始！</span></button>
    </div>

    <div id="gameLayer" style="position:fixed; top:0; left:0; width:100vw; height:100vh; display:none; z-index:10000; background:#000;">
        <iframe id="gameFrame" style="width:100%; height:100%; border:none;" src="about:blank"></iframe>
    </div>

    <!-- その他ダイアログ -->
    <dialog id="modalTransfer"><div class="dialog-header">RECOVERY</div><div class="dialog-body"><input type="text" id="tIdIn" placeholder="ID"><input type="password" id="tPassIn" placeholder="合言葉"><button class="btn-pro pink" onclick="executeTransfer()">実行</button></div></dialog>
    <dialog id="modalSupport"><div class="dialog-header">SUPPORT</div><div class="dialog-body"><p>IDを忘れた場合は管理者に連絡を。</p><button onclick="this.closest('dialog').close()">とじる</button></div></dialog>
    <dialog id="modalJoin"><h3>ROOM ID</h3><input type="text" id="roomJoinIn"><button onclick="joinRoom()">JOIN</button></dialog>
    <dialog id="modalProfile"><h2 id="fpName" style="color:var(--pro-teal);"></h2><div style="text-align:center;"><img id="fpAv" src="" style="width:120px; border-radius:20px;"><p id="fpStatus"></p><p id="fpLoc" style="font-size:0.8rem;"></p></div><button class="btn-pro" onclick="this.closest('dialog').close()">戻る</button></dialog>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwmXjbbp-7bWB9LGN8-oUDlQlJErQkUe-InO1HY7WepO5x_UQVjmnYPq46mlme_Evkr/exec';
        let myId = "", roomId = "", isHost = false, currentGameRow = "", isSyncing = false, isSolo = false;

        function transition(h, s) {
            const cur = document.getElementById(h); const nxt = document.getElementById(s);
            if(cur) { cur.classList.add('hidden'); setTimeout(() => { cur.style.display = 'none'; }, 600); }
            if(nxt) { nxt.style.display = 'flex'; setTimeout(() => { nxt.classList.remove('hidden'); }, 50); }
            if(s === 'loadingScreen') setTimeout(() => { transition('loadingScreen', 'gameScreen'); initPortal(); }, 1500);
        }
        function openBox(id) { document.getElementById(id).showModal(); }
        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }
        function closeQuest() { transition('questScreen', 'gameScreen'); }

        function initPortal() {
            if(!localStorage.getItem('gID')) localStorage.setItem('gID', Math.random().toString(36).substring(2, 12).toUpperCase());
            myId = localStorage.getItem('gID');
            document.getElementById('myIdDisplay').innerText = myId;
            document.getElementById('hName').innerText = localStorage.getItem('gName') || "USER";
            const av = localStorage.getItem('gAv') || "https://api.dicebear.com/7.x/avataaars/svg?seed=" + myId;
            document.getElementById('hAv').src = av; document.getElementById('mAv').src = av;
            document.getElementById('nIn').value = localStorage.getItem('gName') || "";
            document.getElementById('pIn').value = localStorage.getItem('gPass') || "";
            if(!isSyncing) { isSyncing = true; setInterval(fetchSync, 5000); fetchSync(); }
        }

        async function loadGameList() {
            const container = document.getElementById('gameListContainer');
            container.innerHTML = "LOADING...";
            const res = await fetch(`${GAS_URL}?action=getList`);
            const games = await res.json();
            container.innerHTML = "";
            games.forEach(g => {
                const card = document.createElement('div');
                card.className = "nav-card"; card.style.width = "180px"; card.style.height = "180px";
                card.onclick = () => { currentGameRow = g.id; openBox('modalMode'); };
                card.innerHTML = `<div style="height:100px; background:var(--pro-teal); border-radius:10px; margin-bottom:10px;"></div><b>${g.title}</b>`;
                container.appendChild(card);
            });
        }

        function startSolo() { isSolo = true; document.getElementById('modalMode').close(); launchGame(); }
        function toMatching() { isSolo = false; document.getElementById('modalMode').close(); transition('questScreen', 'matchScreen'); }
        function createRoom() { roomId = Math.floor(1000 + Math.random() * 9000).toString(); isHost = true; enterLobby(); }
        function joinRoom() { roomId = document.getElementById('roomJoinIn').value; if(roomId.length !== 4) return alert("4桁必要"); isHost = false; enterLobby(); document.getElementById('modalJoin').close(); }
        function enterLobby() { transition('matchScreen', 'lobbyScreen'); document.getElementById('lobbyRoomId').innerText = roomId; if(isHost) document.getElementById('startBtn').style.display = 'block'; }
        function leaveRoom() { roomId = ""; isHost = false; transition('lobbyScreen', 'gameScreen'); }

        function hostSignalStart() {
            fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "sync", id: myId, location: "START:" + currentGameRow, roomId: roomId }) });
            startGlobalCountdown();
        }

        function startGlobalCountdown() {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('countOverlay').style.display = 'flex';
            let time = 3; const countNum = document.getElementById('countNum');
            const timer = setInterval(() => {
                time--;
                if(time > 0) countNum.innerText = time;
                else if(time === 0) countNum.innerText = "GO!";
                else { clearInterval(timer); document.getElementById('countOverlay').style.display = 'none'; launchGame(); }
            }, 1000);
        }

        async function launchGame() {
            document.getElementById('gameLayer').style.display = 'block';
            document.getElementById('mobilePauseBtn').style.display = 'flex';
            const res = await fetch(`${GAS_URL}?action=getCode&row=${currentGameRow}`);
            const data = await res.json();
            const frame = document.getElementById('gameFrame');
            frame.srcdoc = data.code;
            frame.onload = () => {
                const doc = frame.contentDocument || frame.contentWindow.document;
                doc.addEventListener('keydown', e => { if (e.key === "Escape") showPauseMenu(); });
            };
        }

        function triggerRetry() {
            const frame = document.getElementById('gameFrame');
            // iframe内のwindowに対してリスタート命令を送る（もし内部に実装があれば）
            // 無ければ単純にsrcdocを再セットして最初に戻す
            frame.contentWindow.postMessage("retry", "*"); 
            // 内部の3D迷路などのコードをリセット位置に飛ばす場合は iframeの再読み込み
            frame.srcdoc = frame.srcdoc;
            resumeGame();
        }

        function showPauseMenu() { document.getElementById('pauseOverlay').style.display = 'flex'; }
        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { location.reload(); }

        window.addEventListener('keydown', e => { if (e.key === "Escape" && document.getElementById('gameLayer').style.display === 'block') showPauseMenu(); });

        async function fetchSync() {
            if(!GAS_URL.includes('https')) return;
            const syncData = { type: "sync", id: myId, name: localStorage.getItem('gName'), location: roomId!==""?"Lobby":"Home", roomId: roomId, avatar: localStorage.getItem('gAv')||"" };
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(syncData) });
            document.getElementById('syncDot').classList.add('on');
            const res = await fetch(GAS_URL + "?id=" + myId); const json = await res.json();
            if(json.result === "success") {
                const pending = json.pending ? json.pending.split(',') : [];
                document.getElementById('reqList').innerHTML = pending.map(id => `<div class="row"><span>ID: ${id}</span><button class="btn-pro" style="width:auto; padding:5px 10px; font-size:0.6rem;" onclick="acceptF('${id}')">承認</button></div>`).join('') || "なし";
                const friends = json.friends ? json.friends.split(',') : [];
                const fList = [];
                for(let fid of friends) { if(fid) { const fr = await fetch(GAS_URL + "?id=" + fid); const fj = await fr.json(); if(fj.result === "success") fList.push({id: fid, name: fj.name, online: (new Date() - new Date(fj.lastSeen)) < 60000}); } }
                document.getElementById('fList').innerHTML = fList.map(f => `<div class="row"><span><span class="st-dot ${f.online?'online':'offline'}"></span>${f.name}</span><button onclick="viewProfile('${f.id}')" style="width:auto; padding:5px 10px; font-size:0.6rem;">詳細</button></div>`).join('') || "なし";
            }
            if(roomId !== "" && !isSolo) {
                const rRes = await fetch(GAS_URL + "?roomId=" + roomId); const rJson = await rRes.json();
                const members = rJson.members || [];
                let signal = members.find(m => m.location.startsWith("START:"));
                if(signal && document.getElementById('gameLayer').style.display !== 'block') { currentGameRow = signal.location.split(':')[1]; startGlobalCountdown(); }
                for(let i=0; i<4; i++) {
                    const slot = document.getElementById('slot' + i);
                    if(members[i]) slot.innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${members[i].id}" style="width:40px;"><br><b>${members[i].name}</b>`;
                    else slot.innerHTML = "待機中";
                }
            }
        }

        async function acceptF(id) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "accept", myId: myId, targetId: id }) }); fetchSync(); }
        async function sendReq() { const tid = document.getElementById('fIdIn').value.toUpperCase(); await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "request", targetId: tid, myId: myId }) }); alert("申請完了"); }

        function saveSettings() {
            localStorage.setItem('gName', document.getElementById('nIn').value);
            localStorage.setItem('gPass', document.getElementById('pIn').value);
            document.getElementById('hName').innerText = document.getElementById('nIn').value;
            fetchSync(); closeAllSheets();
        }

        function uploadIcon(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    localStorage.setItem('gAv', e.target.result);
                    document.getElementById('hAv').src = e.target.result;
                    document.getElementById('mAv').src = e.target.result;
                    fetchSync();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function executeTransfer() {
            const tid = document.getElementById('tIdIn').value.toUpperCase();
            const tp = document.getElementById('tPassIn').value;
            const res = await fetch(`${GAS_URL}?id=${tid}`);
            const json = await res.json();
            if(json.result === "success" && json.pass === tp) {
                localStorage.setItem('gID', tid); localStorage.setItem('gName', json.name); localStorage.setItem('gAv', json.avatar||""); localStorage.setItem('gPass', tp);
                alert("復旧成功！"); location.reload();
            } else alert("IDまたは合言葉が違います。");
        }
    </script>
</body>
</html>
