<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - THE FINAL STAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --pro-blue: #00ccff;
            --glass: rgba(0, 0, 0, 0.8); --border: rgba(255, 255, 255, 0.4);
            --online: #00ff88; --offline: #888;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; }
        
        /* 背景 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.6); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%); z-index: -1; }

        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; pointer-events: auto; }
        .hidden { display: none !important; opacity: 0; }

        /* 元々のキャラクター配置 (50, 200, 350) */
        .char-original { position: absolute; width: 85px; height: 85px; border-radius: 20px; border: 3px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: float 3s infinite ease-in-out; z-index: 1; box-shadow: 0 0 20px var(--pro-teal); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* プロセカ風斜めボタン */
        .btn-pro { background: #fff; color: #333; border: none; padding: 15px 45px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 6px 6px 0 var(--pro-teal); z-index: 500; font-family: inherit; margin: 10px; text-transform: uppercase; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); }
        .btn-pro:hover { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 2px 2px 0 var(--pro-teal); background: var(--pro-teal); color: #fff; }
        .btn-pro.pink { box-shadow: 6px 6px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }
        .btn-pro.gray { background: #444; color: #fff; box-shadow: 6px 6px 0 #222; }

        /* UI部 */
        .header-minimal { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 12px; padding: 8px 20px; background: rgba(0,0,0,0.7); border-left: 6px solid var(--pro-teal); backdrop-filter: blur(10px); z-index: 200; border-radius: 0 20px 20px 0; }
        .av-mini { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; }
        .sync-badge { position: absolute; top: 20px; right: 20px; font-size: 0.7rem; font-weight: bold; color: var(--pro-teal); display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; background: #555; border-radius: 50%; transition: 0.4s; }
        .dot.on { background: var(--online); box-shadow: 0 0 10px var(--online); }

        .nav-container { position: absolute; bottom: 30px; display: flex; gap: 12px; width: 95%; max-width: 1000px; z-index: 200; }
        .nav-card { flex: 1; background: var(--glass); border: 1px solid var(--border); padding: 18px 5px; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(15px); font-weight: 900; font-size: 0.8rem; color: #fff; }
        .nav-card:hover { transform: translateY(-10px); border-color: #fff; }
        .nav-card.main { background: linear-gradient(to right, var(--pro-pink), #ff66cc); border: none; font-size: 1.2rem; flex: 1.8; box-shadow: 0 0 25px rgba(255,51,153,0.5); }

        /* 3D Maze UI */
        #maze-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10000; background: #000; }
        .ui-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 10001; }
        #maze-hud { position: absolute; top: 30px; right: 30px; text-align: right; color: var(--pro-teal); font-family: Montserrat; pointer-events: none; z-index: 10002; }
        #maze-minimap { position: absolute; top: 30px; left: 30px; border: 2px solid #fff; border-radius: 10px; background: rgba(0,0,0,0.7); z-index: 10002; }

        #countOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 20000; background: rgba(0,0,0,0.4); pointer-events: none; }
        .count-text { font-family: Montserrat; font-size: 18rem; font-weight: 900; color: #fff; text-shadow: 0 0 40px var(--pro-teal); animation: countPulse 0.5s ease-out; }
        @keyframes countPulse { 0% { transform: scale(1.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* ポーズメニュー (Escキー) */
        #pauseOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 20000; }

        dialog { background: #fff; color: #333; border: none; border-radius: 20px; width: 420px; z-index: 50000; box-shadow: 0 25px 80px rgba(0,0,0,0.6); overflow: hidden; padding: 0; }
        .dialog-header { background: var(--pro-teal); color: #fff; padding: 15px; font-weight: 900; font-size: 1.2rem; text-align: center; }
        .dialog-body { padding: 30px; }
        input { width: 100%; background: #f0f0f5; border: 2px solid #eee; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; font-weight: bold; }
        .id-box { background: #333; color: var(--pro-teal); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 1.2rem; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>

    <div id="countOverlay"><div id="countNum" class="count-text">3</div></div>

    <!-- ポーズメニュー -->
    <div id="pauseOverlay">
        <h1 style="font-family: Montserrat; font-size: 5rem; color: var(--pro-teal); margin: 0;">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開する</span></button>
        <button class="btn-pro pink" onclick="triggerRetry()"><span>リトライ</span></button>
        <button class="btn-pro gray" onclick="exitGame()"><span>終了する</span></button>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <div class="char-original" style="left: 50px; top: 300px;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=A" style="width:100%"></div>
        <div class="char-original" style="left: 200px; top: 300px; animation-delay: 0.2s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=B" style="width:100%"></div>
        <div class="char-original" style="left: 350px; top: 300px; animation-delay: 0.4s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=C" style="width:100%"></div>
        <h1 style="font-family: Montserrat; font-size: 6rem; margin: 0; letter-spacing: -3px; text-shadow: 0 0 25px rgba(51,255,204,0.5);">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: 900; color: var(--pro-pink); margin-bottom: 50px;">COLORFUL STAGE</p>
        <button id="loginBtn" class="btn-pro" onclick="transition('titleScreen', 'loadingScreen')"><span>システムログイン</span></button>
    </div>

    <!-- 2. ロード -->
    <div id="loadingScreen" class="screen hidden">
        <p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px; animation: flash 1s infinite alternate;">同期中...</p>
    </div>
    <style>@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0.3; } }</style>

    <!-- 3. ホーム -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.9rem; font-weight: 900;"><span id="hName">---</span></div>
        </div>
        <div class="sync-badge"><div id="syncDot" class="dot"></div><span>ONLINE</span></div>
        <h2 style="font-size: 3rem; font-weight: 300; letter-spacing: 8px;">MAIN CONSOLE</h2>
        <nav class="nav-container">
            <div class="nav-card" onclick="openBox('modalFriend')">フレンド</div>
            <div class="nav-card" onclick="alert('準備中')">メンバー</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">クエスト開始</div>
            <div class="nav-card" onclick="alert('準備中')">ストーリー</div>
            <div class="nav-card" onclick="openBox('modalConfig')">設定</div>
        </nav>
    </div>

    <!-- 4. クエスト選択 -->
    <div id="questScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; font-size: 3.5rem; margin: 0; color: var(--pro-teal);">SELECT GAME</h2>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; max-height:50vh; overflow-y:auto; width:95%;" id="gameListContainer"></div>
        <button class="btn-pro gray" style="margin-top:40px;" onclick="closeQuest()"><span>戻る</span></button>
    </div>

    <!-- 5. モード選択 -->
    <dialog id="modalMode">
        <div class="dialog-header">PLAY MODE</div>
        <div class="dialog-body" style="text-align:center;">
            <button class="btn-pro" style="width:100%;" onclick="startSolo()"><span>一人で遊ぶ</span></button>
            <button class="btn-pro pink" style="width:100%;" onclick="transitionToMatching()"><span>みんなで遊ぶ</span></button>
            <button class="btn-pro gray" style="width:100%; margin-top:20px;" onclick="this.closest('dialog').close()"><span>キャンセル</span></button>
        </div>
    </dialog>

    <!-- 6. マッチング -->
    <div id="matchScreen" class="screen hidden">
        <h2>MULTIPLAYER</h2>
        <div style="display:flex; gap:30px; margin-top:30px;">
            <div class="nav-card" style="width:220px; height:auto; padding:30px;" onclick="createRoom()"><h3>部屋を作る</h3></div>
            <div class="nav-card" style="width:220px; height:auto; padding:30px;" onclick="openBox('modalJoin')"><h3>番号で参加</h3></div>
        </div>
        <button class="btn-pro gray" style="margin-top:40px;" onclick="transition('matchScreen', 'questScreen')"><span>戻る</span></button>
    </div>

    <!-- 7. 待機ロビー -->
    <div id="lobbyScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; font-size: 2rem;">ROOM ID: <span id="lobbyRoomId" style="color:var(--pro-teal);">----</span></h2>
        <div style="display:flex; gap:15px; margin-top:30px;" id="lobbyMembers">
            <div class="nav-card" id="slot0" style="width:120px; height:150px;">待機中</div><div class="nav-card" id="slot1" style="width:120px; height:150px;">待機中</div>
            <div class="nav-card" id="slot2" style="width:120px; height:150px;">待機中</div><div class="nav-card" id="slot3" style="width:120px; height:150px;">待機中</div>
        </div>
        <button id="startBtn" class="btn-pro" style="display:none; margin-top:50px;" onclick="hostSignalStart()"><span>ダイブ開始！</span></button>
    </div>

    <!-- 8. 3Dゲーム表示 -->
    <div id="maze-layer">
        <canvas id="maze-minimap" width="150" height="150"></canvas>
        <div id="maze-hud"><div id="mScore" style="font-size: 3rem; font-weight: 800;">0</div><div id="mLeft" style="opacity: 0.7;">REMAINING: 0</div></div>
    </div>

    <!-- ダイアログ -->
    <dialog id="modalConfig">
        <div class="dialog-header">PROFILE</div>
        <div class="dialog-body">
            <div style="text-align: center; margin-bottom: 20px;">
                <img id="mAv" src="" style="width:90px; height:90px; border-radius:50%; border:3px solid var(--pro-teal); cursor:pointer; object-fit:cover;" onclick="document.getElementById('fileIn').click()">
                <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)">
            </div>
            ID: <div class="id-box" id="myIdDisplay">--------</div>
            名前: <input type="text" id="nIn">
            <button class="btn-pro" style="width:100%; margin:0;" onclick="saveSettings()"><span>保存</span></button>
        </div>
    </dialog>

    <dialog id="modalFriend">
        <div class="dialog-header">FRIENDS</div>
        <div class="dialog-body"><div id="fList" class="list-box" style="color:#333;"></div><input type="text" id="fIdIn" placeholder="10桁ID入力"><button class="btn-pro pink" style="width:100%; margin:0;" onclick="sendReq()"><span>申請</span></button></div>
    </dialog>

    <dialog id="modalJoin">
        <div class="dialog-header">ROOM ID</div>
        <div class="dialog-body"><input type="text" id="roomJoinIn" placeholder="4桁番号"><button class="btn-pro" style="width:100%; margin:0;" onclick="joinRoom()"><span>参加</span></button></div>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/110/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.110/examples/js/controls/PointerLockControls.js"></script>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxK9KdpwhnhnipwrQ-x0fPU8UONgi9_EPinvafWP4UhdEySbghSYkS-eoChn9sht6bM/exec';
        let myId = "", roomId = "", isHost = false, currentGameRow = "", isSolo = false;
        let mScene, mCamera, mRenderer, mControls, mActive = false, mGameOver = false;
        let otherPlayers = {}, playerFriends = [];

        function transition(h, s) {
            const cur = document.getElementById(h); const nxt = document.getElementById(s);
            if(cur) { cur.classList.add('hidden'); setTimeout(() => { cur.style.display = 'none'; }, 600); }
            if(nxt) { nxt.style.display = 'flex'; setTimeout(() => { nxt.classList.remove('hidden'); }, 50); }
            if(s === 'loadingScreen') setTimeout(() => { transition('loadingScreen', 'gameScreen'); initPortal(); }, 1500);
        }
        function openBox(id) { document.getElementById(id).showModal(); }
        function closeQuest() { transition('questScreen', 'gameScreen'); }

        function initPortal() {
            if(!localStorage.getItem('gID')) localStorage.setItem('gID', Math.random().toString(36).substring(2, 12).toUpperCase());
            myId = localStorage.getItem('gID');
            document.getElementById('myIdDisplay').innerText = myId;
            document.getElementById('hName').innerText = localStorage.getItem('gName') || "USER";
            const av = localStorage.getItem('gAv') || "https://api.dicebear.com/7.x/avataaars/svg?seed=" + myId;
            document.getElementById('hAv').src = av; document.getElementById('mAv').src = av;
            document.getElementById('nIn').value = localStorage.getItem('gName') || "";
            setInterval(fetchSync, 5000);
        }

        async function loadGameList() {
            const container = document.getElementById('gameListContainer');
            container.innerHTML = "LOADING...";
            const res = await fetch(`${GAS_URL}?action=getList`);
            const games = await res.json();
            container.innerHTML = "";
            games.forEach(g => {
                const card = document.createElement('div');
                card.className = "nav-card"; card.style.width = "180px"; card.style.height = "200px";
                card.onclick = () => { currentGameRow = g.id; openBox('modalMode'); };
                card.innerHTML = `<div style="height:100px; background:var(--pro-teal); border-radius:10px; margin-bottom:10px;"></div><b>${g.title}</b>`;
                container.appendChild(card);
            });
        }

        function startSolo() { isSolo = true; document.getElementById('modalMode').close(); startMazeGame(); }
        function toMatching() { isSolo = false; document.getElementById('modalMode').close(); transition('questScreen', 'matchScreen'); }
        function createRoom() { roomId = Math.floor(1000 + Math.random() * 9000).toString(); isHost = true; enterLobby(); }
        function joinRoom() { roomId = document.getElementById('roomJoinIn').value; if(roomId.length !== 4) return alert("4桁必要"); isHost = false; enterLobby(); document.getElementById('modalJoin').close(); }
        function enterLobby() { transition('matchScreen', 'lobbyScreen'); document.getElementById('lobbyRoomId').innerText = roomId; if(isHost) document.getElementById('startBtn').style.display = 'block'; }
        function leaveRoom() { roomId = ""; isHost = false; transition('lobbyScreen', 'gameScreen'); }

        function hostSignalStart() {
            fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "sync", id: myId, location: "START:" + currentGameRow, roomId: roomId }) });
            startGlobalCountdown();
        }

        function startGlobalCountdown() {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('countOverlay').style.display = 'flex';
            let time = 3; const countNum = document.getElementById('countNum');
            const timer = setInterval(() => {
                time--;
                if(time > 0) countNum.innerText = time;
                else if(time === 0) countNum.innerText = "GO!";
                else { clearInterval(timer); document.getElementById('countOverlay').style.display = 'none'; startMazeGame(); }
            }, 1000);
        }

        // --- 3D Maze Logic ---
        function startMazeGame() {
            mActive = true;
            document.getElementById('maze-layer').style.display = 'block';
            if(!mRenderer) initMazeScene();
            resetPlayerPosition();
        }

        function initMazeScene() {
            mScene = new THREE.Scene(); mScene.background = new THREE.Color(0x020205);
            mCamera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            mRenderer = new THREE.WebGLRenderer({ antialias: true }); mRenderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('maze-layer').appendChild(mRenderer.domElement);
            mControls = new THREE.PointerLockControls(mCamera, document.body);
            mControls.addEventListener('unlock', () => { if(mActive) document.getElementById('pauseOverlay').style.display = 'flex'; });
            mScene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshPhongMaterial({color: 0x111111}));
            ground.rotation.x = -Math.PI/2; mScene.add(ground);
            
            // 固定シード迷路
            let seed = 1234; function pr() { var x = Math.sin(seed++) * 10000; return x - Math.floor(x); }
            for(let i=0; i<50; i++) {
                const w = new THREE.Mesh(new THREE.BoxGeometry(1, 3, 1), new THREE.MeshPhongMaterial({color: 0x2222ff}));
                w.position.set((pr()-0.5)*25, 1.5, (pr()-0.5)*25); mScene.add(w);
            }
            animateMaze();
        }

        function resetPlayerPosition() {
            mCamera.position.set(0, 1.5, 0); mCamera.lookAt(0, 1.5, 5);
            document.getElementById('pauseOverlay').style.display = 'none';
            mControls.lock();
        }

        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; mControls.lock(); }
        function triggerRetry() { resetPlayerPosition(); }
        function exitGame() { location.reload(); }

        const mKeys = {}; window.addEventListener('keydown', e => mKeys[e.key.toLowerCase()] = true); window.addEventListener('keyup', e => mKeys[e.key.toLowerCase()] = false);
        function animateMaze() {
            requestAnimationFrame(animateMaze);
            if(mActive && mControls.isLocked) {
                if(mKeys.w) mControls.moveForward(0.1); if(mKeys.s) mControls.moveForward(-0.1);
                if(mKeys.a) mControls.moveRight(-0.1); if(mKeys.d) mControls.moveRight(0.1);
                for(let id in otherPlayers) {
                    const p = otherPlayers[id]; p.mesh.position.x += (p.targetX - p.mesh.position.x) * 0.1; p.mesh.position.z += (p.targetZ - p.mesh.position.z) * 0.1;
                }
            }
            if(mRenderer) mRenderer.render(mScene, mCamera);
        }

        async function fetchSync() {
            if(!GAS_URL.includes('https') || isSolo) return;
            const data = { type: "sync", id: myId, name: localStorage.getItem('gName'), location: mActive?"Maze":"Home", roomId: roomId, x: mCamera?mCamera.position.x:0, z: mCamera?mCamera.position.z:0 };
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
            
            if(roomId !== "") {
                const rRes = await fetch(GAS_URL + "?roomId=" + roomId);
                const rJson = await rRes.json();
                const members = rJson.members || [];
                let startSignal = members.find(m => m.location.startsWith("START:"));
                if(startSignal && !mActive) startGlobalCountdown();
                for(let i=0; i<4; i++) {
                    const slot = document.getElementById('slot' + i);
                    if(members[i]) {
                        slot.innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${members[i].id}" style="width:50px;"><br><b>${members[i].name}</b>`;
                        if(mActive && members[i].id !== myId) updateOtherPlayer(members[i].id, members[i].x, members[i].z);
                    } else slot.innerHTML = "待機中";
                }
            }
        }

        function updateOtherPlayer(id, x, z) {
            if(!otherPlayers[id]) {
                const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshPhongMaterial({ color: 0x33ffcc, emissive: 0x33ffcc }));
                mScene.add(mesh); otherPlayers[id] = { mesh: mesh, targetX: x, targetZ: z };
            } else { otherPlayers[id].targetX = x; otherPlayers[id].targetZ = z; }
        }

        function saveSettings() { localStorage.setItem('gName', document.getElementById('nIn').value); document.getElementById('hName').innerText = document.getElementById('nIn').value; document.getElementById('modalConfig').close(); }
        function uploadIcon(input) { if (input.files && input.files[0]) { const reader = new FileReader(); reader.onload = e => { localStorage.setItem('gAv', e.target.result); document.getElementById('hAv').src = e.target.result; document.getElementById('mAv').src = e.target.result; }; reader.readAsDataURL(input.files[0]); } }
    </script>
</body>
</html>
