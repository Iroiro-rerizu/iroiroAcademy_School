<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - HISTORY & FULLSCREEN STAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.85);
            --border: rgba(255, 255, 255, 0.4);
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.6); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%); z-index: -1; }

        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        .btn-pro { background: #fff; color: #333; border: none; padding: 14px 45px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 6px 6px 0 var(--pro-teal); z-index: 500; font-family: inherit; margin: 10px; text-transform: uppercase; text-align: center; width: 240px; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); }
        .btn-pro:hover { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); background: var(--pro-teal); color: #fff; }
        .btn-pro.pink { box-shadow: 6px 6px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }

        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; padding: 5px 15px; background: rgba(0,0,0,0.6); border-left: 4px solid var(--pro-teal); backdrop-filter: blur(10px); z-index: 200; border-radius: 0 15px 15px 0; }
        .av-mini { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; }
        .iro-coin-disp { margin-left: 20px; font-weight: 900; color: var(--pro-teal); text-shadow: 0 0 10px var(--pro-teal); font-size: 1.1rem; }

        .present-btn { position: absolute; top: 80px; left: 20px; width: 55px; height: 55px; background: var(--glass); border: 1.5px solid var(--border); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 300; transition: 0.3s; backdrop-filter: blur(10px); font-size: 1.6rem; }
        .present-badge { position: absolute; top: 0; right: 0; width: 20px; height: 20px; background: red; border-radius: 50%; border: 2px solid #fff; font-size: 0.7rem; display: none; justify-content: center; align-items: center; font-weight: bold; }

        .nav-container { position: absolute; bottom: 30px; display: flex; gap: 12px; width: 95%; max-width: 1000px; z-index: 300; pointer-events: auto; }
        .nav-card { flex: 1; background: var(--glass); border: 1px solid var(--border); padding: 18px 5px; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(15px); font-weight: 900; font-size: 0.8rem; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 60px; }
        .nav-card.main { background: linear-gradient(to right, var(--pro-pink), #ff66cc); border: none; font-size: 1rem; flex: 1.8; }

        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 90%; background: #0a0b10; border-radius: 30px 30px 0 0; z-index: 50000; transition: 0.4s; overflow-y: auto; color: #fff; }
        .bottom-sheet.open { bottom: 0; }
        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 49999; display: none; backdrop-filter: blur(5px); }

        .history-item { background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; font-size: 0.8rem; }
        .history-item.plus { border-left: 4px solid var(--pro-teal); }
        .history-item.minus { border-left: 4px solid var(--pro-pink); }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        #mobilePauseBtn { position: fixed; top: 15px; right: 15px; width: 45px; height: 45px; background: var(--glass); border: 1.5px solid #fff; border-radius: 50%; display: none; z-index: 15000; justify-content: center; align-items: center; font-weight: 900; cursor: pointer; color: #fff; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="sheetOverlay" class="sheet-overlay" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" onclick="showPauseMenu()">II</div>

    <div id="pauseOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20000; display:none; flex-direction:column; justify-content:center; align-items:center;">
        <h1 style="font-family: Montserrat; font-size: 4rem; color: var(--pro-teal);">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開</span></button>
        <button class="btn-pro pink" onclick="exitGame()"><span>終了</span></button>
    </div>

    <!-- スクリーン1: タイトル -->
    <div id="titleScreen" class="screen">
        <h1 style="font-family: Montserrat; font-size: 6rem; margin: 0; text-shadow: 0 0 25px var(--pro-teal);">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: 900; color: var(--pro-pink); margin-bottom: 50px;">COLORFUL STAGE</p>
        <button class="btn-pro" onclick="startLoading()"><span>ログイン</span></button>
    </div>

    <!-- スクリーン2: ロード -->
    <div id="loadingScreen" class="screen hidden">
        <p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px; animation: flash 1.5s infinite alternate;">同期中...</p>
    </div>

    <!-- スクリーン3: ホーム -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.9rem; font-weight: 900;"><span id="hName">---</span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">0</span></div>
        </div>
        <div class="present-btn" onclick="openSheet('sheetPresent')">🎁<div id="pBadge" class="present-badge">0</div></div>
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="launchGachaUI()" style="border: 2px solid var(--pro-teal);">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">クエスト</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定</div>
        </nav>
    </div>

    <!-- ボトムシート：プレゼント & 履歴 -->
    <div id="sheetPresent" class="bottom-sheet">
        <div style="padding: 30px;">
            <h2 style="color:var(--pro-teal); font-family: Montserrat;">PRESENTS</h2>
            <div id="pListContainer"></div>
            <h2 style="color:var(--pro-pink); font-family: Montserrat; margin-top:40px;">COIN HISTORY</h2>
            <div id="historyContainer">履歴を読み込み中...</div>
        </div>
    </div>

    <!-- 各種ボトムシート -->
    <div id="sheetConfig" class="bottom-sheet">
        <div style="padding: 30px; text-align: center;">
            <h3>ユーザー設定</h3>
            <img id="mAv" style="width:90px; height:110px; border:2px solid #333; object-fit:cover; margin-bottom:10px;" src="" onclick="document.getElementById('fileIn').click()">
            <input type="text" id="nIn" style="width:80%; padding:10px; margin-bottom:10px;" placeholder="名前">
            <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)">
            <button class="btn-pro" onclick="saveSettings()"><span>保存</span></button>
        </div>
    </div>

    <div id="sheetFriend" class="bottom-sheet">
        <div style="padding: 30px;"><h2 style="color:var(--pro-pink);">FRIENDS</h2><div id="reqList"></div><div id="fList"></div></div>
    </div>

    <div id="questScreen" class="screen hidden">
        <div id="gameListContainer" style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:20px; width:95%;"></div>
        <button class="btn-pro gray" onclick="transition('questScreen', 'gameScreen')">戻る</button>
    </div>

    <div id="gameLayer"><iframe id="gameFrame" src="about:blank"></iframe></div>

    <script>
        // --- 1. 基本設定 ---
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzz6Z1ckhBgp-0MVN9si4TqutWaO7a0G7Qbhv24e6CBizWbSZINu3oCZVWL763Ck0Vz/exec';
        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = 0, claimedPresents = [];

        function startLoading() { transition('titleScreen', 'loadingScreen'); setTimeout(() => { transition('loadingScreen', 'gameScreen'); initPortal(); }, 1500); }
        function transition(h, s) {
            const cur = document.getElementById(h); const nxt = document.getElementById(s);
            if(cur) { cur.classList.add('hidden'); setTimeout(() => cur.style.display = 'none', 600); }
            if(nxt) { nxt.style.display = 'flex'; setTimeout(() => nxt.classList.remove('hidden'), 50); }
        }

        function initPortal() {
            localStorage.setItem('gID', myId);
            document.getElementById('hName').innerText = localStorage.getItem('gName') || "USER";
            const av = localStorage.getItem('gAv') || "https://api.dicebear.com/7.x/pixel-art/svg?seed=" + myId;
            document.getElementById('hAv').src = av;
            fetchSync(); setInterval(fetchSync, 15000);
        }

        // --- 2. データ同期 (GAS 17列構成対応) ---
        async function fetchSync() {
            if(!GAS_URL.includes('https')) return;
            try {
                // 保存
                const data = { type: "sync", id: myId, name: localStorage.getItem('gName'), iroCoin: iroCoins, avatar: localStorage.getItem('gAv') };
                await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
                
                // 取得
                const res = await fetch(GAS_URL + "?id=" + myId);
                const json = await res.json();
                if(json.result === "success") {
                    iroCoins = Number(json.iroCoin);
                    document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                    claimedPresents = json.claimed ? json.claimed.split(',') : [];
                    
                    // プレゼントUI更新
                    updatePresentUI();
                    
                    // 履歴UI更新
                    const hContainer = document.getElementById('historyContainer');
                    hContainer.innerHTML = json.history ? json.history.map(h => `
                        <div class="history-item">
                            <span>${h.reason}</span>
                            <span style="color:${h.coin >= 0 ? '#33ffcc' : '#ff3399'}">${h.coin >= 0 ? '+' : ''}${h.coin}</span>
                        </div>
                    `).join('') : "履歴はありません";
                }
            } catch(e) {}
        }

        async function updatePresentUI() {
            try {
                const res = await fetch(GAS_URL + "?action=getPresents");
                const allPresents = await res.json();
                const container = document.getElementById('pListContainer');
                const available = allPresents.filter(p => !claimedPresents.includes(p.id));
                document.getElementById('pBadge').innerText = available.length;
                document.getElementById('pBadge').style.display = available.length ? 'flex' : 'none';
                container.innerHTML = available.length ? "" : "現在プレゼントはありません";
                available.forEach(p => {
                    const div = document.createElement('div'); div.className = 'present-item';
                    div.innerHTML = `<div><b>${p.name}</b><br><small>${p.desc}</small></div><button class="btn-pro" style="width:auto; padding:5px 15px;" onclick="claim('${p.id}','${p.type}',${p.amount},'${p.name}')">受取</button>`;
                    container.appendChild(div);
                });
            } catch(e) {}
        }

        async function claim(id, type, amount, name) {
            if(type === 'iroCoin') iroCoins += amount;
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "claim", userId: myId, presentId: id, newCoins: iroCoins, presentName: name }) });
            alert(`${name}を受け取りました！`); fetchSync();
        }

        // --- 3. 全画面ガチャ演出統合 ---
        async function launchGachaUI() {
            document.getElementById('gameLayer').style.display = 'block';
            document.getElementById('mobilePauseBtn').style.display = 'flex';
            const frame = document.getElementById('gameFrame');
            const [gDataRes, charPoolRes] = await Promise.all([ fetch(GAS_URL + "?action=getGachaSettings"), fetch(GAS_URL + "?action=getCharaPools") ]);
            const gData = await gDataRes.json();
            const charaPools = await charPoolRes.json();
            
            frame.srcdoc = `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { background:#000; color:#fff; font-family:sans-serif; margin:0; overflow:hidden; }
                    #bg { position:fixed; width:100%; height:100%; background:url('${gData[0].bg}') center/cover; filter:brightness(1.1); transition:0.5s; z-index:1; }
                    .ui { position:relative; z-index:10; height:100vh; padding:30px; display:flex; flex-direction:column; justify-content:space-between; box-sizing:border-box; background:linear-gradient(rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.8)); }
                    .coin { background:rgba(0,0,0,0.6); padding:10px 25px; border-radius:30px; color:#33ffcc; border:1px solid #33ffcc; font-weight:bold; width:fit-content; }
                    .sidebar { position:absolute; left:20px; top:100px; display:flex; flex-direction:column; gap:10px; }
                    .tab { width:120px; height:60px; background-size:cover; border:2px solid transparent; border-radius:8px; opacity:0.6; cursor:pointer; }
                    .tab.active { border-color:#ffcc00; opacity:1; transform:translateX(10px); }
                    .pull-btn { background:linear-gradient(#ff88bb, #ff3399); padding:20px 40px; border-radius:15px; border:none; color:#fff; font-weight:bold; cursor:pointer; font-size:1.2rem; }
                    #reveal { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1000; display:none; flex-direction:column; justify-content:center; align-items:center; cursor: pointer; overflow:hidden; }
                    .rev-img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1; animation: zoomIn 10s linear infinite; }
                    .rev-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(transparent 60%, rgba(0,0,0,0.9)); z-index:2; }
                    .rev-content { position:relative; z-index:10; text-align:center; margin-top: auto; padding-bottom: 80px; }
                    .rev-name { font-size:4rem; font-weight:900; text-shadow:0 0 20px #000; margin:0; }
                    .star-container { display:flex; justify-content:center; gap:15px; margin-bottom:10px; }
                    .star { font-size:3.5rem; color:#ffcc00; text-shadow:0 0 10px #000; animation: starPop 0.4s cubic-bezier(0.17, 0.67, 0.83, 1.4) forwards; opacity:0; }
                    @keyframes starPop { from {transform:scale(0) rotate(-45deg); opacity:0} to {transform:scale(1) rotate(0); opacity:1} }
                    @keyframes zoomIn { from {transform:scale(1)} to {transform:scale(1.1)} }
                </style>
            </head>
            <body>
                <div id="bg"></div>
                <div class="ui">
                    <div class="coin">🪙 <span id="c">${iroCoins.toLocaleString()}</span></div>
                    <div class="sidebar" id="sb"></div>
                    <div style="margin-left:150px; margin-bottom:100px;">
                        <h1 id="t" style="font-size:3.5rem; margin:0;">${gData[0].title}</h1>
                        <p id="d" style="background:rgba(0,0,0,0.5); padding:10px; border-left:4px solid #ffcc00; display:inline-block;">${gData[0].chara}</p><br>
                        <button class="pull-btn" onclick="startPull(10)">10回引く (3000)</button>
                    </div>
                </div>
                <div id="reveal" onclick="nextReveal()">
                    <img id="rev-img" class="rev-img"><div class="rev-overlay"></div>
                    <div class="rev-content"><div id="rev-stars" class="star-container"></div><div id="rev-name" class="rev-name"></div><p style="margin-top:20px; opacity:0.8; letter-spacing:5px;">TAP TO NEXT</p></div>
                </div>
                <script>
                    let coins = ${iroCoins}; let pools = ${JSON.stringify(charaPools)};
                    let results = [], currentIndex = 0;
                    function startPull(n){
                        if(coins < 3000){alert('コイン不足'); return;}
                        coins-=3000; document.getElementById('c').innerText = coins.toLocaleString();
                        window.parent.postMessage({type:'gachaPull', value:coins}, '*');
                        results = [];
                        for(let i=0; i<n; i++) {
                            let star = (i === 9) ? (Math.random() < 0.1 ? 4 : 3) : (Math.random() < 0.03 ? 4 : Math.random() < 0.15 ? 3 : 2);
                            const pool = pools['star' + star]; const chara = pool[Math.floor(Math.random()*pool.length)];
                            results.push({...chara, rank: star});
                        }
                        currentIndex = 0; showReveal();
                    }
                    function showReveal(){
                        const c = results[currentIndex]; document.getElementById('reveal').style.display = 'flex';
                        document.getElementById('rev-img').src = c.img; document.getElementById('rev-name').innerText = c.name;
                        const starBox = document.getElementById('rev-stars'); starBox.innerHTML = '';
                        for(let i=0; i<c.rank; i++){ const s = document.createElement('div'); s.className = 'star'; s.innerText = '★'; s.style.animationDelay = (i * 0.1) + 's'; starBox.appendChild(s); }
                    }
                    function nextReveal(){ currentIndex++; if(currentIndex < results.length) showReveal(); else { document.getElementById('reveal').style.display='none'; } }
                    ${JSON.stringify(gData)}.forEach((g,i)=>{
                        const d = document.createElement('div'); d.className='tab'+(i===0?' active':''); d.style.backgroundImage='url('+g.thumbnail+')';
                        d.onclick=()=>{ document.getElementById('bg').style.backgroundImage='url('+g.bg+')'; document.getElementById('t').innerText=g.title; document.getElementById('d').innerText=g.chara; document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',i===idx)); };
                        document.getElementById('sb').appendChild(d);
                    });
                <\/script>
            </body>
            </html>`;
        }

        // --- 4. 共通UI/メッセージ受信 ---
        window.addEventListener('message', e => { 
            if(e.data.type === 'gachaPull') { 
                iroCoins = e.data.value; 
                document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                // コイン消費を即座にGASへ通知（履歴残し用）
                fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "gachaLog", userId: myId, newCoins: iroCoins }) });
            } 
        });

        async function loadGameList() {
            const res = await fetch(GAS_URL + "?action=getList"); const games = await res.json();
            const container = document.getElementById('gameListContainer'); container.innerHTML = "";
            games.forEach(g => {
                const card = document.createElement('div'); card.className = "nav-card"; card.style.width="160px";
                card.innerHTML = `<b>${g.title}</b>`; card.onclick = () => launchGame(g.id);
                container.appendChild(card);
            });
        }
        async function launchGame(id) {
            document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex';
            const res = await fetch(GAS_URL+"?action=getCode&row="+id); const data = await res.json();
            document.getElementById('gameFrame').srcdoc = data.code;
        }
        function saveSettings() { localStorage.setItem('gName', document.getElementById('nIn').value); fetchSync(); closeAllSheets(); }
        function uploadIcon(input) { if (input.files && input.files[0]) { const reader = new FileReader(); reader.onload = e => { localStorage.setItem('gAv', e.target.result); document.getElementById('hAv').src = e.target.result; document.getElementById('mAv').src = e.target.result; fetchSync(); }; reader.readAsDataURL(input.files[0]); } }
        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }
        function showPauseMenu() { document.getElementById('pauseOverlay').style.display = 'flex'; }
        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { location.reload(); }
    </script>
</body>
</html>
