<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - ULTIMATE INTEGRATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.85);
            --border: rgba(255, 255, 255, 0.3); --verify: #1da1f2;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        /* 背景装飾 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.4); pointer-events: none; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, #000 100%); z-index: -1; pointer-events: none; }

        /* 装飾 */
        .char-original { position: absolute; width: 90px; height: 90px; border-radius: 24px; border: 3px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: float 4s infinite ease-in-out; z-index: 1; box-shadow: 0 0 25px var(--pro-teal); pointer-events: none; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-25px) rotate(8deg); } }

        /* スクリーン管理 */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; box-sizing: border-box; padding: 20px; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        /* ボタン */
        .btn-pro { position: relative; background: #fff; color: #111; border: none; padding: 16px 40px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 5px 5px 0 var(--pro-teal); z-index: 10000; font-family: 'Montserrat', sans-serif; margin: 12px; text-transform: uppercase; text-align: center; width: 85%; max-width: 300px; font-size: 1.1rem; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); pointer-events: none; }
        .btn-pro:active { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); }
        .btn-pro.pink { box-shadow: 5px 5px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }

        /* UI要素 */
        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; z-index: 200; }
        .av-mini { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; cursor: pointer; }
        .iro-coin-disp { margin-left: 10px; font-weight: 900; color: var(--pro-teal); text-shadow: 0 0 15px var(--pro-teal); font-size: 1.2rem; }
        .badge-verify { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: linear-gradient(135deg, #1da1f2, #0e71c8); color: #fff; border-radius: 50%; font-size: 10px; margin-left: 6px; border: 1.5px solid #fff; font-weight: bold; }
        .badge-verify::after { content: '✔'; }

        .nav-container { position: absolute; bottom: 25px; display: flex; gap: 10px; width: 95%; max-width: 900px; z-index: 300; justify-content: center; }
        .nav-card { flex: 1; background: rgba(0,0,0,0.7); border: 1.5px solid #444; padding: 20px 5px; border-radius: 14px; cursor: pointer; text-align: center; font-weight: 900; font-size: 0.8rem; color: #fff; transition: 0.2s; white-space: nowrap; }
        .nav-card.main { background: var(--pro-pink); border: none; box-shadow: 0 0 25px rgba(255,51,153,0.5); }

        /* ボトムシート */
        .bottom-sheet { position: fixed; bottom: -110%; left: 0; width: 100%; height: 94%; background: #0a0b12; border-radius: 32px 32px 0 0; z-index: 50000; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; color: #fff; border-top: 1px solid var(--border); }
        .bottom-sheet.open { bottom: 0; }
        .sheet-content { padding: 25px; padding-bottom: 140px; max-width: 800px; margin: 0 auto; }

        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; }
        .member-card { position: relative; background: rgba(255,255,255,0.08); border-radius: 16px; padding: 12px; border: 1.2px solid rgba(255,255,255,0.2); text-align: center; cursor: pointer; }
        .member-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; border: 2px solid #fff; }
        .count-badge { position: absolute; top: 6px; right: 6px; background: var(--pro-pink); color: #fff; font-size: 0.7rem; font-weight: bold; padding: 3px 10px; border-radius: 20px; border: 1.5px solid #fff; z-index: 10; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="floatChars"></div>

    <div id="sheetOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:49000;display:none;backdrop-filter:blur(5px);" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" style="position:fixed;top:15px;right:15px;width:45px;height:45px;background:var(--glass);border:1.5px solid #fff;border-radius:50%;display:none;z-index:15000;justify-content:center;align-items:center;font-weight:900;cursor:pointer;color:#fff;" onclick="showPauseMenu()">II</div>

    <div id="pauseOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:60000;display:none;flex-direction:column;justify-content:center;align-items:center;">
        <h1 style="font-family: Montserrat; font-size: 3.5rem; color: var(--pro-teal);">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開</span></button>
        <button class="btn-pro pink" onclick="exitGame()"><span>終了</span></button>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <h1 style="font-family: Montserrat; font-size: clamp(3.5rem, 15vw, 8.5rem); margin: 0; text-shadow: 0 0 40px var(--pro-teal); text-align: center;">GENSOU</h1>
        <p style="letter-spacing: 14px; font-weight: 900; color: var(--pro-pink); margin-bottom: 60px; text-align: center; font-size: 1.3rem;">COLORFUL STAGE</p>
        <button class="btn-pro" onclick="handleLoginClick()"><span>ログイン</span></button>
        <button class="btn-pro pink" onclick="document.getElementById('modalTransfer').showModal()"><span>データ復元</span></button>
    </div>

    <!-- 2. 新規登録 -->
    <div id="registrationScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; color: var(--pro-teal);">NEW REGISTRATION</h2>
        <div style="background:#fff; padding:20px; border-radius:20px; color:#333; width:80%; max-width:340px; margin:20px 0;">
            <input type="text" id="regName" style="width:100%; padding:10px; margin-bottom:10px; border:none; border-bottom:2px solid #333; font-size:1.2rem;" placeholder="なまえ">
            <input type="password" id="regPass" style="width:100%; padding:10px; border:none; border-bottom:2px solid #333; font-size:1.2rem;" placeholder="合言葉">
        </div>
        <button class="btn-pro" onclick="saveRegistration()"><span>作成して開始！</span></button>
    </div>

    <div id="loadingScreen" class="screen hidden">
        <p style="color: var(--pro-teal); font-weight: 900; letter-spacing: 5px; font-size: 1.8rem;">同期中...</p>
        <p id="debugInfo" style="color:red; font-size:0.8rem; margin-top:20px; max-width:80%; text-align:center;"></p>
        <button id="skipSyncBtn" style="display:none; margin-top:20px; padding:10px 20px; background:#444; color:#fff; border:none; border-radius:10px;" onclick="forceStart()">サーバー接続をスキップして開始</button>
    </div>

    <!-- 3. ホーム画面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 1rem; font-weight: 900;"><span id="hName">---</span><span id="hVerified"></span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">---</span></div>
        </div>
        <div style="position: absolute; top: 75px; left: 15px; width: 48px; height: 48px; background: rgba(255,255,255,0.1); border: 2px solid #555; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 300; font-size: 1.5rem;" onclick="openSheet('sheetPresent')">🎁<div id="pBadge" style="position: absolute; top: -4px; right: -4px; width: 20px; height: 20px; background: #ff3366; border-radius: 50%; border: 2px solid #fff; font-size: 0.7rem; display: none; justify-content: center; align-items: center; font-weight: 900;">0</div></div>
        <h1 style="font-family: Montserrat; font-size: clamp(2rem, 10vw, 5.5rem); font-weight: 900; letter-spacing: 12px; color: #fff; opacity: 0.7; pointer-events: none;">MAIN CONSOLE</h1>
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="launchGachaUI()">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">クエスト</div>
            <div class="nav-card" onclick="openSheet('sheetMember')">メンバー</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定</div>
        </nav>
    </div>

    <!-- ボトムシート -->
    <div id="sheetMember" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">MY MEMBERS</h2><div id="memberListContainer" class="member-grid"></div></div></div>
    <div id="sheetFriend" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-pink); font-family: Montserrat;">FRIENDS</h2><div id="reqList"></div><div id="fList"></div><div style="margin-top:20px; display:flex; gap:10px;"><input type="text" id="fIdIn" placeholder="10桁ID検索" style="flex:1; padding:15px; border-radius:10px;"><button class="btn-pro pink" style="width:auto; padding:15px 25px; margin:0;" onclick="sendReq()"><span>申請</span></button></div></div></div>
    <div id="sheetPresent" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">PRESENTS</h2><div id="pListContainer"></div></div></div>
    <div id="sheetConfig" class="bottom-sheet"><div class="sheet-content" style="text-align: center;"><div style="background:#fff; padding:20px; border-radius:20px; color:#333;"><img id="mAv" style="width:100px; height:100px; border-radius:50%; border:3px solid #333;" onclick="document.getElementById('fileIn').click()"><p>ID: <span id="myIdDisplay">---</span></p><input type="text" id="nIn" style="border:none; border-bottom:2px solid #333; font-size:1.2rem; width:100%; text-align:center;" placeholder="なまえ更新"><input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)"></div><br><button class="btn-pro" style="width:100%" onclick="saveSettings()"><span>保存</span></button></div></div>
    <div id="questScreen" class="screen hidden"><h2 style="font-size: 3rem; color: var(--pro-teal); font-family: Montserrat;">QUEST SELECT</h2><div id="gameListContainer" style="display:flex;flex-wrap:wrap;justify-content:center;gap:18px;width:100%;padding:20px;"></div><button class="btn-pro" onclick="transition('questScreen', 'gameScreen')">戻る</button></div>
    <dialog id="modalTransfer" style="background:#111;color:#fff;border:none;border-radius:24px;padding:30px;width:90%;max-width:340px;"><h3 style="color:var(--pro-pink);">データ復元</h3><input type="text" id="tIdIn" placeholder="ID" style="width:100%; padding:15px; margin-bottom:10px;"><input type="password" id="tPassIn" placeholder="合言葉" style="width:100%; padding:15px;"><br><br><button class="btn-pro pink" style="width:100%;margin:0;" onclick="executeTransfer()">復元</button></dialog>

    <div id="gameLayer"><iframe id="gameFrame" src="about:blank"></iframe></div>

    <script>
        // 【重要】ここにGASのURLを貼り付けてください
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwLBIyJo40drf_jMULKDmECCIxcm0H30lkFfasCNdzE2Ki9VuB39AfTW6yRmcWqs6RM/exec';

        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = parseInt(localStorage.getItem('gCoins')) || 1000;
        let myChars = localStorage.getItem('gChars') || "", globalCharaPool = {}, friendsData = [], firstSyncDone = false;

        // 背景演出
        function initFloating() { const container = document.getElementById('floatChars'); for(let i=0; i<6; i++) { const div = document.createElement('div'); div.className = 'char-original'; div.style.left = (Math.random() * 85) + '%'; div.style.top = (Math.random() * 80) + '%'; div.style.animationDelay = (Math.random() * 6) + 's'; div.style.opacity = '0.25'; container.appendChild(div); } }
        initFloating();

        // ログイン・登録
        function handleLoginClick() { if(!localStorage.getItem('gName')) transition('titleScreen', 'registrationScreen'); else beginPortalSync(); }
        async function saveRegistration() { const name = document.getElementById('regName').value; const pass = document.getElementById('regPass').value; if(!name || !pass) return; localStorage.setItem('gID', myId); localStorage.setItem('gName', name); localStorage.setItem('gPass', pass); beginPortalSync(); }
        
        async function beginPortalSync() {
            transition('registrationScreen', 'loadingScreen'); transition('titleScreen', 'loadingScreen');
            
            // 5秒経っても同期が終わらない場合はスキップボタンを出す
            setTimeout(() => { document.getElementById('skipSyncBtn').style.display = 'block'; }, 5000);

            if(!GAS_URL.includes('https')) { 
                document.getElementById('debugInfo').innerText = "GASのURLが正しく設定されていません。";
                return; 
            }

            try {
                const charRes = await fetch(GAS_URL + "?action=getCharaPools");
                globalCharaPool = await charRes.json();
                
                const syncSuccess = await fetchSync();
                if(syncSuccess) {
                    transition('loadingScreen', 'gameScreen');
                    setInterval(fetchSync, 15000);
                }
            } catch(e) {
                document.getElementById('debugInfo').innerText = "通信エラー: GASの設定（全員に公開）を確認してください。\n" + e.message;
            }
        }

        function forceStart() { transition('loadingScreen', 'gameScreen'); updateHomeUI(); }

        async function fetchSync() {
            try {
                const res = await fetch(GAS_URL + "?id=" + myId);
                const json = await res.json();
                if(json.result === "success") {
                    iroCoins = Number(json.iroCoin); localStorage.setItem('gCoins', iroCoins);
                    myChars = json.chars || ""; friendsData = json.friendsData || [];
                    updateHomeUI(json);
                    return true;
                }
                return false;
            } catch(e) { return false; }
        }

        function updateHomeUI(json={}) {
            document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
            document.getElementById('hName').innerText = json.name || localStorage.getItem('gName') || "USER";
            document.getElementById('hAv').src = json.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed="+myId;
            document.getElementById('myIdDisplay').innerText = myId;
            document.getElementById('hVerified').innerHTML = json.isOfficial ? '<span class="badge-verify"></span>' : "";
            renderMembers();
            if(json.pendingGifts) updatePresentUI(json.pendingGifts);
            if(json.pending) document.getElementById('reqList').innerHTML = json.pending.split(',').map(id => `<div style="background:#fff; padding:10px; border-radius:10px; margin-bottom:5px; color:#333;">ID: ${id} <button onclick="acceptF('${id}')">承認</button></div>`).join('');
            if(friendsData) document.getElementById('fList').innerHTML = friendsData.map(f => `<div style="padding:10px; border-bottom:1px solid #333; color:#fff;">${f.name} <button onclick="sendFriendGift('${f.id}')">🎁</button></div>`).join('');
        }

        function renderMembers() {
            const container = document.getElementById('memberListContainer');
            if(!myChars) { container.innerHTML = "なし"; return; }
            const counts = {}; myChars.split(',').forEach(n => { if(n) counts[n] = (counts[n] || 0) + 1; });
            const master = [...(globalCharaPool.star2||[]), ...(globalCharaPool.star3||[]), ...(globalCharaPool.star4||[])];
            container.innerHTML = Object.keys(counts).map(name => {
                const char = master.find(m => m.name === name);
                return char ? `<div class="member-card"><div class="count-badge">x${counts[name]}</div><img src="${char.img}"><br><small>${char.name}</small></div>` : "";
            }).join('');
        }

        // ガチャUI（確定ロジック入り）
        async function launchGachaUI() {
            document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex';
            const gDataRes = await fetch(GAS_URL + "?action=getGachaSettings");
            const gData = await gDataRes.json();
            
            document.getElementById('gameFrame').srcdoc = `
            <!DOCTYPE html><html><head><style>
                body{background:#000;color:#fff;font-family:sans-serif;margin:0;overflow:hidden;}
                #bg{position:fixed;width:100%;height:100%;background:url('${gData[0].bg}') center/cover; filter:brightness(0.8);}
                .ui{position:relative;z-index:10;height:100vh;padding:30px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;}
                .btn-pull{padding:20px 40px; border-radius:15px; border:none; font-weight:bold; cursor:pointer; font-size:1.2rem; color:#fff; background:linear-gradient(#ff3399,#ff88bb); box-shadow:0 5px 0 #900;}
                .btn-pull:active{transform:translateY(5px); box-shadow:none;}
                #reveal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:1000;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;}
                .rev-img{max-height:70vh; border:5px solid #fff; border-radius:20px;}
            </style></head>
            <body>
                <div id="bg"></div>
                <div class="ui">
                    <div style="font-size:1.5rem;">🪙 ${iroCoins.toLocaleString()}</div>
                    <div style="margin-bottom:100px; text-align:right;">
                        <h1>${gData[0].title}</h1>
                        <button class="btn-pull" onclick="pull(1)">1回引く</button>
                        <button class="btn-pull" onclick="pull(10)" style="margin-left:10px;">10回引く</button>
                    </div>
                </div>
                <div id="reveal" onclick="next()"><img id="ri" class="rev-img"><h1 id="rn"></h1><p>TAP TO NEXT</p></div>
                <script>
                    let coins=${iroCoins}, ps=${JSON.stringify(globalCharaPool)}, res=[], cur=0;
                    function pull(n){
                        const cost=n*300; if(coins<cost){alert('不足');return;}
                        coins-=cost; res=[]; let names=[]; let hasS4=false, hasS3=false;
                        for(let i=0; i<n; i++){
                            let s=2, r=Math.random()*100;
                            if(r<3.5) s=4; else if(r<16) s=3;
                            if(n>=100 && i===n-1 && !hasS4) s=4;
                            else if(n>=10 && i===n-1 && !hasS3 && s<3) s=3;
                            if(s>=4) hasS4=true; if(s>=3) hasS3=true;
                            const pool=ps['star'+s]; const c=pool[Math.floor(Math.random()*pool.length)];
                            res.push({...c,rank:s}); names.push(c.name);
                        }
                        window.parent.postMessage({type:'gachaPull',value:coins,pulls:n,chars:names.join(',')},'*');
                        cur=0; show();
                    }
                    function show(){ const c=res[cur]; document.getElementById('reveal').style.display='flex'; document.getElementById('ri').src=c.img; document.getElementById('rn').innerText=c.name + ' ★' + c.rank; }
                    function next(){ cur++; if(cur<res.length) show(); else location.reload(); }
                <\/script>
            </body></html>`;
        }

        window.addEventListener('message', e => { if(e.data.type === 'gachaPull') { iroCoins = e.data.value; localStorage.setItem('gCoins', iroCoins); fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "gachaLog", userId: myId, newCoins: iroCoins, pulls: e.data.pulls, newChars: e.data.chars }) }); } });
        async function loadGameList() { const res = await (await fetch(GAS_URL + "?action=getList")).json(); const container = document.getElementById('gameListContainer'); container.innerHTML = ""; res.forEach(g => { const card = document.createElement('div'); card.className = "nav-card"; card.style.width="130px"; card.style.flex="none"; card.innerHTML = `<b>${g.title}</b>`; card.onclick = () => launchGame(g.id); container.appendChild(card); }); }
        async function launchGame(id) { document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex'; const res = await (await fetch(GAS_URL+"?action=getCode&row="+id)).json(); document.getElementById('gameFrame').srcdoc = res.code; }
        function saveSettings() { localStorage.setItem('gName', document.getElementById('nIn').value); fetchSync(); closeAllSheets(); }
        function uploadIcon(input) { if (input.files && input.files[0]) { const r = new FileReader(); r.onload = e => { localStorage.setItem('gAv', e.target.result); document.getElementById('hAv').src = e.target.result; fetchSync(); }; r.readAsDataURL(input.files[0]); } }
        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }
        function transition(h, s) { const cur = document.getElementById(h); const nxt = document.getElementById(s); if(cur) { cur.classList.add('hidden'); setTimeout(() => cur.style.display = 'none', 600); } if(nxt) { nxt.style.display = 'flex'; setTimeout(() => nxt.classList.remove('hidden'), 50); } }
        function showPauseMenu() { document.getElementById('pauseOverlay').style.display = 'flex'; }
        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { location.reload(); }
        async function sendReq() { const tid = document.getElementById('fIdIn').value.toUpperCase(); await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "request", myId: myId, targetId: tid }) }); alert("申請完了"); }
        async function acceptF(tid) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "accept", myId: myId, targetId: tid }) }); fetchSync(); }
        async function sendFriendGift(fid) { const amount = prompt("枚数", "100"); iroCoins -= parseInt(amount); await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "friendGift", fromId: myId, fromName: document.getElementById('hName').innerText, toId: fid, amount: amount }) }); fetchSync(); }
        function updatePresentUI(p) { const badge = document.getElementById('pBadge'); const list = document.getElementById('pListContainer'); if(!p || p.length === 0) { badge.style.display = 'none'; return; } badge.innerText = p.length; badge.style.display = 'flex'; list.innerHTML = p.map(x => `<div style="background:rgba(255,255,255,0.1); padding:10px; margin-bottom:5px; border-radius:10px;">${x.name} <button onclick="claim(${x.row},'${x.name}')">受取</button></div>`).join(''); }
        async function claim(r, n) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "claim", userId: myId, giftRow: r }) }); alert(n + " 受取完了"); fetchSync(); }
    </script>
</body>
