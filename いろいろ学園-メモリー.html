<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gensou Chronicle - Game Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.8);
            --border: rgba(255, 255, 255, 0.3);
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; }
        
        /* 背景 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.6); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.5) 100%); z-index: -1; }

        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
        .hidden { display: none !important; opacity: 0; }

        /* キャラクター配置 (50, 200, 350) */
        .char-original { position: absolute; width: 70px; height: 70px; border-radius: 15px; border: 2px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: float 3s infinite ease-in-out; pointer-events: none; z-index: 1; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* ボタン */
        .btn-pro { background: #fff; color: #333; border: none; padding: 15px 50px; border-radius: 5px; font-weight: 900; cursor: pointer; transition: 0.3s; transform: skewX(-10deg); box-shadow: 4px 4px 0 var(--pro-teal); font-family: inherit; }
        .btn-pro:hover { transform: skewX(-10deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); background: var(--pro-teal); color: #fff; }

        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; padding: 5px 12px; background: rgba(0,0,0,0.6); border-left: 4px solid var(--pro-teal); backdrop-filter: blur(10px); z-index: 200; border-radius: 5px; }
        .av-mini { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #fff; overflow: hidden; background: #222; }

        /* ゲーム選択 */
        .game-container-scroll { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-height: 60vh; overflow-y: auto; padding: 20px; width: 90%; scrollbar-width: none; }
        .card { width: 200px; height: 260px; background: var(--glass); border: 2px solid var(--border); border-radius: 20px; padding: 15px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(15px); }
        .card:hover { transform: translateY(-10px); border-color: var(--pro-teal); }
        .thumb { width: 100%; height: 100px; border-radius: 10px; margin-bottom: 15px; }
        .p0 { background: linear-gradient(135deg, #2af598, #009efd); }
        .p1 { background: linear-gradient(135deg, #f093fb, #f5576c); }

        /* --- ポーズメニュー (Escキー) --- */
        #pauseOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20000; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .pause-title { font-family: Montserrat; font-size: 4rem; color: var(--pro-teal); margin-bottom: 30px; }

        /* ゲーム実行用レイヤー */
        #gameFrameContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; }
        iframe { width: 100%; height: 100%; border: none; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 30000; }
        dialog { background: #fff; color: #333; border: none; padding: 30px; border-radius: 20px; width: 380px; z-index: 50000; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>

    <!-- Escポーズメニュー -->
    <div id="pauseOverlay">
        <h1 class="pause-title">PAUSE</h1>
        <button class="btn-pro" style="margin-bottom:20px;" onclick="resumeGame()">再開する</button>
        <button class="btn-pro" style="background:#555; color:#fff; box-shadow: 4px 4px 0 #333;" onclick="quitGame()">終了する</button>
    </div>

    <!-- ローディング -->
    <div id="loadingOverlay">
        <div style="width: 50px; height: 50px; border: 3px solid var(--pro-teal); border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite;"></div>
        <p id="loadText" style="margin-top: 20px; letter-spacing: 5px; color: var(--pro-teal);">LOADING...</p>
    </div>

    <!-- ゲーム実行枠 -->
    <div id="gameFrameContainer">
        <iframe id="gameIframe"></iframe>
    </div>

    <!-- ポータル画面 -->
    <div id="titleScreen" class="screen">
        <div class="char-original" style="left: 50px; top: 300px;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=A" style="width:100%"></div>
        <div class="char-original" style="left: 200px; top: 300px; animation-delay: 0.2s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=B" style="width:100%"></div>
        <div class="char-original" style="left: 350px; top: 300px; animation-delay: 0.4s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=C" style="width:100%"></div>
        <h1 style="font-family: Montserrat; font-size: 5.5rem; margin: 0; letter-spacing: -3px; text-shadow: 0 0 20px var(--pro-teal);">GENSOU</h1>
        <button class="btn-pro" onclick="transition('titleScreen', 'loadingScreen')">システムログイン</button>
    </div>

    <div id="loadingScreen" class="screen hidden">
        <p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px;">同期中...</p>
    </div>

    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal"><div class="av-mini"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div><div id="hName" style="font-size:0.8rem; font-weight:bold; margin-left:5px;">---</div></div>
        <h2 style="font-size: 2.5rem; font-weight: 300; letter-spacing: 5px;">MAIN CONSOLE</h2>
        <nav class="nav-container">
            <div class="nav-card" onclick="openBox('modalFriend')">フレンド</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); initGameList();">ゲーム選択</div>
            <div class="nav-card" onclick="openBox('modalConfig')">プロフィール</div>
        </nav>
    </div>

    <div id="questScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; font-size: 3rem; margin: 0;">SELECT GAME</h2>
        <div class="game-container-scroll" id="game-list-container"></div>
        <button class="btn-pro" style="margin-top:20px; background:#555; color:#fff; box-shadow:none;" onclick="transition('questScreen', 'gameScreen')">戻る</button>
    </div>

    <dialog id="modalConfig"><h2>設定</h2>名前:<input type="text" id="nIn"><button class="btn-pro" style="width:100%;" onclick="saveSettings()">保存</button></dialog>
    <dialog id="modalFriend"><h2>フレンド</h2><div id="fList" style="height:150px; overflow-y:auto; background:#eee; padding:10px; border-radius:10px;"></div><button class="btn-pro" style="width:100%; margin-top:10px;" onclick="this.closest('dialog').close()">閉じる</button></dialog>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxRexzdnkJO8ZDnYJTZJmwHiKGaEW9kgaWD-ZvJN0lqYZxud3Dvsibi0a9r64nxqxK6/exec';
        let myId = "", isGameRunning = false;

        function transition(h, s) {
            document.getElementById(h).classList.add('hidden');
            document.getElementById(s).classList.remove('hidden');
            if(s === 'loadingScreen') setTimeout(() => { transition('loadingScreen', 'gameScreen'); initPortal(); }, 1200);
        }
        function openBox(id) { document.getElementById(id).showModal(); }

        function initPortal() {
            if(!localStorage.getItem('gID')) localStorage.setItem('gID', Math.random().toString(36).substring(2, 12).toUpperCase());
            myId = localStorage.getItem('gID');
            document.getElementById('hName').innerText = localStorage.getItem('gName') || "USER";
            document.getElementById('hAv').src = "https://api.dicebear.com/7.x/avataaars/svg?seed=" + myId;
        }

        function saveSettings() {
            localStorage.setItem('gName', document.getElementById('nIn').value);
            document.getElementById('hName').innerText = document.getElementById('nIn').value;
            document.getElementById('modalConfig').close();
        }

        // --- ゲーム選択・実行システム ---
        async function initGameList() {
            const container = document.getElementById('game-list-container');
            container.innerHTML = "<p>探索中...</p>";
            try {
                const response = await fetch(`${GAS_URL}?action=getList`);
                const games = await response.json();
                container.innerHTML = "";
                games.forEach((game, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => fetchGame(game.id);
                    card.innerHTML = `<div class="thumb p${index % 2}"></div><div class="game-title">${game.title}</div><div class="game-desc">${game.description}</div>`;
                    container.appendChild(card);
                });
            } catch (e) { container.innerHTML = "<p>サーバー接続エラー</p>"; }
        }

        async function fetchGame(rowId) {
            document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                const response = await fetch(`${GAS_URL}?action=getCode&row=${rowId}`);
                const data = await response.json();
                
                // iframeにプログラムを流し込む
                const iframe = document.getElementById('gameIframe');
                const blob = new Blob([data.code], { type: 'text/html' });
                iframe.src = URL.createObjectURL(blob);
                
                document.getElementById('gameFrameContainer').style.display = 'block';
                document.getElementById('loadingOverlay').style.display = 'none';
                isGameRunning = true;
            } catch (e) { alert("読み込み失敗"); document.getElementById('loadingOverlay').style.display = 'none'; }
        }

        // --- Escキー判定とポーズメニュー ---
        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape" && isGameRunning) {
                const menu = document.getElementById('pauseOverlay');
                if (menu.style.display === 'flex') {
                    resumeGame();
                } else {
                    menu.style.display = 'flex';
                }
            }
        });

        function resumeGame() {
            document.getElementById('pauseOverlay').style.display = 'none';
            // iframeにフォーカスを戻す（ゲーム操作を再開させるため）
            document.getElementById('gameIframe').focus();
        }

        function quitGame() {
            isGameRunning = false;
            document.getElementById('pauseOverlay').style.display = 'none';
            document.getElementById('gameFrameContainer').style.display = 'none';
            document.getElementById('gameIframe').src = "about:blank"; // ゲームを停止
            transition('titleScreen', 'gameScreen'); // ホームに戻る
        }
    </script>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
</body>
</html>
