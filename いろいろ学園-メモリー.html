<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - Integrated Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.85);
            --border: rgba(255, 255, 255, 0.4); 
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.6); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%); z-index: -1; }

        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; pointer-events: auto; }
        .hidden { display: none !important; opacity: 0; }

        .btn-pro { background: #fff; color: #333; border: none; padding: 14px 45px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 6px 6px 0 var(--pro-teal); z-index: 500; font-family: inherit; margin: 10px; text-transform: uppercase; text-align: center; width: 240px; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); }
        .btn-pro:hover { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); background: var(--pro-teal); color: #fff; }
        .btn-pro.pink { box-shadow: 6px 6px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }
        .btn-pro.gray { background: #444; color: #fff; box-shadow: 6px 6px 0 #222; }

        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; padding: 5px 15px; background: rgba(0,0,0,0.6); border-left: 4px solid var(--pro-teal); backdrop-filter: blur(10px); z-index: 200; border-radius: 0 15px 15px 0; }
        .av-mini { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; }
        .iro-coin-disp { margin-left: 20px; font-weight: 900; color: var(--pro-teal); text-shadow: 0 0 10px var(--pro-teal); }

        .nav-container { position: absolute; bottom: 30px; display: flex; gap: 12px; width: 95%; max-width: 1000px; z-index: 200; }
        .nav-card { flex: 1; background: var(--glass); border: 1px solid var(--border); padding: 18px 5px; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(15px); font-weight: 900; font-size: 0.8rem; color: #fff; }
        .nav-card:hover { border-color: #fff; transform: translateY(-10px); }
        .nav-card.main { background: linear-gradient(to right, var(--pro-pink), #ff66cc); border: none; font-size: 1.1rem; flex: 1.8; box-shadow: 0 0 25px rgba(255,51,153,0.5); }

        /* ボトムシート設定 */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 90%; background: #0a0b10; color: #fff; border-radius: 30px 30px 0 0; z-index: 50000; transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 -10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; }
        .bottom-sheet.open { bottom: 0; }
        .sheet-handle { width: 40px; height: 5px; background: #555; border-radius: 10px; margin: 15px auto; flex-shrink: 0; }
        .sheet-content { padding: 0 25px 30px; overflow-y: auto; flex-grow: 1; }
        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 49999; display: none; backdrop-filter: blur(5px); }

        .student-id-card { background: #fff; color: #333; border-radius: 10px; padding: 20px; border: 2px solid #555; position: relative; max-width: 350px; margin: 0 auto; text-align: left; }
        input.student-input { background: none; border: none; border-bottom: 1px solid #333; width: 100%; font-size: 1rem; color: #000; padding: 5px 0; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        #mobilePauseBtn { position: fixed; top: 15px; right: 15px; width: 45px; height: 45px; background: var(--glass); border: 1.5px solid #fff; border-radius: 50%; display: none; z-index: 15000; justify-content: center; align-items: center; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="sheetOverlay" class="sheet-overlay" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" onclick="exitGame()">✕</div>

    <!-- 1. タイトル画面 -->
    <div id="titleScreen" class="screen">
        <h1 style="font-family: Montserrat; font-size: 5rem; margin: 0; letter-spacing: -3px; text-shadow: 0 0 25px var(--pro-teal);">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: 900; color: var(--pro-pink); margin-bottom: 50px;">COLORFUL STAGE</p>
        <button class="btn-pro" onclick="transition('titleScreen', 'loadingScreen')"><span>ログイン</span></button>
    </div>

    <!-- 2. ロード画面 -->
    <div id="loadingScreen" class="screen hidden">
        <p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px;">同期中...</p>
    </div>

    <!-- 3. ホーム画面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.8rem; font-weight: 900;"><span id="hName">---</span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">0</span></div>
        </div>
        <h2 style="font-size: 2.5rem; font-weight: 300; letter-spacing: 8px;">MAIN CONSOLE</h2>
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="loadGachaUI()">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">ゲーム選択</div>
            <div class="nav-card" onclick="alert('準備中')">メンバー</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定・学生証</div>
        </nav>
    </div>

    <!-- ゲーム選択画面 -->
    <div id="questScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; font-size: 3rem; color: var(--pro-teal);">SELECT GAME</h2>
        <div id="gameListContainer" style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:20px; width:95%;"></div>
        <button class="btn-pro gray" onclick="transition('questScreen', 'gameScreen')">戻る</button>
    </div>

    <!-- 設定シート -->
    <div id="sheetConfig" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-content" style="text-align: center;">
            <div class="student-id-card">
                <h3>幻想クロニクル 学生証</h3>
                <div style="display:flex; gap:15px;">
                    <img id="mAv" style="width:90px; height:110px; border:2px solid #333; object-fit:cover;" src="" onclick="document.getElementById('fileIn').click()">
                    <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)">
                    <div style="flex-grow:1;">
                        <p style="font-size:0.6rem; color:#888;">ID</p><span style="font-size:1rem; font-weight:bold;" id="myIdDisplay">--------</span>
                        <p style="font-size:0.6rem; color:#888; margin-top:10px;">名前</p><input type="text" id="nIn" class="student-input">
                        <p style="font-size:0.6rem; color:#888; margin-top:10px;">合言葉</p><input type="password" id="pIn" class="student-input">
                    </div>
                </div>
            </div>
            <button class="btn-pro" style="margin-top:30px; width:100%;" onclick="saveSettings()"><span>設定を保存</span></button>
        </div>
    </div>

    <!-- フレンドシート -->
    <div id="sheetFriend" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-content">
            <h2 style="color:var(--pro-pink);">FRIENDS</h2>
            <div id="reqList" style="background:#f0f0f5; padding:10px; border-radius:10px; margin-bottom:15px; color:#333;">届いた申請なし</div>
            <div id="fList" style="background:#f0f0f5; border-radius:10px; min-height:100px; padding:10px; color:#333;">フレンドなし</div>
            <input type="text" id="fIdIn" placeholder="10桁IDで検索" style="width:100%; padding:10px; margin-top:10px; box-sizing:border-box;">
            <button class="btn-pro pink" style="width:100%; margin:10px 0 0 0;" onclick="sendReq()"><span>申請を送る</span></button>
        </div>
    </div>

    <!-- ゲームレイヤー -->
    <div id="gameLayer"><iframe id="gameFrame" src="about:blank"></iframe></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxYv2z5SxTlu7PHSA4hszeKcC2OuLp67w2X3PCtOUQaw1n_mcBo06sbGARlm2gX7JLY/exec';
        let myId = "", iroCoins = 0;

        // ガチャiframeからの同期通知を受け取る
        window.addEventListener('message', (event) => {
            if (event.data.type === 'GACHA_SYNC') {
                iroCoins = event.data.newBalance;
                document.getElementById('hIroCoin').innerText = iroCoins;
                console.log("ポータル側コイン同期:", iroCoins);
            }
        });

        function transition(h, s) {
            document.getElementById(h).classList.add('hidden');
            const next = document.getElementById(s);
            next.classList.remove('hidden');
            if(s === 'loadingScreen') setTimeout(() => { transition('loadingScreen', 'gameScreen'); initPortal(); }, 1500);
        }

        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }

        function initPortal() {
            if(!localStorage.getItem('gID')) localStorage.setItem('gID', Math.random().toString(36).substring(2, 12).toUpperCase());
            myId = localStorage.getItem('gID');
            document.getElementById('myIdDisplay').innerText = myId;
            document.getElementById('hName').innerText = localStorage.getItem('gName') || "USER";
            const av = localStorage.getItem('gAv') || "https://api.dicebear.com/7.x/avataaars/svg?seed=" + myId;
            document.getElementById('hAv').src = av; document.getElementById('mAv').src = av;
            document.getElementById('nIn').value = localStorage.getItem('gName') || "";
            document.getElementById('pIn').value = localStorage.getItem('gPass') || "";
            
            fetchSync();
            setInterval(fetchSync, 15000); // 15秒おきにサーバーと同期
        }

        async function fetchSync() {
            if(!GAS_URL.includes('https')) return;
            try {
                // 1. 最新データの取得
                const res = await fetch(GAS_URL + "?id=" + myId);
                const json = await res.json();
                if(json.result === "success") {
                    iroCoins = json.iroCoin || 0;
                    document.getElementById('hIroCoin').innerText = iroCoins;
                    // フレンド申請リスト表示
                    const pending = json.pending ? json.pending.split(',') : [];
                    document.getElementById('reqList').innerHTML = pending.length ? pending.map(id => `<div>${id} <button onclick="acceptF('${id}')">承認</button></div>`).join('') : "届いた申請なし";
                }
                // 2. 状態の送信
                const data = { 
                    type: "sync", id: myId, name: localStorage.getItem('gName'), 
                    avatar: localStorage.getItem('gAv')||"", pass: localStorage.getItem('gPass')||"", 
                    iroCoin: iroCoins, location: "ホーム" 
                };
                fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
            } catch(e) { console.error("Sync Error", e); }
        }

        async function loadGachaUI() {
            document.getElementById('gameLayer').style.display = 'block';
            document.getElementById('mobilePauseBtn').style.display = 'flex';
            const res = await fetch(`${GAS_URL}?action=getGachaUI`);
            const data = await res.json();
            
            // ガチャ用グローバル変数を注入
            let injectedCode = `
                <script>
                    const USER_ID = "${myId}";
                    const GAS_URL = "${GAS_URL}";
                    let MY_COINS = ${iroCoins};
                    function syncToParent(newBalance) {
                        window.parent.postMessage({type: 'GACHA_SYNC', newBalance: newBalance}, '*');
                    }
                <\/script>
            ` + data.code;

            const frame = document.getElementById('gameFrame');
            frame.srcdoc = injectedCode;
        }

        async function loadGameList() {
            const container = document.getElementById('gameListContainer');
            container.innerHTML = "ロード中...";
            const res = await fetch(`${GAS_URL}?action=getList`);
            const games = await res.json();
            container.innerHTML = "";
            games.forEach(g => {
                const card = document.createElement('div');
                card.className = "nav-card"; card.style.width = "120px";
                card.onclick = () => launchGame(g.id);
                card.innerHTML = `<b>${g.title}</b>`;
                container.appendChild(card);
            });
        }

        function launchGame(id) {
            document.getElementById('gameLayer').style.display = 'block';
            document.getElementById('mobilePauseBtn').style.display = 'flex';
            fetch(`${GAS_URL}?action=getCode&row=${id}`).then(r => r.json()).then(data => {
                document.getElementById('gameFrame').srcdoc = data.code;
            });
        }

        function exitGame() {
            document.getElementById('gameLayer').style.display = 'none';
            document.getElementById('mobilePauseBtn').style.display = 'none';
            document.getElementById('gameFrame').srcdoc = "";
            fetchSync(); 
        }

        function saveSettings() {
            localStorage.setItem('gName', document.getElementById('nIn').value);
            localStorage.setItem('gPass', document.getElementById('pIn').value);
            document.getElementById('hName').innerText = document.getElementById('nIn').value;
            fetchSync(); closeAllSheets();
        }

        function uploadIcon(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    localStorage.setItem('gAv', e.target.result);
                    document.getElementById('hAv').src = e.target.result;
                    document.getElementById('mAv').src = e.target.result;
                    fetchSync();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function sendReq() {
            const tid = document.getElementById('fIdIn').value.toUpperCase();
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "request", targetId: tid, myId: myId }) });
            alert("申請しました");
        }
    </script>
</body>
</html>
