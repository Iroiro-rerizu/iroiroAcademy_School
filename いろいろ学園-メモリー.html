<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - FRIEND GIFT & FULLSCREEN STAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.85);
            --border: rgba(255, 255, 255, 0.4);
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        /* ポータル背景 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.6); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%); z-index: -1; }

        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        .btn-pro { background: #fff; color: #333; border: none; padding: 14px 45px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 6px 6px 0 var(--pro-teal); z-index: 500; font-family: inherit; margin: 10px; text-transform: uppercase; text-align: center; width: 240px; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); }
        .btn-pro:hover { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); background: var(--pro-teal); color: #fff; }
        .btn-pro.pink { box-shadow: 6px 6px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }

        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; padding: 5px 15px; background: rgba(0,0,0,0.6); border-left: 4px solid var(--pro-teal); backdrop-filter: blur(10px); z-index: 200; border-radius: 0 15px 15px 0; }
        .av-mini { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; }
        .iro-coin-disp { margin-left: 20px; font-weight: 900; color: var(--pro-teal); text-shadow: 0 0 10px var(--pro-teal); font-size: 1.1rem; }

        .nav-container { position: absolute; bottom: 30px; display: flex; gap: 12px; width: 95%; max-width: 1000px; z-index: 300; pointer-events: auto; }
        .nav-card { flex: 1; background: var(--glass); border: 1px solid var(--border); padding: 18px 5px; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(15px); font-weight: 900; font-size: 0.8rem; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 60px; }
        .nav-card.main { background: linear-gradient(to right, var(--pro-pink), #ff66cc); border: none; font-size: 1rem; flex: 1.8; }

        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 90%; background: #0a0b10; border-radius: 30px 30px 0 0; z-index: 50000; transition: 0.4s; overflow-y: auto; color: #fff; }
        .bottom-sheet.open { bottom: 0; }
        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 49999; display: none; backdrop-filter: blur(5px); }

        .friend-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 15px; margin-bottom: 10px; }
        .history-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; font-size: 0.8rem; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        #mobilePauseBtn { position: fixed; top: 15px; right: 15px; width: 45px; height: 45px; background: var(--glass); border: 1.5px solid #fff; border-radius: 50%; display: none; z-index: 15000; justify-content: center; align-items: center; font-weight: 900; cursor: pointer; color: #fff; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="sheetOverlay" class="sheet-overlay" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" onclick="showPauseMenu()">II</div>

    <div id="pauseOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20000; display:none; flex-direction:column; justify-content:center; align-items:center;">
        <h1 style="font-family: Montserrat; font-size: 4rem; color: var(--pro-teal); margin-bottom: 20px;">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開</span></button>
        <button class="btn-pro pink" onclick="exitGame()"><span>終了</span></button>
    </div>

    <!-- スクリーン1: タイトル -->
    <div id="titleScreen" class="screen">
        <h1 style="font-family: Montserrat; font-size: 6rem; margin: 0; text-shadow: 0 0 25px var(--pro-teal);">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: 900; color: var(--pro-pink); margin-bottom: 50px;">COLORFUL STAGE</p>
        <button class="btn-pro" onclick="startLoading()"><span>ログイン</span></button>
    </div>

    <!-- スクリーン2: ロード -->
    <div id="loadingScreen" class="screen hidden">
        <p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px; animation: flash 1.5s infinite alternate;">同期中...</p>
    </div>

    <!-- スクリーン3: ホーム -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.9rem; font-weight: 900;"><span id="hName">---</span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">---</span></div>
        </div>

        <div style="position:absolute; top:80px; left:20px; width:55px; height:55px; background:var(--glass); border-radius:50%; display:flex; justify-content:center; align-items:center; cursor:pointer; z-index:300; border:1.5px solid var(--border);" onclick="openSheet('sheetPresent')">🎁<div id="pBadge" style="position:absolute; top:0; right:0; width:20px; height:20px; background:red; border-radius:50%; border:2px solid #fff; font-size:0.7rem; display:none; justify-content:center; align-items:center; font-weight:bold;">0</div></div>

        <h2 style="font-size: 3.5rem; font-weight: 300; letter-spacing: 10px; opacity: 0.8; font-family: Montserrat;">MAIN CONSOLE</h2>
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="launchGachaUI()" style="border: 2px solid var(--pro-teal);">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">クエスト</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">学生証</div>
        </nav>
    </div>

    <!-- 各シート -->
    <div id="sheetPresent" class="bottom-sheet">
        <div style="padding: 30px;">
            <h2 style="color:var(--pro-teal); font-family: Montserrat;">PRESENTS</h2>
            <div id="pListContainer"></div>
            <h2 style="color:var(--pro-pink); font-family: Montserrat; margin-top:40px;">HISTORY</h2>
            <div id="historyContainer"></div>
        </div>
    </div>

    <div id="sheetConfig" class="bottom-sheet">
        <div style="padding: 30px; text-align: center;">
            <div style="background:#fff; color:#333; border-radius:10px; padding:20px; max-width:350px; margin:0 auto; text-align:left;">
                <h3>学生証</h3>
                <img id="mAv" style="width:90px; height:110px; border:2px solid #333; object-fit:cover; background:#eee;" src="" onclick="document.getElementById('fileIn').click()">
                <p>ID: <span id="myIdDisplay">---</span></p>
                <input type="text" id="nIn" style="width:100%; border:none; border-bottom:1px solid #333; padding:10px 0;" placeholder="名前">
                <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)">
            </div><br>
            <button class="btn-pro" onclick="saveSettings()"><span>保存して同期</span></button>
        </div>
    </div>

    <div id="sheetFriend" class="bottom-sheet">
        <div style="padding: 30px;">
            <h2 style="color:var(--pro-pink);">FRIENDS</h2>
            <div id="reqList" style="margin-bottom:20px;"></div>
            <div id="fList"></div>
            <div style="margin-top:30px;">
                <input type="text" id="fIdIn" placeholder="友達のIDを入力" style="width:60%; padding:12px; border-radius:10px; border:none;">
                <button class="btn-pro pink" style="width:auto; padding:12px 25px;" onclick="sendReq()"><span>申請</span></button>
            </div>
        </div>
    </div>

    <div id="questScreen" class="screen hidden">
        <h2 style="font-size: 3rem; color: var(--pro-teal);">QUEST SELECT</h2>
        <div id="gameListContainer" style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:20px; width:95%;"></div>
        <button class="btn-pro gray" onclick="transition('questScreen', 'gameScreen')">戻る</button>
    </div>

    <div id="gameLayer"><iframe id="gameFrame" src="about:blank"></iframe></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxiWu4njTDBxdNngNpaoL8jbkwqhVcEQtsAUMkcK8ql-AtTDJJlTwNihTRcMHmK1r3a/exec';
        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = parseInt(localStorage.getItem('gCoins')) || 0;
        let claimedPresents = [], firstSyncDone = false;

        function startLoading() { transition('titleScreen', 'loadingScreen'); setTimeout(() => { transition('loadingScreen', 'gameScreen'); initPortal(); }, 1500); }
        function transition(h, s) {
            const cur = document.getElementById(h); const nxt = document.getElementById(s);
            if(cur) { cur.classList.add('hidden'); setTimeout(() => cur.style.display = 'none', 600); }
            if(nxt) { nxt.style.display = 'flex'; setTimeout(() => nxt.classList.remove('hidden'), 50); }
        }

        function initPortal() {
            localStorage.setItem('gID', myId);
            document.getElementById('myIdDisplay').innerText = myId;
            document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
            fetchSync(); setInterval(fetchSync, 20000);
        }

        async function fetchSync() {
            if(!GAS_URL.includes('https')) return;
            try {
                const res = await fetch(GAS_URL + "?id=" + myId);
                const json = await res.json();
                if(json.result === "success") {
                    iroCoins = Number(json.iroCoin);
                    localStorage.setItem('gCoins', iroCoins);
                    document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                    claimedPresents = json.claimed ? json.claimed.split(',') : [];
                    document.getElementById('hName').innerText = json.name || "USER";
                    document.getElementById('hAv').src = json.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed="+myId;
                    updatePresentUI();
                    updateHistoryUI(json.history);
                    
                    // フレンドリスト構築
                    const fList = document.getElementById('fList');
                    fList.innerHTML = json.friends ? json.friends.split(',').map(fid => `
                        <div class="friend-item">
                            <span>${fid}</span>
                            <button class="btn-pro" style="width:auto; padding:5px 15px; margin:0; box-shadow:none; font-size:0.7rem; background:var(--pro-pink); color:#fff;" onclick="sendFriendGift('${fid}')">🎁 送る</button>
                        </div>`).join('') : "フレンドはいません";
                    
                    if(json.pending) document.getElementById('reqList').innerHTML = json.pending.split(',').map(id => `<div style="display:flex; justify-content:space-between; margin-bottom:5px; background:#fff; color:#333; padding:10px; border-radius:10px;"><span>${id}</span><button class="btn-pro" style="width:auto; padding:5px 15px; margin:0; box-shadow:none; font-size:0.7rem" onclick="acceptF('${id}')">承認</button></div>`).join('');
                    firstSyncDone = true;
                }
                if(firstSyncDone) {
                    await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "sync", id: myId, name: localStorage.getItem('gName')||"USER", iroCoin: iroCoins, avatar: localStorage.getItem('gAv')||"" }) });
                }
            } catch(e) {}
        }

        async function sendFriendGift(fid) {
            const amount = prompt("フレンドに送る「いろコイン」の枚数を入力してください", "100");
            if(!amount || isNaN(amount) || amount <= 0) return;
            const num = parseInt(amount);
            if(iroCoins < num) { alert("コインが足りません"); return; }
            
            if(confirm(`フレンド ${fid} に ${num} 枚プレゼントしますか？`)) {
                iroCoins -= num;
                document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "friendGift", fromId: myId, toId: fid, amount: num }) });
                alert("プレゼントを送りました！");
                fetchSync();
            }
        }

        async function updatePresentUI() {
            try {
                const res = await fetch(GAS_URL + "?action=getPresents");
                const all = await res.json();
                const container = document.getElementById('pListContainer');
                const available = all.filter(p => !claimedPresents.includes(p.id));
                document.getElementById('pBadge').innerText = available.length;
                document.getElementById('pBadge').style.display = available.length ? 'flex' : 'none';
                container.innerHTML = available.length ? "" : "受け取れるプレゼントはありません";
                available.forEach(p => {
                    const div = document.createElement('div'); div.className = 'present-item';
                    div.innerHTML = `<div><b>${p.name}</b><br><small>${p.desc}</small></div><button class="btn-pro" style="width:auto; padding:5px 15px;" onclick="claim('${p.id}','${p.type}',${p.amount},'${p.name}')">受取</button>`;
                    container.appendChild(div);
                });
            } catch(e) {}
        }

        async function claim(id, type, amount, name) {
            if(type === 'iroCoin') iroCoins += amount;
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "claim", userId: myId, presentId: id, newCoins: iroCoins, presentName: name }) });
            fetchSync();
        }

        async function launchGachaUI() {
            document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex';
            const [gDataRes, charPoolRes] = await Promise.all([ fetch(GAS_URL + "?action=getGachaSettings"), fetch(GAS_URL + "?action=getCharaPools") ]);
            const gData = await gDataRes.json(); const pools = await charPoolRes.json();
            const frame = document.getElementById('gameFrame');
            frame.srcdoc = `<!DOCTYPE html><html><head><style>body{background:#000;color:#fff;font-family:sans-serif;margin:0;overflow:hidden;}#bg{position:fixed;width:100%;height:100%;background:url('${gData[0].bg}') center/cover;transition:0.5s;filter:brightness(1.1);} .ui{position:relative;z-index:10;height:100vh;padding:30px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;background:linear-gradient(rgba(0,0,0,0.2),transparent,rgba(0,0,0,0.8));} .coin{background:rgba(0,0,0,0.6);padding:10px 25px;border-radius:30px;color:#33ffcc;border:1px solid #33ffcc;font-weight:bold;width:fit-content;} .pull-btn{background:linear-gradient(#ff88bb,#ff3399);padding:20px 40px;border-radius:15px;border:none;color:#fff;font-weight:bold;cursor:pointer;font-size:1.2rem;} #reveal{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1000;display:none;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;overflow:hidden;} .rev-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;animation:zoomIn 10s linear infinite;} .rev-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(transparent 60%,rgba(0,0,0,0.9));z-index:2;} .rev-content{position:relative;z-index:10;text-align:center;margin-top:auto;padding-bottom:80px;} .star-container{display:flex;justify-content:center;gap:15px;margin-bottom:10px;} .star{font-size:3.5rem;color:#ffcc00;text-shadow:0 0 10px #000;animation:starPop 0.4s forwards;opacity:0;} @keyframes starPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}} @keyframes zoomIn{from{transform:scale(1)}to{transform:scale(1.1)}}</style></head>
            <body><div id="bg"></div><div class="ui"><div class="coin">🪙 <span id="c">${iroCoins.toLocaleString()}</span></div><div style="margin-left:150px;margin-bottom:100px;"><h1>${gData[0].title}</h1><button class="pull-btn" onclick="startPull(10)">10回引く</button></div></div><div id="reveal" onclick="nextReveal()"><img id="rev-img" class="rev-img"><div class="rev-overlay"></div><div class="rev-content"><div id="rev-stars" class="star-container"></div><h1 id="rev-name" style="font-size:4rem;margin:0;"></h1><p>TAP TO NEXT</p></div></div>
            <script>let coins=${iroCoins};let pools=${JSON.stringify(pools)};let res=[],cur=0;function startPull(n){if(coins<3000){alert('不足');return;}coins-=3000;document.getElementById('c').innerText=coins.toLocaleString();window.parent.postMessage({type:'gachaPull',value:coins},'*');res=[];for(let i=0;i<n;i++){let s=(i===9)?(Math.random()<0.1?4:3):(Math.random()<0.03?4:Math.random()<0.15?3:2);const c=pools['star'+s][Math.floor(Math.random()*pools['star'+s].length)];res.push({...c,rank:s});}cur=0;show();}function show(){const c=res[cur];document.getElementById('reveal').style.display='flex';document.getElementById('rev-img').src=c.img;document.getElementById('rev-name').innerText=c.name;const b=document.getElementById('rev-stars');b.innerHTML='';for(let i=0;i<c.rank;i++){const s=document.createElement('div');s.className='star';s.innerText='★';s.style.animationDelay=(i*0.1)+'s';b.appendChild(s);}}function nextReveal(){cur++;if(cur<res.length)show();else document.getElementById('reveal').style.display='none';}<\/script></body></html>`;
        }

        window.addEventListener('message', e => { if(e.data.type === 'gachaPull') { iroCoins = e.data.value; localStorage.setItem('gCoins', iroCoins); document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString(); fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "gachaLog", userId: myId, newCoins: iroCoins }) }); } });
        function saveSettings() { localStorage.setItem('gName', document.getElementById('nIn').value); fetchSync(); closeAllSheets(); }
        function uploadIcon(input) { if (input.files && input.files[0]) { const reader = new FileReader(); reader.onload = e => { localStorage.setItem('gAv', e.target.result); document.getElementById('hAv').src = e.target.result; document.getElementById('mAv').src = e.target.result; fetchSync(); }; reader.readAsDataURL(input.files[0]); } }
        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }
        function showPauseMenu() { document.getElementById('pauseOverlay').style.display = 'flex'; }
        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { location.reload(); }
        async function loadGameList() { const res = await fetch(GAS_URL + "?action=getList"); const games = await res.json(); const container = document.getElementById('gameListContainer'); container.innerHTML = ""; games.forEach(g => { const card = document.createElement('div'); card.className = "nav-card"; card.style.width="160px"; card.innerHTML = `<b>${g.title}</b>`; card.onclick = () => launchGame(g.id); container.appendChild(card); }); }
        async function launchGame(id) { document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex'; const res = await fetch(GAS_URL+"?action=getCode&row="+id); const data = await res.json(); document.getElementById('gameFrame').srcdoc = data.code; }
        function updateHistoryUI(h) { document.getElementById('historyContainer').innerHTML = h ? h.map(x => `<div class="history-item"><span>${x.reason}</span><span style="color:${x.coin>=0?'#33ffcc':'#ff3399'}">${x.coin>=0?'+':''}${x.coin}</span></div>`).join('') : "履歴なし"; }
        async function sendReq() { const tid = document.getElementById('fIdIn').value.toUpperCase(); await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "request", myId: myId, targetId: tid }) }); alert("送信完了"); }
        async function acceptF(tid) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "accept", myId: myId, targetId: tid }) }); fetchSync(); }
    </script>
</body>
</html>
