<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - MOBILE OPTIMIZED STAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.85);
            --border: rgba(255, 255, 255, 0.4); --verify: #1da1f2;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.4); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.7) 100%); z-index: -1; }

        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; overflow: hidden; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        /* 装飾 */
        .char-original { position: absolute; width: clamp(60px, 15vw, 85px); height: auto; border-radius: 15px; border: 2px solid #fff; background: var(--glass); animation: float 3s infinite ease-in-out; z-index: 1; pointer-events: none; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* ボタンデザイン */
        .btn-pro { position: relative; background: #fff; color: #333; border: none; padding: 12px 30px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 5px 5px 0 var(--pro-teal); z-index: 1000; font-family: inherit; margin: 8px; text-transform: uppercase; text-align: center; width: min(280px, 80vw); pointer-events: auto; font-size: 1rem; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); }
        .btn-pro:hover { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); background: var(--pro-teal); color: #fff; }
        .btn-pro.pink { box-shadow: 5px 5px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }
        .btn-pro.gray { background: #444; color: #fff; box-shadow: 5px 5px 0 #222; }

        .badge-verify { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; background: linear-gradient(135deg, #1da1f2 0%, #0e71c8 100%); color: #fff; border-radius: 50%; font-size: 10px; margin-left: 5px; vertical-align: middle; box-shadow: 0 0 5px var(--verify); }

        /* ヘッダー */
        .header-minimal { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 8px; padding: 5px 12px; background: rgba(0,0,0,0.7); border-left: 4px solid var(--pro-teal); backdrop-filter: blur(10px); z-index: 200; border-radius: 0 10px 10px 0; max-width: 80%; }
        .av-mini { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #fff; overflow: hidden; background: #222; flex-shrink: 0; }
        .iro-coin-disp { margin-left: 10px; font-weight: 900; color: var(--pro-teal); font-size: 0.9rem; white-space: nowrap; }

        /* 下部ナビゲーション（スマホ対応） */
        .nav-container { position: absolute; bottom: 20px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: auto auto; gap: 8px; width: 92%; max-width: 1000px; z-index: 300; pointer-events: auto; }
        .nav-card { background: var(--glass); border: 1px solid var(--border); padding: 12px 5px; border-radius: 10px; cursor: pointer; text-align: center; backdrop-filter: blur(15px); font-weight: 900; font-size: 0.65rem; color: #fff; }
        .nav-card.main { grid-column: span 4; background: linear-gradient(to right, var(--pro-pink), #ff66cc); border: none; font-size: 1.1rem; padding: 15px; margin-bottom: 5px; box-shadow: 0 0 15px rgba(255,51,153,0.4); }

        .present-btn { position: absolute; top: 60px; left: 15px; width: 45px; height: 45px; background: var(--glass); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 300; border: 1px solid var(--border); font-size: 1.3rem; }
        .present-badge { position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; background: red; border-radius: 50%; border: 1.5px solid #fff; font-size: 0.6rem; display: none; justify-content: center; align-items: center; font-weight: bold; }

        /* ボトムシート */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 85%; background: #0a0b10; border-radius: 25px 25px 0 0; z-index: 50000; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); }
        .bottom-sheet.open { bottom: 0; }
        .sheet-content { padding: 20px 20px 100px; color: #fff; }

        /* メンバー・詳細 */
        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
        .member-card { position: relative; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 8px; border: 1px solid rgba(255,255,255,0.2); text-align: center; }
        .member-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 5px; border: 1px solid #fff; }
        .count-badge { position: absolute; top: -5px; right: -5px; background: var(--pro-pink); color: #fff; font-size: 0.6rem; padding: 2px 6px; border-radius: 8px; font-weight: bold; border: 1px solid #fff; }

        .detail-img { width: 100%; max-height: 50vh; object-fit: contain; background: #000; border-radius: 15px; border: 1px solid #fff; margin-bottom: 15px; }

        .friend-box { background: #f0f0f5; color: #333; padding: 12px; border-radius: 12px; margin-bottom: 15px; font-size: 0.8rem; }
        .student-id-card { background: #fff; color: #333; border-radius: 12px; padding: 15px; max-width: 90%; margin: 10px auto; text-align: left; }
        .student-input { background: none; border: none; border-bottom: 1px solid #333; width: 100%; font-size: 1rem; padding: 8px 0; margin-bottom: 10px; color:#000; font-family: inherit; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="sheetOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:49999;display:none;backdrop-filter:blur(5px);" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" style="display:none;" onclick="showPauseMenu()">II</div>

    <!-- ポーズメニュー -->
    <div id="pauseOverlay">
        <h1 style="font-family: Montserrat; font-size: 3rem; color: var(--pro-teal); margin-bottom: 20px;">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開</span></button>
        <button class="btn-pro pink" onclick="exitGame()"><span>終了</span></button>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <div class="char-original" style="left: 5%; top: 15%;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=A" style="width:100%"></div>
        <div class="char-original" style="right: 5%; top: 20%;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=B" style="width:100%"></div>
        <h1 style="font-family: Montserrat; font-size: clamp(3rem, 12vw, 6rem); margin: 0; text-shadow: 0 0 20px var(--pro-teal); pointer-events: none;">GENSOU</h1>
        <p style="letter-spacing: 5px; font-weight: 900; color: var(--pro-pink); margin-bottom: 40px; pointer-events: none; font-size: 0.8rem;">COLORFUL STAGE</p>
        <button class="btn-pro" onclick="startLoginProcess()"><span>ログイン</span></button>
        <button class="btn-pro pink" onclick="document.getElementById('modalTransfer').showModal()"><span>データ復元</span></button>
    </div>

    <!-- 新規登録 -->
    <div id="registrationScreen" class="screen hidden">
        <div class="student-id-card">
            <h3 style="margin:0 0 10px;">新規登録</h3>
            <input type="text" id="regName" class="student-input" placeholder="名前（公開）">
            <input type="password" id="regPass" class="student-input" placeholder="合言葉（復元用）">
            <p style="font-size:0.6rem; color:red;">※合言葉は忘れないようにしてください。</p>
        </div>
        <button class="btn-pro" onclick="saveRegistration()"><span>登録して開始</span></button>
    </div>

    <!-- 同期ロード -->
    <div id="loadingScreen" class="screen hidden"><p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px; animation: flash 1.5s infinite alternate;">同期中...</p></div>

    <!-- 3. ホーム画面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.8rem; font-weight: 900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"><span id="hName">---</span><span id="hVerified"></span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">---</span></div>
        </div>
        <div class="present-btn" onclick="openSheet('sheetPresent')">🎁<div id="pBadge" class="present-badge">0</div></div>
        
        <h2 style="font-size: clamp(1.5rem, 8vw, 3rem); font-weight: 300; letter-spacing: 5px; opacity: 0.6; font-family: Montserrat; pointer-events: none;">MAIN CONSOLE</h2>
        
        <nav class="nav-container">
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">クエスト・ゲーム選択</div>
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="launchGachaUI()">ガチャ</div>
            <div class="nav-card" onclick="openSheet('sheetMember')">メンバー</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定</div>
        </nav>
    </div>

    <!-- ボトムシート集 -->
    <div id="sheetMember" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">MY MEMBERS</h2><div id="memberListContainer" class="member-grid"></div></div></div>
    
    <div id="sheetMemberDetail" class="bottom-sheet">
        <div class="sheet-content" style="text-align: center;">
            <div id="memberDetailContent"></div>
            <div id="giftSelectionArea" style="display:none; margin-top:20px;">
                <h3 style="color:var(--pro-pink);">フレンドを選択</h3>
                <div id="giftFriendList" class="friend-box"></div>
            </div>
            <button class="btn-pro pink" id="startGiftBtn"><span>フレンドに贈る</span></button>
            <button class="btn-pro gray" onclick="closeSheet('sheetMemberDetail')"><span>とじる</span></button>
        </div>
    </div>

    <div id="sheetPresent" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">PRESENTS</h2><div id="pListContainer"></div><h2 style="color:var(--pro-pink); margin-top:30px;">HISTORY</h2><div id="historyContainer"></div></div></div>
    
    <div id="sheetConfig" class="bottom-sheet"><div class="sheet-content" style="text-align: center;"><div class="student-id-card"><h3>設定</h3><img id="mAv" style="width:80px;height:100px;border:2px solid #333;object-fit:cover;margin-bottom:10px;" onclick="document.getElementById('fileIn').click()"><p style="font-size:0.7rem;">ID: <span id="myIdDisplay">---</span></p><input type="text" id="nIn" placeholder="名前" class="student-input"><input type="password" id="pIn" placeholder="合言葉" class="student-input"><input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)"></div><button class="btn-pro" style="width:100%" onclick="saveSettings()"><span>保存して同期</span></button></div></div>
    
    <div id="sheetFriend" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-pink);">FRIENDS</h2><div id="reqList" class="friend-box"></div><div id="sentList" class="friend-box" style="font-size:0.7rem;"></div><div id="fList" class="friend-box"></div><div style="display:flex; gap:5px;"><input type="text" id="fIdIn" placeholder="10桁ID検索" style="flex-grow:1; padding:12px; border-radius:8px; border:none; color:#000;"><button class="btn-pro pink" style="width:auto; padding:0 20px; margin:0; box-shadow:none;" onclick="sendReq()"><span>申請</span></button></div></div></div>
    
    <div id="questScreen" class="screen hidden"><div id="gameListContainer" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:10px;"></div><button class="btn-pro gray" onclick="transition('questScreen', 'gameScreen')">戻る</button></div>
    
    <dialog id="modalTransfer" style="background:#111; color:#fff; border:none; border-radius:20px; padding:20px; width:85%; box-shadow: 0 0 30px rgba(255,51,153,0.5);"><h3 style="margin-top:0">データ復元</h3><input type="text" id="tIdIn" placeholder="ID" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px;"><input type="password" id="tPassIn" placeholder="合言葉" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px;"><button class="btn-pro pink" style="width:100%; margin:0;" onclick="executeTransfer()">復元実行</button><button class="btn-pro gray" style="width:100%; margin-top:10px;" onclick="this.closest('dialog').close()">キャンセル</button></dialog>

    <div id="gameLayer"><iframe id="gameFrame" src="about:blank"></iframe></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzxr7VfOdaqkV7Ex2C6P3l6kSxuUjchyRFQzvVnfrqUzWrQK3YFsnqouHoEYa0RBJ2D/exec';
        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = parseInt(localStorage.getItem('gCoins')) || 0;
        let myChars = "", globalCharaPool = {}, friendsData = [], claimedPresents = [], firstSyncDone = false;

        // --- ログイン・登録フロー ---
        async function startLoginProcess() {
            if(!localStorage.getItem('gName')) { transition('titleScreen', 'registrationScreen'); return; }
            beginSyncLoading();
        }
        async function saveRegistration() {
            const name = document.getElementById('regName').value;
            const pass = document.getElementById('regPass').value;
            if(!name || !pass) { alert("入力してください"); return; }
            localStorage.setItem('gName', name); localStorage.setItem('gPass', pass);
            beginSyncLoading();
        }
        async function beginSyncLoading() {
            transition('registrationScreen', 'loadingScreen');
            transition('titleScreen', 'loadingScreen');
            try { const cpRes = await fetch(GAS_URL + "?action=getCharaPools"); globalCharaPool = await cpRes.json(); } catch(e) {}
            const success = await fetchSync();
            if(success || !GAS_URL.includes('https')) {
                transition('loadingScreen', 'gameScreen');
                setInterval(fetchSync, 15000);
            } else { alert("同期失敗"); transition('loadingScreen', 'titleScreen'); }
        }

        // --- 同期 ---
        async function fetchSync() {
            if(!GAS_URL.includes('https')) return true;
            try {
                const res = await fetch(GAS_URL + "?id=" + myId);
                const json = await res.json();
                if(json.result === "success") {
                    iroCoins = Number(json.iroCoin); localStorage.setItem('gCoins', iroCoins);
                    document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                    myChars = json.chars || ""; claimedPresents = json.claimed ? json.claimed.split(',') : [];
                    friendsData = json.friendsData || [];
                    document.getElementById('hName').innerText = json.name || "USER";
                    document.getElementById('hVerified').innerHTML = json.isOfficial ? '<span class="badge-verify">✔</span>' : "";
                    const avUrl = json.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed="+myId;
                    document.getElementById('hAv').src = avUrl; document.getElementById('mAv').src = avUrl;
                    document.getElementById('myIdDisplay').innerText = myId;
                    document.getElementById('nIn').value = json.name || "";
                    document.getElementById('pIn').value = json.pass || "";
                    
                    updatePresentUI(json.pendingGifts); updateHistoryUI(json.history); renderMembers();
                    document.getElementById('reqList').innerHTML = json.pending ? json.pending.split(',').map(id => `<div class="friend-item" style="color:#333;"><span>${id}</span><button onclick="acceptF('${id}')">承認</button></div>`).join('') : "申請なし";
                    document.getElementById('fList').innerHTML = friendsData.length ? friendsData.map(f => `<div class="friend-item" style="color:#333;"><span>${f.name}${f.isOfficial?'✔':''}</span><div><button onclick="sendFriendGift('${f.id}')">🪙</button><button onclick="removeFriend('${f.id}')">×</button></div></div>`).join('') : "なし";
                    firstSyncDone = true;
                    // 保存
                    await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "sync", id: myId, name: document.getElementById('nIn').value||localStorage.getItem('gName'), pass: document.getElementById('pIn').value, iroCoin: iroCoins, chars: myChars, avatar: localStorage.getItem('gAv')||"" }) });
                    return true;
                }
            } catch(e) { return false; }
        }

        function renderMembers() {
            const container = document.getElementById('memberListContainer');
            if(!myChars) { container.innerHTML = "メンバーはいません。"; return; }
            const charArray = myChars.split(',').filter(n => n !== "");
            const counts = {}; charArray.forEach(name => { counts[name] = (counts[name] || 0) + 1; });
            const master = [...(globalCharaPool.star2||[]), ...(globalCharaPool.star3||[]), ...(globalCharaPool.star4||[])];
            container.innerHTML = Object.keys(counts).map(name => {
                const char = master.find(m => m.name === name);
                return char ? `<div class="member-card" onclick="showMemberDetail('${char.name}')"><div class="count-badge">x${counts[name]}</div><img src="${char.img}"><small>${char.name}</small></div>` : "";
            }).join('');
        }

        function showMemberDetail(name) {
            const master = [...(globalCharaPool.star2||[]), ...(globalCharaPool.star3||[]), ...(globalCharaPool.star4||[])];
            const char = master.find(m => m.name === name); if(!char) return;
            let stars = globalCharaPool.star4.some(c=>c.name===name) ? 4 : (globalCharaPool.star3.some(c=>c.name===name) ? 3 : 2);
            document.getElementById('memberDetailContent').innerHTML = `<div class="detail-card"><img src="${char.img}" class="detail-img"><div style="color:#ffcc00;font-size:1.2rem;">${'★'.repeat(stars)}</div><h2>${char.name}</h2></div>`;
            document.getElementById('giftSelectionArea').style.display = 'none';
            document.getElementById('startGiftBtn').style.display = 'inline-block';
            document.getElementById('startGiftBtn').onclick = () => {
                if(friendsData.length === 0) { alert("フレンドなし"); return; }
                document.getElementById('startGiftBtn').style.display = 'none';
                document.getElementById('giftFriendList').innerHTML = friendsData.map(f => `<div class="friend-item" style="color:#333;padding:10px;" onclick="executeMemberGift('${f.id}','${f.name}','${char.name}')"><span>${f.name}</span><span>贈る➔</span></div>`).join('');
                document.getElementById('giftSelectionArea').style.display = 'block';
            };
            openSheet('sheetMemberDetail');
        }

        async function executeMemberGift(targetId, targetName, charName) {
            if(confirm(`${targetName}さんに贈りますか？`)) {
                await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "friendMemberGift", fromId: myId, fromName: document.getElementById('hName').innerText, toId: targetId, charName: charName }) });
                alert("贈りました！"); closeSheet('sheetMemberDetail'); fetchSync();
            }
        }

        // --- ガチャ演出（スマホサイズ対応） ---
        async function launchGachaUI() {
            document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex';
            const [gDataRes, charPoolRes] = await Promise.all([ fetch(GAS_URL + "?action=getGachaSettings"), fetch(GAS_URL + "?action=getCharaPools") ]);
            const gData = await gDataRes.json(); const pools = await charPoolRes.json();
            document.getElementById('gameFrame').srcdoc = `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:#000;color:#fff;font-family:sans-serif;margin:0;overflow:hidden;}#bg{position:fixed;width:100%;height:100%;background:url('${gData[0].bg}') center/cover;transition:0.5s;filter:brightness(1.1);} .ui{position:relative;z-index:10;height:100vh;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;background:linear-gradient(rgba(0,0,0,0.2),transparent,rgba(0,0,0,0.9));} .coin{background:rgba(0,0,0,0.6);padding:8px 15px;border-radius:30px;color:#33ffcc;border:1px solid #33ffcc;font-weight:bold;width:fit-content;font-size:0.8rem;} .sidebar{position:absolute;left:10px;top:80px;display:flex;flex-direction:column;gap:8px;} .tab{width:80px;height:45px;background-size:cover;border:2px solid transparent;border-radius:8px;opacity:0.6;cursor:pointer;} .tab.active{border-color:#ffcc00;opacity:1;transform:translateX(5px);} .controls{display:flex;gap:10px;flex-direction:column;align-items:flex-end;margin-bottom:20px;} .pull-btn{width:160px;padding:12px;border-radius:15px;border:none;color:#fff;font-weight:bold;cursor:pointer;font-size:0.9rem;box-shadow:0 4px 0 rgba(0,0,0,0.3);} .b-1{background:#555;} .b-10{background:linear-gradient(#ff88bb,#ff3399);} .b-100{background:linear-gradient(#ffcc00,#ff6600);} .num-btn{width:25px;height:25px;border-radius:50%;border:none;background:#fff;font-weight:bold;} #reveal{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1000;display:none;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;overflow:hidden;} .rev-img{width:100%;height:100%;object-fit:contain;z-index:1;animation:zoomIn 10s linear infinite;} .rev-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(transparent 50%,rgba(0,0,0,0.9));z-index:2;} .rev-content{position:relative;z-index:10;text-align:center;margin-top:auto;padding-bottom:100px;} .star{font-size:3rem;color:#ffcc00;text-shadow:0 0 10px #000;animation:starPop 0.4s forwards;opacity:0;} @keyframes starPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}} @keyframes zoomIn{from{transform:scale(1)}to{transform:scale(1.05)}} #summary{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;} .summary-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:95%;overflow-y:auto;max-height:75vh;} .summary-card{width:60px;text-align:center;background:rgba(255,255,255,0.1);border-radius:5px;padding:5px;border:1px solid rgba(255,255,255,0.2);} .summary-card img{width:50px;height:65px;object-fit:cover;border-radius:3px;border:1px solid #fff;}</style></head>
            <body><div id="bg"></div><div class="ui"><div class="coin">🪙 <span id="c">${iroCoins.toLocaleString()}</span></div><div class="sidebar" id="sb"></div><div style="margin-left:100px;margin-bottom:100px;"><h1 id="tName" style="font-size:1.8rem;">${gData[0].title}</h1></div><div class="controls" id="btn-container"></div></div>
            <button style="position:fixed;top:20px;right:20px;z-index:3000;padding:8px 20px;background:rgba(255,255,255,0.2);border:1px solid #fff;border-radius:20px;color:#fff;display:none;" id="skip" onclick="skipReveal()">SKIP</button>
            <div id="reveal" onclick="nextReveal()"><img id="rev-img" class="rev-img"><div class="rev-overlay"></div><div class="rev-content"><div id="rev-stars" style="display:flex;justify-content:center;gap:10px;margin-bottom:10px;"></div><h2 style="font-size:2rem;margin:0;" id="rev-name"></h2><p style="font-size:0.7rem;">TAP TO NEXT</p></div></div>
            <div id="summary"><h2 style="margin-bottom:20px;font-size:1.2rem;">RESULT</h2><div id="sum-grid" class="summary-grid"></div><button onclick="document.getElementById('summary').style.display='none'" style="margin-top:15px;padding:10px 40px;border-radius:20px;border:none;font-weight:bold;">とじる</button></div>
            <script>let coins=${iroCoins};let pools=${JSON.stringify(globalCharaPool)};let gData=${JSON.stringify(gData)};let res=[],cur=0,custCount=1;
            function chgNum(v){ custCount=Math.max(1, custCount+v); document.getElementById('customNum').innerText=custCount; }
            function renderButtons(idx){
                const container = document.getElementById('btn-container'); container.innerHTML = '';
                const btns = gData[idx].buttons.split(',');
                btns.forEach(b => {
                    if(b==='1回') container.innerHTML += '<button class="pull-btn b-1" onclick="startPull(1)">1回引く</button>';
                    if(b==='10回') container.innerHTML += '<button class="pull-btn b-10" onclick="startPull(10)">10回引く</button>';
                    if(b==='100回') container.innerHTML += '<button class="pull-btn b-100" onclick="startPull(100)">100回引く</button>';
                    if(b==='カスタム') container.innerHTML += '<div style="background:rgba(0,0,0,0.8);padding:8px;border-radius:12px;display:flex;align-items:center;gap:5px;"><button class="num-btn" onclick="chgNum(-1)">-</button><span id="customNum" style="font-weight:bold;width:25px;text-align:center">1</span><button class="num-btn" onclick="chgNum(1)">+</button><button class="pull-btn" style="background:#33ffcc;color:#000;width:90px;margin:0;padding:8px;font-size:0.8rem;" onclick="startPull(custCount)">カスタム</button></div>';
                });
            }
            function startPull(n){const cost=n*300;if(coins<cost){alert('不足');return;}
            coins-=cost;document.getElementById('c').innerText=coins.toLocaleString();
            res=[]; let names=[]; let hasS4=false, hasS3=false;
            for(let i=0; i<n; i++){
                let s=2, r=Math.random()*100; if(r<3) s=4; else if(r<15) s=3;
                if(n>=100 && i===n-1 && !hasS4) s=4; else if(n>=10 && i===n-1 && !hasS3 && s<3) s=3;
                if(s>=4) hasS4=true; if(s>=3) hasS3=true;
                const pool = pools['star' + s]; const c=pool[Math.floor(Math.random()*pool.length)]; res.push({...c,rank:s}); names.push(c.name);
            }
            window.parent.postMessage({type:'gachaPull',value:coins,pulls:n,chars:names.join(',')},'*');
            cur=0; document.getElementById('skip').style.display='block'; show();}
            function show(){const c=res[cur];document.getElementById('reveal').style.display='flex';document.getElementById('rev-img').src=c.img;document.getElementById('rev-name').innerText=c.name;const b=document.getElementById('rev-stars');b.innerHTML='';for(let i=0;i<c.rank;i++){const s=document.createElement('div');s.className='star';s.innerText='★';s.style.animationDelay=(i*0.1)+'s';b.appendChild(s);}}
            function nextReveal(){cur++; if(cur<res.length) show(); else skipReveal();}
            function skipReveal(){ document.getElementById('reveal').style.display='none'; document.getElementById('skip').style.display='none'; const g=document.getElementById('sum-grid');g.innerHTML='';res.forEach(c=>{const d=document.createElement('div');d.className='summary-card';d.innerHTML='<img src="'+c.img+'"><br><small>'+'★'.repeat(c.rank)+'</small>';g.appendChild(d);});document.getElementById('summary').style.display='flex';}
            gData.forEach((g,i)=>{const d=document.createElement('div');d.className='tab'+(i===0?' active':'');d.style.backgroundImage='url('+g.thumbnail+')';d.onclick=()=>{document.getElementById('bg').style.backgroundImage='url('+g.bg+')';document.getElementById('tName').innerText=g.title;renderButtons(i);document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',i===idx));};document.getElementById('sb').appendChild(d);});renderButtons(0);<\/script></body></html>`;
        }

        // --- その他UI制御 ---
        window.addEventListener('message', e => { if(e.data.type === 'gachaPull') { iroCoins = e.data.value; localStorage.setItem('gCoins', iroCoins); document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString(); fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "gachaLog", userId: myId, newCoins: iroCoins, pulls: e.data.pulls, newChars: e.data.chars }) }); } });
        function saveSettings() { localStorage.setItem('gName', document.getElementById('nIn').value); localStorage.setItem('gPass', document.getElementById('pIn').value); fetchSync(); closeAllSheets(); }
        function uploadIcon(input) { if (input.files && input.files[0]) { const r = new FileReader(); r.onload = e => { localStorage.setItem('gAv', e.target.result); document.getElementById('hAv').src = e.target.result; fetchSync(); }; r.readAsDataURL(input.files[0]); } }
        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeSheet(id) { document.getElementById(id).classList.remove('open'); if(!document.querySelector('.bottom-sheet.open')) document.getElementById('sheetOverlay').style.display = 'none'; }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }
        function showPauseMenu() { document.getElementById('pauseOverlay').style.display = 'flex'; }
        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { location.reload(); }
        async function loadGameList() { const res = await fetch(GAS_URL + "?action=getList"); const games = await res.json(); const container = document.getElementById('gameListContainer'); container.innerHTML = ""; games.forEach(g => { const card = document.createElement('div'); card.className = "nav-card"; card.style.width="140px"; card.innerHTML = `<b>${g.title}</b>`; card.onclick = () => launchGame(g.id); container.appendChild(card); }); }
        async function launchGame(id) { document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex'; const res = await fetch(GAS_URL+"?action=getCode&row="+id); const data = await res.json(); document.getElementById('gameFrame').srcdoc = data.code; }
        function updateHistoryUI(h) { document.getElementById('historyContainer').innerHTML = h ? h.map(x => `<div class="history-item"><span>${x.reason}</span><span>${x.coin>=0?'+':''}${x.coin}</span></div>`).join('') : "なし"; }
        async function sendReq() { const tid = document.getElementById('fIdIn').value.toUpperCase(); if(tid===myId) return; await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "request", myId: myId, targetId: tid }) }); alert("送信完了"); fetchSync(); }
        async function acceptF(tid) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "accept", myId: myId, targetId: tid }) }); fetchSync(); }
        async function removeFriend(fid) { if(confirm("解除?")){ await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "removeFriend", myId: myId, targetId: fid }) }); fetchSync(); } }
        async function sendFriendGift(fid) { const amount = prompt("枚数", "100"); if(!amount || iroCoins < amount) return; iroCoins -= parseInt(amount); await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "friendGift", fromId: myId, fromName: document.getElementById('hName').innerText, toId: fid, amount: amount }) }); fetchSync(); }
        async function claim(rowId, type, content, name) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "claim", userId: myId, giftRow: rowId }) }); alert(`受取完了`); fetchSync(); }
        function updatePresentUI(pendingGifts) { const c = document.getElementById('pListContainer'); if(!pendingGifts || pendingGifts.length === 0) { c.innerHTML = "なし"; document.getElementById('pBadge').style.display = 'none'; return; } document.getElementById('pBadge').innerText = pendingGifts.length; document.getElementById('pBadge').style.display = 'flex'; c.innerHTML = pendingGifts.map(p => `<div class="present-item"><b>${p.name}</b><button onclick="claim(${p.row},'${p.type}','${p.content}','${p.name}')">受取</button></div>`).join(''); }
        async function executeTransfer() { const id = document.getElementById('tIdIn').value.toUpperCase(); const ps = document.getElementById('tPassIn').value; const res = await fetch(GAS_URL + "?id=" + id); const json = await res.json(); if(json.result === "success" && String(json.pass) === String(ps)) { localStorage.setItem('gID', id); location.reload(); } else { alert("失敗"); } }
    </script>
</body>
</html>
