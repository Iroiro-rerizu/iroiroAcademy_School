<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - 究極統合フルコード版</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --pro-blue: #00ccff;
            --glass: rgba(0, 0, 0, 0.7); --border: rgba(255, 255, 255, 0.3);
            --online: #00ff88; --offline: #888;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; }
        
        /* 背景 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.6); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.5) 100%); z-index: -1; }

        /* スクリーン */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; pointer-events: auto; }
        .hidden { display: none !important; opacity: 0; pointer-events: none !important; }

        /* 元々のキャラクター配置 (50, 200, 350) */
        .char-original { position: absolute; width: 80px; height: 80px; border-radius: 20px; border: 2.5px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: bounce 2s infinite ease-in-out; pointer-events: none; z-index: 1; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* ボタン */
        .btn-pro { background: #fff; color: #333; border: none; padding: 15px 50px; border-radius: 5px; font-weight: 900; cursor: pointer; transition: 0.3s; transform: skewX(-10deg); box-shadow: 4px 4px 0 var(--pro-teal); z-index: 500; font-family: inherit; }
        .btn-pro:hover { transform: skewX(-10deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); background: var(--pro-teal); color: #fff; }
        .btn-pro.pink { box-shadow: 4px 4px 0 var(--pro-pink); }
        .btn-pro.gray { box-shadow: 4px 4px 0 #666; background: #444; color: #fff; }

        /* ヘッダー */
        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; padding: 5px 12px; background: rgba(0,0,0,0.6); border-left: 4px solid var(--pro-teal); backdrop-filter: blur(10px); z-index: 200; border-radius: 5px; }
        .av-mini { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #fff; overflow: hidden; background: #222; }

        /* ナビゲーション */
        .nav-container { position: absolute; bottom: 30px; display: flex; gap: 10px; width: 95%; max-width: 900px; z-index: 200; }
        .nav-card { flex: 1; background: var(--glass); border: 1px solid var(--border); padding: 15px 5px; border-radius: 10px; cursor: pointer; transition: 0.3s; text-align: center; backdrop-filter: blur(15px); font-weight: bold; font-size: 0.75rem; }
        .nav-card:hover { background: var(--pro-teal); color: #000; transform: translateY(-10px); }
        .nav-card.main { background: var(--pro-pink); border: none; font-size: 1.1rem; flex: 1.5; color: #fff; }

        /* 待機ロビー */
        .slot { width: 140px; height: 180px; background: var(--glass); border: 2px solid var(--border); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
        .slot img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; margin-bottom: 10px; }

        /* カウントダウン */
        #countOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 20000; background: rgba(0,0,0,0.3); pointer-events: none; }
        .count-text { font-family: Montserrat; font-size: 15rem; font-weight: 900; color: #fff; text-shadow: 0 0 50px var(--pro-teal); }

        /* ゲーム表示 */
        #gameLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        #pauseOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 20000; }

        dialog { background: #fff; color: #333; border: none; padding: 30px; border-radius: 20px; width: 380px; z-index: 50000; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .list-box { background: #f5f5f5; border-radius: 15px; height: 150px; overflow-y: auto; padding: 10px; margin-bottom: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>

    <div id="countOverlay"><div id="countNum" class="count-text">3</div></div>

    <!-- ポーズメニュー -->
    <div id="pauseOverlay">
        <h1 style="font-family: Montserrat; font-size: 5rem; color: var(--pro-teal);">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()">再開する</button>
        <button class="btn-pro gray" style="margin-top:20px;" onclick="exitGame()">終了する</button>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <div class="char-original" style="left: 50px; top: 300px;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=A" style="width:100%"></div>
        <div class="char-original" style="left: 200px; top: 300px; animation-delay: 0.2s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=B" style="width:100%"></div>
        <div class="char-original" style="left: 350px; top: 300px; animation-delay: 0.4s;"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=C" style="width:100%"></div>
        <h1 style="font-family: Montserrat; font-size: 5.5rem; margin: 0; letter-spacing: -3px; text-shadow: 0 0 20px var(--pro-teal);">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: bold; color: var(--pro-pink); margin-bottom: 50px;">COLORFUL STAGE</p>
        <button id="loginBtn" class="btn-pro" onclick="transition('titleScreen', 'loadingScreen')">システムログイン</button>
    </div>

    <!-- 2. ロード -->
    <div id="loadingScreen" class="screen hidden">
        <p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px;">セカイを同期中...</p>
    </div>

    <!-- 3. ホーム -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.8rem; font-weight: bold;"><span id="hName">---</span></div>
        </div>
        <h2 style="font-size: 2.5rem; font-weight: 300; letter-spacing: 5px;">MAIN CONSOLE</h2>
        <nav class="nav-container">
            <div class="nav-card" onclick="openBox('modalFriend')">フレンド</div>
            <div class="nav-card" onclick="openBox('modalGacha')">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">ゲーム選択</div>
            <div class="nav-card" onclick="alert('メンバー未実装')">メンバー</div>
            <div class="nav-card" onclick="openBox('modalConfig')">設定</div>
        </nav>
    </div>

    <!-- 4. ゲーム選択 -->
    <div id="questScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; font-size: 3rem;">SELECT GAME</h2>
        <div id="gameListContainer" class="lobby-grid" style="flex-wrap:wrap; justify-content:center; max-height:50vh; overflow-y:auto; width:90%;"></div>
        <button class="btn-pro gray" style="margin-top:40px;" onclick="closeQuest()">戻る</button>
    </div>

    <!-- 5. 待機ロビー -->
    <div id="lobbyScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; font-size: 2rem;">ROOM: <span id="lobbyRoomId" style="color:var(--pro-teal);">----</span></h2>
        <div style="display:flex; gap:15px; margin-top:30px;" id="lobbyMembers">
            <div class="slot" id="slot0">待機中</div><div class="slot" id="slot1">待機中</div>
            <div class="slot" id="slot2">待機中</div><div class="slot" id="slot3">待機中</div>
        </div>
        <button id="startBtn" class="btn-pro" style="display:none; background: var(--pro-teal); margin-top:40px;" onclick="hostSignalStart()">開始！</button>
    </div>

    <!-- 6. ゲームレイヤー -->
    <div id="gameLayer">
        <iframe id="gameFrame" src="about:blank"></iframe>
    </div>

    <!-- 各種ダイアログ -->
    <dialog id="modalConfig"><h2>設定</h2>名前:<input type="text" id="nIn"> アイコン:<input type="file" id="fileIn" accept="image/*" onchange="uploadIcon(this)"><button class="btn-pro" style="width:100%;" onclick="saveSettings()">保存</button></dialog>
    <dialog id="modalFriend"><h2>フレンド</h2><div id="fList" class="list-box"></div><input type="text" id="fIdIn" placeholder="ID検索"><button class="btn-pro" onclick="sendReq()">申請</button><button class="btn-pro gray" style="width:100%; margin-top:5px;" onclick="this.closest('dialog').close()">とじる</button></dialog>
    <dialog id="modalGacha"><h2>ガチャ</h2>準備中...<button class="btn-pro" onclick="this.closest('dialog').close()">とじる</button></dialog>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzaAZNIDfKCm9wJQerECcgnD8elg_o_DKJrA47h1nSeS9PqJnXjpett8sSOLass9vOt/exec';
        let myId = "", roomId = "", isHost = false, isSyncing = false, currentGameRow = "";

        function transition(h, s) {
            const cur = document.getElementById(h); const nxt = document.getElementById(s);
            if(cur) { cur.classList.add('hidden'); setTimeout(() => { cur.style.display = 'none'; }, 600); }
            if(nxt) { nxt.style.display = 'flex'; setTimeout(() => { nxt.classList.remove('hidden'); }, 50); }
            if(s === 'loadingScreen') setTimeout(() => { transition('loadingScreen', 'gameScreen'); initPortal(); }, 1500);
        }
        function openBox(id) { document.getElementById(id).showModal(); }
        function closeQuest() { transition('questScreen', 'gameScreen'); }

        function initPortal() {
            if(!localStorage.getItem('gID')) localStorage.setItem('gID', Math.random().toString(36).substring(2, 12).toUpperCase());
            myId = localStorage.getItem('gID');
            document.getElementById('hName').innerText = localStorage.getItem('gName') || "USER";
            document.getElementById('hAv').src = localStorage.getItem('gAv') || "https://api.dicebear.com/7.x/avataaars/svg?seed=" + myId;
            if(!isSyncing) { isSyncing = true; setInterval(fetchData, 5000); fetchData(); }
        }

        async function loadGameList() {
            const container = document.getElementById('gameListContainer');
            container.innerHTML = "読込中...";
            const res = await fetch(`${GAS_URL}?action=getList`);
            const games = await res.json();
            container.innerHTML = "";
            games.forEach(g => {
                const card = document.createElement('div');
                card.className = "nav-card";
                card.style.width = "180px";
                card.onclick = () => { roomId = Math.floor(1000 + Math.random() * 9000).toString(); isHost = true; currentGameRow = g.id; enterLobby(); };
                card.innerHTML = `<h3>${g.title}</h3><p style="font-size:0.6rem;">${g.desc}</p>`;
                container.appendChild(card);
            });
        }

        function enterLobby() {
            transition('questScreen', 'lobbyScreen');
            document.getElementById('lobbyRoomId').innerText = roomId;
            if(isHost) document.getElementById('startBtn').style.display = 'block';
        }

        async function fetchData() {
            if(!GAS_URL.includes('https')) return;
            const syncData = { type: "sync", id: myId, name: localStorage.getItem('gName'), location: roomId !== "" ? "Lobby" : "Home", roomId: roomId };
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(syncData) });

            if(roomId !== "") {
                const rRes = await fetch(GAS_URL + "?roomId=" + roomId);
                const rJson = await rRes.json();
                const members = rJson.members || [];
                // ホストがゲームを開始したかチェック
                let startSignal = members.find(m => m.location.startsWith("START:"));
                if(startSignal && document.getElementById('gameLayer').style.display !== 'block') {
                    currentGameRow = startSignal.location.split(':')[1];
                    startGlobalCountdown();
                }
                for(let i=0; i<4; i++) {
                    const slot = document.getElementById('slot' + i);
                    if(members[i]) slot.innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${members[i].id}" style="width:50px;"><br>${members[i].name}`;
                    else slot.innerHTML = "待機中";
                }
            }
        }

        function hostSignalStart() {
            const syncData = { type: "sync", id: myId, name: localStorage.getItem('gName'), location: "START:" + currentGameRow, roomId: roomId };
            fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(syncData) });
            startGlobalCountdown();
        }

        function startGlobalCountdown() {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('countOverlay').style.display = 'flex';
            let time = 3; const countNum = document.getElementById('countNum');
            const timer = setInterval(() => {
                time--;
                if(time > 0) countNum.innerText = time;
                else if(time === 0) countNum.innerText = "GO!";
                else { clearInterval(timer); document.getElementById('countOverlay').style.display = 'none'; launchGame(); }
            }, 1000);
        }

        async function launchGame() {
            document.getElementById('gameLayer').style.display = 'block';
            const res = await fetch(`${GAS_URL}?action=getCode&row=${currentGameRow}`);
            const data = await res.json();
            document.getElementById('gameFrame').srcdoc = data.code;
            setTimeout(() => document.getElementById('gameFrame').contentWindow.focus(), 500);
        }

        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { document.getElementById('pauseOverlay').style.display = 'none'; document.getElementById('gameLayer').style.display = 'none'; document.getElementById('gameFrame').srcdoc = ""; transition('titleScreen', 'gameScreen'); }

        window.addEventListener('keydown', e => {
            if (e.key === "Escape" && document.getElementById('gameLayer').style.display === 'block') {
                document.getElementById('pauseOverlay').style.display = 'flex';
            }
        });

        function saveSettings() {
            localStorage.setItem('gName', document.getElementById('nIn').value);
            document.getElementById('hName').innerText = document.getElementById('nIn').value;
            document.getElementById('modalConfig').close();
        }

        function uploadIcon(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    localStorage.setItem('gAv', e.target.result);
                    document.getElementById('hAv').src = e.target.result;
                    document.getElementById('mAv').src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
