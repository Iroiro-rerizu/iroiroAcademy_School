<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - ULTIMATE INTEGRATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.85);
            --border: rgba(255, 255, 255, 0.2); --verify: #1da1f2;
            --gold: #ffcc00; --bg-dark: #0a0b12;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        /* 背景装飾 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.4); pointer-events: none; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, #000 100%); z-index: -1; pointer-events: none; }

        /* スクリーン管理 */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; box-sizing: border-box; padding: 20px; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        /* 装飾 */
        .btn-pro { position: relative; background: #fff; color: #111; border: none; padding: 18px 40px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 6px 6px 0 var(--pro-teal); z-index: 1000; font-family: 'Montserrat', sans-serif; margin: 12px; text-transform: uppercase; text-align: center; width: 85%; max-width: 300px; font-size: 1.1rem; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); pointer-events: none; }
        .btn-pro:active { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); }
        .btn-pro.pink { box-shadow: 6px 6px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }

        /* ヘッダー */
        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; z-index: 200; background: var(--glass); padding: 8px 15px; border-radius: 50px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .av-mini { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; }
        .iro-coin-disp { margin-left: 10px; font-weight: 900; color: var(--pro-teal); font-family: 'Montserrat'; font-size: 1.1rem; }

        /* メインナビ */
        .nav-container { position: absolute; bottom: 25px; display: flex; gap: 10px; width: 95%; max-width: 900px; z-index: 300; justify-content: center; }
        .nav-card { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 20px 5px; border-radius: 12px; cursor: pointer; text-align: center; font-weight: 900; font-size: 0.8rem; transition: 0.2s; backdrop-filter: blur(10px); }
        .nav-card:active { transform: scale(0.95); background: var(--pro-teal); color: #000; }
        .nav-card.main { background: var(--pro-pink); border: none; box-shadow: 0 0 20px rgba(255,51,153,0.4); }

        /* ボトムシート */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 94%; background: var(--bg-dark); border-radius: 30px 30px 0 0; z-index: 50000; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; color: #fff; border-top: 2px solid var(--pro-teal); }
        .bottom-sheet.open { bottom: 0; }
        .sheet-content { padding: 30px; padding-bottom: 120px; max-width: 800px; margin: 0 auto; }

        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; }
        .member-card { position: relative; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; border: 1px solid var(--border); text-align: center; cursor: pointer; }
        .member-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; }
        .count-badge { position: absolute; top: 5px; right: 5px; background: var(--pro-pink); color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; border: 1px solid #fff; z-index: 10; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }

        /* フォーム系 */
        .student-id-card { background: #fff; color: #333; border-radius: 15px; padding: 25px; border: 3px solid #555; max-width: 350px; margin: 20px auto; text-align: left; }
        .student-input { background: none; border: none; border-bottom: 2px solid #333; width: 100%; font-size: 1.2rem; padding: 10px 0; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="sheetOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:49000;display:none;backdrop-filter:blur(5px);" onclick="closeAllSheets()"></div>

    <!-- ポーズ/終了メニュー -->
    <div id="pauseOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:60000;display:none;flex-direction:column;justify-content:center;align-items:center;">
        <h1 style="font-family: Montserrat; font-size: 3rem; color: var(--pro-teal); margin-bottom: 30px;">MENU</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開する</span></button>
        <button class="btn-pro pink" onclick="exitGame()"><span>タイトルへ</span></button>
    </div>

    <!-- 1. タイトル画面 -->
    <div id="titleScreen" class="screen">
        <h1 style="font-family: Montserrat; font-size: clamp(3rem, 15vw, 7rem); margin: 0; text-shadow: 0 0 30px var(--pro-teal); letter-spacing: -2px;">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: 900; color: var(--pro-pink); margin-bottom: 50px; font-size: 1.1rem;">COLORFUL STAGE</p>
        <button class="btn-pro" onclick="handleLoginClick()"><span>START</span></button>
    </div>

    <!-- 2. 新規登録画面 -->
    <div id="registrationScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; color: var(--pro-teal);">USER SETUP</h2>
        <div class="student-id-card">
            <h3 style="margin:0 0 15px 0;">プロフィール作成</h3>
            <input type="text" id="regName" class="student-input" placeholder="名前を入力">
            <input type="password" id="regPass" class="student-input" placeholder="合言葉（復元用）">
        </div>
        <button class="btn-pro pink" onclick="saveRegistration()"><span>作成して開始</span></button>
    </div>

    <!-- 3. ホーム画面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.9rem; font-weight: 900;"><span id="hName">---</span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">0</span></div>
        </div>
        
        <h1 style="font-family: 'Montserrat'; font-size: 5rem; opacity: 0.05; position: absolute; pointer-events: none; letter-spacing: 10px;">DASHBOARD</h1>
        
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card main" onclick="launchGachaUI()">ガチャ</div>
            <div class="nav-card" onclick="openSheet('sheetMember')">メンバー</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定</div>
        </nav>
    </div>

    <!-- 各ボトムシート -->
    <div id="sheetMember" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">MY MEMBERS</h2><div id="memberListContainer" class="member-grid"></div></div></div>
    
    <div id="sheetConfig" class="bottom-sheet">
        <div class="sheet-content" style="text-align: center;">
            <h2 style="font-family: Montserrat;">CONFIG</h2>
            <div class="student-id-card">
                <img id="mAv" style="width:100px;height:100px;border-radius:50%;border:3px solid #333;object-fit:cover;cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)">
                <input type="text" id="nIn" placeholder="名前" class="student-input">
                <p style="font-size:0.7rem; color:#888;">ID: <span id="myIdDisplay">---</span></p>
            </div>
            <button class="btn-pro" onclick="saveSettings()"><span>保存</span></button>
        </div>
    </div>

    <div id="sheetFriend" class="bottom-sheet">
        <div class="sheet-content">
            <h2 style="color:var(--pro-pink); font-family: Montserrat;">FRIENDS</h2>
            <div id="fList" style="background:rgba(255,255,255,0.05); border-radius:15px; padding:15px; min-height:100px; color:#ccc;">フレンドはいません</div>
            <br>
            <input type="text" id="fIdIn" placeholder="IDで検索" style="width:60%; padding:15px; border-radius:10px; border:none; background:#222; color:#fff;">
            <button class="btn-pro pink" style="width:auto; padding:12px 25px;" onclick="alert('申請を送りました（モック機能）')"><span>申請</span></button>
        </div>
    </div>

    <!-- ゲーム/ガチャレイヤー -->
    <div id="gameLayer">
        <div style="position:fixed;top:15px;right:15px;width:45px;height:45px;background:rgba(0,0,0,0.6);border:2px solid #fff;border-radius:50%;display:flex;z-index:20000;justify-content:center;align-items:center;font-weight:900;cursor:pointer;" onclick="showPauseMenu()">II</div>
        <iframe id="gameFrame" src="about:blank"></iframe>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyIWr5MlPOhSDmYxPrFCI25a6g_Vz1u557ZSCtovj-rSdt1vw1X3_CrBk1EF6uZD9cd/exec';
        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = parseInt(localStorage.getItem('gCoins')) || 50000;
        let myChars = localStorage.getItem('gChars') || ""; 
        let globalCharaPool = {};

        // --- 初期化 & 画面遷移 ---
        function handleLoginClick() {
            if(!localStorage.getItem('gName')) transition('titleScreen', 'registrationScreen');
            else {
                transition('titleScreen', 'gameScreen');
                syncUI();
                fetchPools();
            }
        }

        function saveRegistration() {
            const name = document.getElementById('regName').value.trim();
            if(!name) { alert("名前を入力してください"); return; }
            localStorage.setItem('gName', name);
            localStorage.setItem('gID', myId);
            transition('registrationScreen', 'gameScreen');
            syncUI();
            fetchPools();
        }

        function syncUI() {
            document.getElementById('hName').innerText = localStorage.getItem('gName');
            document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
            document.getElementById('myIdDisplay').innerText = myId;
            document.getElementById('nIn').value = localStorage.getItem('gName');
            const av = localStorage.getItem('gAv') || "https://api.dicebear.com/7.x/avataaars/svg?seed="+myId;
            document.getElementById('hAv').src = av;
            document.getElementById('mAv').src = av;
            renderMembers();
        }

        function transition(h, s) { 
            const cur = document.getElementById(h);
            const nxt = document.getElementById(s);
            cur.classList.add('hidden');
            setTimeout(() => { cur.style.display = 'none'; nxt.style.display = 'flex'; }, 400);
            setTimeout(() => nxt.classList.remove('hidden'), 450); 
        }

        // --- メンバー管理 ---
        function renderMembers() {
            const container = document.getElementById('memberListContainer');
            if(!myChars) { container.innerHTML = "<p>メンバーがいません</p>"; return; }
            const charArray = myChars.split(',').filter(n => n !== "");
            const counts = {};
            charArray.forEach(n => counts[n] = (counts[n] || 0) + 1);
            
            // 本来はマスターデータから画像を取得するが、ここでは簡易的に生成
            container.innerHTML = Object.keys(counts).map(name => `
                <div class="member-card">
                    <div class="count-badge">x${counts[name]}</div>
                    <img src="https://picsum.photos/200/300?seed=${name}">
                    <small style="display:block;margin-top:5px;font-size:0.7rem;">${name}</small>
                </div>
            `).join('');
        }

        // --- ガチャロジック ---
        async function fetchPools() {
            try {
                const res = await fetch(GAS_URL + "?action=getCharaPools");
                globalCharaPool = await res.json();
            } catch(e) {
                // ダミーデータ
                globalCharaPool = {
                    star2: [{name:"サトシ", img:"https://picsum.photos/200/300?1"}, {name:"カスミ", img:"https://picsum.photos/200/300?2"}],
                    star3: [{name:"タケシ", img:"https://picsum.photos/200/300?3"}, {name:"シゲル", img:"https://picsum.photos/200/300?4"}],
                    star4: [{name:"伝説の勇者", img:"https://picsum.photos/200/300?5"}, {name:"神龍", img:"https://picsum.photos/200/300?6"}]
                };
            }
        }

        function launchGachaUI() {
            document.getElementById('gameLayer').style.display='block';
            document.getElementById('gameFrame').srcdoc = `
            <!DOCTYPE html><html><head><style>
                body{background:#000;color:#fff;font-family:sans-serif;margin:0;overflow:hidden;}
                .ui{height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:40px;box-sizing:border-box;background:linear-gradient(transparent,#000),url('https://images.unsplash.com/photo-1533107862482-0e6974b06ec4?auto=format&fit=crop&q=80&w=2000') center/cover;}
                .coin-box{position:absolute;top:30px;left:30px;background:rgba(0,0,0,0.8);padding:10px 25px;border-radius:50px;border:2px solid #33ffcc;font-weight:bold;}
                .controls{display:flex;gap:15px;justify-content:center;}
                .pull-btn{position:relative;width:180px;padding:20px;border-radius:10px;border:none;color:#fff;font-weight:900;cursor:pointer;transform:skewX(-15deg);transition:0.2s;}
                .b-1{background:#444;} .b-10{background:linear-gradient(45deg,#ff3399,#ff88bb);} .b-100{background:linear-gradient(45deg,#ffcc00,#ff6600);color:#000;}
                .tag{position:absolute;top:-10px;left:0;background:#fff;color:#ff3399;padding:2px 8px;font-size:0.6rem;transform:skewX(15deg);border-radius:4px;}
                #reveal{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1000;display:none;flex-direction:column;justify-content:center;align-items:center;background:#000;cursor:pointer;}
                .rev-img{width:100%;height:100%;object-fit:contain;animation:zoomIn 10s linear;}
                @keyframes zoomIn{from{transform:scale(1)}to{transform:scale(1.2)}}
                #summary{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;}
                .summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-height:60vh;overflow-y:auto;padding:20px;}
                .card{width:60px;background:#222;border-radius:8px;padding:5px;border:1px solid #444;text-align:center;}
                .card img{width:100%;border-radius:4px;}
                .s4{border-color:#ffcc00;box-shadow:0 0 10px #ffcc00;}
            </style></head>
            <body>
                <div class="coin-box">🪙 <span id="c">${iroCoins.toLocaleString()}</span></div>
                <div class="ui">
                    <h1 style="font-size:2.5rem;margin-bottom:auto;padding-top:60px;">幻想フェスティバル</h1>
                    <div class="controls">
                        <button class="pull-btn b-1" onclick="startPull(1)"><span>1回引く<br><small>300 🪙</small></span></button>
                        <button class="pull-btn b-10" onclick="startPull(10)"><div class="tag">★3以上確定</div><span>10回引く<br><small>3000 🪙</small></span></button>
                        <button class="pull-btn b-100" onclick="startPull(100)"><div class="tag">★4確定</div><span>100回引く<br><small>30000 🪙</small></span></button>
                    </div>
                </div>
                <div id="reveal" onclick="nextReveal()"><img id="rev-img" class="rev-img"><div style="position:absolute;bottom:80px;text-align:center;">
                    <div id="rev-stars" style="color:#ffcc00;font-size:2rem;"></div><h2 id="rev-name" style="font-size:2.5rem;margin:0;"></h2>
                </div></div>
                <div id="summary"><h2>GACHA RESULT</h2><div id="sum-grid" class="summary-grid"></div><button onclick="location.reload()" style="padding:15px 60px;border-radius:50px;border:none;background:#33ffcc;font-weight:bold;margin-top:20px;cursor:pointer;">OK</button></div>
                <script>
                    let coins = ${iroCoins};
                    let pools = ${JSON.stringify(globalCharaPool)};
                    let results = [], cur = 0;
                    function startPull(n){
                        const cost = n*300; if(coins<cost){alert("不足");return;}
                        coins-=cost; document.getElementById('c').innerText=coins.toLocaleString();
                        results = []; let hasS3=false, hasS4=false;
                        for(let i=0;i<n;i++){
                            let r=Math.random()*100, rank=2;
                            if(r<3.5)rank=4; else if(r<16)rank=3;
                            // 確定ロジック
                            if(n===100 && i===n-1 && !hasS4) rank=4;
                            else if(n===10 && i===n-1 && !hasS3) rank=3;
                            if(rank>=4){hasS4=true; hasS3=true;} if(rank>=3)hasS3=true;
                            const p=pools['star'+rank]||pools['star2'];
                            const c=p[Math.floor(Math.random()*p.length)];
                            results.push({...c,rank:rank});
                        }
                        window.parent.postMessage({type:'gachaPull', value:coins, chars:results.map(r=>r.name).join(',')}, '*');
                        cur=0; document.getElementById('reveal').style.display='flex'; updateReveal();
                    }
                    function updateReveal(){
                        const item=results[cur]; document.getElementById('rev-img').src=item.img;
                        document.getElementById('rev-name').innerText=item.name;
                        document.getElementById('rev-stars').innerText='★'.repeat(item.rank);
                    }
                    function nextReveal(){ cur++; if(cur<results.length)updateReveal(); else showSum(); }
                    function showSum(){
                        document.getElementById('reveal').style.display='none';
                        const g=document.getElementById('sum-grid'); g.innerHTML=results.map(r=>\`
                            <div class="card \${r.rank===4?'s4':''}">
                                <img src="\${r.img}"><div style="font-size:0.5rem;color:#ffcc00;">\${'★'.repeat(r.rank)}</div>
                            </div>\`).join('');
                        document.getElementById('summary').style.display='flex';
                    }
                <\/script>
            </body></html>`;
        }

        // --- システムメッセージ受信 ---
        window.addEventListener('message', e => {
            if(e.data.type === 'gachaPull') {
                iroCoins = e.data.value;
                localStorage.setItem('gCoins', iroCoins);
                const currentChars = localStorage.getItem('gChars') || "";
                myChars = currentChars ? currentChars + "," + e.data.chars : e.data.chars;
                localStorage.setItem('gChars', myChars);
                syncUI();
                // 本来はここでGASにPOSTして同期する
            }
        });

        // --- ユーティリティ ---
        function uploadIcon(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    localStorage.setItem('gAv', e.target.result);
                    syncUI();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        function saveSettings() {
            localStorage.setItem('gName', document.getElementById('nIn').value);
            syncUI();
            closeAllSheets();
        }
        function openSheet(id) {
            document.getElementById('sheetOverlay').style.display = 'block';
            document.getElementById(id).classList.add('open');
        }
        function closeAllSheets() {
            document.getElementById('sheetOverlay').style.display = 'none';
            document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open'));
        }
        function showPauseMenu() { document.getElementById('pauseOverlay').style.display = 'flex'; }
        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { location.reload(); }
    </script>
</body>
</html>
