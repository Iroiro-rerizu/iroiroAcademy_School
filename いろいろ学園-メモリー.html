<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - ULTIMATE INTEGRATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.85);
            --border: rgba(255, 255, 255, 0.3); --verify: #1da1f2;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        /* 背景装飾 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.4); pointer-events: none; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, #000 100%); z-index: -1; pointer-events: none; }

        /* キャラクター装飾（浮遊） */
        .char-original { position: absolute; width: 85px; height: 85px; border-radius: 20px; border: 3px solid #fff; background: var(--glass); backdrop-filter: blur(10px); animation: float 3s infinite ease-in-out; z-index: 1; box-shadow: 0 0 20px var(--pro-teal); pointer-events: none; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(5deg); } }

        /* スクリーン管理 */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; box-sizing: border-box; padding: 20px; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        /* ボタン */
        .btn-pro { position: relative; background: #fff; color: #111; border: none; padding: 16px 40px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 5px 5px 0 var(--pro-teal); z-index: 10000; font-family: 'Montserrat', sans-serif; margin: 12px; text-transform: uppercase; text-align: center; width: 85%; max-width: 300px; font-size: 1.1rem; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); pointer-events: none; }
        .btn-pro:active { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); }
        .btn-pro.pink { box-shadow: 5px 5px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }

        /* UI要素 */
        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 8px; z-index: 200; }
        .av-mini { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; cursor: pointer; }
        .iro-coin-disp { margin-left: 10px; font-weight: 900; color: var(--pro-teal); text-shadow: 0 0 10px var(--pro-teal); font-size: 1.1rem; }
        .badge-verify { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: linear-gradient(135deg, #1da1f2, #0e71c8); color: #fff; border-radius: 50%; font-size: 10px; margin-left: 8px; border: 1.5px solid #fff; font-weight: bold; }
        .badge-verify::after { content: '✔'; }

        /* 下部ナビゲーション */
        .nav-container { position: absolute; bottom: 25px; display: flex; gap: 10px; width: 95%; max-width: 900px; z-index: 300; justify-content: center; }
        .nav-card { flex: 1; background: rgba(0,0,0,0.6); border: 1.5px solid #333; padding: 18px 5px; border-radius: 12px; cursor: pointer; text-align: center; font-weight: 900; font-size: 0.8rem; color: #fff; transition: 0.2s; white-space: nowrap; min-width: 0; }
        .nav-card.main { background: var(--pro-pink); border: none; box-shadow: 0 0 20px rgba(255,102,204,0.4); }

        /* ボトムシート */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 94%; background: #0a0b12; border-radius: 30px 30px 0 0; z-index: 50000; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; color: #fff; border-top: 1px solid var(--border); }
        .bottom-sheet.open { bottom: 0; }
        .sheet-content { padding: 25px; padding-bottom: 120px; max-width: 800px; margin: 0 auto; }

        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .member-card { position: relative; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; border: 1px solid rgba(255,255,255,0.2); text-align: center; cursor: pointer; }
        .member-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; border: 2px solid #fff; }
        .count-badge { position: absolute; top: 5px; right: 5px; background: var(--pro-pink); color: #fff; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; border: 1.5px solid #fff; z-index: 10; }
        
        .student-id-card { background: #fff; color: #333; border-radius: 15px; padding: 25px; border: 3px solid #555; max-width: 350px; margin: 20px auto; text-align: left; }
        .student-input { background: none; border: none; border-bottom: 2px solid #333; width: 100%; font-size: 1.2rem; padding: 10px 0; margin-bottom: 15px; color:#000; font-family: inherit; font-weight: bold; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="floatChars"></div>

    <div id="sheetOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:49000;display:none;backdrop-filter:blur(5px);" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" style="position:fixed;top:15px;right:15px;width:45px;height:45px;background:var(--glass);border:1.5px solid #fff;border-radius:50%;display:none;z-index:15000;justify-content:center;align-items:center;font-weight:900;cursor:pointer;color:#fff;" onclick="showPauseMenu()">II</div>

    <!-- ポーズメニュー -->
    <div id="pauseOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:60000;display:none;flex-direction:column;justify-content:center;align-items:center;">
        <h1 style="font-family: Montserrat; font-size: 3rem; color: var(--pro-teal); margin-bottom: 30px;">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開</span></button>
        <button class="btn-pro pink" onclick="exitGame()"><span>終了</span></button>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <h1 style="font-family: Montserrat; font-size: clamp(3.5rem, 15vw, 8rem); margin: 0; text-shadow: 0 0 30px var(--pro-teal); text-align: center;">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: 900; color: var(--pro-pink); margin-bottom: 50px; text-align: center; font-size: 1.2rem;">COLORFUL STAGE</p>
        <button class="btn-pro" onclick="handleLoginClick()"><span>ログイン</span></button>
        <button class="btn-pro pink" onclick="document.getElementById('modalTransfer').showModal()"><span>データ復元</span></button>
    </div>

    <!-- 2. 新規登録 -->
    <div id="registrationScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; color: var(--pro-teal);">NEW REGISTRATION</h2>
        <div class="student-id-card">
            <h3 style="margin:0 0 15px 0; color:#111;">学生証作成</h3>
            <input type="text" id="regName" class="student-input" placeholder="なまえ（公開）">
            <input type="password" id="regPass" class="student-input" placeholder="合言葉（復元用）">
            <p style="font-size: 0.7rem; color: #f39; font-weight:bold;">※このIDと合言葉でデータ復元ができます。</p>
        </div>
        <button class="btn-pro" onclick="saveRegistration()"><span>作成してログイン！</span></button>
    </div>

    <div id="loadingScreen" class="screen hidden"><p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px; animation: flash 1.5s infinite alternate; font-size: 1.5rem;">同期中...</p></div>

    <!-- 3. ホーム画面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.9rem; font-weight: 900;"><span id="hName">---</span><span id="hVerified"></span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">---</span></div>
        </div>
        
        <div class="present-btn" style="position: absolute; top: 75px; left: 15px; width: 45px; height: 45px; background: rgba(255,255,255,0.05); border: 1.5px solid #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 300; font-size: 1.3rem;" onclick="openSheet('sheetPresent')">🎁<div id="pBadge" style="position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; background: red; border-radius: 50%; border: 1.5px solid #fff; font-size: 0.6rem; display: none; justify-content: center; align-items: center; font-weight: bold;">0</div></div>

        <h1 style="font-family: Montserrat; font-size: clamp(2rem, 10vw, 5.5rem); font-weight: 900; letter-spacing: 12px; color: #fff; opacity: 0.8; user-select: none; pointer-events: none; text-align: center;">MAIN CONSOLE</h1>
        
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="launchGachaUI()">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">クエスト</div>
            <div class="nav-card" onclick="openSheet('sheetMember')">メンバー</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定</div>
        </nav>
    </div>

    <!-- ボトムシート -->
    <div id="sheetMember" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">MY MEMBERS</h2><div id="memberListContainer" class="member-grid"></div></div></div>
    
    <div id="sheetMemberDetail" class="bottom-sheet">
        <div class="sheet-content" style="text-align: center;">
            <div id="memberDetailContent"></div>
            <div id="giftSelectionArea" style="display:none; margin-top:20px;">
                <h3 style="color:var(--pro-pink);">贈るフレンドを選択</h3>
                <div id="giftFriendList" style="background:#f0f0f5;color:#333;padding:15px;border-radius:20px;max-height:300px;overflow-y:auto; border: 2px solid #ddd;"></div>
            </div>
            <button class="btn-pro pink" id="startGiftBtn"><span>フレンドにあげる</span></button><br>
            <button class="btn-pro gray" onclick="closeSheet('sheetMemberDetail')"><span>戻る</span></button>
        </div>
    </div>

    <div id="sheetPresent" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">PRESENTS</h2><div id="pListContainer"></div></div></div>
    <div id="sheetConfig" class="bottom-sheet"><div class="sheet-content" style="text-align: center;"><div class="student-id-card"><h3>学生証設定</h3><img id="mAv" style="width:105px;height:140px;border:3px solid #333;object-fit:cover;background:#eee;cursor:pointer;border-radius:10px;" onclick="document.getElementById('fileIn').click()"><p style="font-size:0.6rem; color:#888;">ID: <span id="myIdDisplay">---</span></p><input type="text" id="nIn" placeholder="なまえ" class="student-input"><input type="password" id="pIn" placeholder="合言葉" class="student-input"><input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)"></div><br><button class="btn-pro" style="width:100%" onclick="saveSettings()"><span>保存して同期</span></button></div></div>
    
    <div id="sheetFriend" class="bottom-sheet">
        <div class="sheet-content">
            <h2 style="color:var(--pro-pink);">FRIENDS</h2>
            <div id="reqList"></div>
            <div id="fList" style="margin-top:20px;"></div>
            <hr style="border:0.5px solid #333; margin:20px 0;">
            <input type="text" id="fIdIn" placeholder="10桁ID検索" style="width:60%; padding:14px; border-radius:10px; border:none; color:#000; box-sizing:border-box;">
            <button class="btn-pro pink" style="width:auto; padding:12px 25px;" onclick="sendReq()"><span>申請</span></button>
        </div>
    </div>

    <div id="questScreen" class="screen hidden"><h2 style="font-size: 2.5rem; color: var(--pro-teal); font-family: Montserrat;">QUEST SELECT</h2><div id="gameListContainer" style="display:flex;flex-wrap:wrap;justify-content:center;gap:15px;width:100%;padding:20px;box-sizing:border-box;"></div><button class="btn-pro gray" onclick="transition('questScreen', 'gameScreen')">戻る</button></div>
    
    <dialog id="modalTransfer" style="background:#111;color:#fff;border:none;border-radius:20px;padding:30px;width:90%;max-width:320px;"><h3>データ復元</h3><input type="text" id="tIdIn" placeholder="ID"><input type="password" id="tPassIn" placeholder="合言葉"><br><br><button class="btn-pro pink" style="width:100%;margin:0;" onclick="executeTransfer()">復元実行</button></dialog>

    <div id="gameLayer"><iframe id="gameFrame" src="about:blank"></iframe></div>

    <script>
        // --- 設定 ---
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzFvP2arDXE10BQgkPYG-fDghCAb90gqn8D7UT3u1rEDtoJwYAqiTwKj7o3P_XO3bVD/exec';
        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = parseInt(localStorage.getItem('gCoins')) || 0;
        let myChars = "", globalCharaPool = {}, friendsData = [];

        // 浮遊装飾
        function initFloat() {
            const container = document.getElementById('floatChars');
            for(let i=0; i<5; i++){
                const d = document.createElement('div'); d.className = 'char-original';
                d.style.left = Math.random()*80 + '%'; d.style.top = Math.random()*80 + '%';
                d.style.animationDelay = (Math.random()*5)+'s'; d.style.opacity = '0.3';
                container.appendChild(d);
            }
        }
        initFloat();

        // ログイン
        function handleLoginClick() {
            if(!localStorage.getItem('gName')) transition('titleScreen', 'registrationScreen');
            else beginPortalSync();
        }
        async function saveRegistration() {
            const name = document.getElementById('regName').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            if(!name || !pass) return;
            localStorage.setItem('gID', myId); localStorage.setItem('gName', name); localStorage.setItem('gPass', pass);
            beginPortalSync();
        }
        async function beginPortalSync() {
            transition('registrationScreen', 'loadingScreen'); transition('titleScreen', 'loadingScreen');
            try { globalCharaPool = await (await fetch(GAS_URL + "?action=getCharaPools")).json(); } catch(e) {}
            if(await fetchSync()) {
                transition('loadingScreen', 'gameScreen');
                setInterval(fetchSync, 15000);
            }
        }
        function transition(h, s) { const cur = document.getElementById(h); const nxt = document.getElementById(s); if(cur) { cur.classList.add('hidden'); setTimeout(() => cur.style.display = 'none', 600); } if(nxt) { nxt.style.display = 'flex'; setTimeout(() => nxt.classList.remove('hidden'), 50); } }

        async function fetchSync() {
            try {
                const res = await fetch(GAS_URL + "?id=" + myId);
                const json = await res.json();
                if(json.result === "success") {
                    iroCoins = Number(json.iroCoin); localStorage.setItem('gCoins', iroCoins);
                    document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                    myChars = json.chars || ""; friendsData = json.friendsData || [];
                    document.getElementById('hName').innerText = json.name || "USER";
                    document.getElementById('hVerified').innerHTML = json.isOfficial ? '<span class="badge-verify"></span>' : "";
                    const avUrl = json.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed="+myId;
                    document.getElementById('hAv').src = avUrl; document.getElementById('mAv').src = avUrl;
                    document.getElementById('myIdDisplay').innerText = myId;
                    updatePresentUI(json.pendingGifts); renderMembers();
                    document.getElementById('reqList').innerHTML = json.pending ? json.pending.split(',').map(id => `<div style="display:flex;justify-content:space-between;padding:10px;background:#fff;border-radius:10px;margin-bottom:5px;color:#333;"><span>ID: ${id}</span><button onclick="acceptF('${id}')">承認</button></div>`) : "";
                    document.getElementById('fList').innerHTML = friendsData.length ? friendsData.map(f => `<div style="display:flex;justify-content:space-between;border-bottom:1px solid #333;padding:12px 0;color:#fff;"><span>${f.name}</span><button onclick="sendFriendGift('${f.id}')">🎁</button></div>`).join('') : "なし";
                    return true;
                }
            } catch(e) { return false; }
        }

        // ガチャUI起動
        async function launchGachaUI() {
            document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex';
            const [gDataRes, charPoolRes] = await Promise.all([ fetch(GAS_URL + "?action=getGachaSettings"), fetch(GAS_URL + "?action=getCharaPools") ]);
            const gData = await gDataRes.json(); const pools = await charPoolRes.json();
            
            document.getElementById('gameFrame').srcdoc = `
            <!DOCTYPE html><html><head><style>
                body{background:#000;color:#fff;font-family:sans-serif;margin:0;overflow:hidden;}
                #bg{position:fixed;width:100%;height:100%;background:url('${gData[0].bg}') center/cover; transition:0.5s;}
                .ui{position:relative;z-index:10;height:100vh;padding:30px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;background:linear-gradient(rgba(0,0,0,0.2),transparent,rgba(0,0,0,0.8));}
                .coin-tag{background:rgba(0,0,0,0.7);padding:10px 20px;border-radius:30px;color:#33ffcc;border:1px solid #33ffcc;width:fit-content;}
                .sidebar{position:absolute;left:20px;top:100px;display:flex;flex-direction:column;gap:10px;}
                .tab{width:120px;height:60px;background-size:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;opacity:0.6;}
                .tab.active{border-color:#ffcc00;opacity:1;}
                .controls{display:flex;flex-direction:column;align-items:flex-end;gap:15px;}
                .btn-pull{padding:20px 40px;border-radius:10px;border:none;font-weight:bold;cursor:pointer;font-size:1.1rem;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,0.3);}
                .b-1{background:#555;} .b-10{background:linear-gradient(#ff88bb,#ff3399);} .b-100{background:linear-gradient(#ffcc00,#ff6600);}
                #reveal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:1000;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
                .rev-img{max-height:70vh;border:5px solid #fff;border-radius:20px;}
                #summary{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;z-index:2000;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
                .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;overflow-y:auto;max-height:70vh;}
                .card{width:80px;text-align:center;font-size:0.7rem;background:rgba(255,255,255,0.1);padding:5px;border-radius:5px;}
                .card img{width:70px;height:90px;object-fit:cover;border:1px solid #fff;border-radius:5px;}
                .custom-box{background:rgba(0,0,0,0.7);padding:10px;border-radius:15px;display:flex;align-items:center;gap:10px;}
            </style></head>
            <body>
                <div id="bg"></div>
                <div class="ui">
                    <div class="coin-tag">🪙 <span id="c">${iroCoins.toLocaleString()}</span></div>
                    <div class="sidebar" id="sb"></div>
                    <div style="margin-left:140px;margin-bottom:100px;"><h1 id="gn">${gData[0].title}</h1></div>
                    <div class="controls" id="bc"></div>
                </div>
                <div id="reveal" onclick="next()"><img id="ri" class="rev-img"><h1 id="rn" style="font-size:3rem;margin:10px 0;"></h1><div id="rs" style="color:#ffcc00;font-size:2.5rem;"></div><p>TAP TO NEXT</p></div>
                <div id="summary"><h2>RESULT</h2><div id="sg" class="grid"></div><button onclick="location.reload()" style="margin-top:20px;padding:15px 60px;border-radius:30px;border:none;font-weight:bold;cursor:pointer;">閉じる</button></div>
                
                <script>
                    let coins=${iroCoins}, ps=${JSON.stringify(pools)}, gd=${JSON.stringify(gData)}, res=[], cur=0, cust=1;
                    function build(idx){
                        document.getElementById('bg').style.backgroundImage='url('+gd[idx].bg+')';
                        document.getElementById('gn').innerText=gd[idx].title;
                        const bc=document.getElementById('bc'); bc.innerHTML='';
                        gd[idx].buttons.split(',').forEach(b=>{
                            const btn=document.createElement('button');
                            if(b.includes('回')){
                                let n = parseInt(b); btn.innerText = b + '引く';
                                btn.className = 'btn-pull ' + (n>=100?'b-100':(n>=10?'b-10':'b-1'));
                                btn.onclick = () => pull(n);
                            } else if(b === 'カスタム'){
                                const box = document.createElement('div'); box.className='custom-box';
                                box.innerHTML = '<button onclick="chg(-1)" style="width:30px;height:30px;">-</button><span id="cv" style="font-weight:bold;width:30px;text-align:center;">1</span><button onclick="chg(1)" style="width:30px;height:30px;">+</button>';
                                const cb = document.createElement('button'); cb.className='btn-pull b-1'; cb.innerText='カスタム引く';
                                cb.onclick = () => pull(cust);
                                bc.appendChild(box); bc.appendChild(cb); return;
                            }
                            bc.appendChild(btn);
                        });
                    }
                    function chg(v){ cust=Math.max(1, cust+v); document.getElementById('cv').innerText=cust; }
                    function pull(n){
                        const cost=n*300; if(coins<cost){alert('コイン不足');return;}
                        coins-=cost; document.getElementById('c').innerText=coins.toLocaleString();
                        res=[]; let names=[]; let hasS4=false, hasS3=false;
                        for(let i=0; i<n; i++){
                            let s=2, r=Math.random()*100;
                            if(r<3.5) s=4; else if(r<16) s=3;
                            // 確定ロジック
                            if(n>=100 && i===n-1 && !hasS4) s=4;
                            else if(n>=10 && i===n-1 && !hasS3 && s<3) s=3;
                            if(s>=4) hasS4=true; if(s>=3) hasS3=true;
                            const char = ps['star'+s][Math.floor(Math.random()*ps['star'+s].length)];
                            res.push({...char,rank:s}); names.push(char.name);
                        }
                        window.parent.postMessage({type:'gachaPull',value:coins,pulls:n,chars:names.join(',')},'*');
                        cur=0; show();
                    }
                    function show(){const c=res[cur]; document.getElementById('reveal').style.display='flex'; document.getElementById('ri').src=c.img; document.getElementById('rn').innerText=c.name; document.getElementById('rs').innerText='★'.repeat(c.rank);}
                    function next(){cur++; if(cur<res.length)show(); else{document.getElementById('reveal').style.display='none';const g=document.getElementById('sg');g.innerHTML='';res.forEach(c=>{g.innerHTML+='<div class="card"><img src="'+c.img+'"><br>'+'★'.repeat(c.rank)+'</div>'});document.getElementById('summary').style.display='flex';}}
                    gd.forEach((g,i)=>{ const t=document.createElement('div'); t.className='tab'+(i===0?' active':''); t.style.backgroundImage='url('+g.thumbnail+')'; t.onclick=()=>{build(i); document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',i===j))}; document.getElementById('sb').appendChild(t); });
                    build(0);
                <\/script>
            </body></html>`;
        }

        // --- ユーティリティ ---
        window.addEventListener('message', e => { if(e.data.type === 'gachaPull') { iroCoins = e.data.value; localStorage.setItem('gCoins', iroCoins); document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString(); fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "gachaLog", userId: myId, newCoins: iroCoins, pulls: e.data.pulls, newChars: e.data.chars }) }); } });
        function renderMembers() { const c=document.getElementById('memberListContainer'); if(!myChars){c.innerHTML="なし";return;} const counts={}; myChars.split(',').forEach(n=>{if(n)counts[n]=(counts[n]||0)+1;}); const master=[...globalCharaPool.star2,...globalCharaPool.star3,...globalCharaPool.star4]; c.innerHTML=Object.keys(counts).map(name=>{ const char=master.find(m=>m.name===name); return char?`<div class="member-card"><div class="count-badge">x${counts[name]}</div><img src="${char.img}"><br><small>${char.name}</small></div>`:""; }).join(''); }
        function openSheet(id) { document.getElementById('sheetOverlay').style.display='block'; document.getElementById(id).classList.add('open'); }
        function closeSheet(id) { document.getElementById(id).classList.remove('open'); if(!document.querySelector('.bottom-sheet.open')) document.getElementById('sheetOverlay').style.display = 'none'; }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display='none'; document.querySelectorAll('.bottom-sheet').forEach(s=>s.classList.remove('open')); }
        function showPauseMenu() { document.getElementById('pauseOverlay').style.display='flex'; }
        function resumeGame() { document.getElementById('pauseOverlay').style.display='none'; }
        function exitGame() { location.reload(); }
        function saveSettings() { localStorage.setItem('gName', document.getElementById('nIn').value); localStorage.setItem('gPass', document.getElementById('pIn').value); alert("保存しました"); fetchSync(); closeAllSheets(); }
        async function loadGameList() { const res=await(await fetch(GAS_URL+"?action=getList")).json(); const c=document.getElementById('gameListContainer'); c.innerHTML=""; res.forEach(g=>{ const d=document.createElement('div'); d.className="nav-card"; d.style.width="130px"; d.innerHTML=`<b>${g.title}</b>`; d.onclick=()=>launchGame(g.id); c.appendChild(d); }); }
        async function launchGame(id) { document.getElementById('gameLayer').style.display='block'; document.getElementById('mobilePauseBtn').style.display='flex'; const res=await(await fetch(GAS_URL+"?action=getCode&row="+id)).json(); document.getElementById('gameFrame').srcdoc = res.code; }
        function updatePresentUI(p) { const b=document.getElementById('pBadge'); const c=document.getElementById('pListContainer'); if(!p || p.length===0){c.innerHTML="なし";b.style.display='none';return;} b.innerText=p.length; b.style.display='flex'; c.innerHTML=p.map(x=>`<div style="display:flex;justify-content:space-between;padding:10px;background:rgba(255,255,255,0.1);margin-bottom:5px;"><span>${x.name}</span><button onclick="claim(${x.row},'${x.name}')">受取</button></div>`).join(''); }
        async function claim(r,n) { await fetch(GAS_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({type:"claim",userId:myId,giftRow:r})}); alert(n+" 受取完了"); fetchSync(); }
        async function sendReq() { const tid = document.getElementById('fIdIn').value.toUpperCase(); if(tid===myId) return; await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "request", myId: myId, targetId: tid }) }); alert("送信完了"); fetchSync(); }
        async function acceptF(tid) { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "accept", myId: myId, targetId: tid }) }); fetchSync(); }
        async function executeTransfer() { const id = document.getElementById('tIdIn').value.toUpperCase(); const ps = document.getElementById('tPassIn').value; const res = await (await fetch(GAS_URL + "?id=" + id)).json(); if(res.result === "success" && String(res.pass) === String(ps)) { localStorage.setItem('gID', id); localStorage.setItem('gName', res.name); localStorage.setItem('gPass', res.pass); location.reload(); } else { alert("失敗"); } }
    </script>
</body>
</html>
