<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻想クロニクル - ULTIMATE INTEGRATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pro-teal: #33ffcc; --pro-pink: #ff3399; --glass: rgba(0, 0, 0, 0.8);
            --border: rgba(255, 255, 255, 0.4); --verify: #1da1f2;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; color: #fff; height: 100vh; width: 100vw; touch-action: manipulation; }
        
        /* 背景装飾 */
        .bg-sekai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover; z-index: -1; filter: brightness(0.4); pointer-events: none; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, #000 100%); z-index: -1; pointer-events: none; }

        /* スクリーン管理 */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; box-sizing: border-box; padding: 20px; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        /* プロセカ風ボタン */
        .btn-pro { position: relative; background: #fff; color: #111; border: none; padding: 16px 40px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; transform: skewX(-15deg); box-shadow: 5px 5px 0 var(--pro-teal); z-index: 10000; font-family: 'Montserrat', sans-serif; margin: 12px; text-transform: uppercase; text-align: center; width: 85%; max-width: 300px; pointer-events: auto !important; font-size: 1.1rem; }
        .btn-pro span { display: inline-block; transform: skewX(15deg); pointer-events: none; }
        .btn-pro:active { transform: skewX(-15deg) translate(2px, 2px); box-shadow: 0 0 0 var(--pro-teal); }
        .btn-pro.pink { box-shadow: 5px 5px 0 var(--pro-pink); background: var(--pro-pink); color: #fff; }

        /* 認証済みバッジ */
        .badge-verify { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: linear-gradient(135deg, #1da1f2, #0e71c8); color: #fff; border-radius: 50%; font-size: 10px; margin-left: 8px; vertical-align: middle; border: 1.5px solid #fff; box-shadow: 0 0 8px rgba(29, 161, 242, 0.6); font-weight: bold; }
        .badge-verify::after { content: '✔'; }

        /* ヘッダー */
        .header-minimal { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 8px; z-index: 200; }
        .av-mini { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #222; cursor: pointer; }
        .iro-coin-disp { margin-left: 10px; font-weight: 900; color: var(--pro-teal); text-shadow: 0 0 10px var(--pro-teal); font-size: 1.1rem; }

        /* 中央メインテキスト */
        .main-console-text { font-family: 'Montserrat', sans-serif; font-size: clamp(2rem, 10vw, 5.5rem); font-weight: 900; letter-spacing: 12px; color: #fff; opacity: 0.8; user-select: none; pointer-events: none; text-align: center; }

        /* 下部ナビゲーション */
        .nav-container { position: absolute; bottom: 25px; display: flex; gap: 10px; width: 95%; max-width: 900px; z-index: 300; pointer-events: auto; justify-content: center; }
        .nav-card { flex: 1; background: rgba(0,0,0,0.6); border: 1.5px solid #333; padding: 18px 5px; border-radius: 12px; cursor: pointer; text-align: center; font-weight: 900; font-size: 0.8rem; color: #fff; transition: 0.2s; white-space: nowrap; min-width: 0; }
        .nav-card:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .nav-card.main { background: var(--pro-pink); border: none; box-shadow: 0 0 20px rgba(255,102,204,0.4); }

        /* ボトムシート */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 94%; background: #0a0b12; border-radius: 30px 30px 0 0; z-index: 50000; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; color: #fff; border-top: 1px solid var(--border); }
        .bottom-sheet.open { bottom: 0; }
        .sheet-content { padding: 25px; padding-bottom: 120px; max-width: 800px; margin: 0 auto; }

        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .member-card { position: relative; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; border: 1px solid rgba(255,255,255,0.2); text-align: center; cursor: pointer; }
        .member-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; border: 1.5px solid #fff; }
        .count-badge { position: absolute; top: 5px; right: 5px; background: var(--pro-pink); color: #fff; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; border: 1.5px solid #fff; z-index: 10; }

        .student-id-card { background: #fff; color: #333; border-radius: 15px; padding: 25px; border: 3px solid #555; max-width: 350px; margin: 20px auto; text-align: left; }
        .student-input { background: none; border: none; border-bottom: 2px solid #333; width: 100%; font-size: 1.2rem; padding: 10px 0; margin-bottom: 15px; color:#000; font-family: inherit; font-weight: bold; }

        #gameLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; background: #000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="bg-sekai"></div>
    <div class="bg-overlay"></div>
    <div id="sheetOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:49000;display:none;backdrop-filter:blur(5px);" onclick="closeAllSheets()"></div>
    <div id="mobilePauseBtn" style="position:fixed;top:15px;right:15px;width:45px;height:45px;background:var(--glass);border:1.5px solid #fff;border-radius:50%;display:none;z-index:15000;justify-content:center;align-items:center;font-weight:900;cursor:pointer;color:#fff;" onclick="showPauseMenu()">II</div>

    <div id="pauseOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:60000;display:none;flex-direction:column;justify-content:center;align-items:center;">
        <h1 style="font-family: Montserrat; font-size: 3rem; color: var(--pro-teal); margin-bottom: 30px;">PAUSE</h1>
        <button class="btn-pro" onclick="resumeGame()"><span>再開</span></button>
        <button class="btn-pro pink" onclick="exitGame()"><span>終了</span></button>
    </div>

    <!-- 1. タイトル -->
    <div id="titleScreen" class="screen">
        <h1 style="font-family: Montserrat; font-size: clamp(3.5rem, 15vw, 8rem); margin: 0; text-shadow: 0 0 30px var(--pro-teal); text-align: center;">GENSOU</h1>
        <p style="letter-spacing: 12px; font-weight: 900; color: var(--pro-pink); margin-bottom: 50px; text-align: center; font-size: 1.2rem;">COLORFUL STAGE</p>
        <button class="btn-pro" onclick="handleLoginClick()"><span>ログイン</span></button>
        <button class="btn-pro pink" onclick="document.getElementById('modalTransfer').showModal()"><span>データ復元</span></button>
    </div>

    <!-- 2. 新規登録 -->
    <div id="registrationScreen" class="screen hidden">
        <h2 style="font-family: Montserrat; color: var(--pro-teal);">NEW REGISTRATION</h2>
        <div class="student-id-card">
            <h3 style="margin:0 0 15px 0; color:#111;">学生証作成</h3>
            <input type="text" id="regName" class="student-input" placeholder="なまえ（公開）">
            <input type="password" id="regPass" class="student-input" placeholder="合言葉（復元用）">
        </div>
        <button class="btn-pro" onclick="saveRegistration()"><span>作成してログイン！</span></button>
    </div>

    <div id="loadingScreen" class="screen hidden"><p style="color: var(--pro-teal); font-weight: bold; letter-spacing: 3px; animation: flash 1.5s infinite alternate; font-size: 1.5rem;">同期中...</p></div>

    <!-- 3. ホーム画面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="header-minimal">
            <div class="av-mini" onclick="openSheet('sheetConfig')"><img id="hAv" src="" style="width:100%; height:100%; object-fit:cover;"></div>
            <div style="font-size: 0.9rem; font-weight: 900;"><span id="hName">---</span><span id="hVerified"></span></div>
            <div class="iro-coin-disp">🪙 <span id="hIroCoin">---</span></div>
        </div>
        
        <h1 class="main-console-text">MAIN CONSOLE</h1>
        
        <nav class="nav-container">
            <div class="nav-card" onclick="openSheet('sheetFriend')">フレンド</div>
            <div class="nav-card" onclick="launchGachaUI()">ガチャ</div>
            <div class="nav-card main" onclick="transition('gameScreen', 'questScreen'); loadGameList();">クエスト</div>
            <div class="nav-card" onclick="openSheet('sheetMember')">メンバー</div>
            <div class="nav-card" onclick="openSheet('sheetConfig')">設定</div>
        </nav>
    </div>

    <!-- ボトムシート群 -->
    <div id="sheetMember" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-teal); font-family: Montserrat;">MY MEMBERS</h2><div id="memberListContainer" class="member-grid"></div></div></div>
    <div id="sheetConfig" class="bottom-sheet"><div class="sheet-content" style="text-align: center;"><div class="student-id-card"><h3>学生証設定</h3><img id="mAv" style="width:105px;height:140px;border:3px solid #333;object-fit:cover;background:#eee;cursor:pointer;border-radius:10px;" onclick="document.getElementById('fileIn').click()"><p>ID: <span id="myIdDisplay">---</span></p><input type="text" id="nIn" class="student-input"><input type="password" id="pIn" class="student-input"><input type="file" id="fileIn" style="display:none" accept="image/*" onchange="uploadIcon(this)"></div><button class="btn-pro" onclick="saveSettings()"><span>保存</span></button></div></div>
    <div id="sheetFriend" class="bottom-sheet"><div class="sheet-content"><h2 style="color:var(--pro-pink);">FRIENDS</h2><div id="fList" style="color:#333; background:white; padding:10px; border-radius:10px;"></div><input type="text" id="fIdIn" placeholder="ID検索"><button onclick="sendReq()">申請</button></div></div>
    <div id="questScreen" class="screen hidden"><h2 style="color:var(--pro-teal);">QUEST SELECT</h2><div id="gameListContainer"></div><button class="btn-pro gray" onclick="transition('questScreen', 'gameScreen')">戻る</button></div>
    
    <dialog id="modalTransfer" style="background:#111;color:#fff;border:none;border-radius:20px;padding:30px;">
        <h3>データ復元</h3><input type="text" id="tIdIn" placeholder="ID"><input type="password" id="tPassIn" placeholder="合言葉"><button onclick="executeTransfer()">実行</button>
    </dialog>

    <div id="gameLayer"><iframe id="gameFrame" src="about:blank"></iframe></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx2sa_f69YbAcM-tEDjFIvp93vPqZzFQz0fqg0ZydUtQ65Yx5CPIp36B4y4i1TxitHi/exec';
        let myId = localStorage.getItem('gID') || Math.random().toString(36).substring(2, 12).toUpperCase();
        let iroCoins = parseInt(localStorage.getItem('gCoins')) || 0;
        let myChars = "", globalCharaPool = {}, friendsData = [];

        async function handleLoginClick() {
            if(!localStorage.getItem('gName')) transition('titleScreen', 'registrationScreen');
            else beginPortalSync();
        }

        async function saveRegistration() {
            localStorage.setItem('gName', document.getElementById('regName').value);
            localStorage.setItem('gPass', document.getElementById('regPass').value);
            localStorage.setItem('gID', myId);
            beginPortalSync();
        }

        async function beginPortalSync() {
            transition('registrationScreen', 'loadingScreen'); transition('titleScreen', 'loadingScreen');
            try { 
                globalCharaPool = await (await fetch(GAS_URL + "?action=getCharaPools")).json();
                await fetchSync();
                transition('loadingScreen', 'gameScreen');
                setInterval(fetchSync, 15000);
            } catch(e) { alert("通信エラー"); transition('loadingScreen', 'titleScreen'); }
        }

        function transition(h, s) { 
            document.getElementById(h).classList.add('hidden'); 
            const nxt = document.getElementById(s);
            nxt.style.display = 'flex';
            setTimeout(() => nxt.classList.remove('hidden'), 50);
        }

        async function fetchSync() {
            const res = await fetch(GAS_URL + "?id=" + myId);
            const json = await res.json();
            if(json.result === "success") {
                iroCoins = Number(json.iroCoin);
                myChars = json.chars || "";
                document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                document.getElementById('hName').innerText = json.name || "USER";
                document.getElementById('hAv').src = json.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed="+myId;
                renderMembers();
                // 同期用POST
                await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "sync", id: myId, name: localStorage.getItem('gName'), pass: localStorage.getItem('gPass'), iroCoin: iroCoins, chars: myChars, avatar: localStorage.getItem('gAv')||"" }) });
            }
        }

        function renderMembers() {
            const container = document.getElementById('memberListContainer');
            if(!myChars) return;
            const counts = {}; myChars.split(',').forEach(n => { if(n) counts[n] = (counts[n] || 0) + 1; });
            const master = [...globalCharaPool.star2, ...globalCharaPool.star3, ...globalCharaPool.star4];
            container.innerHTML = Object.keys(counts).map(name => {
                const char = master.find(m => m.name === name);
                return char ? `<div class="member-card"><div class="count-badge">x${counts[name]}</div><img src="${char.img}"><br><small>${char.name}</small></div>` : "";
            }).join('');
        }

        async function launchGachaUI() {
            document.getElementById('gameLayer').style.display='block';
            document.getElementById('mobilePauseBtn').style.display='flex';
            const gRes = await fetch(GAS_URL + "?action=getGachaSettings");
            const gData = await gRes.json();
            
            document.getElementById('gameFrame').srcdoc = `
            <!DOCTYPE html><html><head><style>
                body{background:#000;color:#fff;font-family:sans-serif;margin:0;overflow:hidden;}
                .ui{padding:20px;} .btn-g{padding:15px;margin:10px;border-radius:10px;border:none;font-weight:bold;cursor:pointer;}
                .s4{background:orange;} .s10{background:magenta;} .s100{background:gold;}
                #reveal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
                .rev-img{width:80%;max-height:70vh;object-fit:contain;}
            </style></head><body>
            <div class="ui">
                <h1>${gData[0].title}</h1>
                <p>所持: 🪙<span id="c">${iroCoins}</span></p>
                <button class="btn-g s4" onclick="pull(1)">1回引く(300)</button>
                <button class="btn-g s10" onclick="pull(10)">10回引く(3000)</button>
                <button class="btn-g s100" onclick="pull(100)">100回引く(30000)</button>
                <div id="log"></div>
            </div>
            <div id="reveal" onclick="next()">
                <div id="stars" style="color:yellow;font-size:2rem;"></div>
                <img id="ri" class="rev-img">
                <h2 id="rn"></h2>
                <p>TAP TO NEXT</p>
            </div>
            <script>
                let coins = ${iroCoins};
                let pools = ${JSON.stringify(globalCharaPool)};
                let results = [], cur = 0;

                function pull(n) {
                    const cost = n * 300;
                    if(coins < cost) { alert("コイン不足"); return; }
                    coins -= cost;
                    document.getElementById('c').innerText = coins;

                    results = [];
                    let hasStar3 = false;
                    let hasStar4 = false;

                    for(let i=0; i<n; i++) {
                        let r = Math.random() * 100;
                        let s = 2;
                        if(r < 3.5) s = 4; else if(r < 16) s = 3;

                        // ロジック：10連の最後で星3以上確定
                        if(n >= 10 && i === n-1 && !hasStar3 && s < 3) s = 3;
                        // ロジック：100連の最後で星4確定
                        if(n >= 100 && i === n-1 && !hasStar4) s = 4;

                        if(s >= 3) hasStar3 = true;
                        if(s >= 4) hasStar4 = true;

                        const p = pools['star'+s];
                        const c = p[Math.floor(Math.random()*p.length)];
                        results.push({...c, rank: s});
                    }

                    // 親ウィンドウへ通知（保存処理）
                    window.parent.postMessage({
                        type: 'gachaPull', 
                        value: coins, 
                        pulls: n, 
                        chars: results.map(r=>r.name).join(',')
                    }, '*');

                    cur = 0; show();
                }

                function show() {
                    const c = results[cur];
                    document.getElementById('reveal').style.display='flex';
                    document.getElementById('ri').src = c.img;
                    document.getElementById('rn').innerText = c.name;
                    document.getElementById('stars').innerText = '★'.repeat(c.rank);
                }

                function next() {
                    cur++;
                    if(cur < results.length) show();
                    else document.getElementById('reveal').style.display='none';
                }
            <\/script></body></html>`;
        }

        window.addEventListener('message', e => {
            if(e.data.type === 'gachaPull') {
                iroCoins = e.data.value;
                document.getElementById('hIroCoin').innerText = iroCoins.toLocaleString();
                // GASへログ送信
                fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "gachaLog", userId: myId, newCoins: iroCoins, pulls: e.data.pulls, newChars: e.data.chars }) });
            }
        });

        function showPauseMenu() { document.getElementById('pauseOverlay').style.display = 'flex'; }
        function resumeGame() { document.getElementById('pauseOverlay').style.display = 'none'; }
        function exitGame() { location.reload(); }
        function openSheet(id) { document.getElementById('sheetOverlay').style.display = 'block'; document.getElementById(id).classList.add('open'); }
        function closeAllSheets() { document.getElementById('sheetOverlay').style.display = 'none'; document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open')); }
    </script>
</body>
</html>
