<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Snake Game to GAS</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #eef; }
    canvas { border: 5px solid #333; background: #fff; }
    .score { font-size: 24px; margin: 10px; }
  </style>
</head>
<body>
  <h1>Snake Game</h1>
  <div class="score">Score: <span id="scoreVal">0</span></div>
  <canvas id="gameCanvas" width="300" height="300"></canvas>
  <p>矢印キーで操作してください</p>

  <script>
    // ★ここにコピーしたGASのWebアプリURLを貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwHBvXJJz1oy1_VP5-9a9xdjGESO0WeLb8jTFKEhBFO79CBamLRl1eoXAZYFJbHDLhI/exec";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreVal = document.getElementById("scoreVal");

    let snake, food, dx, dy, score, gameInterval;
    const gridSize = 15;

    function startGame() {
      snake = [{x: 150, y: 150}];
      dx = gridSize; dy = 0; score = 0;
      scoreVal.innerText = score;
      createFood();
      if(gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(draw, 150);
    }

    function createFood() {
      food = {
        x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
        y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize
      };
    }

    function draw() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      
      // 当たり判定
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || snake.some(s => s.x === head.x && s.y === head.y)) {
        clearInterval(gameInterval);
        alert("Game Over! Score: " + score);
        sendScoreToGAS(score); // GASへ送信
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreVal.innerText = score;
        createFood();
      } else {
        snake.pop();
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, gridSize, gridSize);
      ctx.fillStyle = "green";
      snake.forEach(s => ctx.fillRect(s.x, s.y, gridSize, gridSize));
    }

    // GASにスコアを送信する関数
    function sendScoreToGAS(finalScore) {
      const data = {
        name: "GitHub Player",
        score: finalScore
      };

      // fetchを使ってGASにPOST送信
      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors", // GASの仕様上、no-corsが安定します
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(() => {
        alert("スプレッドシートにスコアを保存しました！");
        startGame();
      })
      .catch(err => console.error("Error:", err));
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -gridSize; }
      else if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = gridSize; }
      else if (e.key === "ArrowLeft" && dx === 0) { dx = -gridSize; dy = 0; }
      else if (e.key === "ArrowRight" && dx === 0) { dx = gridSize; dy = 0; }
    });

    startGame();
  </script>
</body>
</html>
