<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>幻想クロニクル</title>

<link
href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap"
rel="stylesheet"
>

<style>

/* =========================================================
   基本
   ========================================================= */

:root{

    --teal:#33ffcc;

    --pink:#ff3399;

    --glass:rgba(0,0,0,.8);

    --border:rgba(255,255,255,.4);

    --blue:#1da1f2;

}

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    padding:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#000;

    color:#fff;

    font-family:
        'Noto Sans JP',
        sans-serif;

    touch-action:manipulation;

}

button,
input{

    font-family:inherit;

}


/* =========================================================
   背景
   ========================================================= */

.bg-sekai{

    position:fixed;

    inset:0;

    background:
    url(
    'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000'
    )
    center/cover no-repeat;

    filter:brightness(.4);

    z-index:-2;

}

.bg-overlay{

    position:fixed;

    inset:0;

    background:
    radial-gradient(
        circle at center,
        transparent 0%,
        #000 100%
    );

    z-index:-1;

}


/* =========================================================
   画面
   ========================================================= */

.screen{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding:20px;

    transition:
        .4s
        cubic-bezier(.16,1,.3,1);

    z-index:100;

}

.hidden{

    display:none!important;

}


/* =========================================================
   ボタン
   ========================================================= */

.btn-pro{

    position:relative;

    width:85%;

    max-width:320px;

    margin:10px;

    padding:16px 30px;

    border:none;

    border-radius:5px;

    background:#fff;

    color:#111;

    font-size:1rem;

    font-weight:900;

    cursor:pointer;

    transform:skewX(-15deg);

    box-shadow:
        5px 5px 0 var(--teal);

}

.btn-pro span{

    display:inline-block;

    transform:skewX(15deg);

}

.btn-pro:active{

    transform:
        skewX(-15deg)
        translate(2px,2px);

}

.btn-pro.pink{

    background:var(--pink);

    color:#fff;

    box-shadow:
        5px 5px 0 #ff99cc;

}

.btn-pro.gray{

    background:#555;

    color:#fff;

    box-shadow:
        5px 5px 0 #888;

}


/* =========================================================
   タイトル
   ========================================================= */

.title-logo{

    font-family:
        Montserrat,
        sans-serif;

    font-size:
        clamp(
            3.5rem,
            15vw,
            8rem
        );

    margin:0;

    text-align:center;

    text-shadow:
        0 0 30px var(--teal);

}

.title-sub{

    letter-spacing:12px;

    font-weight:900;

    color:var(--pink);

    margin-bottom:45px;

    text-align:center;

}


/* =========================================================
   学生証
   ========================================================= */

.student-id-card{

    width:min(90vw,350px);

    background:#fff;

    color:#333;

    border-radius:15px;

    padding:25px;

    margin:20px auto;

}

.student-input{

    display:block;

    width:100%;

    padding:10px 0;

    margin-bottom:15px;

    border:none;

    border-bottom:
        2px solid #333;

    background:none;

    color:#000;

    font-size:1.1rem;

    font-weight:bold;

    outline:none;

}


/* =========================================================
   ヘッダー
   ========================================================= */

.header-minimal{

    position:absolute;

    top:15px;

    left:15px;

    display:flex;

    align-items:center;

    gap:8px;

    z-index:300;

}

.av-mini{

    width:38px;

    height:38px;

    border-radius:50%;

    overflow:hidden;

    border:
        2px solid #fff;

    background:#222;

    cursor:pointer;

}

.av-mini img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.iro-coin-disp{

    margin-left:10px;

    color:var(--teal);

    font-weight:900;

    text-shadow:
        0 0 10px var(--teal);

}


/* =========================================================
   メイン
   ========================================================= */

.main-console-text{

    font-family:
        Montserrat,
        sans-serif;

    font-size:
        clamp(
            2rem,
            10vw,
            5.5rem
        );

    letter-spacing:8px;

    text-align:center;

    opacity:.8;

}


/* =========================================================
   ナビ
   ========================================================= */

.nav-container{

    position:absolute;

    bottom:25px;

    width:95%;

    max-width:900px;

    display:flex;

    gap:8px;

    justify-content:center;

}

.nav-card{

    flex:1;

    min-width:0;

    padding:18px 5px;

    border:
        1px solid #444;

    border-radius:12px;

    background:
        rgba(0,0,0,.65);

    text-align:center;

    font-size:.8rem;

    font-weight:900;

    cursor:pointer;

}

.nav-card.main{

    background:var(--pink);

}


/* =========================================================
   プレゼント
   ========================================================= */

.present-btn{

    position:absolute;

    top:75px;

    left:15px;

    width:45px;

    height:45px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid #444;

    border-radius:50%;

    background:
        rgba(255,255,255,.05);

    cursor:pointer;

    z-index:300;

}

.present-badge{

    position:absolute;

    top:-3px;

    right:-3px;

    min-width:18px;

    height:18px;

    display:none;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:red;

    color:#fff;

    font-size:.65rem;

    font-weight:bold;

}


/* =========================================================
   シート
   ========================================================= */

#sheetOverlay{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.8);

    z-index:49000;

    display:none;

    backdrop-filter:
        blur(5px);

}

.bottom-sheet{

    position:fixed;

    left:0;

    bottom:-100%;

    width:100%;

    height:94%;

    overflow-y:auto;

    background:#0a0b12;

    border-radius:
        30px 30px 0 0;

    border-top:
        1px solid var(--border);

    z-index:50000;

    transition:
        .4s
        cubic-bezier(.16,1,.3,1);

}

.bottom-sheet.open{

    bottom:0;

}

.sheet-content{

    max-width:850px;

    margin:auto;

    padding:25px;

    padding-bottom:120px;

}


/* =========================================================
   メンバー
   ========================================================= */

.member-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(105px,1fr)
        );

    gap:12px;

}

.member-card{

    position:relative;

    padding:10px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.2);

    border-radius:12px;

    text-align:center;

    cursor:pointer;

}

.member-card img{

    width:100%;

    height:110px;

    object-fit:cover;

    border-radius:6px;

}

.count-badge{

    position:absolute;

    top:5px;

    right:5px;

    padding:2px 8px;

    background:var(--pink);

    border-radius:10px;

    font-size:.7rem;

}


/* =========================================================
   フレンド
   ========================================================= */

.friend-box{

    margin-bottom:15px;

    padding:10px;

    background:#fff;

    border-radius:12px;

}


/* =========================================================
   履歴
   ========================================================= */

.history-item{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    padding:12px;

    margin-bottom:8px;

    border-left:
        4px solid #555;

    border-radius:8px;

    background:
        rgba(255,255,255,.05);

}


/* =========================================================
   ゲーム
   ========================================================= */

#gameLayer{

    position:fixed;

    inset:0;

    display:none;

    z-index:10000;

    background:#000;

}

#gameFrame{

    width:100%;

    height:100%;

    border:none;

}


/* =========================================================
   ポーズ
   ========================================================= */

#mobilePauseBtn{

    position:fixed;

    top:15px;

    right:15px;

    width:45px;

    height:45px;

    display:none;

    align-items:center;

    justify-content:center;

    border:
        1px solid #fff;

    border-radius:50%;

    background:
        rgba(0,0,0,.8);

    z-index:15000;

    cursor:pointer;

}

#pauseOverlay{

    position:fixed;

    inset:0;

    display:none;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:
        rgba(0,0,0,.95);

    z-index:60000;

}


/* =========================================================
   認証バッジ
   ========================================================= */

.badge-verify{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    width:18px;

    height:18px;

    margin-left:5px;

    border-radius:50%;

    background:#1da1f2;

    font-size:10px;

}

.badge-verify::after{

    content:"✔";

}


/* =========================================================
   レスポンシブ
   ========================================================= */

@media(max-width:600px){

    .nav-card{

        font-size:.65rem;

        padding:14px 2px;

    }

    .main-console-text{

        letter-spacing:4px;

    }

}

</style>

</head>


<body>

<div class="bg-overlay"></div>

<div
id="sheetOverlay"
onclick="closeAllSheets()">
</div>


<!-- ポーズ -->

id="mobilePauseBtn"

</div>

<h1

font-family:Montserrat;
color:var(--teal);

id="gameScreen"

class="av-mini"
onclick="openSheet('sheetConfig')">

id="hAv"

<script>


/* =========================================================
   GAS
   ========================================================= */

const GAS_URL =
'https://script.google.com/macros/s/AKfycbxzIYmakpPZtvBo12_zQkeMfZuiJdmEXZgpB30u34UBkNOGZt5_MfSiTnkxFltJEayk/exec';


/* =========================================================
   ローカルデータ
   ========================================================= */

let myId =
localStorage.getItem('gID');


if(!myId){

    myId =
        Math.random()
        .toString(36)
        .substring(2,12)
        .toUpperCase();

    localStorage.setItem(
        'gID',
        myId
    );

}


let iroCoins =
Number(
    localStorage.getItem('gCoins') || 0
);


let myChars =
localStorage.getItem('gChars') || "";


let globalCharaPool = {

    star2:[],

    star3:[],

    star4:[]

};


let friendsData = [];

let claimedPresents = [];

let syncTimer = null;


/* =========================================================
   初期化
   ========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    function(){

        if(
            localStorage.getItem('gName')
        ){

            document
            .getElementById('regName')
            .value =
                localStorage.getItem('gName');

        }

    }
);


/* =========================================================
   ログイン
   ========================================================= */

function handleLoginClick(){

    if(
        !localStorage.getItem('gName')
    ){

        transition(
            'titleScreen',
            'registrationScreen'
        );

    }else{

        beginPortalSync();

    }

}


/* =========================================================
   登録
   ========================================================= */

async function saveRegistration(){

    const name =
        document
        .getElementById('regName')
        .value
        .trim();


    const pass =
        document
        .getElementById('regPass')
        .value
        .trim();


    if(!name || !pass){

        alert(
            '名前と合言葉を入力してください'
        );

        return;

    }


    localStorage.setItem(
        'gName',
        name
    );

    localStorage.setItem(
        'gPass',
        pass
    );


    beginPortalSync();

}


/* =========================================================
   同期開始
   ========================================================= */

async function beginPortalSync(){

    transition(
        'registrationScreen',
        'loadingScreen'
    );

    transition(
        'titleScreen',
        'loadingScreen'
    );


    try{

        const response =
            await fetch(
                GAS_URL +
                '?action=getCharaPools'
            );


        const data =
            await response.json();


        if(
            data &&
            !data.result
        ){

            globalCharaPool =
                data;

        }


    }catch(error){

        console.error(
            'キャラクター取得エラー',
            error
        );

    }


    const success =
        await fetchSync();


    if(success){

        transition(
            'loadingScreen',
            'gameScreen'
        );


        if(syncTimer){

            clearInterval(
                syncTimer
            );

        }


        syncTimer =
            setInterval(
                fetchSync,
                15000
            );


    }else{

        alert(
            '同期に失敗しました'
        );


        transition(
            'loadingScreen',
            'titleScreen'
        );

    }

}


/* =========================================================
   同期
   ========================================================= */

async function fetchSync(){

    try{

        const response =
            await fetch(
                GAS_URL +
                '?id=' +
                encodeURIComponent(myId)
            );


        const json =
            await response.json();


        if(
            json.result !== 'success'
        ){

            return false;

        }


        iroCoins =
            Number(
                json.iroCoin || 0
            );


        myChars =
            json.chars || "";


        friendsData =
            json.friendsData || [];


        claimedPresents =
            json.claimed
            ? json.claimed
                .split(',')

/* =========================================================
   画面切り替え
   ========================================================= */

function transition(
    from,
    to
){

    const current =
        document.getElementById(from);


    const next =
        document.getElementById(to);


    if(current){

        current.classList.add(
            'hidden'
        );

        setTimeout(
            function(){

                current.style.display =
                    'none';

            },
            400
        );

    }


    if(next){

        next.style.display =
            'flex';


        setTimeout(
            function(){

                next.classList.remove(
                    'hidden'
                );

            },
            30
        );

    }

}


/* =========================================================
   メンバー
   ========================================================= */

function renderMembers(){

    const container =
        document
        .getElementById(
            'memberListContainer'
        );


    if(!myChars){

        container.innerHTML =
            '<p>所持キャラクターなし</p>';

        return;

    }


    const counts = {};


    myChars
    .split(',')
    .filter(Boolean)
    .forEach(
        function(name){

            counts[name] =
                (counts[name] || 0) + 1;

        }
    );


    const master = [

        ...(globalCharaPool.star2 || []),

        ...(globalCharaPool.star3 || []),

        ...(globalCharaPool.star4 || [])

    ];


    container.innerHTML = '';


    Object.keys(counts)
    .forEach(
        function(name){

            const char =
                master.find(
                    function(c){
                        return c.name === name;
                    }
                );


            if(!char){

                return;

            }


            const card =
                document.createElement(
                    'div'
                );


            card.className =
                'member-card';


            card.innerHTML =

                '<div class="count-badge">' +
                'x' +
                counts[name] +
                '</div>' +

                '<img src="' +
                escapeAttr(char.img) +
                '">' +

                '<small>' +
                escapeHtml(char.name) +
                '</small>';


            card.onclick =
                function(){

                    showMemberDetail(
                        char.name
                    );

                };


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   キャラクター詳細
   ========================================================= */

function showMemberDetail(name){

    const master = [

        ...(globalCharaPool.star2 || []),

        ...(globalCharaPool.star3 || []),

        ...(globalCharaPool.star4 || [])

    ];


    const char =
        master.find(
            function(c){
                return c.name === name;
            }
        );


    if(!char){

        return;

    }


    let stars = 2;


    if(
        (globalCharaPool.star4 || [])
        .some(
            c => c.name === name
        )
    ){

        stars = 4;

    }else if(

        (globalCharaPool.star3 || [])
        .some(
            c => c.name === name
        )

    ){

        stars = 3;

    }


    document
    .getElementById(
        'memberDetailContent'
    )
    .innerHTML =

        '<img src="' +
        escapeAttr(char.img) +
        '" style="width:220px;max-width:80%;border-radius:15px;">' +

        '<div style="color:#ffcc00;font-size:2rem;margin:15px">' +
        '★'.repeat(stars) +
        '</div>' +

        '<h1>' +
        escapeHtml(char.name) +
        '</h1>';


    document
    .getElementById(
        'giftSelectionArea'
    )
    .style.display =
        'none';


    document
    .getElementById(
        'startGiftBtn'
    )
    .onclick =
        function(){

            if(!friendsData.length){

                alert(
                    'フレンドがいません'
                );

                return;

            }


            const list =
                document
                .getElementById(
                    'giftFriendList'
                );


            list.innerHTML = '';


            friendsData.forEach(
                function(friend){

                    const div =
                        document.createElement(
                            'div'
                        );


                    div.style.cssText =
                        'padding:12px;' +
                        'border-bottom:1px solid #ddd;' +
                        'cursor:pointer;';


                    div.innerHTML =
                        escapeHtml(
                            friend.name
                        ) +
                        ' ➜ 贈る';


                    div.onclick =
                        function(){

                            executeMemberGift(
                                friend.id,
                                friend.name,
                                char.name
                            );

                        };


                    list.appendChild(
                        div
                    );

                }
            );

/* =========================================================
   キャラクターを贈る
   ========================================================= */

async function executeMemberGift(
    targetId,
    targetName,
    charName
){

    if(
        !confirm(
            targetName +
            'さんに「' +
            charName +
            '」を贈りますか？'
        )
    ){

        return;

    }


    try{

        const response =
            await postData({

                type:
                    'friendMemberGift',

                fromId:
                    myId,

                fromName:
                    document
                    .getElementById(
                        'hName'
                    )
                    .innerText,

                toId:
                    targetId,

                charName:
                    charName

            });


        if(
            response &&
            response.result === 'error'
        ){

            alert(
                response.message ||
                '送信できませんでした'
            );

            return;

        }


        alert(
            'プレゼントしました'
        );


        closeSheet(
            'sheetMemberDetail'
        );


        await fetchSync();


    }catch(error){

        console.error(error);

        alert(
            '送信中にエラーが発生しました'
        );

    }

}

/* ガチャ */

function startPull(n){

    n =
        Math.floor(
            Number(n)
        );


    if(!n || n < 1){

        return;

    }


    const cost =
        n * 300;


    if(coins < cost){

        alert(
            'コインが不足しています'
        );

        return;

    }


    const availablePools = {

        star2:
            pools.star2 || [],

        star3:
            pools.star3 || [],

        star4:
            pools.star4 || []

    };


    if(
        !availablePools.star2.length ||
        !availablePools.star3.length ||
        !availablePools.star4.length
    ){

        alert(
            'キャラクタープールが不足しています'
        );

        return;

    }


    coins -= cost;


    document
    .getElementById('c')
    .innerText =
        coins.toLocaleString();


    results = [];


    let hasS4 = false;

    let hasS3 = false;


    for(
        let i=0;
        i<n;
        i++
    ){

        let rank = 2;

        const random =
            Math.random() * 100;


        if(random < 3.5){

            rank = 4;

        }else if(random < 16){

            rank = 3;

        }


        /* 100連なら最後に★4保証 */

        if(
            n >= 100 &&
            i === n - 1 &&
            !hasS4
        ){

            rank = 4;

        }


        /* 10連以上なら★3以上保証 */

        else if(
            n >= 10 &&
            i === n - 1 &&
            !hasS3 &&
            rank < 3
        ){

            rank = 3;

        }


        if(rank === 4){

            hasS4 = true;

        }


        if(rank >= 3){

            hasS3 = true;

        }


        const pool =
            availablePools[
                'star' + rank
            ];


        const char =
            pool[
                Math.floor(
                    Math.random() *
                    pool.length
                )
            ];


        results.push({

            name:char.name,

            img:char.img,

            rank:rank

        });

    }


    /* GASへ一度だけ通知 */

    window.parent.postMessage({

        type:'gachaPull',

        value:coins,

        pulls:n,

        chars:
            results
            .map(c => c.name)
            .join(',')

    },'*');


    current = 0;


    document
    .getElementById('skip')
    .style.display =
        'block';


    showReveal();

}

function uploadIcon(input){

    if(
        !input.files ||
        !input.files[0]
    ){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        async function(event){

            const image =
                event.target.result;


            localStorage.setItem(
                'gAv',
                image
            );


            document
            .getElementById(
                'hAv'
            )
            .src =
                image;


            document
            .getElementById(
                'mAv'
            )
            .src =
                image;


            await fetchSync();

        };


    reader.readAsDataURL(
        input.files[0]
    );

}

/* =========================================================
   ゲーム一覧
   ========================================================= */

async function loadGameList(){

    const container =
        document
        .getElementById(
            'gameListContainer'
        );


    container.innerHTML =
        '<p>読み込み中...</p>';


    try{

        const response =
            await fetch(
                GAS_URL +
                '?action=getList'
            );


        const result =
            await response.json();


        if(!Array.isArray(result)){

            throw new Error(
                'ゲーム一覧が不正です'
            );

        }


        container.innerHTML = '';


        if(!result.length){

            container.innerHTML =
                '<p>ゲームがありません</p>';

            return;

        }


        result.forEach(
            function(game){

                const card =
                    document.createElement(
                        'div'
                    );


                card.className =
                    'nav-card';


                card.style.width =
                    '150px';


                card.innerText =
                    game.title;


                card.onclick =
                    function(){

                        launchGame(
                            game.id
                        );

                    };


                container.appendChild(
                    card
                );

            }
        );


    }catch(error){

        console.error(error);


        container.innerHTML =
            '<p>ゲーム一覧の取得に失敗しました</p>';

    }

}

async function launchGame(id){

    try{

        const response =
            await fetch(
                GAS_URL +
                '?action=getCode&row=' +
                encodeURIComponent(id)
            );


        const result =
            await response.json();


        if(
            result.result !==
            'success'
        ){

            alert(
                result.message ||
                'ゲームコード取得失敗'

            return;

        }


        document
        .getElementById(
            'gameLayer'
        )
        .style.display =

        document
        .getElementById(
            'mobilePauseBtn'
        )
        .style.display =
            'flex';


        document
        .getElementById(
            'gameFrame'
        )
        .srcdoc =
            result.code || '';


    }catch(error){

        console.error(error);

        alert(
            'ゲーム起動に失敗しました'
        );

    }

}

/* =========================================================
   フレンド申請
   ========================================================= */

async function sendReq(){

    const input =
        document
        .getElementById(
            'fIdIn'
        );


    const targetId =
        input
        .value
        .trim()
        .toUpperCase();


    if(!targetId){

        alert(
            'IDを入力してください'
        );

        return;

    }


    if(targetId === myId){

        alert(
            '自分自身には申請できません'
        );

        return;

    }


    try{

        const result =
            await postData({

                type:'request',

                myId:myId,

                targetId:targetId

            });


        if(
            result &&
            result.result === 'error'
        ){

            alert(
                result.message
            );

            return;

        }


        alert(
            'フレンド申請を送信しました'
        );


        input.value = '';


        await fetchSync();


    }catch(error){

        console.error(error);

        alert(
            '申請に失敗しました'
        );

    }

}

/* =========================================================
   コイン送信
   ========================================================= */

async function sendFriendGift(targetId){

    const value =
        prompt(
            '送るコイン枚数',
            '100'
        );


    if(value === null){

        return;

    }


    const amount =
        Number(value);


    if(
        !Number.isFinite(amount) ||
        amount <= 0 ||
        !Number.isInteger(amount)
    ){

        alert(
            '正しい枚数を入力してください'
        );

        return;

    }


    if(
        iroCoins < amount
    ){

        alert(
            'コインが不足しています'
        );

        return;

    }


    try{

        const result =
            await postData({

                type:'friendGift',

                fromId:myId,

                fromName:
                    document
                    .getElementById(
                        'hName'
                    )
                    .innerText,

                toId:targetId,

                amount:amount

            });


        if(
            result &&
            result.result === 'error'
        ){

            alert(
                result.message
            );

            return;

        }


        iroCoins -= amount;


        localStorage.setItem(
            'gCoins',
            String(iroCoins)
        );


        document
        .getElementById(
            'hIroCoin'
        )
        .innerText =
            iroCoins.toLocaleString();


        await fetchSync();


    }catch(error){

        console.error(error);

        alert(
            '送信に失敗しました'
        );

    }

}

/* =========================================================
   データ復元
   ========================================================= */

async function executeTransfer(){

    const id =
        document
        .getElementById(
            'tIdIn'
        )
        .value
        .trim()
        .toUpperCase();


    const pass =
        document
        .getElementById(
            'tPassIn'
        )
        .value;


    if(!id || !pass){

        alert(
            'IDと合言葉を入力してください'
        );

        return;

    }


    try{

        const response =
            await fetch(
                GAS_URL +
                '?id=' +
                encodeURIComponent(id)
            );


        const json =
            await response.json();


        if(
            json.result === 'success' &&
            String(json.pass) ===
            String(pass)
        ){

            localStorage.setItem(
                'gID',
                id
            );


            localStorage.setItem(
                'gName',
                json.name || ''
            );


            localStorage.setItem(
                'gPass',
                pass
            );


            localStorage.setItem(
                'gCoins',
                String(
                    json.iroCoin || 0
                )
            );


            localStorage.setItem(
                'gChars',
                json.chars || ''
            );


            if(json.avatar){

                localStorage.setItem(
                    'gAv',
                    json.avatar
                );

            }


            alert(
                'データを復元しました'
            );


            location.reload();


        }else{

            alert(
                'IDまたは合言葉が違います'
            );

        }


    }catch(error){

        console.error(error);

        alert(
            'データ復元中にエラーが発生しました'
        );

    }

}


/* =========================================================
   POST
   ========================================================= */

async function postData(data){

    const response =
        await fetch(
            GAS_URL,
            {

                method:'POST',

                mode:'no-cors',

                headers:{
                    'Content-Type':
                        'text/plain;charset=utf-8'
                },

                body:
                    JSON.stringify(data)

            }
        );


    /*
     * no-corsの場合、
     * ブラウザからレスポンス本文を取得できません。
     *
     * そのため基本的には
     * 「送信できた」
     * という扱いにします。
     */

    return {
        result:'success'
    };

}


/* =========================================================
   HTMLエスケープ
   ========================================================= */

function escapeHtml(value){

    return String(value ?? '')
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}


function escapeAttr(value){

    return escapeHtml(value);

}
