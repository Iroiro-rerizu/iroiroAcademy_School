<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>学園クロニクル</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --board:#12352a; --board-2:#0c2219; --chalk:#f6f3ea; --dusk:#ff8a4c; --sakura:#ff5fa2;
  --ink:#0e1830; --mint:#5ff0c0; --line:rgba(246,243,234,.28);
  --font-d:'Dela Gothic One','Zen Maru Gothic',sans-serif;
  --font-b:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--ink);color:var(--chalk);font-family:var(--font-b);font-weight:500;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

/* ---- 背景：夕暮れの校舎 ---- */
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#1c2a5c 0%,#7b3f86 42%,#ee7b6b 74%,#ffb36b 100%)}
.bg-school{position:fixed;left:0;right:0;bottom:0;height:34vh;min-height:170px;z-index:-1;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 300' preserveAspectRatio='xMidYMax slice'><g fill='%230e1830'><rect x='0' y='230' width='1200' height='70'/><rect x='260' y='120' width='680' height='120'/><rect x='520' y='60' width='160' height='70'/><polygon points='510,60 600,10 690,60'/><rect x='80' y='170' width='150' height='70'/><rect x='970' y='160' width='170' height='80'/></g><g fill='%23ffd88a'><rect x='290' y='145' width='36' height='28'/><rect x='350' y='145' width='36' height='28'/><rect x='410' y='145' width='36' height='28'/><rect x='470' y='145' width='36' height='28'/><rect x='700' y='145' width='36' height='28'/><rect x='760' y='145' width='36' height='28'/><rect x='820' y='145' width='36' height='28'/><rect x='880' y='145' width='36' height='28'/><rect x='560' y='80' width='30' height='26'/><rect x='610' y='80' width='30' height='26'/><circle cx='600' cy='36' r='9'/></g></svg>") center bottom/cover no-repeat}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(8,12,30,.55) 100%)}

/* ---- 画面 / レイヤー ---- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;z-index:100;overflow-y:auto}
.screen.hidden{display:none}
.layer{position:fixed;inset:0;display:none;z-index:10000}
.layer.show{display:flex}

/* ---- ボタン ---- */
.btn{position:relative;display:block;border:0;cursor:pointer;font-weight:900;font-size:1.05rem;color:var(--ink);background:var(--chalk);
  padding:15px 34px;width:86%;max-width:300px;margin:10px auto;border-radius:6px;transform:skewX(-10deg);box-shadow:5px 5px 0 var(--mint);transition:transform .12s,box-shadow .12s}
.btn>span{display:inline-block;transform:skewX(10deg)}
.btn:active{transform:skewX(-10deg) translate(3px,3px);box-shadow:0 0 0 var(--mint)}
.btn.pink{background:var(--sakura);color:#fff;box-shadow:5px 5px 0 var(--ink)}
.btn.gray{background:#3a3f55;color:#fff;box-shadow:5px 5px 0 #1a1e2e}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-small{border:1.5px solid var(--line);background:rgba(0,0,0,.45);color:var(--chalk);border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer}

/* ---- タイトル ---- */
.title-mark{font-family:var(--font-d);font-size:clamp(3rem,15vw,7.5rem);line-height:1;margin:0;text-align:center;text-shadow:4px 4px 0 var(--ink),0 0 28px rgba(255,138,76,.8)}
.title-sub{font-weight:900;letter-spacing:.5em;color:#fff;margin:14px 0 40px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6)}

/* ---- 黒板パネル ---- */
.board{background:linear-gradient(135deg,var(--board),var(--board-2));border:6px solid #c9975b;border-radius:10px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.board h3{margin:0 0 14px;font-family:var(--font-d);font-weight:400}
.field{width:100%;background:rgba(255,255,255,.08);border:0;border-bottom:2px solid var(--chalk);color:var(--chalk);font-family:inherit;font-weight:700;font-size:1.1rem;padding:11px 8px;margin-bottom:14px;border-radius:4px 4px 0 0}
.field::placeholder{color:rgba(246,243,234,.55)}
.note{font-size:.75rem;color:#ffd1e5;font-weight:700;margin:0}
.reg-card{width:100%;max-width:360px;margin:16px auto}

/* ---- ホーム ---- */
.hud{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;gap:10px;z-index:200}
.av-mini{width:42px;height:42px;border-radius:50%;border:2px solid var(--chalk);overflow:hidden;background:#222;cursor:pointer;padding:0;flex:none}
.av-mini img{width:100%;height:100%;object-fit:cover;display:block}
.hud-name{font-weight:900;font-size:.95rem;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.coin-pill{margin-left:auto;background:rgba(0,0,0,.55);border:1.5px solid var(--mint);color:var(--mint);font-weight:900;border-radius:30px;padding:7px 16px}
.badge-verify{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;background:linear-gradient(135deg,#1da1f2,#0e71c8);color:#fff;border-radius:50%;font-size:10px;border:1.5px solid #fff;vertical-align:middle}
.present-btn{position:absolute;top:calc(68px + env(safe-area-inset-top));left:14px;width:46px;height:46px;background:rgba(0,0,0,.45);border:1.5px solid var(--line);border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;z-index:300;font-size:1.3rem;padding:0;color:inherit}
.present-badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 4px;background:#e53030;border-radius:10px;border:1.5px solid #fff;font-size:.65rem;display:none;justify-content:center;align-items:center;font-weight:900}
.home-title{font-family:var(--font-d);font-size:clamp(2.4rem,11vw,5.5rem);text-align:center;margin:0;text-shadow:4px 4px 0 var(--ink)}
.home-sub{margin:10px 0 0;font-weight:900;letter-spacing:.3em;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.nav{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;margin:0 auto;display:flex;gap:8px;width:95%;max-width:900px;z-index:300}
.nav-card{flex:1;min-width:0;background:rgba(14,24,48,.82);border:1.5px solid var(--line);padding:17px 2px;border-radius:12px;cursor:pointer;text-align:center;font-weight:900;font-size:.82rem;color:var(--chalk);white-space:nowrap;transition:transform .12s}
.nav-card:active{transform:scale(.95)}
.nav-card.main{background:var(--sakura);border-color:transparent;color:#fff}

/* ---- ボトムシート ---- */
.overlay{position:fixed;inset:0;background:rgba(5,8,20,.75);z-index:49000;display:none;backdrop-filter:blur(4px)}
.sheet{position:fixed;left:0;bottom:-100%;width:100%;height:92%;background:#0d1426;border-radius:26px 26px 0 0;z-index:50000;transition:bottom .35s cubic-bezier(.16,1,.3,1);overflow-y:auto;border-top:1px solid var(--line)}
.sheet.open{bottom:0}
.sheet-in{padding:24px 22px 110px;max-width:800px;margin:0 auto}
.sheet h2{font-family:var(--font-d);font-weight:400;color:var(--mint);margin:0 0 16px}
.sheet h2.pink{color:var(--sakura)}
.empty{color:rgba(246,243,234,.55);font-weight:700;padding:10px 0}

.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.member{position:relative;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;cursor:pointer;color:inherit;font-family:inherit}
.member img{width:100%;height:110px;object-fit:cover;border-radius:6px;border:1.5px solid var(--chalk);display:block;background:#222}
.member small{display:block;margin-top:5px;font-weight:700;line-height:1.3}
.count-badge{position:absolute;top:4px;right:4px;background:var(--sakura);font-size:.72rem;font-weight:900;padding:2px 8px;border-radius:10px;border:1.5px solid #fff;z-index:2}
.detail-img{width:min(260px,70%);aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:3px solid var(--chalk);background:#222}
.stars{color:#ffcc33;font-size:1.8rem;margin:8px 0}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row .grow{min-width:0;overflow:hidden;text-overflow:ellipsis}
.mini{border:0;border-radius:8px;padding:8px 12px;font-weight:900;cursor:pointer;background:var(--chalk);color:var(--ink);font-family:inherit}
.mini.pink{background:var(--sakura);color:#fff}
.mini.gray{background:#444b66;color:#fff}
.hist{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;background:rgba(255,255,255,.05);border-left:4px solid #556;padding:10px 12px;border-radius:8px;margin-bottom:6px;font-size:.85rem}
.hist b{text-align:right}
.sec-title{font-weight:900;margin:18px 0 8px;color:#ffd1e5}
.id-row{display:flex;gap:8px;margin-top:14px}
.id-row .field{margin:0;flex:1}

/* ---- 学生証 ---- */
.id-card{background:var(--chalk);color:var(--ink);border-radius:16px;padding:22px;border:3px solid #556;max-width:360px;margin:6px auto 18px;text-align:left}
.id-card .field{color:var(--ink);border-bottom-color:var(--ink);background:rgba(0,0,0,.04)}
.id-card .field::placeholder{color:rgba(14,24,48,.5)}
.id-photo{display:block;margin:0 auto 10px;width:105px;height:140px;border:3px solid var(--ink);object-fit:cover;background:#eee;cursor:pointer;border-radius:10px}

/* ---- 課外活動 ---- */
.quest-list{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%;max-width:900px;padding:16px 0}
.quest-card{width:140px;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:rgba(14,24,48,.82);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-weight:900;color:var(--chalk);font-family:inherit;font-size:.95rem}
.quest-card:active{transform:scale(.95)}
.screen h2.head{font-family:var(--font-d);font-weight:400;font-size:2rem;color:#fff;text-shadow:3px 3px 0 var(--ink);margin:0}

/* ---- スカウト ---- */
#gachaLayer{background:#000;flex-direction:column}
.g-bg{position:absolute;inset:0;transition:background .4s}
.g-ui{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,.25),transparent 40%,rgba(0,0,0,.85));min-height:0}
.g-top{display:flex;justify-content:space-between;align-items:center}
.g-tabs{display:flex;gap:10px;overflow-x:auto;padding:6px 2px}
.g-tab{flex:none;min-width:120px;height:60px;padding:0 10px;border-radius:10px;border:2px solid transparent;background:rgba(0,0,0,.55) center/cover;color:#fff;font-weight:900;font-size:.8rem;opacity:.65;cursor:pointer;text-shadow:0 1px 4px #000}
.g-tab.active{border-color:#ffcc33;opacity:1;box-shadow:0 0 14px #ffcc33}
.g-title h1{font-family:var(--font-d);font-weight:400;font-size:clamp(1.8rem,8vw,3.2rem);margin:0;text-shadow:3px 3px 0 #000}
.g-title p{margin:6px 0 0;font-weight:700;text-shadow:0 1px 6px #000}
.g-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.pull{border:0;border-radius:14px;padding:16px 20px;min-width:140px;color:#fff;font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35);font-family:inherit}
.pull small{display:block;font-weight:700;opacity:.9;margin-top:3px}
.pull.p1{background:#555}.pull.p10{background:linear-gradient(#ff88bb,#ff3399)}.pull.p100{background:linear-gradient(#ffcc00,#ff6600)}
.pull:disabled{opacity:.5}

#revealLayer{z-index:20000;flex-direction:column;justify-content:flex-end;align-items:center;background:#000;cursor:pointer;overflow:hidden}
.rev-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:slowzoom 12s linear infinite}
@keyframes slowzoom{from{transform:scale(1)}to{transform:scale(1.12)}}
.rev-shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.92))}
.rev-body{position:relative;text-align:center;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
.rev-stars{display:flex;justify-content:center;gap:10px;font-size:2.6rem;color:#ffcc33;text-shadow:0 0 18px #000;min-height:3.2rem}
.rev-stars span{animation:pop .35s both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.rev-body h1{font-family:var(--font-d);font-weight:400;font-size:clamp(1.8rem,8vw,3.4rem);margin:6px 0}
.rev-body .rk{display:inline-block;background:var(--sakura);padding:3px 14px;border-radius:20px;font-weight:900;font-size:.85rem}
.skip{position:absolute;top:calc(20px + env(safe-area-inset-top));right:20px;z-index:3}
#summaryLayer{z-index:21000;background:rgba(5,8,20,.96);flex-direction:column;align-items:center;justify-content:center;padding:18px}
.sum-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:92%;overflow-y:auto;max-height:70vh}
.sum-card{width:82px;text-align:center;background:rgba(255,255,255,.1);border-radius:8px;padding:5px;font-size:.7rem}
.sum-card img{width:66px;height:86px;object-fit:cover;border-radius:4px;border:1px solid #fff;display:block;margin:0 auto 3px;background:#222}
.sum-card .s4{color:#ffcc33}

.side-btn2{top:calc(122px + env(safe-area-inset-top))}
.home-area{margin:14px 0 0;font-weight:900;font-size:1.05rem;background:rgba(0,0,0,.45);border:1.5px solid var(--line);border-radius:30px;padding:8px 20px;cursor:pointer;color:var(--chalk);font-family:inherit}

/* ---- エリア（ホーム画面：プロセカ風） ---- */
#areaLayer{z-index:90;background:#bfe9ff}
#stage{position:absolute;inset:0;overflow:hidden;cursor:pointer;touch-action:manipulation;user-select:none;--h:clamp(104px,17vh,172px)}
.sc-sky{position:absolute;left:0;right:0;top:0;height:46%}
.sc-ground{position:absolute;left:0;right:0;top:46%;bottom:0}
.pl{position:absolute;width:0;height:0;transition-property:left,top;transition-timing-function:linear;pointer-events:none}
.pl.talk{z-index:9999!important}
.pl .wrap{position:absolute;left:0;bottom:0;transform:translate(-50%,0) scale(var(--s,1));transform-origin:50% 100%;transition:transform var(--d,0s) linear}
.pl .wrap::before{content:"";position:absolute;left:50%;bottom:-5px;width:78%;height:12px;transform:translateX(-50%);border-radius:50%;background:rgba(40,40,80,.28);filter:blur(2px)}
.chibi{position:relative;width:calc(var(--h)*.78);height:var(--h)}
.chibi svg{width:100%;height:100%;display:block;overflow:visible}
.cb-face{position:absolute;left:50%;top:3%;width:74%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;border:3px solid #fff;object-fit:cover;object-position:50% 18%;background:#ddd;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pl.walk .chibi{animation:bob .38s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.pl .tag{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(40,48,80,.72);color:#fff;font-size:.62rem;font-weight:900;padding:2px 9px;border-radius:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.pl.me .tag{background:rgba(255,95,162,.9)}
.newtag{position:absolute;right:-14px;bottom:-4px;font-weight:900;font-style:italic;font-size:.8rem;color:#ff6a3d;-webkit-text-stroke:3px #fff;paint-order:stroke fill;transform:rotate(-8deg);pointer-events:none;display:none}
.newtag.show{display:block;animation:pop .3s both}
.bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);display:none;width:max-content;max-width:190px;background:#f4f4f8;color:#3b4058;font-weight:700;font-size:.92rem;line-height:1.45;padding:10px 16px;border-radius:18px;word-break:break-word;box-shadow:0 3px 8px rgba(30,40,80,.28)}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#f4f4f8}
.bubble.show{display:block;animation:pop .22s both}
.bubble.stamp{background:transparent;box-shadow:none;font-size:2.8rem;padding:0;line-height:1}
.bubble.stamp::after{display:none}

.h-left{position:absolute;z-index:30;top:calc(10px + env(safe-area-inset-top));left:10px;display:flex;align-items:center;gap:6px}
.globe{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);font-size:1.4rem;cursor:pointer;flex:none;padding:0}
.loc-pill{display:flex;flex-direction:column;justify-content:center;height:44px;background:rgba(40,48,80,.8);border-radius:22px;padding:0 18px 0 14px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.loc-pill b{font-size:.88rem;white-space:nowrap}
.loc-pill small{font-size:.62rem;opacity:.85}
.h-me{position:absolute;z-index:30;top:calc(62px + env(safe-area-inset-top));left:10px;display:flex;align-items:center;gap:8px;background:rgba(40,48,80,.72);border-radius:22px;padding:4px 14px 4px 4px;cursor:pointer;max-width:55%}
.h-me img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#222;flex:none}
.h-me b{font-size:.78rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-me small{font-size:.62rem;opacity:.85;display:block}
.h-right{position:absolute;z-index:30;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;align-items:center;gap:6px}
.coin-pill2{background:rgba(40,48,80,.8);border-radius:22px;padding:0 12px;height:38px;display:flex;align-items:center;gap:4px;font-weight:900;font-size:.85rem;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.round{width:38px;height:38px;border-radius:50%;border:0;background:rgba(40,48,80,.8);color:#fff;font-size:1.05rem;cursor:pointer;padding:0}
.round.menu{background:#fff;color:#2b3350;width:42px;height:42px;font-size:1.3rem;font-weight:900;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.h-side{position:absolute;z-index:30;top:calc(64px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;gap:10px}
.side{position:relative;width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.92);font-size:1.3rem;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);padding:0}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:#e5486a;color:#fff;font-size:.65rem;font-weight:900;display:none;justify-content:center;align-items:center;border:1.5px solid #fff}
.h-act{position:absolute;z-index:30;left:10px;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.act{width:60px;padding:6px 0;border-radius:14px;border:0;background:rgba(255,255,255,.93);color:#2b3350;font-weight:900;font-size:.58rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:inherit;box-shadow:0 3px 8px rgba(0,0,0,.28)}
.act b{font-size:1.4rem;line-height:1.1}
.act.on{background:var(--dusk)}
.a-nav{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,rgba(64,70,102,.88),rgba(40,46,74,.95));backdrop-filter:blur(3px)}
.a-nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:#fff;cursor:pointer;font-family:inherit;padding:0 4px;min-width:0}
.a-nav button+button{border-left:1px solid rgba(255,255,255,.12)}
.a-nav i{font-style:normal;font-size:1.6rem}
.a-nav span{text-align:left;line-height:1.15;min-width:0}
.a-nav b{display:block;font-size:.76rem;font-weight:900;white-space:nowrap}
.a-nav small{display:block;font-size:.52rem;opacity:.7;letter-spacing:.08em}
.a-hint{position:absolute;left:50%;top:30%;transform:translateX(-50%);z-index:25;background:rgba(40,48,80,.7);padding:8px 18px;border-radius:20px;font-weight:900;font-size:.85rem;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.a-toast{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#e5486a;color:#fff;font-weight:900;font-size:.8rem;padding:8px 16px;border-radius:20px;display:none;max-width:90%;text-align:center}
#aPanel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:800px;z-index:50;display:none;background:#0d1426;color:var(--chalk);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-height:64%;overflow-y:auto}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:900;color:var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--chalk);border-radius:20px;padding:8px 14px;font-weight:900;cursor:pointer;font-family:inherit}
.chip.active{background:var(--dusk);color:var(--ink);border-color:transparent}
.say-row{display:flex;gap:8px}
.say-row .field{margin:0;flex:1}
.stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stamp-btn{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:8px 2px;color:inherit;font-family:inherit;cursor:pointer;font-weight:700;font-size:.68rem}
.stamp-btn b{display:block;font-size:2rem;line-height:1.2}
.area-row{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1.5px solid var(--line);color:var(--chalk);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-family:inherit;cursor:pointer;font-size:1rem}
.area-row.active{border-color:var(--dusk);background:rgba(255,138,76,.18)}
.area-row b{font-size:1rem}.area-row small{display:block;opacity:.75;font-weight:700;margin-top:2px}
.log-row{margin-bottom:9px;font-size:.88rem;line-height:1.5;word-break:break-word}
.log-row b{color:var(--mint)}
.log-row.me b{color:var(--sakura)}
.log-row .tm{opacity:.5;font-size:.7rem;margin-left:6px}
@media (max-width:420px){.a-nav i{font-size:1.35rem}.a-nav b{font-size:.7rem}}

/* ---- ゲーム ---- */
#gameLayer{background:#000}
#gameFrame{width:100%;height:100%;border:0}
#pauseBtn{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;width:46px;height:46px;background:rgba(0,0,0,.65);border:1.5px solid #fff;border-radius:50%;display:none;z-index:15000;justify-content:center;align-items:center;font-weight:900;cursor:pointer;color:#fff;padding:0}
#pauseOverlay{position:fixed;inset:0;background:rgba(5,8,20,.95);z-index:60000;display:none;flex-direction:column;justify-content:center;align-items:center}
#pauseOverlay h1{font-family:var(--font-d);font-weight:400;font-size:3rem;color:var(--mint);margin:0 0 26px}

dialog{background:var(--board-2);color:var(--chalk);border:5px solid #c9975b;border-radius:14px;padding:26px;width:90%;max-width:340px}
dialog::backdrop{background:rgba(5,8,20,.75)}

@media (prefers-reduced-motion:reduce){.rev-img{animation:none}.rev-stars span{animation:none}}
</style>
</head>
<body>
<div class="bg"></div><div class="bg-school"></div><div class="vignette"></div>
<div id="sheetOverlay" class="overlay" onclick="closeAllSheets()"></div>

<!-- タイトル -->
<div id="titleScreen" class="screen">
  <h1 class="title-mark">学園<br>クロニクル</h1>
  <p class="title-sub">SCHOOL STAGE</p>
  <button class="btn" onclick="handleLoginClick()"><span>登校する</span></button>
  <button class="btn pink" onclick="document.getElementById('modalTransfer').showModal()"><span>データ引き継ぎ</span></button>
</div>

<!-- 新規入学 -->
<div id="registrationScreen" class="screen hidden">
  <h2 class="head">入学手続き</h2>
  <div class="board reg-card">
    <h3>学生証をつくる</h3>
    <input type="text" id="regName" class="field" placeholder="なまえ（12文字まで・みんなに見える）" maxlength="12" autocomplete="off">
    <input type="password" id="regPass" class="field" placeholder="合言葉（4文字以上・引き継ぎ用）" autocomplete="new-password">
    <p class="note">学生証IDは入学後に発行されます。IDと合言葉でデータを引き継げます。</p>
  </div>
  <button class="btn" id="regBtn" onclick="saveRegistration()"><span>入学する</span></button>
  <button class="btn gray" onclick="showScreen('titleScreen')"><span>もどる</span></button>
</div>

<div id="loadingScreen" class="screen hidden"><p style="font-weight:900;letter-spacing:.3em;font-size:1.4rem;text-shadow:0 2px 8px #000">登校中…</p></div>

<!-- 課外活動 -->
<div id="questScreen" class="screen hidden" style="background:rgba(8,12,30,.9);backdrop-filter:blur(4px)">
  <h2 class="head">課外活動</h2>
  <div id="gameListContainer" class="quest-list"></div>
  <button class="btn gray" onclick="goHome()"><span>もどる</span></button>
</div>

<!-- シート -->
<div id="sheetMember" class="sheet"><div class="sheet-in">
  <h2>生徒名簿</h2><div id="memberListContainer" class="member-grid"></div>
</div></div>

<div id="sheetMemberDetail" class="sheet"><div class="sheet-in" style="text-align:center">
  <div id="memberDetailContent"></div>
  <div id="giftSelectionArea" style="display:none;margin-top:18px;text-align:left">
    <h3 style="color:var(--sakura);margin:0 0 10px">贈る友達を選ぶ</h3>
    <div id="giftFriendList"></div>
  </div>
  <button class="btn pink" id="startGiftBtn"><span>友達にあげる</span></button>
  <button class="btn gray" onclick="closeSheet('sheetMemberDetail')"><span>もどる</span></button>
</div></div>

<div id="sheetPresent" class="sheet"><div class="sheet-in">
  <h2>おくりもの</h2><div id="pListContainer"></div>
  <h2 class="pink" style="margin-top:34px">コイン履歴</h2><div id="historyContainer"></div>
</div></div>

<div id="sheetConfig" class="sheet"><div class="sheet-in" style="text-align:center">
  <div class="id-card">
    <h3 style="margin:0 0 12px">学生証</h3>
    <img id="mAv" class="id-photo" alt="顔写真（タップで変更）" onclick="document.getElementById('fileIn').click()">
    <p style="font-size:.7rem;color:#667;margin:0 0 10px;text-align:center">ID: <b id="myIdDisplay">---</b></p>
    <input type="text" id="nIn" class="field" placeholder="なまえ" maxlength="12">
    <input type="password" id="pIn" class="field" placeholder="新しい合言葉（変えるときだけ）" autocomplete="new-password">
    <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="pickAvatar(this)">
  </div>
  <button class="btn" onclick="saveSettings()"><span>保存する</span></button>
  <button class="btn gray" onclick="logout()"><span>ログアウト</span></button>
</div></div>

<div id="sheetFriend" class="sheet"><div class="sheet-in">
  <h2 class="pink">友達</h2>
  <div class="sec-title">届いている申請</div><div id="reqList"></div>
  <div class="sec-title">申請中</div><div id="sentList"></div>
  <div class="sec-title">友達リスト</div><div id="fList"></div>
  <div class="id-row">
    <input type="text" id="fIdIn" class="field" placeholder="10桁のIDで検索" maxlength="10" autocomplete="off">
    <button class="mini pink" onclick="sendReq()">申請</button>
  </div>
</div></div>

<!-- ホーム＝エリア（プロセカ風） -->
<div id="areaLayer" class="layer">
  <div id="stage">
    <div id="scSky" class="sc-sky"></div><div id="scGround" class="sc-ground"></div>
    <div id="scPlayers"></div>
  </div>

  <div class="h-left">
    <button class="globe" data-act="panel" data-mode="area" aria-label="エリア移動">🌐</button>
    <div class="loc-pill"><b>📍 <span id="aLoc">-校門-</span></b><small id="aCount">在室 1人</small></div>
  </div>
  <div class="h-me" onclick="openSheet('sheetConfig')">
    <img id="hAv" alt="">
    <div style="min-width:0"><b><span id="hName">---</span><span id="hVerified"></span></b><small id="hLv">Lv.1</small></div>
  </div>
  <div class="h-right">
    <div class="coin-pill2">🪙 <span id="hCoin">---</span></div>
    <button class="round" onclick="openSheet('sheetConfig')" aria-label="学生証">⚙️</button>
    <button class="round menu" data-act="panel" data-mode="menu" aria-label="メニュー">☰</button>
  </div>
  <div class="h-side">
    <button class="side" onclick="openSheet('sheetPresent')" aria-label="おくりもの">🎁<span id="pBadge" class="badge">0</span></button>
    <button class="side" data-act="panel" data-mode="log" aria-label="ログ">📋<span id="logBadge" class="badge">0</span></button>
  </div>
  <div class="h-act">
    <button class="act" data-act="panel" data-mode="say"><b>💬</b>はなす</button>
    <button class="act" data-act="panel" data-mode="stamp"><b>😀</b>スタンプ</button>
    <button class="act" data-act="panel" data-mode="partner"><b>🎓</b>パートナー</button>
  </div>

  <div id="aHint" class="a-hint">地面をタップして歩こう</div>
  <div id="aToast" class="a-toast"></div>

  <nav class="a-nav">
    <button onclick="openGacha()"><i>🎰</i><span><b>スカウト</b><small>SCOUT</small></span></button>
    <button onclick="openSheet('sheetMember')"><i>🎧</i><span><b>生徒名簿</b><small>MEMBER</small></span></button>
    <button onclick="openSheet('sheetFriend')"><i>👫</i><span><b>友達</b><small>FRIEND</small></span></button>
    <button onclick="openQuest()"><i>🎵</i><span><b>課外活動</b><small>ACTIVITY</small></span></button>
  </nav>
  <div id="aPanel"></div>
</div>

<!-- スカウト -->
<div id="gachaLayer" class="layer">
  <div id="gBg" class="g-bg"></div>
  <div class="g-ui">
    <div>
      <div class="g-top">
        <div class="coin-pill" style="margin-left:0">🪙 <span id="gCoin">0</span></div>
        <button class="btn-small" onclick="closeGacha()">もどる</button>
      </div>
      <div id="gTabs" class="g-tabs" style="margin-top:14px"></div>
    </div>
    <div class="g-title"><h1 id="gTitle"></h1><p id="gSub"></p></div>
    <div id="gBtns" class="g-btns"></div>
  </div>
</div>
<div id="revealLayer" class="layer" onclick="nextReveal()">
  <img id="revImg" class="rev-img" alt="">
  <div class="rev-shade"></div>
  <button class="btn-small skip" onclick="event.stopPropagation();showSummary()">スキップ</button>
  <div class="rev-body">
    <div id="revStars" class="rev-stars"></div>
    <h1 id="revName"></h1><span id="revRank" class="rk"></span>
    <p style="opacity:.8;font-weight:700">タップで次へ</p>
  </div>
</div>
<div id="summaryLayer" class="layer">
  <h2 class="head" style="font-family:var(--font-d);font-weight:400;margin:0 0 14px">RESULT</h2>
  <div id="sumGrid" class="sum-grid"></div>
  <button class="btn" style="margin-top:20px" onclick="closeSummary()"><span>とじる</span></button>
</div>

<!-- ゲーム -->
<div id="gameLayer" class="layer"><iframe id="gameFrame" title="課外活動" sandbox="allow-scripts"></iframe></div>
<button id="pauseBtn" onclick="showPauseMenu()" aria-label="ポーズ">II</button>
<div id="pauseOverlay">
  <h1>PAUSE</h1>
  <button class="btn" onclick="resumeGame()"><span>再開</span></button>
  <button class="btn pink" onclick="exitGame()"><span>終了</span></button>
</div>

<dialog id="modalTransfer">
  <h3 style="margin:0 0 14px;font-family:var(--font-d);font-weight:400">データ引き継ぎ</h3>
  <input type="text" id="tIdIn" class="field" placeholder="ID" autocomplete="off">
  <input type="password" id="tPassIn" class="field" placeholder="合言葉" autocomplete="current-password">
  <button class="btn pink" style="width:100%;max-width:none;margin:6px 0" onclick="executeTransfer()"><span>引き継ぐ</span></button>
  <button class="btn gray" style="width:100%;max-width:none;margin:6px 0" onclick="document.getElementById('modalTransfer').close()"><span>キャンセル</span></button>
</dialog>

<script>
/* =========================================================
   設定  ※GASを再デプロイしたら新しいURLに差し替える
========================================================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwVGsDO-PM99wPnhVHbiW4rOKucIO0L2224Dri5T7K7jhOPsMxXGBH2C_HH9CjzXhjBbw/exec';
const POLL_MS = 15000;
const RANK_LABEL = {2:'クラスメイト', 3:'部活のエース', 4:'学園のスター'};
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='100' height='130'><rect width='100' height='130' fill='#2a2f4a'/><text x='50' y='78' font-size='40' text-anchor='middle'>🎓</text></svg>");

const S = {
  id: localStorage.getItem('gk_id') || '',
  token: localStorage.getItem('gk_token') || '',
  user: null,
  pools: {star2:[], star3:[], star4:[]},
  banners: [],
  timer: null,
  busy: false,
  pendingAvatar: '',
  detailChar: null
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imgSrc = u => esc(u || PLACEHOLDER);

/* ---- 画像読み込み失敗時の代替 ---- */
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && !t.dataset.fb) { t.dataset.fb = '1'; t.src = PLACEHOLDER; }
}, true);

/* =========================================================
   通信（GET/POSTとも data を持つ共通形式）
========================================================= */
const api = {
  async get(params) {
    try {
      const r = await fetch(GAS_URL + '?' + new URLSearchParams(params));
      return this._done(await r.json());
    } catch (e) { return {result:'error', message:'通信に失敗しました'}; }
  },
  async post(type, body = {}) {
    try {
      // text/plain にするとプリフライトが発生せず、レスポンスも読める
      const r = await fetch(GAS_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({type, id: S.id, token: S.token, ...body})
      });
      return this._done(await r.json());
    } catch (e) { return {result:'error', message:'通信に失敗しました'}; }
  },
  _done(res) {
    if (res && res.auth) logout(true);
    return res || {result:'error', message:'応答がありません'};
  }
};

/* =========================================================
   画面遷移 / セッション
========================================================= */
function goHome() { showScreen(''); }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.id !== id));
}
function saveSession(id, token) {
  S.id = id; S.token = token;
  localStorage.setItem('gk_id', id); localStorage.setItem('gk_token', token);
}
function logout(forced) {
  clearInterval(S.timer); S.timer = null;
  localStorage.removeItem('gk_id'); localStorage.removeItem('gk_token');
  S.id = ''; S.token = ''; S.user = null;
  closeAllSheets();
  stopAreaSync();
  ['gachaLayer','revealLayer','summaryLayer','gameLayer','areaLayer'].forEach(i => $(i).classList.remove('show'));
  $('pauseBtn').style.display = 'none';
  showScreen('titleScreen');
  if (forced === true) alert('ログイン情報が切れました。「データ引き継ぎ」からログインしてください。');
}

function handleLoginClick() {
  if (S.id && S.token) enterSchool(); else showScreen('registrationScreen');
}

async function saveRegistration() {
  const name = $('regName').value.trim(), pass = $('regPass').value;
  if (!name || !pass) return alert('なまえと合言葉を入力してください');
  if (pass.length < 4) return alert('合言葉は4文字以上にしてください');
  $('regBtn').disabled = true;
  const r = await api.post('register', {name, pass});
  $('regBtn').disabled = false;
  if (r.result !== 'success') return alert(r.message || '入学手続きに失敗しました');
  saveSession(r.data.id, r.token);
  alert('入学おめでとう！\nあなたのIDは ' + r.data.id + ' です。\n引き継ぎに必要なのでメモしておいてね。');
  enterSchool();
}

async function executeTransfer() {
  const id = $('tIdIn').value.trim().toUpperCase(), pass = $('tPassIn').value;
  if (!id || !pass) return alert('IDと合言葉を入力してください');
  const r = await api.post('login', {id, pass});
  if (r.result !== 'success') return alert(r.message || '引き継ぎに失敗しました');
  saveSession(r.data.id, r.token);
  $('modalTransfer').close();
  enterSchool();
}

async function enterSchool() {
  showScreen('loadingScreen');
  const [pools, banners, areas] = await Promise.all([
    api.get({action:'getCharaPools'}), api.get({action:'getGachaSettings'}), api.get({action:'getAreas'})
  ]);
  if (areas.result === 'success' && areas.data && areas.data.areas && areas.data.areas.length) {
    S.areas = areas.data.areas;
    if (areas.data.stamps && areas.data.stamps.length) S.stamps = areas.data.stamps;
  }
  if (pools.result === 'success') S.pools = pools.data;
  if (banners.result === 'success') S.banners = banners.data;

  if (!(await refreshUser())) {
    if (S.id) { alert('同期に失敗しました。通信状況を確認してください。'); showScreen('titleScreen'); }
    return;
  }
  goHome(); openArea();
  clearInterval(S.timer);
  S.timer = setInterval(() => { if (!document.hidden && !S.busy) refreshUser(); }, POLL_MS);
}

async function refreshUser() {
  if (!S.id) return false;
  const r = await api.get({action:'getUser', id:S.id, token:S.token});
  if (r.result !== 'success') return false;
  S.user = r.data;
  renderAll();
  return true;
}

/* =========================================================
   描画
========================================================= */
function masterList() { return [...S.pools.star2, ...S.pools.star3, ...S.pools.star4]; }
function rankOf(name) {
  if (S.pools.star4.some(c => c.name === name)) return 4;
  if (S.pools.star3.some(c => c.name === name)) return 3;
  return 2;
}
function avatarOf(u) { return u.avatar || ('https://api.dicebear.com/7.x/avataaars/svg?seed=' + u.id); }

function renderAll() {
  const u = S.user; if (!u) return;
  $('hName').textContent = u.name;
  $('hLv').textContent = 'Lv.' + u.level;
  $('hVerified').innerHTML = u.isOfficial ? '<span class="badge-verify">✔</span>' : '';
  $('hCoin').textContent = u.coin.toLocaleString();
  $('gCoin').textContent = u.coin.toLocaleString();
  $('hAv').src = avatarOf(u);
  $('mAv').src = S.pendingAvatar || avatarOf(u);
  $('myIdDisplay').textContent = u.id;
  if (document.activeElement !== $('nIn')) $('nIn').placeholder = u.name;
  renderPresents(); renderHistory(); renderMembers(); renderFriends();
}

function renderMembers() {
  const box = $('memberListContainer');
  const names = (S.user.chars || '').split(',').map(s => s.trim()).filter(Boolean);
  if (!names.length) { box.innerHTML = '<div class="empty">まだ生徒がいません。スカウトで仲間を迎えよう！</div>'; return; }
  const counts = {};
  names.forEach(n => counts[n] = (counts[n] || 0) + 1);
  const master = masterList();
  box.innerHTML = Object.keys(counts).map(name => {
    const c = master.find(m => m.name === name);
    return `<button class="member" data-act="detail" data-name="${esc(name)}">
      <span class="count-badge">x${counts[name]}</span>
      <img src="${imgSrc(c && c.img)}" alt=""><small>${esc(name)}</small></button>`;
  }).join('');
}

function renderFriends() {
  const u = S.user;
  $('reqList').innerHTML = u.pending.length ? u.pending.map(id =>
    `<div class="row"><span class="grow">ID: ${esc(id)}</span><button class="mini" data-act="accept" data-id="${esc(id)}">承認</button></div>`).join('')
    : '<div class="empty">なし</div>';
  $('sentList').innerHTML = u.sentRequests.length ? u.sentRequests.map(id =>
    `<div class="row"><span class="grow">ID: ${esc(id)}</span><span>返事待ち</span></div>`).join('')
    : '<div class="empty">なし</div>';
  $('fList').innerHTML = u.friendsData.length ? u.friendsData.map(f =>
    `<div class="row"><span class="grow">${esc(f.name)}${f.isOfficial ? ' <span class="badge-verify">✔</span>' : ''}</span>
      <span><button class="mini pink" data-act="giftCoin" data-id="${esc(f.id)}" data-name="${esc(f.name)}" aria-label="コインを贈る">🎁</button>
      <button class="mini gray" data-act="unfriend" data-id="${esc(f.id)}" data-name="${esc(f.name)}" aria-label="友達解除">×</button></span></div>`).join('')
    : '<div class="empty">まだ友達がいません</div>';
}

function renderPresents() {
  const gifts = S.user.pendingGifts || [];
  const badge = $('pBadge');
  badge.style.display = gifts.length ? 'flex' : 'none';
  badge.textContent = gifts.length;
  $('pListContainer').innerHTML = gifts.length ? gifts.map(g =>
    `<div class="row"><span class="grow"><b>${esc(g.label)}</b><br><small>${esc(g.fromName)} さんから</small></span>
     <button class="mini pink" data-act="claim" data-id="${esc(g.id)}">受け取る</button></div>`).join('')
    : '<div class="empty">おくりものはありません</div>';
}

function renderHistory() {
  const h = S.user.history || [];
  $('historyContainer').innerHTML = h.length ? h.map(x =>

/* =========================================================
   動的ボタン（イベント委譲）
========================================================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'detail': showMemberDetail(d.name); break;
    case 'accept': await act('accept', {targetId: d.id}); break;
    case 'unfriend':
      if (confirm(d.name + ' さんとの友達を解除しますか？')) await act('removeFriend', {targetId: d.id});
      break;
    case 'giftCoin': {
      const v = prompt(d.name + ' さんに贈るコイン数', '100');
      const amount = Math.floor(Number(v));
      if (!v || !(amount > 0)) return;
      if (amount > S.user.coin) return alert('コインが足りません');
      if (await act('friendGift', {toId: d.id, amount})) alert('おくりものを送りました');
      break;
    }
    case 'giftChar':
      if (confirm(d.name + ' さんに「' + S.detailChar + '」を贈りますか？')) {
        if (await act('friendMemberGift', {toId: d.id, charName: S.detailChar})) {
          alert('贈りました'); closeSheet('sheetMemberDetail');
        }
      }
      break;
    case 'claim': {
      const g = (S.user.pendingGifts || []).find(x => x.id === d.id);
      if (await act('claim', {giftId: d.id}) && g) alert('「' + g.label + '」を受け取りました');
      break;
    }
    case 'game': launchGame(Number(d.id), d.title); break;
    case 'banner': S.gIdx = Number(d.i); renderGacha(); break;
    case 'area': changeArea(d.name); break;
    case 'panel': showPanel(d.mode); break;
    case 'panelClose': closePanel(); break;
    case 'phrase': if (await areaSay(d.t)) closePanel(); break;
    case 'stamp': if (await areaSay('', d.id)) closePanel(); break;
    case 'sayGo': sayFromInput(); break;
    case 'partner':
      if (await act('setPartner', {name: d.name})) { refreshMySprite(); closePanel(); }
      break;
    case 'logout': logout(); break;
  }
});

// サーバー操作 → 返却されたユーザー情報で即時更新
async function act(type, body) {
  if (S.busy) return false;
  S.busy = true;
  const r = await api.post(type, body);
  S.busy = false;
  if (r.result !== 'success') { alert(r.message || '失敗しました'); return false; }
  if (r.data) { S.user = r.data; renderAll(); } else await refreshUser();
  return true;
}

async function sendReq() {
  const tid = $('fIdIn').value.trim().toUpperCase();

  if (await act('request', {targetId: tid})) { $('fIdIn').value = ''; alert('申請しました'); }
}

/* ---- 学生証 ---- */
function pickAvatar(input) {
  const file = input.files && input.files[0]; if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    // 150x200 に縮小して保存（スプレッドシートのセル上限対策）
    const w = 150, h = 200, c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    const s = Math.max(w / img.width, h / img.height);
    ctx.drawImage(img, (w - img.width * s) / 2, (h - img.height * s) / 2, img.width * s, img.height * s);
    S.pendingAvatar = c.toDataURL('image/jpeg', 0.8);
    $('mAv').src = S.pendingAvatar;
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

async function saveSettings() {
  const body = {};
  const name = $('nIn').value.trim(), pass = $('pIn').value;
  if (name) body.name = name;
  if (pass) body.pass = pass;
  if (S.pendingAvatar) body.avatar = S.pendingAvatar;
  if (!Object.keys(body).length) return alert('変更はありません');
  if (await act('saveProfile', body)) {
    S.pendingAvatar = ''; $('nIn').value = ''; $('pIn').value = '';
    alert('保存しました'); closeAllSheets();
  }
}

let gRes = [], gCur = 0;
S.gIdx = 0;

function bgCss(v) {
  return /^https?:\/\//.test(v || '')
    ? `url("${String(v).replace(/"/g, '%22')}") center/cover`
    : 'linear-gradient(160deg,#2a1f5e,#c2527f 55%,#ffb36b)';
}

function openGacha() {
  if (!S.banners.length) return alert('スカウト情報がありません');
  S.gIdx = 0; $('gachaLayer').classList.add('show'); renderGacha();
}
function closeGacha() { $('gachaLayer').classList.remove('show'); }

function renderGacha() {
  const b = S.banners[S.gIdx];
  $('gBg').style.background = bgCss(b.bg);
  $('gTitle').textContent = b.title;
  $('gSub').textContent = b.pickUp || '';
  $('gCoin').textContent = S.user.coin.toLocaleString();

  $('gTabs').innerHTML = S.banners.map((x, i) =>
    `<button class="g-tab${i === S.gIdx ? ' active' : ''}" data-act="banner" data-i="${i}"
      style="${/^https?:\/\//.test(x.thumbnail) ? 'background-image:url(' + JSON.stringify(x.thumbnail).replace(/"/g, "'") + ')' : ''}">${esc(x.title)}</button>`).join('');

  const cost = S.user.pullCost || 300;
  const wanted = String(b.buttons || '1回,10回,100回').split(/[,、]/).map(s => s.trim());
  $('gBtns').innerHTML = '';
  [1, 10, 100].filter(n => wanted.includes(n + '回')).forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'pull p' + n;
    btn.innerHTML = `${n}回スカウト<small>🪙 ${(cost * n).toLocaleString()}</small>`;
    btn.onclick = () => doPull(n);
    $('gBtns').appendChild(btn);
  });
}

async function doPull(n) {
  if (S.busy) return;
  const cost = (S.user.pullCost || 300) * n;
  if (S.user.coin < cost) return alert('コインが足りません');
  S.busy = true;
  document.querySelectorAll('.pull').forEach(b => b.disabled = true);
  const r = await api.post('gachaPull', {pulls: n});
  S.busy = false;
  document.querySelectorAll('.pull').forEach(b => b.disabled = false);
  if (r.result !== 'success') return alert(r.message || 'スカウトに失敗しました');
  S.user = r.data; renderAll(); renderGacha();
  gRes = r.results || []; gCur = 0;
  if (gRes.length) showReveal();
}

function showReveal() {
  const c = gRes[gCur];
  $('revealLayer').classList.add('show');
  $('revImg').dataset.fb = ''; $('revImg').src = c.img || PLACEHOLDER;
  $('revName').textContent = c.name;
  $('revRank').textContent = RANK_LABEL[c.rank] || '';
  $('revStars').innerHTML = Array.from({length: c.rank}, (_, i) => `<span style="animation-delay:${i * .12}s">★</span>`).join('');
}
function nextReveal() { gCur++; if (gCur < gRes.length) showReveal(); else showSummary(); }
function showSummary() {
  $('revealLayer').classList.remove('show');
  $('sumGrid').innerHTML = gRes.map(c =>
    `<div class="sum-card"><img src="${imgSrc(c.img)}" alt=""><span class="${c.rank >= 4 ? 's4' : ''}">${'★'.repeat(c.rank)}</span></div>`).join('');

}

/* ---- SDキャラ（SVGで描画。パートナー設定中は顔だけ生徒画像） ---- */
const HAIR = ['#4a3426', '#2b2b4f', '#8a5a32', '#d6b05a', '#e0719b', '#4a8fd0', '#4fae88', '#8c63d8', '#c94b4b', '#2f2f2f'];
const EYES = ['#5a3a2a', '#2d6cb5', '#2f9a6a', '#8a4ad0', '#c0506a'];
const UNI = ['#26356b', '#2d5a46', '#6b2d4a', '#3a3f55', '#7a3b2a'];
function hashN(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; }
function chibiSVG(id, withHead) {
  const h = hashN(id), hair = HAIR[h % HAIR.length], eye = EYES[(h >> 3) % EYES.length], uni = UNI[(h >> 5) % UNI.length];
  const style = (h >> 7) % 3, skirt = ((h >> 9) % 2) === 0, skin = '#fde3cf';
  const legs = skirt
    ? `<rect x="38" y="104" width="9" height="17" rx="4" fill="${skin}"/><rect x="53" y="104" width="9" height="17" rx="4" fill="${skin}"/><path d="M28 100Q50 110 72 100L77 116Q50 123 23 116z" fill="#8a3a5a"/>`
    : `<rect x="36" y="100" width="12" height="21" rx="5" fill="#3a3f55"/><rect x="52" y="100" width="12" height="21" rx="5" fill="#3a3f55"/>`;
  const body = `${legs}<ellipse cx="42" cy="123" rx="9" ry="4.5" fill="#5a3a2a"/><ellipse cx="58" cy="123" rx="9" ry="4.5" fill="#5a3a2a"/>
    <path d="M30 78Q50 70 70 78L74 108Q50 114 26 108z" fill="${uni}"/><path d="M44 76L50 92 56 76z" fill="#fff"/><path d="M46 90L50 86 54 90 50 98z" fill="#e5486a"/>
    <rect x="19" y="80" width="12" height="26" rx="6" fill="${uni}" transform="rotate(8 25 80)"/><rect x="69" y="80" width="12" height="26" rx="6" fill="${uni}" transform="rotate(-8 75 80)"/>
    <circle cx="23" cy="108" r="5.5" fill="${skin}"/><circle cx="77" cy="108" r="5.5" fill="${skin}"/>`;
  let head = '';
  if (withHead) {
    const back = style === 1 ? `<ellipse cx="9" cy="60" rx="9" ry="20" fill="${hair}"/><ellipse cx="91" cy="60" rx="9" ry="20" fill="${hair}"/>`
      : style === 2 ? `<path d="M12 40Q4 92 22 100L36 66z" fill="${hair}"/><path d="M88 40Q96 92 78 100L64 66z" fill="${hair}"/>` : '';
    const acc = style === 1 ? `<circle cx="14" cy="44" r="6" fill="#ff7ab0"/><circle cx="86" cy="44" r="6" fill="#ff7ab0"/>` : '';
    head = `${back}<circle cx="50" cy="40" r="38" fill="${hair}"/><ellipse cx="50" cy="46" rx="31" ry="29" fill="${skin}"/>
      <path d="M13 42Q16 4 50 5Q84 4 87 42Q78 22 62 26Q50 16 38 26Q22 22 13 42z" fill="${hair}"/>
      <ellipse cx="38" cy="49" rx="5" ry="7" fill="${eye}"/><ellipse cx="62" cy="49" rx="5" ry="7" fill="${eye}"/><circle cx="36" cy="46" r="2.2" fill="#fff"/><circle cx="60" cy="46" r="2.2" fill="#fff"/>
      <ellipse cx="29" cy="59" rx="5" ry="3" fill="#ffb3b3" opacity=".65"/><ellipse cx="71" cy="59" rx="5" ry="3" fill="#ffb3b3" opacity=".65"/>
      <path d="M45 62Q50 67 55 62" stroke="#c0556a" fill="none" stroke-width="2" stroke-linecap="round"/>${acc}`;
  }
  return `<svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">${body}${head}</svg>`;
}

/* ---- 状態 ---- */
S.areas = [
  {name:'校門', icon:'🏫', desc:'登校した生徒が最初に集まる場所'},
  {name:'教室', icon:'📚', desc:'授業の合間のおしゃべり'},
  {name:'校庭', icon:'⚽', desc:'部活動の声が響く広場'},
  {name:'図書室', icon:'📖', desc:'静かに話そう'},
  {name:'食堂', icon:'🍱', desc:'お昼休みの人気スポット'},
  {name:'屋上', icon:'🌇', desc:'夕焼けを眺めながら'}
];
S.stamps = [
  {id:'hi',e:'👋',l:'やあ'},{id:'thanks',e:'🙏',l:'ありがとう'},{id:'ok',e:'👍',l:'いいね'},{id:'party',e:'🎉',l:'おめでとう'},
  {id:'lol',e:'😂',l:'わらい'},{id:'cry',e:'😭',l:'なみだ'},{id:'love',e:'💖',l:'すき'},{id:'sweat',e:'💦',l:'あせあせ'},
  {id:'sleep',e:'😪',l:'ねむい'},{id:'fight',e:'💪',l:'がんばる'},{id:'wow',e:'✨',l:'すごい'},{id:'bye',e:'🌸',l:'またね'}
];
S.area = localStorage.getItem('gk_area') || '校門';
S.areaTimer = null;
const newAm = () => ({players:new Map(), ids:new Set(), log:[], since:0, loaded:false, polling:false, sending:false, unread:0,
                      me:{x:30 + Math.random()*40, y:55 + Math.random()*35}, mode:''});
S.am = newAm();

const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
const round1 = v => Math.round(v * 10) / 10;
const areaData = () => S.areas.find(a => a.name === S.area) || S.areas[0];
const stampOf = text => String(text).startsWith('::stamp:') ? S.stamps.find(x => x.id === String(text).slice(8)) : null;
function toast(msg) {
  const t = $('aToast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2200);
}
function hideHint() { $('aHint').style.opacity = 0; }
function updateLogBadge() {
  const b = $('logBadge'), n = S.am.unread;
  b.style.display = n > 0 ? 'flex' : 'none'; b.textContent = n > 99 ? '99+' : n;
}

/* ---- シーン ---- */
function renderScene() {
  $('scSky').innerHTML = (SKY[S.area] || DEFAULT_SKY)();
  $('scGround').innerHTML = groundSVG(GROUNDS[S.area] || GROUNDS['校門']);
  $('aLoc').textContent = '-' + S.area + '-';
}

/* ---- キャラクター ---- */
function place(p, x, y, animate) {
  const dist = animate ? Math.hypot(x - p.x, (y - p.y) * .8) : 0;
  const dur = animate ? clampN(dist / 32, .25, 2.4) : 0;
  const el = p.el;
  el.style.transitionDuration = dur + 's';
  el.style.setProperty('--d', dur + 's');
  el.style.left = x + '%';
  el.style.top = (HORIZON + y * SPAN / 100) + '%';
  if (!el.classList.contains('talk')) el.style.zIndex = Math.round(y * 10) + 1;
  el.style.setProperty('--s', (.62 + .5 * y / 100).toFixed(3));
  p.x = x; p.y = y;
  if (dur > 0) {
    el.classList.add('walk'); clearTimeout(p.walkTimer);
    p.walkTimer = setTimeout(() => el.classList.remove('walk'), dur * 1000);
  }
}
function setLook(p, partner) {
  const c = partner && masterList().find(m => m.name === partner);
  const face = c && c.img ? c.img : '';
  p.el.querySelector('.chibi').innerHTML = chibiSVG(p.id, !face) + (face ? `<img class="cb-face" alt="" src="${esc(face)}">` : '');
}
function ensurePlayer(m) {
  const A = S.am, isMe = m.id === S.id;
  let p = A.players.get(m.id);
  if (!p) {
    const el = document.createElement('div');
    el.className = 'pl' + (isMe ? ' me' : '');
    el.innerHTML = '<div class="wrap"><div class="bubble"></div><div class="chibi"></div><div class="newtag">NEW!</div><div class="tag"></div></div>';
    $('scPlayers').appendChild(el);
    p = {id:m.id, el, x:m.x, y:m.y, name:'', partner:null, bubTimer:null, walkTimer:null};
    A.players.set(m.id, p);
    place(p, m.x, m.y, false);
    if (!isMe && A.loaded) {                       // 途中参加の人に「NEW!」を出す
      const nt = el.querySelector('.newtag'); nt.classList.add('show');
      setTimeout(() => nt.classList.remove('show'), 9000);
    }
  } else if (!isMe && (m.x !== p.x || m.y !== p.y)) {
    place(p, m.x, m.y, true);
  }
  const partner = m.partner || '';
  if (p.partner !== partner) { p.partner = partner; setLook(p, partner); }
  if (p.name !== m.name) { p.name = m.name; p.el.querySelector('.tag').textContent = m.name; }
  return p;
}
function refreshMySprite() {
  if (!S.user || !$('areaLayer').classList.contains('show')) return;
  ensurePlayer({id:S.id, name:S.user.name, x:S.am.me.x, y:S.am.me.y, partner:S.user.partner || ''});
}

function showBubble(id, m) {
  const p = S.am.players.get(id); if (!p) return;
  const b = p.el.querySelector('.bubble'), st = stampOf(m.text);
  b.className = 'bubble show' + (st ? ' stamp' : '');
  b.textContent = st ? st.e : m.text;           // textContentでXSS対策
  p.el.classList.add('talk'); p.el.style.zIndex = 9999;
  clearTimeout(p.bubTimer);
  p.bubTimer = setTimeout(() => {
    b.classList.remove('show'); p.el.classList.remove('talk'); p.el.style.zIndex = Math.round(p.y * 10) + 1;
  }, st ? 4000 : 6500);
}

/* ---- 入退室・同期 ---- */
function enterAreaScene() {
  S.am = newAm();
  $('scPlayers').innerHTML = '';
  renderScene(); closePanel(); updateLogBadge();
  S.am.me = {x:round1(S.am.me.x), y:round1(S.am.me.y)};
  ensurePlayer({id:S.id, name:S.user.name, x:S.am.me.x, y:S.am.me.y, partner:S.user.partner || ''});
  $('aCount').textContent = '在室 1人';
  $('aHint').style.opacity = 1;
}
function openArea() {
  if (!S.areas.some(a => a.name === S.area)) S.area = S.areas[0].name;
  $('areaLayer').classList.add('show');
  enterAreaScene();
  stopAreaSync();
  S.areaTimer = setInterval(areaPoll, AREA_POLL_MS);
  areaPoll();
}
function stopAreaSync() { clearInterval(S.areaTimer); S.areaTimer = null; }
function changeArea(name) {
  if (name === S.area) { closePanel(); return; }
  S.area = name; localStorage.setItem('gk_area', name);
  enterAreaScene();
  areaPoll();
}

async function areaPoll() {
  const A = S.am;
  if (A.polling || document.hidden || !S.id) return;
  A.polling = true;
  const area = S.area;
  const r = await api.get({action:'areaSync', id:S.id, token:S.token, area, x:A.me.x, y:A.me.y, since:A.since});
  A.polling = false;
  if (A !== S.am || area !== S.area || !$('areaLayer').classList.contains('show')) return; // 切替え後の古い応答は捨てる
  if (r.result !== 'success') return;
  applyMembers(r.members || []);
  handleMessages(r.messages || [], A.loaded);
  A.loaded = true;
}

function applyMembers(list) {
  const A = S.am, seen = new Set();
  list.forEach(m => { seen.add(m.id); if (m.id !== S.id) ensurePlayer(m); });
  A.players.forEach((p, id) => {
    if (id !== S.id && !seen.has(id)) { clearTimeout(p.bubTimer); p.el.remove(); A.players.delete(id); }
  });
  $('aCount').textContent = '在室 ' + A.players.size + '人';
}

function handleMessages(list, live) {
  const A = S.am;
  list.forEach(m => {
    A.since = Math.max(A.since, m.t);
    if (A.ids.has(m.id)) return;
    A.ids.add(m.id); A.log.push(m);
    if (A.log.length > 120) A.log.shift();
    if (live) {
      showBubble(m.fromId, m);
      if (m.fromId !== S.id && A.mode !== 'log') { A.unread++; updateLogBadge(); }
    }
  });
  if (A.mode === 'log') renderPanel();
}

/* ---- 移動（地面をタップ） ---- */
$('stage').addEventListener('click', e => {
  closePanel();
  const me = S.am.players.get(S.id); if (!me) return;
  const r = $('stage').getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width * 100, py = (e.clientY - r.top) / r.height * 100;
  const x = round1(clampN(px, 4, 96)), y = round1(clampN((py - HORIZON) / SPAN * 100, 0, 100));
  S.am.me = {x, y};
  place(me, x, y, true);
  hideHint();
});

/* ---- 発言 ---- */
async function areaSay(text, stamp) {
  const A = S.am;
  if (A.sending) return false;
  A.sending = true;
  const body = {area: S.area};
  if (stamp) body.stamp = stamp; else body.text = text;
  const r = await api.post('sendAreaChat', body);
  A.sending = false;
  if (r.result !== 'success') { toast(r.message || '送信できませんでした'); return false; }
  handleMessages([r.message], true);
  hideHint();
  return true;
}
async function sayFromInput() {
  const input = $('aSayIn'); if (!input) return;
  const text = input.value.trim(); if (!text) return;
  if (await areaSay(text)) { input.value = ''; closePanel(); }
}
document.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'aSayIn' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sayFromInput(); }
});

/* ---- パネル ---- */
function showPanel(mode) {
  if (S.am.mode === mode) { closePanel(); return; }
  S.am.mode = mode;
  if (mode === 'log') { S.am.unread = 0; updateLogBadge(); }
  renderPanel();
}
function closePanel() {
  S.am.mode = ''; $('aPanel').style.display = 'none';
  document.querySelectorAll('.act').forEach(b => b.classList.remove('on'));
}
function renderPanel() {
  const A = S.am, P = $('aPanel'), mode = A.mode;
  if (!mode) return;
  const head = t => `<div class="ph"><span>${t}</span><button class="mini gray" data-act="panelClose" aria-label="とじる">×</button></div>`;
  let html = '';
  if (mode === 'say') {
    html = head('💬 はなす') +
      `<div class="chips">${PHRASES.map(t => `<button class="chip" data-act="phrase" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
       <div class="say-row"><input id="aSayIn" class="field" maxlength="100" placeholder="メッセージ（100文字まで）" autocomplete="off">
       <button class="mini pink" data-act="sayGo">送信</button></div>`;
  } else if (mode === 'stamp') {
    html = head('😀 スタンプ') + `<div class="stamp-grid">${S.stamps.map(s =>
      `<button class="stamp-btn" data-act="stamp" data-id="${esc(s.id)}"><b>${s.e}</b>${esc(s.l)}</button>`).join('')}</div>`;
  } else if (mode === 'area') {
    html = head('🌐 エリア移動') + S.areas.map(a =>
      `<button class="area-row${a.name === S.area ? ' active' : ''}" data-act="area" data-name="${esc(a.name)}"><b>${esc(a.icon)} ${esc(a.name)}</b><small>${esc(a.desc)}</small></button>`).join('');
  } else if (mode === 'menu') {
    html = head('☰ メニュー') +
      `<button class="area-row" onclick="closePanel();openSheet('sheetConfig')"><b>🪪 学生証</b></button>
       <button class="area-row" onclick="closePanel();openSheet('sheetPresent')"><b>🎁 おくりもの・コイン履歴</b></button>
       <button class="area-row" data-act="logout"><b>🚪 ログアウト</b></button>`;
  } else if (mode === 'partner') {
    const names = [...new Set((S.user.chars || '').split(',').map(s => s.trim()).filter(Boolean))];
    const master = masterList();
    html = head('🎓 パートナーを選ぶ') +
      `<button class="chip${S.user.partner ? '' : ' active'}" style="margin-bottom:12px" data-act="partner" data-name="">デフォルトに戻す</button>` +
      (names.length ? `<div class="member-grid">${names.map(n => {
        const c = master.find(m => m.name === n);
        return `<button class="member" data-act="partner" data-name="${esc(n)}" style="${S.user.partner === n ? 'border-color:var(--mint)' : ''}"><img src="${imgSrc(c && c.img)}" alt=""><small>${esc(n)}</small></button>`;
      }).join('')}</div>` : '<div class="empty">まだ生徒がいません。スカウトで仲間を迎えよう！</div>');
  } else if (mode === 'log') {
    html = head('📋 ログ') + (A.log.length ? A.log.map(m => {
      const st = stampOf(m.text), d = new Date(m.t);
      const tm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      return `<div class="log-row${m.fromId === S.id ? ' me' : ''}"><b>${esc(m.name)}</b><span class="tm">${tm}</span><br>${st ? st.e + ' ' + esc(st.l) : esc(m.text)}</div>`;
    }).join('') : '<div class="empty">まだ会話がありません</div>');
  }
  P.innerHTML = html; P.style.display = 'block';
  document.querySelectorAll('.act').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  if (mode === 'log') P.scrollTop = P.scrollHeight;
  if (mode === 'say') setTimeout(() => { const i = $('aSayIn'); if (i) i.focus(); }, 60);
}

/* =========================================================
   課外活動（ミニゲーム）
========================================================= */
async function openQuest() {
  showScreen('questScreen');
  const box = $('gameListContainer');
  box.innerHTML = '<div class="empty">読み込み中…</div>';
  const r = await api.get({action:'getList'});
  if (r.result !== 'success') { box.innerHTML = '<div class="empty">読み込みに失敗しました</div>'; return; }
  box.innerHTML = r.data.length ? r.data.map(g =>
    `<button class="quest-card" data-act="game" data-id="${g.id}" data-title="${esc(g.title)}">${esc(g.title)}</button>`).join('')
    : '<div class="empty">まだ課外活動がありません</div>';
}

async function launchGame(row, title) {
  const r = await api.get({action:'getCode', row});
  if (r.result !== 'success') return alert(r.message || 'ゲームを開始できません');
  $('gameFrame').srcdoc = r.code;
  $('gameLayer').classList.add('show');
  $('pauseBtn').style.display = 'flex';
  api.post('launch', {title, gameId: row});
}
function showPauseMenu() { $('pauseOverlay').style.display = 'flex'; }
function resumeGame() { $('pauseOverlay').style.display = 'none'; }
function exitGame() {
  $('pauseOverlay').style.display = 'none';
  $('gameLayer').classList.remove('show');
  $('pauseBtn').style.display = 'none';
  $('gameFrame').srcdoc = '';
  refreshUser();
}
