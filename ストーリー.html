<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proseka Story with Voice</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #game-container { position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; top: 50%; transform: translateY(-50%); background-color: #111; overflow: hidden; }
        #background { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; transition: 0.8s; filter: brightness(0.7); }
        #character-container { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80%; height: 95%; display: flex; justify-content: center; align-items: flex-end; pointer-events: none; }
        #character-img { height: 100%; object-fit: contain; transition: 0.4s; opacity: 0; transform: translateY(30px); }
        #character-img.active { opacity: 1; transform: translateY(0); }
        #message-box { position: absolute; bottom: 30px; left: 4%; width: 92%; height: 150px; background: rgba(15, 25, 35, 0.9); border: 2px solid rgba(255,255,255,0.2); border-radius: 18px; padding: 30px 45px; color: #fff; cursor: pointer; box-sizing: border-box; backdrop-filter: blur(8px); z-index: 10; display: none; }
        #name-tag { position: absolute; top: -20px; left: 40px; background: linear-gradient(90deg, #00d2ff, #3a7bd5); padding: 6px 35px; border-radius: 25px; font-weight: bold; }
        #text-area { font-size: 1.4em; line-height: 1.6; margin-top: 10px; }
        #next-indicator { position: absolute; right: 30px; bottom: 20px; animation: bounce 1s infinite; color: #00d2ff; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        #selector-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .menu-card { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center; width: 350px; }
        #sheet-select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; background: #222; color: white; }
        #start-btn { width: 100%; padding: 15px; background: #00d2ff; color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; display: none; justify-content: center; align-items: center; z-index: 200; }
    </style>
</head>
<body>

    <div id="selector-screen">
        <div class="menu-card">
            <h2>STORY SELECT</h2>
            <select id="sheet-select"><option>読み込み中...</option></select>
            <button id="start-btn" disabled>再生を開始する</button>
        </div>
    </div>

    <div id="loading">Now Loading...</div>

    <div id="game-container">
        <div id="background"></div>
        <div id="character-container"><img id="character-img" src=""></div>
        <div id="message-box">
            <div id="name-tag"></div>
            <div id="text-area"></div>
            <div id="next-indicator">▼</div>
        </div>
    </div>

    <script>
        const gasUrl = "https://script.google.com/macros/s/AKfycbzbFZ8cVc9iDvHNdWkXo076COqOpZQ2nwdPOKyrg96ZmIyaVt2kc8hTESgYlQaobBJ6/exec";

        let scenario = [];
        let currentIndex = 0;
        let isTyping = false;
        let typingTimer;
        let currentText = "";
        let currentAudio = null; // 現在再生中の音声

        const sheetSelect = document.getElementById("sheet-select");
        const startBtn = document.getElementById("start-btn");
        const selectorScreen = document.getElementById("selector-screen");
        const loadingScreen = document.getElementById("loading");
        const messageBox = document.getElementById("message-box");

        // シート一覧取得
        async function fetchSheetList() {
            try {
                const response = await fetch(gasUrl);
                const result = await response.json();
                if (result.type === "list") {
                    sheetSelect.innerHTML = "";
                    result.data.forEach(title => {
                        const opt = document.createElement("option");
                        opt.value = opt.innerText = title;
                        sheetSelect.appendChild(opt);
                    });
                    startBtn.disabled = false;
                }
            } catch (e) { alert("通信エラー"); }
        }

        // ストーリー開始
        startBtn.onclick = async () => {
            const selectedTitle = sheetSelect.value;
            selectorScreen.style.display = "none";
            loadingScreen.style.display = "flex";

            try {
                const response = await fetch(`${gasUrl}?sheet=${encodeURIComponent(selectedTitle)}`);
                const result = await response.json();
                scenario = result.data;
                loadingScreen.style.display = "none";
                messageBox.style.display = "block";
                updateScene();
            } catch (e) { alert("読み込みエラー"); }
        };

        function updateScene() {
            if (currentIndex >= scenario.length) {
                document.getElementById("text-area").innerText = "ストーリーは終了しました。";
                return;
            }
            const data = scenario[currentIndex];

            // 1. 音声の再生
            if (currentAudio) { currentAudio.pause(); currentAudio = null; } // 前の音声を止める
            if (data.audio && data.audio.trim() !== "") {
                currentAudio = new Audio(data.audio);
                currentAudio.play().catch(e => console.log("Audio play error:", e));
            }

            // 2. 背景
            if (data.background) document.getElementById("background").style.backgroundImage = `url('${data.background}')`;

            // 3. キャラ
            const charImg = document.getElementById("character-img");
            charImg.classList.remove("active");
            if (data.character) {
                setTimeout(() => { charImg.src = data.character; charImg.classList.add("active"); }, 50);
            }

            // 4. 名前
            const nameTag = document.getElementById("name-tag");
            if (data.name) { nameTag.innerText = data.name; nameTag.style.display = "block"; }
            else { nameTag.style.display = "none"; }

            startTyping(data.text || "");
        }

        function startTyping(text) {
            clearInterval(typingTimer);
            isTyping = true;
            let i = 0;
            currentText = text;
            const area = document.getElementById("text-area");
            area.innerText = "";
            typingTimer = setInterval(() => {
                if (i < currentText.length) { area.innerText += currentText[i++]; }
                else { clearInterval(typingTimer); isTyping = false; }
            }, 40);
        }

        function next() {
            if (isTyping) { 
                clearInterval(typingTimer); 
                document.getElementById("text-area").innerText = currentText; 
                isTyping = false; 
            } else { 
                currentIndex++; 
                updateScene(); 
            }
        }

        messageBox.onclick = next;
        window.onkeydown = (e) => { if(e.code === "Space" || e.code === "Enter") next(); };

        fetchSheetList();
    </script>
</body>
</html>
